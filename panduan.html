<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pusat Bantuan - Argumentasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] }, colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } } } } }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .faq-item.active .faq-answer { max-height: 500px; transition: max-height 0.5s ease-in; }
        .faq-item.active .faq-icon { transform: rotate(180deg); }
        .faq-icon { transition: transform 0.3s; }
        .pop { animation: pop .3s ease-out both; }
        @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        .dots span { width: 6px; height: 6px; border-radius: 9999px; background: #10b981; display: inline-block; animation: bump 1s infinite; }
        .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
        @keyframes bump { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-slate-100 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">

        <!-- HEADER + KOLOM CARI -->
        <header class="bg-brand-green pt-4 pb-3 px-4 sticky top-0 z-30 shadow-sm">
            <div class="flex items-center gap-3 mb-3">
                <a href="javascript:history.back()" class="text-white text-lg px-2 py-1"><i class="fas fa-chevron-left"></i></a>
                <h1 class="text-lg font-semibold text-white flex-1">Pusat Bantuan</h1>
            </div>
            <div class="bg-white rounded-full flex items-center pl-4 pr-1 py-1 shadow-sm">
                <input type="text" id="searchInput" maxlength="200" placeholder="Tanya apa saja, mis. cara gabung kelas..." class="w-full bg-transparent outline-none text-slate-700 text-sm placeholder-slate-400" onkeydown="if(event.key==='Enter') cariAI()">
                <button id="btnCari" onclick="cariAI()" aria-label="Cari" class="w-9 h-9 shrink-0 rounded-full bg-brand-green text-white flex items-center justify-center active:scale-95 transition-transform"><i class="fas fa-search text-sm"></i></button>
            </div>
        </header>

        <!-- KARTU JAWABAN (tepat di bawah kolom cari) -->
        <div id="answerBox" class="hidden px-4 pt-3"></div>

        <!-- TULISAN BERJALAN -->
        <div class="bg-amber-50 border-y border-amber-100 py-2.5 px-4 flex items-center gap-3 shrink-0 mt-3">
            <i class="fas fa-volume-up text-amber-500 text-sm"></i>
            <marquee scrollamount="4" class="text-xs text-amber-700 font-medium">Selamat datang di Platform Argumentasi! Tingkatkan literasi dan kemampuan berpikir kritis Anda melalui Ruang Latihan dan Galeri Teks interaktif.</marquee>
            <i class="fas fa-chevron-right text-amber-300 text-xs"></i>
        </div>

        <!-- REKOMENDASI PERTANYAAN (selalu tampil, jawaban langsung) -->
        <section class="bg-white mt-2 px-4 py-4 shadow-sm">
            <h2 id="recoTitle" class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2"><i class="fas fa-lightbulb text-amber-400"></i> Pertanyaan yang Sering Ditanyakan</h2>
            <div id="recoList" class="flex flex-col gap-2">
                <div class="h-10 rounded-lg bg-slate-100 animate-pulse"></div>
                <div class="h-10 rounded-lg bg-slate-100 animate-pulse"></div>
                <div class="h-10 rounded-lg bg-slate-100 animate-pulse"></div>
            </div>
        </section>

        <div class="flex-grow flex flex-col pb-6">
            <!-- PANDUAN SISWA -->
            <div class="bg-white mt-2 px-4 py-5 shadow-sm">
                <h2 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2"><i class="fas fa-user-graduate text-blue-500"></i> Panduan Lengkap Untuk Siswa</h2>
                <div class="space-y-3" id="panduanSiswa"></div>
            </div>

            <!-- PANDUAN GURU -->
            <div class="bg-white mt-2 px-4 py-5 shadow-sm border-t border-slate-100">
                <h2 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2"><i class="fas fa-chalkboard-teacher text-brand-green"></i> Panduan Lengkap Untuk Guru</h2>
                <div class="space-y-3" id="panduanGuru"></div>
            </div>

            <!-- FAQ -->
            <div class="bg-white mt-2 flex-grow shadow-sm">
                <div class="px-4 py-4 border-b border-slate-100">
                    <h2 class="font-bold text-slate-800 text-sm mb-3">Tanya Jawab (FAQ)</h2>
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar" id="faqTabs">
                        <button onclick="filterFAQ('Semua', this)" class="faq-tab-btn px-4 py-1.5 bg-white border border-red-400 text-red-500 text-xs font-medium rounded shrink-0">Semua</button>
                        <button onclick="filterFAQ('Akun', this)" class="faq-tab-btn px-4 py-1.5 bg-slate-50 border border-slate-100 text-slate-600 text-xs font-medium rounded shrink-0">Akun & Login</button>
                        <button onclick="filterFAQ('Kelas', this)" class="faq-tab-btn px-4 py-1.5 bg-slate-50 border border-slate-100 text-slate-600 text-xs font-medium rounded shrink-0">Ruang Kelas</button>
                        <button onclick="filterFAQ('Nilai', this)" class="faq-tab-btn px-4 py-1.5 bg-slate-50 border border-slate-100 text-slate-600 text-xs font-medium rounded shrink-0">Sistem Nilai</button>
                    </div>
                </div>
                <div class="flex flex-col" id="faqContainer"></div>
            </div>

            <!-- WHATSAPP -->
            <div class="bg-white mt-2 px-4 py-5 pb-8 shadow-sm">
                <h2 class="font-bold text-slate-800 text-sm mb-4">Butuh Bantuan Lainnya?</h2>
                <button onclick="bukaWhatsApp()" class="w-full bg-white border border-slate-200 rounded-lg p-3 flex items-center gap-3 hover:bg-slate-50 transition-colors active:scale-95 shadow-sm">
                    <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center shrink-0"><i class="fab fa-whatsapp text-green-500 text-lg"></i></div>
                    <span class="font-medium text-slate-700 text-[13px] text-left flex-1">Chat Customer Support Sekarang</span>
                    <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/all-search';

        /* ---------- Konten panduan & FAQ ---------- */
        const SISWA = [
            ['Persiapan Belajar', 'Pastikan Anda telah mengisi nama di halaman "Profil Saya". Ini penting agar nama Anda tercatat di Papan Prestasi.'],
            ['Bergabung ke Ruang Kelas', 'Klik menu "Aksi" > "Gabung Kelas" di pojok kanan atas beranda. Masukkan 6 digit angka unik atau scan QR Code yang diberikan oleh guru Anda.'],
            ['Mengerjakan Misi Latihan', 'Di dalam Ruang Kelas, Anda akan menemukan misi membaca dan menulis. Kerjakan dengan serius, karena Mesin Pemroses akan langsung menilai logika tulisan Anda.'],
            ['Ekstrak Rangkuman Otomatis', 'Saat Anda membaca Galeri Teks atau Artikel, gulir hingga paling bawah dan tekan tombol "Ekstrak Rangkuman" untuk melihat inti makna tulisan.']
        ];
        const GURU = [
            ['Pendaftaran & Log In', 'Lakukan pendaftaran menggunakan alamat email aktif. Anda wajib melakukan verifikasi email dengan mengklik tautan yang dikirimkan ke *inbox* Anda sebelum bisa masuk ke Portal Guru.'],
            ['Membuka Ruang Kelas', 'Di Dashboard Guru, pilih "Buat Ruang Kelas". Anda wajib memilih jenjang pendidikan (SMP/SMA) dan menyematkan CP/TP Kurikulum sebelum sistem men-*generate* kode kelas.'],
            ['Mengunggah Modul Ajar', 'Sistem kami mendukung ekstraksi dokumen PDF. Unggah bahan ajar Anda, lalu Mesin Ekstraksi akan memecahnya menjadi materi interaktif bagi siswa.'],
            ['Evaluasi Otomatis (Autograding)', 'Saat mengontrol kelas secara *live*, Anda dapat menekan tombol "Evaluasi Massal" di tab Prestasi untuk menilai esai siswa secara otomatis menggunakan indikator rubrik.']
        ];
        const FAQ = [
            ['Akun', 'Bagaimana jika saya lupa kata sandi (password)?', 'Anda dapat mengklik tombol "Lupa?" di halaman Log In pada kolom kata sandi. Masukkan email Anda, lalu sistem akan mengirimkan tautan reset kata sandi langsung ke kotak masuk email Anda.'],
            ['Kelas', 'Apa yang harus dilakukan jika kode kelas invalid?', 'Pastikan Anda mengetikkan 6 digit angka dengan benar. Jika masih invalid, kemungkinan guru Anda telah menutup atau mengarsipkan ruang kelas tersebut. Silakan hubungi guru Anda untuk meminta kode baru.'],
            ['Nilai', 'Bagaimana cara sistem menilai esai saya?', 'Sistem Evaluator membedah struktur tulisan Anda (Tesis, Argumen, Kesimpulan) dan mengecek relevansi serta logika argumentasi berdasarkan kurikulum (CP/TP) yang telah diatur sebelumnya. Semakin terstruktur tulisan Anda, semakin tinggi Poin XP yang didapat.'],
            ['Akun', 'Bagaimana jika email verifikasi saya tidak masuk?', 'Silakan periksa folder SPAM atau Junk di email Anda. Jika tetap tidak ada, Anda dapat menekan tombol "Kirim Ulang Email" di halaman verifikasi (harus menunggu 2 menit antar percobaan untuk menghindari *spam* sistem).'],
            ['Kelas', 'Apakah saya bisa masuk kembali ke kelas yang sudah ditutup?', 'Tidak bisa. Jika guru telah menekan tombol "Akhiri & Arsipkan Kelas", maka ruang kelas tersebut dikunci permanen. Namun, laporan nilai akhir dan riwayat pengerjaan tetap tersimpan di arsip guru.']
        ];
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function renderSteps(id, data, bg, fg) {
            document.getElementById(id).innerHTML = data.map(([t, d], i) => `
                <div class="flex gap-3 items-start bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <div class="w-6 h-6 ${bg} ${fg} rounded-full flex items-center justify-center shrink-0 text-xs font-bold">${i + 1}</div>
                    <div><h3 class="text-xs font-bold text-slate-700">${esc(t)}</h3><p class="text-[10px] text-slate-500 mt-1">${esc(d)}</p></div>
                </div>`).join('');
        }
        renderSteps('panduanSiswa', SISWA, 'bg-blue-100', 'text-blue-600');
        renderSteps('panduanGuru', GURU, 'bg-emerald-100', 'text-emerald-600');
        document.getElementById('faqContainer').innerHTML = FAQ.map(([k, q, a]) => `
            <div class="faq-item border-b border-slate-100" data-kategori="${k}">
                <button class="w-full text-left px-4 py-4 flex justify-between items-center focus:outline-none" onclick="toggleFaq(this)">
                    <span class="text-[13px] text-slate-700 font-medium pr-4">${esc(q)}</span>
                    <i class="fas fa-chevron-down text-slate-300 text-xs faq-icon"></i>
                </button>
                <div class="faq-answer px-4 bg-slate-50"><p class="text-[11px] text-slate-500 pb-4 leading-relaxed">${esc(a)}</p></div>
            </div>`).join('');

        function toggleFaq(button) {
            const item = button.parentElement;
            document.querySelectorAll('.faq-item').forEach(el => { if (el !== item) el.classList.remove('active'); });
            item.classList.toggle('active');
        }
        function filterFAQ(kategori, btn) {
            document.querySelectorAll('.faq-tab-btn').forEach(b => {
                b.classList.replace('bg-white', 'bg-slate-50'); b.classList.replace('border-red-400', 'border-slate-100'); b.classList.replace('text-red-500', 'text-slate-600');
            });
            btn.classList.replace('bg-slate-50', 'bg-white'); btn.classList.replace('border-slate-100', 'border-red-400'); btn.classList.replace('text-slate-600', 'text-red-500');
            document.querySelectorAll('.faq-item').forEach(item => {
                item.classList.remove('active');
                item.style.display = (kategori === 'Semua' || item.dataset.kategori === kategori) ? 'block' : 'none';
            });
        }

        /* ---------- PENCARIAN AI ---------- */
        const answerBox = document.getElementById('answerBox');
        let sedangCari = false;

        async function panggilAPI(payload) {
            const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail_error || data.error || 'Gagal');
            return data;
        }

        function tampilJawaban(pertanyaan, jawaban, badge, ok = true) {
            answerBox.classList.remove('hidden');
            answerBox.innerHTML = `
            <div class="pop bg-white rounded-2xl border ${ok ? 'border-emerald-200' : 'border-amber-200'} shadow-md overflow-hidden">
                <div class="flex items-start gap-2 px-4 pt-3">
                    <p class="flex-1 text-[11px] font-semibold text-slate-400 leading-snug"><i class="fas fa-comment-dots mr-1"></i>${esc(pertanyaan)}</p>
                    <button onclick="tutupJawaban()" aria-label="Tutup" class="text-slate-300 hover:text-red-500 -mt-0.5"><i class="fas fa-times"></i></button>
                </div>
                <p class="px-4 py-2.5 text-[13px] text-slate-700 leading-relaxed whitespace-pre-line">${esc(jawaban)}</p>
                <div class="px-4 pb-3"><span class="inline-flex items-center gap-1 text-[9px] font-bold ${ok ? 'text-emerald-600 bg-emerald-50' : 'text-amber-600 bg-amber-50'} px-2 py-0.5 rounded-full">${badge}</span></div>
            </div>`;
        }
        function tutupJawaban() { answerBox.classList.add('hidden'); answerBox.innerHTML = ''; }

        function tampilRekomendasi(list, judul) {
            document.getElementById('recoTitle').innerHTML = `<i class="fas fa-lightbulb text-amber-400"></i> ${judul}`;
            const el = document.getElementById('recoList');
            if (!list || !list.length) { el.innerHTML = ''; return; }
            window._reco = list;
            el.innerHTML = list.map((r, i) => `
                <button onclick="pilihRekomendasi(${i})" class="text-left w-full flex items-center gap-3 bg-slate-50 hover:bg-emerald-50 border border-slate-100 hover:border-emerald-200 rounded-lg px-3 py-2.5 transition-colors active:scale-[0.98]">
                    <i class="far fa-question-circle text-emerald-500 text-sm shrink-0"></i>
                    <span class="flex-1 text-[12px] font-medium text-slate-700 leading-snug">${esc(r.q)}</span>
                    <i class="fas fa-chevron-right text-slate-300 text-[10px]"></i>
                </button>`).join('');
        }

        // Rekomendasi langsung menampilkan jawabannya (tanpa memanggil AI lagi)
        function pilihRekomendasi(i) {
            const r = window._reco[i];
            document.getElementById('searchInput').value = r.q;
            tampilJawaban(r.q, r.a, '<i class="fas fa-book-open"></i> Dari Panduan');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function cariAI() {
            const input = document.getElementById('searchInput');
            const q = input.value.trim();
            if (q.length < 2 || sedangCari) return;
            sedangCari = true;
            input.blur();
            const btn = document.getElementById('btnCari');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-sm"></i>';

            answerBox.classList.remove('hidden');
            answerBox.innerHTML = `<div class="pop bg-white rounded-2xl border border-slate-200 shadow-md px-4 py-4 flex items-center gap-3">
                <div class="dots flex gap-1"><span></span><span></span><span></span></div>
                <p class="text-xs text-slate-500">Mencari jawaban untuk "${esc(q)}"...</p></div>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const d = await panggilAPI({ action: 'help', query: q });
                const badge = d.mode === 'ai' ? '<i class="fas fa-wand-magic-sparkles"></i> Dijawab asisten AI' : '<i class="fas fa-book-open"></i> Dari Panduan';
                tampilJawaban(q, d.answer, badge, d.found !== false);
                tampilRekomendasi(d.related, 'Pertanyaan Terkait');
            } catch (e) {
                console.error(e);
                tampilJawaban(q, 'Maaf, pencarian sedang bermasalah. Coba lagi sebentar lagi, atau gunakan Chat Customer Support di bagian bawah halaman.', '<i class="fas fa-triangle-exclamation"></i> Gagal memuat', false);
            } finally {
                sedangCari = false;
                btn.innerHTML = '<i class="fas fa-search text-sm"></i>';
            }
        }

        // Rekomendasi awal
        (async () => {
            try { const d = await panggilAPI({ action: 'suggest' }); tampilRekomendasi(d.related, 'Pertanyaan yang Sering Ditanyakan'); }
            catch (e) {
                console.error(e);
                // Cadangan lokal bila API belum aktif
                tampilRekomendasi(FAQ.slice(0, 4).map(([, q, a]) => ({ q, a })), 'Pertanyaan yang Sering Ditanyakan');
            }
        })();

        function bukaWhatsApp() {
            const nomorWA = "628895615630";
            const namaSiswa = localStorage.getItem('namaSiswaCendekia') || "[Isi Nama Anda]";
            const teks = `Halo Tim Support Argumentasi,\nSaya membutuhkan bantuan terkait sistem.\n\nNama : ${namaSiswa}\nPeran : [Siswa / Guru] *pilih salah satu*\nKendala : [Tuliskan kendala Anda secara detail di sini]\n\nTerima kasih.`;
            window.open(`https://wa.me/${nomorWA}?text=${encodeURIComponent(teks)}`, '_blank');
        }
    </script>
</body>
</html>
