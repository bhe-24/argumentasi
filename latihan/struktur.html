<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bedah Struktur - Ruang Latihan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], reading: ['Merriweather', 'serif'] }, colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } } } } }</script>
    <script>
/* latihan-core — penyimpanan per-browser (localStorage + IndexedDB), XP, timer, toast, PDF */
(function () {
    const LS = 'lat_v1', DBN = 'latihan-db'; let S = null, siapP = null;
    const pad = n => String(n).padStart(2, '0');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
    const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
    const idbOpen = () => new Promise((ok, no) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
    const idbGet = async () => { try { const d = await idbOpen(); return await new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } };
    const idbSet = async v => { try { const d = await idbOpen(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'state'); t.oncomplete = ok; t.onerror = ok; t.onabort = ok; }); } catch (e) {} };

    const L = {
        esc, today, pad,
        siap() { return siapP || (siapP = (async () => {
            const a = lsRead(), b = await idbGet();
            S = [a, b].filter(x => x && x.hari).sort((x, y) => (y.u || 0) - (x.u || 0))[0] || { v: 1, id: uuid(), u: Date.now(), hari: {} };
            L.simpan(true); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
            return S; })()); },
        state: () => S,
        simpan(tetap) {
            if (!tetap) S.u = Date.now();
            const ks = Object.keys(S.hari).sort(); while (ks.length > 45) delete S.hari[ks.shift()];
            try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
            idbSet(JSON.parse(JSON.stringify(S)));
        },
        aktif() { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.spin && now < h.spin.ts + 864e5 && (!best || h.spin.ts > S.hari[best].spin.ts)) best = k; } return best; },
        baru() { const k = 'c' + Date.now(); S.hari[k] = { sesi: {}, hasil: {} }; return S.hari[k]; },
        hari(kunci) { if (kunci === undefined || kunci === null) { const a = L.aktif(); return a ? S.hari[a] : null; } return S.hari[kunci] || null; },
        sisaReset() { const a = L.aktif(); return a ? Math.max(0, S.hari[a].spin.ts + 864e5 - Date.now()) : 0; },
        jam(ms) { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); },
        nama: () => localStorage.getItem('namaSiswaCendekia') || 'Siswa',
        xp: () => (parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + parseInt(localStorage.getItem('kelasPointsArg') || '0')),
        tambahXp(n) { localStorage.setItem('latihanPointsCendekia', String(parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + n)); },
        fmt(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); },
        menit: s => Math.max(1, Math.round(s / 60)),
        acakInt(n) { if (window.crypto && crypto.getRandomValues) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } return Math.floor(Math.random() * n); },
        async paket(hid) {
            const r = await fetch('/api/latihan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'buat', handoutId: hid }), signal: AbortSignal.timeout(75000) });
            const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.detail_error || 'Server error (' + r.status + ')'); return d;
        },
        toast(msg, err) {
            let c = document.getElementById('lToast');
            if (!c) { c = document.createElement('div'); c.id = 'lToast'; c.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100000] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none'; document.body.appendChild(c); }
            const t = document.createElement('div'); t.className = `${err ? 'bg-red-500' : 'bg-slate-800'} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2`;
            t.innerHTML = `<i class="fas ${err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400'}"></i><span class="flex-1">${esc(msg)}</span>`; c.appendChild(t); setTimeout(() => t.remove(), 3000);
        },
        beep(jenis) {
            try { const x = new (window.AudioContext || window.webkitAudioContext)(), o = x.createOscillator(), g = x.createGain(); o.connect(g); g.connect(x.destination);
                if (jenis === 'ok') { o.type = 'sine'; o.frequency.setValueAtTime(523, x.currentTime); o.frequency.exponentialRampToValueAtTime(1046, x.currentTime + .12); }
                else if (jenis === 'tik') { o.type = 'square'; o.frequency.setValueAtTime(900, x.currentTime); }
                else { o.type = 'sawtooth'; o.frequency.setValueAtTime(150, x.currentTime); }
                g.gain.setValueAtTime(.06, x.currentTime); g.gain.exponentialRampToValueAtTime(.001, x.currentTime + (jenis === 'tik' ? .06 : .4)); o.start(); o.stop(x.currentTime + .4); } catch (e) {}
        },
        async pdf(el, namaBerkas) {
            if (!window.html2pdf) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; s.onload = ok; s.onerror = () => no(new Error('Pembuat PDF gagal dimuat')); document.head.appendChild(s); });
            const c = el.cloneNode(true); c.style.cssText = 'display:block;position:static;width:700px;background:#fff;color:#0f172a';
            await html2pdf().set({ margin: [10, 10, 12, 10], filename: namaBerkas, image: { type: 'jpeg', quality: .95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'], avoid: '.nobreak' } }).from(c).save();
        }
    };
    window.L = L;
})();
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #e2e8f0; -webkit-tap-highlight-color: transparent; }
        .up { animation: up .35s ease-out both; } @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .kertas { background: #fffdf8; background-image: repeating-linear-gradient(transparent 0 31px, rgba(148,163,184,.18) 31px 32px); border: 1px solid #e7e5e4; border-left: 3px solid #fca5a5; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .pil-lbl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; padding: .55rem .4rem; border: 2px solid #e2e8f0; border-radius: .75rem; background: #fff; font-size: 11px; font-weight: 700; color: #64748b; transition: all .18s; }
        .pil-lbl:active { transform: scale(.96); }
        .pil-lbl.sel-tesis { border-color: #f59e0b; background: #fffbeb; color: #b45309; animation: pop .25s ease-out; }
        .pil-lbl.sel-argumen { border-color: #0ea5e9; background: #f0f9ff; color: #0369a1; animation: pop .25s ease-out; }
        .pil-lbl.sel-kesimpulan { border-color: #8b5cf6; background: #f5f3ff; color: #6d28d9; animation: pop .25s ease-out; }
        @keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .kal-span { transition: all .2s; border-radius: 4px; padding: 1px 3px; cursor: pointer; }
        .kal-span.hl-tesis { background: #fef3c7; color: #92400e; border-bottom: 2px solid #f59e0b; }
        .kal-span.hl-argumen { background: #e0f2fe; color: #075985; border-bottom: 2px solid #0ea5e9; }
        .kal-span.hl-kesimpulan { background: #ede9fe; color: #5b21b6; border-bottom: 2px solid #8b5cf6; }
        .waktu-kritis { animation: dk 1s infinite; } @keyframes dk { 50% { background: #dc2626; } }
        .tos { position: relative; height: 112px; display: flex; justify-content: center; align-items: center; }
        .tos .h { position: absolute; font-size: 66px; color: #fcd34d; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
        .hl { animation: tosL 1.2s cubic-bezier(.2,.9,.3,1.15) .1s both; } .hr { animation: tosR 1.2s cubic-bezier(.2,.9,.3,1.15) .1s both; }
        @keyframes tosL { 0% { transform: translateX(-170px) rotate(-55deg); opacity: 0; } 50% { transform: translateX(-6px) rotate(-8deg); opacity: 1; } 62% { transform: translateX(-20px) rotate(-22deg); } 100% { transform: translateX(-12px) rotate(-14deg); opacity: 1; } }
        @keyframes tosR { 0% { transform: scaleX(-1) translateX(-170px) rotate(-55deg); opacity: 0; } 50% { transform: scaleX(-1) translateX(-6px) rotate(-8deg); opacity: 1; } 62% { transform: scaleX(-1) translateX(-20px) rotate(-22deg); } 100% { transform: scaleX(-1) translateX(-12px) rotate(-14deg); opacity: 1; } }
        .tos .boom { position: absolute; width: 20px; height: 20px; border-radius: 9999px; border: 4px solid #fde047; opacity: 0; animation: boom .7s ease-out .62s both; }
        @keyframes boom { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(6); opacity: 0; } }
        .tos .sp { position: absolute; color: #fde047; font-size: 14px; opacity: 0; animation: sp .9s ease-out .65s both; }
        @keyframes sp { 0% { transform: scale(0) rotate(0); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1.4) rotate(120deg); opacity: 0; } }
        .goyang { animation: goy 1.2s ease-in-out infinite; } @keyframes goy { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-12px) rotate(6deg); } }
        .detak { animation: dtk 1.2s ease-in-out infinite; } @keyframes dtk { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        .rpt { display: none; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; }
        @media print { body > *:not(#laporan) { display: none !important; } #laporan { display: block !important; } body { background: #fff; } }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-100 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-300">

    <header class="sticky top-0 z-50 bg-brand-green h-14 px-4 flex items-center gap-3 shadow-md">
        <a id="btnBack" href="../latihan.html" aria-label="Kembali" class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition"><i class="fas fa-chevron-left"></i></a>
        <div class="flex-1 min-w-0"><h1 class="text-white font-bold text-sm leading-tight truncate">Bedah Struktur</h1><p id="hSub" class="text-white/70 text-[10px] leading-tight truncate">Memuat…</p></div>
        <span id="hTimer" class="hidden shrink-0 bg-white text-brand-green px-3 py-1 rounded-full text-xs font-extrabold tabular-nums"><i class="far fa-clock mr-1"></i><span id="hTimerTxt">00:00</span></span>
    </header>
    <div id="barWaktu" class="hidden sticky top-14 z-40 h-1.5 bg-slate-300"><div id="barWaktuIsi" class="h-full bg-brand-green transition-all duration-500" style="width:100%"></div></div>

    <main id="main" class="flex-grow px-3 py-4"><div class="text-center py-16 text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl"></i></div></main>

    <div id="bar" class="hidden sticky bottom-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 p-3 flex items-center gap-3">
        <div class="flex-1 min-w-0"><p id="barInfo" class="text-[11px] font-semibold text-slate-600"></p><div class="h-1.5 bg-slate-200 rounded-full overflow-hidden mt-1.5"><div id="barJawab" class="h-full bg-brand-green rounded-full transition-all" style="width:0"></div></div></div>
        <button onclick="mintaKumpul()" class="shrink-0 bg-brand-green text-white font-bold px-5 py-3 rounded-xl text-xs shadow-md active:scale-95 transition"><i class="fas fa-paper-plane mr-1.5"></i>Kumpulkan</button>
    </div>
</div>

<div id="modal" class="fixed inset-0 bg-slate-900/60 z-[99999] hidden items-end sm:items-center justify-center">
    <div class="up bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5">
        <div id="mIkon" class="w-12 h-12 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-xl mx-auto mb-3"><i class="fas fa-triangle-exclamation"></i></div>
        <h3 id="mJudul" class="font-bold text-slate-800 text-center text-sm"></h3><p id="mKet" class="text-[11px] text-slate-500 text-center mt-1.5 leading-relaxed"></p>
        <div class="grid grid-cols-2 gap-2 mt-5"><button onclick="jawabModal(false)" id="mBatal" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">Batal</button><button onclick="jawabModal(true)" id="mOk" class="py-3 rounded-xl bg-brand-green text-white font-bold text-xs">Lanjutkan</button></div>
    </div>
</div>

<div id="laporan" class="rpt"></div>

<script>
const $ = id => document.getElementById(id), esc = L.esc, qs = new URLSearchParams(location.search);
const LBL = {
    tesis: ['Tesis', 'amber', 'fa-compass', 'Pernyataan pendapat / klaim awal'],
    argumen: ['Argumen', 'sky', 'fa-scale-balanced', 'Alasan, bukti, data pendukung'],
    kesimpulan: ['Kesimpulan', 'purple', 'fa-flag-checkered', 'Penegasan ulang / simpulan akhir']
};
const URUT_LBL = ['tesis', 'argumen', 'kesimpulan'];
const NAV_BAGIAN = [
    ['pilgan', 'Pilihan Ganda', 'pilgan.html', 'fa-circle-check', 'blue'],
    ['struktur', 'Bedah Struktur', 'struktur.html', 'fa-layer-group', 'amber'],
    ['esai', 'Isi Argumentasi', 'esai.html', 'fa-pen-nib', 'emerald'],
    ['kritis', 'Uji Berpikir', 'kritis.html', 'fa-brain', 'rose']
];
let H, P, teks, totalWaktu, tgl, sesi, timer = null, aktif = false, resolveM = null;

function normKat(v) {
    if (v === 0 || v === '0') return 'tesis';
    if (v === 1 || v === '1') return 'argumen';
    if (v === 2 || v === '2') return 'kesimpulan';
    const s = String(v ?? '').toLowerCase().trim();
    if (s.includes('tes') || s.includes('pendahuluan') || s.includes('klaim') || s.includes('pendapat')) return 'tesis';
    if (s.includes('kesimpulan') || s.includes('simpulan') || s.includes('penutup') || s.includes('penegasan')) return 'kesimpulan';
    return 'argumen';
}
function normTeks(raw) {
    const arr = Array.isArray(raw.teks) ? raw.teks : (Array.isArray(raw.kalimat) ? raw.kalimat : (Array.isArray(raw.soal) ? raw.soal : []));
    const kunciArr = Array.isArray(raw.kunci) ? raw.kunci : (Array.isArray(raw.j) ? raw.j : []);
    return arr.map((x, idx) => {
        if (typeof x === 'string') return { k: x, j: normKat(kunciArr[idx] ?? 'argumen'), bahas: '' };
        return {
            k: x.k ?? x.kalimat ?? x.teks ?? x.t ?? x.p ?? x.pernyataan ?? '',
            j: normKat(x.j ?? x.peran ?? x.label ?? x.struktur ?? x.jenis ?? x.kunci ?? kunciArr[idx] ?? 'argumen'),
            bahas: x.bahas ?? x.pembahasan ?? x.alasan ?? x.penjelasan ?? ''
        };
    });
}

const modal = (judul, ket, ok, batal, ikon) => new Promise(r => { resolveM = r; $('mJudul').textContent = judul; $('mKet').textContent = ket; $('mOk').textContent = ok || 'Lanjutkan'; $('mBatal').textContent = batal || 'Batal'; $('mIkon').innerHTML = `<i class="fas ${ikon || 'fa-triangle-exclamation'}"></i>`; $('modal').classList.replace('hidden', 'flex'); });
window.jawabModal = v => { $('modal').classList.replace('flex', 'hidden'); if (resolveM) { resolveM(v); resolveM = null; } };
const badge = k => { const [n, c, i] = LBL[k] || LBL.argumen; return `<span class="inline-flex items-center gap-1 text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-${c}-100 text-${c}-700"><i class="fas ${i}"></i>${n}</span>`; };

L.siap().then(() => {
    tgl = qs.get('tgl') || L.aktif(); H = tgl ? L.hari(tgl) : null;
    if (!H || !H.pack || !H.pack.struktur) return location.replace('../latihan.html');
    P = H.pack.struktur; teks = normTeks(P); totalWaktu = P.waktu || P.total || Math.max(180, teks.length * 40);
    $('hSub').textContent = H.pack.judul;
    if (H.hasil.struktur) return tampilHasil();
    if (H.sesi.struktur) { sesi = H.sesi.struktur; return Date.now() >= sesi.batas ? kumpulkan(true) : renderUjian(); }
    if (tgl !== L.aktif()) return tidakDikerjakan();
    tampilIntro();
});

/* ================= INTRO ================= */
function tampilIntro() {
    $('main').innerHTML = `<div class="up bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <div class="w-14 h-14 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-2xl mx-auto"><i class="fas fa-layer-group"></i></div>
        <h2 class="text-center font-extrabold text-slate-800 text-base mt-3">Bedah Struktur Argumentasi</h2>
        <p class="text-center text-[11px] text-slate-500 mt-1 leading-relaxed">Analisis peran setiap kalimat dari materi <b>${esc(H.pack.judul)}</b>.</p>
        <div class="grid grid-cols-2 gap-2.5 mt-5">
            <div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-2xl font-extrabold text-slate-800">${teks.length}</p><p class="text-[10px] text-slate-500 font-semibold">Kalimat</p></div>
            <div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-2xl font-extrabold text-slate-800">${L.menit(totalWaktu)}</p><p class="text-[10px] text-slate-500 font-semibold">Menit total</p></div>
        </div>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-5 mb-2">3 Bagian Struktur</p>
        <div class="space-y-2">${URUT_LBL.map(k => `<div class="flex items-center gap-2.5 bg-slate-50 rounded-xl p-2.5">${badge(k)}<span class="text-[11px] text-slate-600">${LBL[k][3]}</span></div>`).join('')}</div>
        <ul class="mt-5 space-y-2 text-[11px] text-slate-600 leading-relaxed">
            <li class="flex gap-2"><i class="fas fa-highlighter text-amber-500 mt-0.5"></i><span>Baca wacana secara utuh di bagian atas, lalu tentukan apakah tiap kalimat merupakan <b>Tesis</b>, <b>Argumen</b>, atau <b>Kesimpulan</b>.</span></li>
            <li class="flex gap-2"><i class="fas fa-lock text-rose-500 mt-0.5"></i><span><b>Hanya bisa dikerjakan 1 kali per hari.</b> Waktu terus berjalan walau halaman ditutup.</span></li>
            <li class="flex gap-2"><i class="fas fa-floppy-disk text-emerald-500 mt-0.5"></i><span>Pilihan labelmu otomatis tersimpan di browser ini.</span></li>
        </ul>
        <button onclick="mulai()" class="mt-6 w-full bg-brand-green text-white font-bold py-3.5 rounded-xl shadow-md text-sm active:scale-95 transition"><i class="fas fa-play mr-1.5"></i>Mulai Bedah Struktur</button></div>`;
}
window.mulai = async () => {
    if (!(await modal('Mulai sekarang?', 'Waktu langsung berjalan dan latihan ini tidak bisa diulang.', 'Mulai', 'Belum', 'fa-play'))) return;
    const t = Date.now(); H.sesi.struktur = sesi = { mulai: t, batas: t + totalWaktu * 1000, jawab: {}, keluar: 0 }; L.simpan(); renderUjian(); window.scrollTo({ top: 0 });
};
function tidakDikerjakan() { $('main').innerHTML = '<div class="bg-white rounded-2xl p-8 text-center border border-slate-200"><i class="fas fa-calendar-xmark text-4xl text-slate-300 mb-3"></i><p class="text-sm font-bold text-slate-700">Latihan ini tidak dikerjakan</p><p class="text-[11px] text-slate-500 mt-1">Latihan hanya bisa dikerjakan dalam 24 jam sejak gacha diputar.</p><a href="../latihan.html" class="inline-block mt-4 bg-brand-green text-white text-xs font-bold px-5 py-2.5 rounded-full">Kembali</a></div>'; }

/* ================= UJIAN ================= */
function renderUjian() {
    aktif = true; $('hTimer').classList.remove('hidden'); $('barWaktu').classList.remove('hidden'); $('bar').classList.remove('hidden'); $('btnBack').removeAttribute('href'); $('btnBack').onclick = e => { e.preventDefault(); L.toast('Ujian sedang berjalan. Selesaikan atau kumpulkan dulu.', true); };
    $('main').innerHTML = `<div class="kertas up p-4 pl-5 mb-4"><p class="text-center text-[10px] font-extrabold tracking-[.25em] text-slate-500">LEMBAR KERJA</p><h2 class="text-center font-reading font-bold text-slate-800 text-[15px] mt-1">${esc(P.judul || 'Bedah Struktur Teks Argumentasi')}</h2>
        <div class="mt-3 text-[11px] text-slate-600 space-y-0.5"><p><b class="inline-block w-14">Nama</b>: ${esc(L.nama())}</p><p><b class="inline-block w-14">Materi</b>: ${esc(H.pack.judul)}</p><p><b class="inline-block w-14">Petunjuk</b>: Pilih label struktur yang tepat untuk setiap kalimat.</p></div>
        <div class="mt-3 pt-3 border-t border-slate-200/80"><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5"><i class="fas fa-book-open mr-1"></i>Pratinjau Wacana Utuh (Ketuk kalimat untuk melompat)</p>
        <p id="wacanaUtuh" class="font-reading text-[12px] text-slate-700 leading-[1.9] bg-white/80 p-3 rounded-lg border border-slate-200/70">${teks.map((s, i) => `<span id="sp${i}" onclick="lompat(${i})" class="kal-span ${sesi.jawab[i] ? 'hl-' + sesi.jawab[i] : ''}"><b>[${i + 1}]</b> ${esc(s.k)}</span> `).join('')}</p></div></div>
        <div id="daftar" class="space-y-3.5">${teks.map((s, i) => `<article id="q${i}" class="kertas p-4 pl-5">
            <div class="flex items-center justify-between mb-2"><span class="inline-flex items-center gap-1.5 text-[11px] font-extrabold text-slate-700"><span class="w-6 h-6 rounded-full bg-slate-800 text-white text-[11px] flex items-center justify-center">${i + 1}</span>Kalimat ke-${i + 1}</span><span id="st${i}">${sesi.jawab[i] ? badge(sesi.jawab[i]) : '<span class="text-[10px] text-slate-400 font-semibold">Belum dilabeli</span>'}</span></div>
            <p class="font-reading text-[13px] text-slate-800 leading-[1.8] mb-3">${esc(s.k)}</p>
            <div class="grid grid-cols-3 gap-2">${URUT_LBL.map(k => `<button class="pil-lbl ${sesi.jawab[i] === k ? 'sel-' + k : ''}" data-i="${i}" data-k="${k}"><i class="fas ${LBL[k][2]} text-sm"></i><span>${LBL[k][0]}</span></button>`).join('')}</div></article>`).join('')}</div><div class="h-6"></div>`;

    $('daftar').addEventListener('click', e => {
        const b = e.target.closest('.pil-lbl'); if (!b || !aktif) return;
        const i = +b.dataset.i, k = b.dataset.k;
        sesi.jawab[i] = k; L.simpan();
        b.parentElement.querySelectorAll('.pil-lbl').forEach(x => x.className = 'pil-lbl');
        b.classList.add('sel-' + k);
        $('st' + i).innerHTML = badge(k);
        const sp = $('sp' + i); if (sp) sp.className = 'kal-span hl-' + k;
        if (navigator.vibrate) navigator.vibrate(8);

    hitungJawab(); jalankanWaktu();
}
window.lompat = i => { const el = $('q' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function hitungJawab() { const n = Object.keys(sesi.jawab).length; $('barInfo').textContent = `${n} dari ${teks.length} kalimat dilabeli`; $('barJawab').style.width = (n / teks.length * 100) + '%'; }
function jalankanWaktu() {
    const tot = sesi.batas - sesi.mulai; clearInterval(timer);
    const tik = () => { const sisa = Math.ceil((sesi.batas - Date.now()) / 1000); $('hTimerTxt').textContent = L.fmt(sisa); $('barWaktuIsi').style.width = Math.max(0, (sesi.batas - Date.now()) / tot * 100) + '%';
        const krit = sisa <= 60 || (sesi.batas - Date.now()) / tot < .1; $('hTimer').classList.toggle('waktu-kritis', krit); $('hTimer').classList.toggle('text-white', krit); $('hTimer').classList.toggle('text-brand-green', !krit); $('barWaktuIsi').className = 'h-full transition-all duration-500 ' + (krit ? 'bg-red-500' : 'bg-brand-green');
        if (sisa <= 0) kumpulkan(true); };
    tik(); timer = setInterval(tik, 400);
}
window.addEventListener('beforeunload', e => { if (aktif) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (aktif && document.hidden && sesi) { sesi.keluar = (sesi.keluar || 0) + 1; L.simpan(); } });
window.mintaKumpul = async () => {
    const sisa = teks.length - Object.keys(sesi.jawab).length;
    if (await modal('Kumpulkan hasil struktur?', sisa ? `Masih ada ${sisa} kalimat belum dilabeli. Setelah dikumpulkan, jawaban tidak bisa diubah.` : 'Semua kalimat sudah dilabeli. Setelah dikumpulkan, jawaban tidak bisa diubah.', 'Kumpulkan', 'Periksa Lagi', 'fa-paper-plane')) kumpulkan(false);
};
function kumpulkan(auto) {
    if (H.hasil.struktur) return; aktif = false; clearInterval(timer);
    const jawab = sesi.jawab, benar = teks.filter((s, i) => jawab[i] === s.j).length, skor = Math.round(benar / teks.length * 100);
    const xp = Math.round(skor / 4) + (skor >= 80 ? 10 : 0); L.tambahXp(xp);
    H.hasil.struktur = { skor, benar, total: teks.length, jawab, durasi: Math.round((Math.min(Date.now(), sesi.batas) - sesi.mulai) / 1000), batas: totalWaktu, selesai: Date.now(), auto: !!auto, keluar: sesi.keluar || 0, xp }; L.simpan();
    $('hTimer').classList.add('hidden'); $('barWaktu').classList.add('hidden'); $('bar').classList.add('hidden'); $('btnBack').href = '../latihan.html'; $('btnBack').onclick = null;
    if (auto) L.toast('Waktu habis. Jawabanmu otomatis dikumpulkan.', true);
    tampilHasil(true);
}

/* ================= HASIL ================= */
function navLatihanHtml() {
    const q = tgl && tgl !== L.aktif() ? `?tgl=${tgl}` : '';
    return `<div class="bg-white rounded-2xl border border-slate-200 p-4 mt-3"><h3 class="font-bold text-slate-800 text-xs mb-2.5"><i class="fas fa-compass text-brand-green mr-1.5"></i>Latihan Lainnya pada Materi Ini</h3><div class="grid grid-cols-2 gap-2">${NAV_BAGIAN.map(([k, n, url, ic, c]) => {
        const hs = H.hasil[k], cur = k === 'struktur';
        return `<a href="${url}${q}" class="flex items-center gap-2.5 p-2.5 rounded-xl border ${cur ? 'border-brand-green bg-emerald-50/60' : 'border-slate-100 bg-slate-50 hover:border-slate-300'} transition"><div class="w-8 h-8 rounded-lg bg-${c}-100 text-${c}-600 flex items-center justify-center text-xs shrink-0"><i class="fas ${ic}"></i></div><div class="min-w-0 flex-1"><p class="font-bold text-[11px] text-slate-800 truncate">${n}</p><p class="text-[9px] font-semibold ${hs ? 'text-emerald-600' : 'text-slate-400'}">${hs ? 'Selesai · ' + hs.skor : 'Siap dikerjakan'}</p></div></a>`;
    }).join('')}</div></div>`;
}
function tampilHasil(baru) {

    const rek = R.skor === 100 ? 'Sempurna! Kamu berhasil mengidentifikasi seluruh bagian tesis, argumen, dan kesimpulan dengan tepat.' : `Kamu paling tepat mengenali bagian <b>${LBL[kuat][0]}</b> (${tk[kuat].b}/${tk[kuat].n}). ${lemah !== kuat || tk[lemah].b < tk[lemah].n ? `Perhatikan lagi ciri kalimat <b>${LBL[lemah][0]}</b> (${tk[lemah].b}/${tk[lemah].n}) pada pembahasan di bawah.` : ''}`;

    $('main').innerHTML = `<div class="up rounded-3xl p-5 text-center text-white shadow-lg" style="background:linear-gradient(135deg,#064e3b,#059669 60%,#34d399)">${anim}
            <p class="text-[10px] uppercase tracking-[.2em] text-white/70 font-semibold">Skor Akhir</p><div class="flex items-end justify-center gap-1"><span id="skorAngka" class="text-6xl font-extrabold leading-none">0</span><span class="text-xl font-bold text-white/70 mb-1">/100</span></div>
            <p class="font-extrabold text-base mt-2">${pesan[0]}</p><p class="text-[11px] text-white/80">${pesan[1]}</p>
            <span class="inline-block mt-3 bg-white/20 rounded-full px-3 py-1 text-[11px] font-bold"><i class="fas fa-star text-amber-300 mr-1"></i>+${R.xp} XP</span>${R.auto ? '<p class="text-[10px] text-amber-200 mt-2"><i class="fas fa-clock mr-1"></i>Dikumpulkan otomatis karena waktu habis</p>' : ''}</div>
        <div class="grid grid-cols-3 gap-2.5 mt-3"><div class="bg-white rounded-xl p-3 text-center border border-slate-200"><p class="text-lg font-extrabold text-emerald-600">${R.benar}</p><p class="text-[9px] font-semibold text-slate-500">Tepat</p></div><div class="bg-white rounded-xl p-3 text-center border border-slate-200"><p class="text-lg font-extrabold text-rose-500">${R.total - R.benar}</p><p class="text-[9px] font-semibold text-slate-500">Keliru/Kosong</p></div><div class="bg-white rounded-xl p-3 text-center border border-slate-200"><p class="text-lg font-extrabold text-slate-700">${L.fmt(R.durasi)}</p><p class="text-[9px] font-semibold text-slate-500">dari ${L.fmt(R.batas)}</p></div></div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 mt-3"><h3 class="font-bold text-slate-800 text-sm mb-3">Ketepatan per Struktur</h3><div class="space-y-3">${urut.map(t => { const p = Math.round(tk[t].b / tk[t].n * 100); return `<div><div class="flex justify-between items-center mb-1">${badge(t)}<span class="text-[11px] font-bold text-slate-600">${tk[t].b}/${tk[t].n}</span></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-${LBL[t][1]}-500 rounded-full transition-all duration-1000" style="width:0" data-w="${p}"></div></div></div>`; }).join('')}</div>
            <div class="mt-4 bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-[11px] text-emerald-900 leading-relaxed"><i class="fas fa-lightbulb text-amber-500 mr-1"></i>${rek}</div>${R.keluar ? `<p class="text-[10px] text-slate-400 mt-2.5"><i class="fas fa-eye-slash mr-1"></i>Kamu meninggalkan halaman ${R.keluar}× saat ujian.</p>` : ''}</div>
        <div class="grid grid-cols-2 gap-2 mt-3"><button id="btnPdf" onclick="unduhPdf()" class="bg-white border border-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs active:scale-95 transition"><i class="fas fa-file-pdf text-red-500 mr-1.5"></i>Unduh PDF</button><a href="../latihan.html" class="bg-brand-green text-white font-bold py-3 rounded-xl text-xs shadow-md text-center active:scale-95 transition"><i class="fas fa-house mr-1.5"></i>Ruang Latihan</a></div>

    window.scrollTo({ top: 0 });

function filterBahas(f) {

    const arr = teks.map((s, i) => [s, i]).filter(([s, i]) => f === 'semua' || R.jawab[i] !== s.j);
    $('bahas').innerHTML = arr.length ? arr.map(([s, i]) => { const u = R.jawab[i], ok = u === s.j;
        return `<article class="bg-white rounded-2xl border ${ok ? 'border-emerald-200' : 'border-rose-200'} p-4"><div class="flex items-center gap-2 mb-2"><span class="w-6 h-6 rounded-full ${ok ? 'bg-emerald-500' : 'bg-rose-500'} text-white text-[11px] font-extrabold flex items-center justify-center">${i + 1}</span>${badge(s.j)}<span class="ml-auto text-[10px] font-bold ${ok ? 'text-emerald-600' : 'text-rose-500'}">${ok ? 'Benar' : u === undefined ? 'Tidak dilabeli' : 'Keliru'}</span></div>
            <p class="font-reading text-[12px] text-slate-800 leading-[1.75] mb-2.5">${esc(s.k)}</p>
            <div class="flex flex-wrap gap-2 text-[11px]"><span class="px-2.5 py-1 rounded-lg ${ok ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">Pilihanmu: <b>${u ? LBL[u][0] : '-'}</b></span><span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700">Kunci: <b>${LBL[s.j][0]}</b></span></div>
            ${s.bahas ? `<div class="mt-2.5 bg-slate-50 rounded-lg p-2.5 text-[11px] text-slate-600 leading-relaxed"><b class="text-slate-700">Pembahasan:</b> ${esc(s.bahas)}</div>` : ''}</article>`; }).join('')
        : '<div class="bg-white rounded-2xl p-6 text-center text-xs text-emerald-600 font-semibold border border-emerald-100"><i class="fas fa-circle-check mr-1"></i> Semua kalimat berhasil dilabeli dengan benar!</div>';

window.filterBahas = filterBahas;

/* ================= PDF ================= */
function isiLaporan() {
    const R = H.hasil.struktur, tk = {}; teks.forEach((s, i) => { const t = tk[s.j] = tk[s.j] || { n: 0, b: 0 }; t.n++; if (R.jawab[i] === s.j) t.b++; });
    const tgls = new Date(H.spin.ts).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('laporan').innerHTML = `<div style="padding:4px"><div style="border-bottom:3px solid #059669;padding-bottom:8px;margin-bottom:12px"><div style="font-size:17px;font-weight:800;color:#064e3b">LAPORAN LATIHAN — BEDAH STRUKTUR</div><div style="color:#64748b;font-size:11px">Platform Argumentasi · Ruang Latihan</div></div>
        <table style="width:100%;font-size:12px;margin-bottom:12px"><tr><td style="width:90px;color:#64748b">Nama</td><td><b>${esc(L.nama())}</b></td></tr><tr><td style="color:#64748b">Tanggal</td><td>${tgls}</td></tr><tr><td style="color:#64748b">Materi</td><td>${esc(H.pack.judul)}</td></tr><tr><td style="color:#64748b">Waktu</td><td>${L.fmt(R.durasi)} dari ${L.fmt(R.batas)}${R.auto ? ' (waktu habis)' : ''}</td></tr></table>
        <div class="nobreak" style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;margin-bottom:12px"><span style="font-size:30px;font-weight:800;color:#059669">${R.skor}</span><span style="color:#64748b"> / 100</span> &nbsp;·&nbsp; Tepat <b>${R.benar}</b> dari <b>${R.total}</b> kalimat</div>
        <table class="nobreak" style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px"><tr style="background:#f1f5f9"><th style="text-align:left;padding:5px 8px;border:1px solid #e2e8f0">Bagian Struktur</th><th style="padding:5px 8px;border:1px solid #e2e8f0">Tepat</th><th style="padding:5px 8px;border:1px solid #e2e8f0">Jumlah</th><th style="padding:5px 8px;border:1px solid #e2e8f0">Ketepatan</th></tr>${URUT_LBL.filter(t => tk[t]).map(t => `<tr><td style="padding:5px 8px;border:1px solid #e2e8f0">${LBL[t][0]}</td><td style="text-align:center;padding:5px 8px;border:1px solid #e2e8f0">${tk[t].b}</td><td style="text-align:center;padding:5px 8px;border:1px solid #e2e8f0">${tk[t].n}</td><td style="text-align:center;padding:5px 8px;border:1px solid #e2e8f0">${Math.round(tk[t].b / tk[t].n * 100)}%</td></tr>`).join('')}</table>
        <div style="font-size:13px;font-weight:800;margin-bottom:6px;color:#064e3b">Rincian Analisis Kalimat</div>
        ${teks.map((s, i) => { const u = R.jawab[i], ok = u === s.j; return `<div class="nobreak" style="border:1px solid ${ok ? '#a7f3d0' : '#fecdd3'};border-radius:6px;padding:8px 10px;margin-bottom:8px"><div style="font-size:11px"><b>Kalimat ${i + 1}</b> &nbsp;·&nbsp; <b style="color:${ok ? '#059669' : '#e11d48'}">${ok ? 'TEPAT' : 'KELIRU'}</b></div><div style="margin:3px 0;font-size:12px">${esc(s.k)}</div><div style="font-size:11px"><span style="color:#64748b">Labelmu:</span> ${u ? LBL[u][0] : '-'} &nbsp;|&nbsp; <span style="color:#64748b">Kunci:</span> <b>${LBL[s.j][0]}</b></div>${s.bahas ? `<div style="font-size:11px;color:#475569;margin-top:3px"><i>Pembahasan:</i> ${esc(s.bahas)}</div>` : ''}</div>`; }).join('')}
        <div style="font-size:9px;color:#94a3b8;margin-top:10px;text-align:center">Dihasilkan otomatis oleh Platform Argumentasi · ${new Date(R.selesai).toLocaleString('id-ID')}</div></div>`;
}
window.unduhPdf = async () => {
    const b = $('btnPdf'), isi = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1.5"></i>Membuat PDF…';
    try { isiLaporan(); await L.pdf($('laporan'), `Laporan-Bedah-Struktur-${new Date(H.spin.ts).toISOString().slice(0, 10)}.pdf`); L.toast('PDF berhasil dibuat.'); }
    catch (e) { console.error(e); L.toast('Gagal membuat PDF. Memakai cetak browser…', true); setTimeout(() => window.print(), 600); }

};
