<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isi Argumentasi - Ruang Latihan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], reading: ['Merriweather', 'serif'] }, colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } } } } }</script>
    
    <script>
    (function () {
        const LS = 'lat_v1', DBN = 'latihan-db'; let S = null, siapP = null;
        const pad = n => String(n).padStart(2, '0');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
        const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
        const idbOpen = () => new Promise((ok, no) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
        const idbGet = async () => { try { const d = await idbOpen(); return await new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } };
        const idbSet = async v => { try { const d = await idbOpen(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'state'); t.oncomplete = ok; t.onerror = ok; t.onabort = ok; }); } catch (e) {} };

        const L = {
            esc, today, pad,
            siap() { return siapP || (siapP = (async () => {
                const a = lsRead(), b = await idbGet();
                S = [a, b].filter(x => x && x.hari).sort((x, y) => (y.u || 0) - (x.u || 0))[0] || { v: 1, id: uuid(), u: Date.now(), hari: {} };
                L.simpan(true); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
                return S; })()); },
            state: () => S,
            simpan(tetap) {
                if (!tetap) S.u = Date.now();
                const ks = Object.keys(S.hari).sort(); while (ks.length > 45) delete S.hari[ks.shift()];
                try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
                idbSet(JSON.parse(JSON.stringify(S)));
            },
            aktif() { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.spin && now < h.spin.ts + 864e5 && (!best || h.spin.ts > S.hari[best].spin.ts)) best = k; } return best; },
            hari(kunci) { if (kunci === undefined || kunci === null) { const a = L.aktif(); return a ? S.hari[a] : null; } return S.hari[kunci] || null; },
            nama: () => localStorage.getItem('namaSiswaCendekia') || 'Siswa',
            xp: () => (parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + parseInt(localStorage.getItem('kelasPointsArg') || '0')),
            tambahXp(n) { localStorage.setItem('latihanPointsCendekia', String(parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + n)); },
            fmt(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); },
            menit: s => Math.max(1, Math.round(s / 60)),
            toast(msg, err) {
                let c = document.getElementById('lToast');
                if (!c) { c = document.createElement('div'); c.id = 'lToast'; c.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100000] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none'; document.body.appendChild(c); }
                const t = document.createElement('div'); t.className = (err ? 'bg-red-500' : 'bg-slate-800') + ' text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 up';
                t.innerHTML = '<i class="fas ' + (err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400') + '"></i><span class="flex-1">' + esc(msg) + '</span>'; c.appendChild(t); setTimeout(() => t.remove(), 3000);
            },
            beep(jenis) {
                try { const x = new (window.AudioContext || window.webkitAudioContext)(), o = x.createOscillator(), g = x.createGain(); o.connect(g); g.connect(x.destination);
                    if (jenis === 'ok') { o.type = 'sine'; o.frequency.setValueAtTime(523, x.currentTime); o.frequency.exponentialRampToValueAtTime(1046, x.currentTime + .12); }
                    else if (jenis === 'tik') { o.type = 'square'; o.frequency.setValueAtTime(900, x.currentTime); }
                    else { o.type = 'sawtooth'; o.frequency.setValueAtTime(150, x.currentTime); }
                    g.gain.setValueAtTime(.06, x.currentTime); g.gain.exponentialRampToValueAtTime(.001, x.currentTime + (jenis === 'tik' ? .06 : .4)); o.start(); o.stop(x.currentTime + .4); } catch (e) {}
            },
            async pdf(el, namaBerkas) {
                if (!window.html2pdf) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; s.onload = ok; s.onerror = () => no(new Error('Pembuat PDF gagal dimuat')); document.head.appendChild(s); });
                const c = el.cloneNode(true); c.style.cssText = 'display:block;position:static;width:700px;background:#fff;color:#0f172a';
                await html2pdf().set({ margin: [10, 10, 12, 10], filename: namaBerkas, image: { type: 'jpeg', quality: .95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'], avoid: '.nobreak' } }).from(c).save();
            }
        };
        window.L = L;
    })();
    </script>
    
    <style>
        body { font-family: 'Poppins', sans-serif; background: #e2e8f0; -webkit-tap-highlight-color: transparent; }
        .up { animation: up .35s ease-out both; } @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .kertas { background: #fffdf8; background-image: repeating-linear-gradient(transparent 0 31px, rgba(148,163,184,.18) 31px 32px); border: 1px solid #e7e5e4; border-left: 3px solid #fca5a5; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        textarea.esai-input { width: 100%; min-height: 120px; border: 2px solid #e2e8f0; border-radius: .8rem; padding: .75rem; font-size: 13px; color: #334155; background: #fff; transition: all .18s; resize: vertical; line-height: 1.6; }
        textarea.esai-input:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1); }
        .waktu-kritis { animation: dk 1s infinite; } @keyframes dk { 50% { background: #dc2626; } }
        .tos { position: relative; height: 112px; display: flex; justify-content: center; align-items: center; }
        .tos .h { position: absolute; font-size: 66px; color: #fcd34d; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
        .hl { animation: tosL 1.2s cubic-bezier(.2,.9,.3,1.15) .1s both; } .hr { animation: tosR 1.2s cubic-bezier(.2,.9,.3,1.15) .1s both; }
        @keyframes tosL { 0% { transform: translateX(-170px) rotate(-55deg); opacity: 0; } 50% { transform: translateX(-6px) rotate(-8deg); opacity: 1; } 62% { transform: translateX(-20px) rotate(-22deg); } 100% { transform: translateX(-12px) rotate(-14deg); opacity: 1; } }
        @keyframes tosR { 0% { transform: scaleX(-1) translateX(-170px) rotate(-55deg); opacity: 0; } 50% { transform: scaleX(-1) translateX(-6px) rotate(-8deg); opacity: 1; } 62% { transform: scaleX(-1) translateX(-20px) rotate(-22deg); } 100% { transform: scaleX(-1) translateX(-12px) rotate(-14deg); opacity: 1; } }
        .tos .boom { position: absolute; width: 20px; height: 20px; border-radius: 9999px; border: 4px solid #fde047; opacity: 0; animation: boom .7s ease-out .62s both; }
        @keyframes boom { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(6); opacity: 0; } }
        .tos .sp { position: absolute; color: #fde047; font-size: 14px; opacity: 0; animation: sp .9s ease-out .65s both; }
        @keyframes sp { 0% { transform: scale(0) rotate(0); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1.4) rotate(120deg); opacity: 0; } }
        .goyang { animation: goy 1.2s ease-in-out infinite; } @keyframes goy { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-12px) rotate(6deg); } }
        .detak { animation: dtk 1.2s ease-in-out infinite; } @keyframes dtk { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        .rpt { display: none; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; }
        @media print { body > *:not(#laporan) { display: none !important; } #laporan { display: block !important; } body { background: #fff; } }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-100 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-300">

    <header class="sticky top-0 z-50 bg-brand-green h-14 px-4 flex items-center gap-3 shadow-md">
        <a id="btnBack" href="../latihan.html" aria-label="Kembali" class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition"><i class="fas fa-chevron-left"></i></a>
        <div class="flex-1 min-w-0"><h1 class="text-white font-bold text-sm leading-tight truncate">Esai Argumentasi</h1><p id="hSub" class="text-white/70 text-[10px] leading-tight truncate">Memuat…</p></div>
        <span id="hTimer" class="hidden shrink-0 bg-white text-brand-green px-3 py-1 rounded-full text-xs font-extrabold tabular-nums"><i class="far fa-clock mr-1"></i><span id="hTimerTxt">00:00</span></span>
    </header>
    <div id="barWaktu" class="hidden sticky top-14 z-40 h-1.5 bg-slate-300"><div id="barWaktuIsi" class="h-full bg-brand-green transition-all duration-500" style="width:100%"></div></div>

    <main id="main" class="flex-grow px-3 py-4"><div class="text-center py-16 text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl"></i></div></main>

    <div id="bar" class="hidden sticky bottom-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 p-3 flex items-center gap-3">
        <div class="flex-1 min-w-0"><p id="barInfo" class="text-[11px] font-semibold text-slate-600"></p><div class="h-1.5 bg-slate-200 rounded-full overflow-hidden mt-1.5"><div id="barJawab" class="h-full bg-brand-green rounded-full transition-all" style="width:0"></div></div></div>
        <button onclick="mintaKumpul()" class="shrink-0 bg-brand-green text-white font-bold px-5 py-3 rounded-xl text-xs shadow-md active:scale-95 transition"><i class="fas fa-paper-plane mr-1.5"></i>Kumpulkan</button>
    </div>
</div>

<div id="modal" class="fixed inset-0 bg-slate-900/60 z-[99999] hidden items-end sm:items-center justify-center">
    <div class="up bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5">
        <div id="mIkon" class="w-12 h-12 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-xl mx-auto mb-3"></div>
        <h3 id="mJudul" class="font-bold text-slate-800 text-center text-sm"></h3><p id="mKet" class="text-[11px] text-slate-500 text-center mt-1.5 leading-relaxed"></p>
        <div class="grid grid-cols-2 gap-2 mt-5"><button onclick="jawabModal(false)" id="mBatal" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">Batal</button><button onclick="jawabModal(true)" id="mOk" class="py-3 rounded-xl bg-brand-green text-white font-bold text-xs">Lanjutkan</button></div>
    </div>
</div>

<div id="laporan" class="rpt"></div>

<script>
const $ = id => document.getElementById(id), esc = L.esc;

window.H = null; window.P = null; window.soal = null; window.totalWaktu = 0; window.sesi = null; window.timer = null; window.aktif = false; window.resolveM = null;
const TKT = { mudah: ['Mudah', 'emerald', 'fa-seedling'], sedang: ['Sedang', 'sky', 'fa-gauge'], sulit: ['Sulit', 'amber', 'fa-mountain'], hots: ['HOTS', 'rose', 'fa-fire'] };
const NAV_BAGIAN = [
    ['pilgan', 'Pilihan Ganda', 'pilgan.html', 'fa-circle-check', 'blue'],
    ['struktur', 'Bedah Struktur', 'struktur.html', 'fa-layer-group', 'amber'],
    ['esai', 'Esai Argumentasi', 'esai.html', 'fa-pen-nib', 'emerald'],
    ['kritis', 'Uji Berpikir', 'kritis.html', 'fa-brain', 'rose']
];

window.normSoal = function(arr) { 
    return (arr || []).map(s => { 
        const tk = String(s.tingkat || 'sedang').toLowerCase(); 
        return { 
            p: s.p ?? s.pertanyaan ?? s.teks ?? 'Tuliskan argumenmu secara logis.', 
            tingkat: TKT[tk] ? tk : 'sedang', 
            waktu: s.waktu || 300, 
            bahas: s.bahas ?? s.pembahasan ?? s.kunci ?? '' 
        }; 
    }); 
};

window.modal = (judul, ket, ok, batal, ikon) => new Promise(r => { window.resolveM = r; $('mJudul').textContent = judul; $('mKet').textContent = ket; $('mOk').textContent = ok || 'Lanjutkan'; $('mBatal').textContent = batal || 'Batal'; $('mIkon').innerHTML = '<i class="fas ' + (ikon || 'fa-triangle-exclamation') + '"></i>'; $('modal').classList.replace('hidden', 'flex'); });
window.jawabModal = v => { $('modal').classList.replace('flex', 'hidden'); if (window.resolveM) { window.resolveM(v); window.resolveM = null; } };
window.badge = t => { const arr = TKT[t] || TKT.sedang; return '<span class="inline-flex items-center gap-1 text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-' + arr[1] + '-100 text-' + arr[1] + '-700"><i class="fas ' + arr[2] + '"></i>' + arr[0] + '</span>'; };

async function init() {
    await L.siap();
    const H = L.hari();
    
    $('btnBack').href = '../latihan.html';
    
    if (!H || !H.pack || !H.pack.esai) {
        $('main').innerHTML = [
            '<div class="bg-white rounded-2xl p-8 text-center border border-slate-200">',
            '<i class="fas fa-exclamation-triangle text-4xl text-slate-300 mb-3"></i>',
            '<p class="text-sm font-bold text-slate-700">Latihan Belum Siap</p>',
            '<p class="text-[11px] text-slate-500 mt-1">Silakan putar gacha dan siapkan soal di halaman utama terlebih dahulu.</p>',
            '<a href="../latihan.html" class="inline-block mt-4 bg-brand-green text-white text-xs font-bold px-5 py-2.5 rounded-full">Kembali</a>',
            '</div>'
        ].join('');
        return;
    }
    
    window.H = H;
    window.P = H.pack.esai;
    window.soal = window.normSoal(window.P.soal);
    window.totalWaktu = window.P.total || window.P.waktu || window.soal.reduce((a, b) => a + (b.waktu || 300), 0) || 1200;
    
    if($('hSub')) $('hSub').textContent = H.spin.judul || 'Esai Argumentasi';

    if (H.hasil && H.hasil.esai) return window.tampilHasil();
    
    if (H.sesi && H.sesi.esai) { 
        window.sesi = H.sesi.esai; 
        return Date.now() >= window.sesi.batas ? window.kumpulkan(true) : window.renderUjian(); 
    }
    
    window.tampilIntro();
}

window.tampilIntro = function() {
    const hit = {}; window.soal.forEach(s => hit[s.tingkat] = (hit[s.tingkat] || 0) + 1);
    const tkBadge = ['mudah', 'sedang', 'sulit', 'hots'].filter(t => hit[t]).map(t => '<span class="flex items-center gap-1.5">' + badge(t) + '<b class="text-[11px] text-slate-600">×' + hit[t] + '</b></span>').join('');
    
    $('main').innerHTML = [
        '<div class="up bg-white rounded-2xl shadow-sm border border-slate-200 p-5">',
        '<div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl mx-auto"><i class="fas fa-pen-nib"></i></div>',
        '<h2 class="text-center font-extrabold text-slate-800 text-base mt-3">Esai Argumentasi</h2>',
        '<p class="text-center text-[11px] text-slate-500 mt-1 leading-relaxed">Susun argumenmu sendiri berdasarkan materi <b>' + esc(window.H.spin.judul) + '</b>. Gunakan logika dan bukti yang kuat.</p>',
        '<div class="grid grid-cols-2 gap-2.5 mt-5">',
        '<div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-2xl font-extrabold text-slate-800">' + window.soal.length + '</p><p class="text-[10px] text-slate-500 font-semibold">Soal Esai</p></div>',
        '<div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-2xl font-extrabold text-slate-800">' + L.menit(window.totalWaktu) + '</p><p class="text-[10px] text-slate-500 font-semibold">Menit total</p></div>',
        '</div>',
        '<p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-5 mb-2">Tingkat kesulitan</p>',
        '<div class="flex flex-wrap gap-2">' + tkBadge + '</div>',
        '<ul class="mt-5 space-y-2 text-[11px] text-slate-600 leading-relaxed">',
        '<li class="flex gap-2"><i class="fas fa-quote-left text-emerald-500 mt-0.5"></i><span>Jawab setiap pertanyaan esai secara mendalam dan jelas.</span></li>',
        '<li class="flex gap-2"><i class="fas fa-lock text-rose-500 mt-0.5"></i><span><b>Hanya bisa dikerjakan 1 kali per hari.</b> Setelah dimulai, waktu terus berjalan walau halaman ditutup.</span></li>',
        '<li class="flex gap-2"><i class="fas fa-floppy-disk text-emerald-500 mt-0.5"></i><span>Jawabanmu tersimpan otomatis di perangkat ini.</span></li>',
        '</ul>',
        '<button onclick="mulai()" class="mt-6 w-full bg-brand-green text-white font-bold py-3.5 rounded-xl shadow-md text-sm active:scale-95 transition"><i class="fas fa-play mr-1.5"></i>Mulai Latihan</button>',
        '</div>'
    ].join('');
}

window.mulai = async () => {
    if (!(await modal('Mulai sekarang?', 'Waktu langsung berjalan dan latihan ini tidak bisa diulang.', 'Mulai', 'Belum', 'fa-play'))) return;
    const t = Date.now(); 
    window.H.sesi.esai = window.sesi = { mulai: t, batas: t + window.totalWaktu * 1000, jawab: {}, keluar: 0 }; 
    L.simpan(); 
    renderUjian(); 
    window.scrollTo({ top: 0 });
};

window.renderUjian = function() {
    window.aktif = true; $('hTimer').classList.remove('hidden'); $('barWaktu').classList.remove('hidden'); $('bar').classList.remove('hidden'); $('btnBack').removeAttribute('href'); 
    $('btnBack').onclick = e => { e.preventDefault(); L.toast('Ujian sedang berjalan. Selesaikan atau kumpulkan dulu.', true); };
    
    let html = [
        '<div class="kertas up p-4 pl-5 mb-4">',
        '<p class="text-center text-[10px] font-extrabold tracking-[.25em] text-slate-500">LEMBAR SOAL</p>',
        '<h2 class="text-center font-reading font-bold text-slate-800 text-[15px] mt-1">Esai Argumentasi</h2>',
        '<div class="mt-3 text-[11px] text-slate-600 space-y-0.5">',
        '<p><b class="inline-block w-14">Nama</b>: ' + esc(L.nama()) + '</p>',
        '<p><b class="inline-block w-14">Materi</b>: ' + esc(window.H.spin.judul) + '</p>',
        '<p><b class="inline-block w-14">Petunjuk</b>: Tulis jawaban esaimu dengan argumen yang jelas dan kuat.</p>',
        '</div></div>',
        '<div id="daftar" class="space-y-4">'
    ];
    
    window.soal.forEach((s, i) => {
        html.push('<article id="q' + i + '" class="kertas p-4 pl-5">');
        html.push('<div class="flex items-center gap-2 mb-2.5"><span class="w-7 h-7 rounded-full bg-slate-800 text-white text-xs font-extrabold flex items-center justify-center">' + (i + 1) + '</span>' + badge(s.tingkat) + '<span class="ml-auto text-[10px] font-semibold text-slate-400"><i class="far fa-clock"></i> ' + L.fmt(s.waktu) + '</span></div>');
        html.push('<p class="font-reading text-[13px] text-slate-800 leading-[1.8] mb-3">' + esc(s.p) + '</p>');
        html.push('<textarea class="esai-input" data-i="' + i + '" placeholder="Ketik jawabanmu di sini...">' + esc(window.sesi.jawab[i] || '') + '</textarea></article>');
    });
    
    html.push('</div><div class="h-6"></div>');
    $('main').innerHTML = html.join('');
    
    $('daftar').addEventListener('input', e => { 
        if (e.target.tagName.toLowerCase() === 'textarea' && window.aktif) {
            const i = +e.target.dataset.i;
            window.sesi.jawab[i] = e.target.value;
            L.simpan(); 
            hitungJawab();
        }
    }); 
    
    hitungJawab(); jalankanWaktu();
}

window.hitungJawab = function() { 
    const n = Object.values(window.sesi.jawab).filter(v => typeof v === 'string' && v.trim().length > 10).length; 
    $('barInfo').textContent = n + ' dari ' + window.soal.length + ' soal terjawab'; 
    $('barJawab').style.width = (n / window.soal.length * 100) + '%'; 
} 

window.jalankanWaktu = function() {
    const tot = window.sesi.batas - window.sesi.mulai; clearInterval(window.timer);
    const tik = () => { const sisa = Math.ceil((window.sesi.batas - Date.now()) / 1000); $('hTimerTxt').textContent = L.fmt(sisa); $('barWaktuIsi').style.width = Math.max(0, (window.sesi.batas - Date.now()) / tot * 100) + '%';
        const krit = sisa <= 60 || (window.sesi.batas - Date.now()) / tot < .1; $('hTimer').classList.toggle('waktu-kritis', krit); $('hTimer').classList.toggle('text-white', krit); $('hTimer').classList.toggle('text-brand-green', !krit); $('barWaktuIsi').className = 'h-full transition-all duration-500 ' + (krit ? 'bg-red-500' : 'bg-brand-green');
        if (sisa <= 0) kumpulkan(true); };
    tik(); window.timer = setInterval(tik, 400);
}

window.addEventListener('beforeunload', e => { if (window.aktif) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (window.aktif && document.hidden && window.sesi) { window.sesi.keluar = (window.sesi.keluar || 0) + 1; L.simpan(); } });

window.mintaKumpul = async () => {
    const sisa = window.soal.length - Object.values(window.sesi.jawab).filter(v => typeof v === 'string' && v.trim().length > 10).length;
    if (await modal('Kumpulkan jawaban?', sisa ? 'Masih ada ' + sisa + ' soal belum dijawab. Setelah dikumpulkan, jawaban tidak bisa diubah dan latihan tidak bisa diulang.' : 'Semua soal sudah dijawab. Setelah dikumpulkan, jawaban tidak bisa diubah.', 'Kumpulkan', 'Periksa Lagi', 'fa-paper-plane')) kumpulkan(false);
};

window.kumpulkan = async function(auto) { 
    if (window.H.hasil.esai) return; window.aktif = false; clearInterval(window.timer); 
    const jawab = window.sesi.jawab; 
    const dijawab = Object.values(jawab).filter(v => typeof v === 'string' && v.trim().length > 10).length;
    const skor = Math.round(dijawab / window.soal.length * 100); 
    const xp = dijawab * 5; window.L.tambahXp(xp); 
    
    window.H.hasil.esai = { skor: skor, benar: dijawab, total: window.soal.length, jawab: jawab, durasi: Math.round((Math.min(Date.now(), window.sesi.batas) - window.sesi.mulai) / 1000), batas: window.totalWaktu, selesai: Date.now(), auto: !!auto, keluar: window.sesi.keluar || 0, xp: xp }; 
    
    delete window.H.sesi.esai;
    L.simpan(); 
    
    $('hTimer').classList.add('hidden'); $('barWaktu').classList.add('hidden'); $('bar').classList.add('hidden'); $('btnBack').onclick = null; $('btnBack').href = '../latihan.html'; 
    if (auto) L.toast('Waktu habis. Jawabanmu otomatis dikumpulkan.', true); 
    window.tampilHasil(true); 
}

window.navLatihanHtml = function() {
    let navHtml = '<div class="bg-white rounded-2xl border border-slate-200 p-4 mt-3"><h3 class="font-bold text-slate-800 text-xs mb-2.5"><i class="fas fa-compass text-brand-green mr-1.5"></i>Latihan Lainnya pada Materi Ini</h3><div class="grid grid-cols-2 gap-2">';
    NAV_BAGIAN.forEach(item => {
        const k = item[0], n = item[1], url = item[2], ic = item[3], c = item[4];
        const hs = window.H.hasil[k], cur = k === 'esai';
        navHtml += '<a href="' + url + '" class="flex items-center gap-2.5 p-2.5 rounded-xl border ' + (cur ? 'border-brand-green bg-emerald-50/60' : 'border-slate-100 bg-slate-50 hover:border-slate-300') + ' transition"><div class="w-8 h-8 rounded-lg bg-' + c + '-100 text-' + c + '-600 flex items-center justify-center text-xs shrink-0"><i class="fas ' + ic + '"></i></div><div class="min-w-0 flex-1"><p class="font-bold text-[11px] text-slate-800 truncate">' + n + '</p><p class="text-[9px] font-semibold ' + (hs ? 'text-emerald-600' : 'text-slate-400') + '">' + (hs ? 'Selesai' : 'Siap dikerjakan') + '</p></div></a>';
    });
    navHtml += '</div></div>';
    return navHtml;
}

window.tampilHasil = function(baru) { 
    const R = window.H.hasil.esai; window.aktif = false; $('hTimer').classList.add('hidden'); $('barWaktu').classList.add('hidden'); $('bar').classList.add('hidden'); 
    
    const pesan = R.benar > 0 ? ['Luar biasa!', 'Kamu telah menyelesaikan latihan esai ini.'] : ['Tetap semangat!', 'Lain kali coba isi jawabanmu dengan lebih lengkap.']; 
    const anim = R.benar > 0 ? '<div class="tos"><i class="fas fa-hand h hl"></i><i class="fas fa-hand h hr"></i><div class="boom"></div><i class="fas fa-star sp" style="top:8px;left:42%"></i><i class="fas fa-star sp" style="top:24px;left:58%"></i><i class="fas fa-sparkles sp" style="top:70px;left:36%"></i><i class="fas fa-star sp" style="top:78px;left:60%"></i></div>' 
        : '<div class="tos"><i class="fas fa-heart detak" style="font-size:60px;color:#fda4af;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))"></i></div>'; 
 
    let html = [
        '<div class="up rounded-3xl p-5 text-center text-white shadow-lg" style="background:linear-gradient(135deg,#064e3b,#059669 60%,#34d399)">',
        anim,
        '<p class="text-[10px] uppercase tracking-[.2em] text-white/70 font-semibold">Status Pengerjaan</p><div class="flex items-end justify-center gap-1"><span class="text-4xl font-extrabold leading-none mt-2">Selesai</span></div>',
        '<p class="font-extrabold text-base mt-4">' + pesan[0] + '</p><p class="text-[11px] text-white/80">' + pesan[1] + '</p>',
        '<span class="inline-block mt-3 bg-white/20 rounded-full px-3 py-1 text-[11px] font-bold"><i class="fas fa-star text-amber-300 mr-1"></i>+' + R.xp + ' XP Partisipasi</span>',
        R.auto ? '<p class="text-[10px] text-amber-200 mt-2"><i class="fas fa-clock mr-1"></i>Dikumpulkan otomatis karena waktu habis</p>' : '',
        '</div>',
        '<div class="grid grid-cols-2 gap-2.5 mt-3"><div class="bg-white rounded-xl p-3 text-center border border-slate-200"><p class="text-lg font-extrabold text-emerald-600">' + R.benar + '</p><p class="text-[9px] font-semibold text-slate-500">Soal Dijawab</p></div><div class="bg-white rounded-xl p-3 text-center border border-slate-200"><p class="text-lg font-extrabold text-slate-700">' + L.fmt(R.durasi) + '</p><p class="text-[9px] font-semibold text-slate-500">dari ' + L.fmt(R.batas) + '</p></div></div>',
        '<div class="grid grid-cols-2 gap-2 mt-3"><button id="btnPdf" onclick="unduhPdf()" class="bg-white border border-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs active:scale-95 transition"><i class="fas fa-file-pdf text-red-500 mr-1.5"></i>Unduh PDF</button><a href="../latihan.html" class="bg-brand-green text-white font-bold py-3 rounded-xl text-xs shadow-md text-center active:scale-95 transition"><i class="fas fa-house mr-1.5"></i>Ruang Latihan</a></div>',
        navLatihanHtml(),
        '<p class="text-center text-[10px] text-slate-400 mt-4"><i class="fas fa-rotate mr-1"></i>Gacha & latihan baru dibuka setelah ' + new Date(window.H.spin.ts + 864e5).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</p>',
        '<div class="flex items-center justify-between mt-6 mb-3"><h3 class="font-bold text-slate-800 text-sm">Review Jawabanmu</h3></div><div id="bahas" class="space-y-3"></div>'
    ].join('');
    
    $('main').innerHTML = html;
    window.scrollTo({ top: 0 }); 
    if (baru) { if (R.benar > 0) { L.beep('ok'); setTimeout(() => window.confetti && confetti({ particleCount: 140, spread: 80, origin: { y: .4 }, zIndex: 100001 }), 700); } else L.beep('ok'); } 
    
    let ulasanHtml = '';
    window.soal.forEach((s, i) => { 
        const u = R.jawab[i] || ''; 
        const diJawab = u.trim().length > 10;
        ulasanHtml += '<article class="bg-white rounded-2xl border border-slate-200 p-4"><div class="flex items-center gap-2 mb-2"><span class="w-6 h-6 rounded-full bg-slate-800 text-white text-[11px] font-extrabold flex items-center justify-center">' + (i + 1) + '</span>' + badge(s.tingkat) + '<span class="ml-auto text-[10px] font-bold ' + (diJawab ? 'text-emerald-600' : 'text-rose-500') + '">' + (diJawab ? 'Dijawab' : 'Tidak Valid/Kosong') + '</span></div>';
        ulasanHtml += '<p class="font-reading text-[12px] text-slate-800 leading-[1.75] mb-2.5">' + esc(s.p) + '</p>';
        ulasanHtml += '<div class="bg-slate-50 rounded-lg p-2.5 mb-2.5 border border-slate-100"><p class="text-[10px] font-bold text-slate-500 mb-1">Jawabanmu:</p><p class="text-[11px] text-slate-700 whitespace-pre-wrap">' + (u ? esc(u) : '<i class="text-slate-400">Kosong</i>') + '</p></div>';
        if(s.bahas) {
            ulasanHtml += '<div class="bg-emerald-50 rounded-lg p-2.5 text-[11px] text-emerald-900 leading-relaxed border border-emerald-100"><b class="text-emerald-700">Poin Penting (Ekspektasi AI):</b> ' + esc(s.bahas) + '</div>';
        }
        ulasanHtml += '</article>';
    });
    $('bahas').innerHTML = ulasanHtml; 
} 

window.isiLaporan = function() {
    const R = window.H.hasil.esai;
    const tgls = new Date(window.H.spin.ts).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    
    let repHtml = [
        '<div style="padding:4px"><div style="border-bottom:3px solid #059669;padding-bottom:8px;margin-bottom:12px"><div style="font-size:17px;font-weight:800;color:#064e3b">LAPORAN LATIHAN — ESAI ARGUMENTASI</div><div style="color:#64748b;font-size:11px">Platform Argumentasi · Ruang Latihan</div></div>',
        '<table style="width:100%;font-size:12px;margin-bottom:12px"><tr><td style="width:90px;color:#64748b">Nama</td><td><b>' + esc(L.nama()) + '</b></td></tr><tr><td style="color:#64748b">Tanggal</td><td>' + tgls + '</td></tr><tr><td style="color:#64748b">Materi</td><td>' + esc(window.H.spin.judul) + '</td></tr><tr><td style="color:#64748b">Waktu</td><td>' + L.fmt(R.durasi) + ' dari ' + L.fmt(R.batas) + (R.auto ? ' (waktu habis)' : '') + '</td></tr></table>',
        '<div class="nobreak" style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;margin-bottom:12px"><span style="font-size:24px;font-weight:800;color:#059669">Selesai</span> &nbsp;·&nbsp; Dijawab <b>' + R.benar + '</b> dari <b>' + R.total + '</b> soal</div>',
        '<div style="font-size:13px;font-weight:800;margin-bottom:6px;color:#064e3b">Rincian Jawaban</div>'
    ];
    
    window.soal.forEach((s, i) => { 
        const jwb = R.jawab[i] || '';
        let item = '<div class="nobreak" style="border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;margin-bottom:8px"><div style="font-size:11px"><b>' + (i + 1) + '.</b> <span style="color:#64748b">[' + TKT[s.tingkat][0] + ']</span></div><div style="margin:3px 0;font-size:12px">' + esc(s.p) + '</div><div style="font-size:11px;margin-bottom:4px"><span style="color:#64748b">Jawabanmu:</span><br> ' + (jwb ? esc(jwb) : '<i>Kosong</i>') + '</div>';
        if(s.bahas) item += '<div style="font-size:11px;color:#065f46;background:#ecfdf5;padding:4px;border-radius:4px;margin-top:4px"><i>Ekspektasi:</i> ' + esc(s.bahas) + '</div>';
        item += '</div>';
        repHtml.push(item);
    });
    
    repHtml.push('<div style="font-size:9px;color:#94a3b8;margin-top:10px;text-align:center">Dihasilkan otomatis oleh Platform Argumentasi · ' + new Date(R.selesai).toLocaleString('id-ID') + '</div></div>');
    $('laporan').innerHTML = repHtml.join('');
}

window.unduhPdf = async () => {
    const b = $('btnPdf'), isi = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1.5"></i>Membuat PDF…';
    try { isiLaporan(); await L.pdf($('laporan'), 'Laporan-Isi-Argumentasi-' + new Date(window.H.spin.ts).toISOString().slice(0, 10) + '.pdf'); L.toast('PDF berhasil dibuat.'); }
    catch (e) { console.error(e); L.toast('Gagal membuat PDF. Memakai cetak browser…', true); setTimeout(() => window.print(), 600); }
    finally { b.disabled = false; b.innerHTML = isi; }
};

init();
</script>
