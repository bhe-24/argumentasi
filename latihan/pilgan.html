<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilihan Ganda - Ruang Latihan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], reading: ['Merriweather', 'serif'] }, colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } } } } }</script>
    
    <!-- Modul Inti: latihan-core (Menghubungkan sesi ke halaman utama) -->
    <script>
    (function () {
        const LS = 'lat_v1', DBN = 'latihan-db'; let S = null, siapP = null;
        const pad = n => String(n).padStart(2, '0');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
        const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
        const idbOpen = () => new Promise((ok, no) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
        const idbGet = async () => { try { const d = await idbOpen(); return await new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } };
        const idbSet = async v => { try { const d = await idbOpen(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'state'); t.oncomplete = ok; t.onerror = ok; t.onabort = ok; }); } catch (e) {} };

        const L = {
            esc, today, pad,
            siap() { return siapP || (siapP = (async () => {
                const a = lsRead(), b = await idbGet();
                S = [a, b].filter(x => x && x.hari).sort((x, y) => (y.u || 0) - (x.u || 0))[0] || { v: 1, id: uuid(), u: Date.now(), hari: {} };
                L.simpan(true); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
                return S; })()); },
            state: () => S,
            simpan(tetap) {
                if (!tetap) S.u = Date.now();
                const ks = Object.keys(S.hari).sort(); while (ks.length > 45) delete S.hari[ks.shift()];
                try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
                idbSet(JSON.parse(JSON.stringify(S)));
            },
            aktif() { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.spin && now < h.spin.ts + 864e5 && (!best || h.spin.ts > S.hari[best].spin.ts)) best = k; } return best; },
            hari(kunci) { if (kunci === undefined || kunci === null) { const a = L.aktif(); return a ? S.hari[a] : null; } return S.hari[kunci] || null; },
            nama: () => localStorage.getItem('namaSiswaCendekia') || 'Siswa',
            xp: () => (parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + parseInt(localStorage.getItem('kelasPointsArg') || '0')),
            tambahXp(n) { localStorage.setItem('latihanPointsCendekia', String(parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + n)); },
            fmt(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); },
            menit: s => Math.max(1, Math.round(s / 60)),
            toast(msg, err) {
                let c = document.getElementById('lToast');
                if (!c) { c = document.createElement('div'); c.id = 'lToast'; c.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100000] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none'; document.body.appendChild(c); }
                const t = document.createElement('div'); t.className = `${err ? 'bg-red-500' : 'bg-slate-800'} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 up`;
                t.innerHTML = `<i class="fas ${err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400'}"></i><span class="flex-1">${esc(msg)}</span>`; c.appendChild(t); setTimeout(() => t.remove(), 3000);
            },
            beep(jenis) {
                try { const x = new (window.AudioContext || window.webkitAudioContext)(), o = x.createOscillator(), g = x.createGain(); o.connect(g); g.connect(x.destination);
                    if (jenis === 'ok') { o.type = 'sine'; o.frequency.setValueAtTime(523, x.currentTime); o.frequency.exponentialRampToValueAtTime(1046, x.currentTime + .12); }
                    else if (jenis === 'tik') { o.type = 'square'; o.frequency.setValueAtTime(900, x.currentTime); }
                    else { o.type = 'sawtooth'; o.frequency.setValueAtTime(150, x.currentTime); }
                    g.gain.setValueAtTime(.06, x.currentTime); g.gain.exponentialRampToValueAtTime(.001, x.currentTime + (jenis === 'tik' ? .06 : .4)); o.start(); o.stop(x.currentTime + .4); } catch (e) {}
            },
            async pdf(el, namaBerkas) {
                if (!window.html2pdf) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; s.onload = ok; s.onerror = () => no(new Error('Pembuat PDF gagal dimuat')); document.head.appendChild(s); });
                const c = el.cloneNode(true); c.style.cssText = 'display:block;position:static;width:700px;background:#fff;color:#0f172a';
                await html2pdf().set({ margin: [10, 10, 12, 10], filename: namaBerkas, image: { type: 'jpeg', quality: .95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'], avoid: '.nobreak' } }).from(c).save();
            }
        };
        window.L = L;
    })();
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background: #e2e8f0; -webkit-tap-highlight-color: transparent; }
        .up { animation: up .35s ease-out both; } @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        /* lembar ujian */
        .kertas { background: #fffdf8; background-image: repeating-linear-gradient(transparent 0 31px, rgba(148,163,184,.18) 31px 32px); border: 1px solid #e7e5e4; border-left: 3px solid #fca5a5; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .opsi { display: flex; gap: .7rem; align-items: flex-start; width: 100%; text-align: left; padding: .65rem .8rem; border: 2px solid #e2e8f0; border-radius: .8rem; background: #fff; transition: all .18s; position: relative; overflow: hidden; }
        .opsi:active { transform: scale(.98); }
        .opsi .huruf { width: 1.6rem; height: 1.6rem; flex-shrink: 0; border-radius: 9999px; background: #f1f5f9; color: #64748b; font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: all .18s; }
        .opsi.sel { border-color: #059669; background: #ecfdf5; animation: pop .28s ease-out; } .opsi.sel .huruf { background: #059669; color: #fff; transform: scale(1.12); }
        @keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.025); } 100% { transform: scale(1); } }
        .opsi.benar { border-color: #10b981; background: #ecfdf5; } .opsi.benar .huruf { background: #10b981; color: #fff; }
        .opsi.salah { border-color: #fb7185; background: #fff1f2; } .opsi.salah .huruf { background: #fb7185; color: #fff; }
        .waktu-kritis { animation: dk 1s infinite; } @keyframes dk { 50% { background: #dc2626; } }
        /* animasi tos */
        .tos { position: relative; height: 112px; display: flex; justify-content: center; align-items: center; }
        .tos .h { position: absolute; font-size: 66px; color: #fcd34d; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
        .hl { animation: tosL 1.2s cubic-bezier(.2,.9,.3,1.15) .1s both; } .hr { animation: tosR 1.2s cubic-bezier(.2,.9,.3,1.15) .1s both; }
        @keyframes tosL { 0% { transform: translateX(-170px) rotate(-55deg); opacity: 0; } 50% { transform: translateX(-6px) rotate(-8deg); opacity: 1; } 62% { transform: translateX(-20px) rotate(-22deg); } 100% { transform: translateX(-12px) rotate(-14deg); opacity: 1; } }
        @keyframes tosR { 0% { transform: scaleX(-1) translateX(-170px) rotate(-55deg); opacity: 0; } 50% { transform: scaleX(-1) translateX(-6px) rotate(-8deg); opacity: 1; } 62% { transform: scaleX(-1) translateX(-20px) rotate(-22deg); } 100% { transform: scaleX(-1) translateX(-12px) rotate(-14deg); opacity: 1; } }
        .tos .boom { position: absolute; width: 20px; height: 20px; border-radius: 9999px; border: 4px solid #fde047; opacity: 0; animation: boom .7s ease-out .62s both; }
        @keyframes boom { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(6); opacity: 0; } }
        .tos .sp { position: absolute; color: #fde047; font-size: 14px; opacity: 0; animation: sp .9s ease-out .65s both; }
        @keyframes sp { 0% { transform: scale(0) rotate(0); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1.4) rotate(120deg); opacity: 0; } }
        .goyang { animation: goy 1.2s ease-in-out infinite; } @keyframes goy { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-12px) rotate(6deg); } }
        .detak { animation: dtk 1.2s ease-in-out infinite; } @keyframes dtk { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        .rpt { display: none; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; }
        @media print { body > *:not(#laporan) { display: none !important; } #laporan { display: block !important; } body { background: #fff; } }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-100 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-300">

    <header class="sticky top-0 z-50 bg-brand-green h-14 px-4 flex items-center gap-3 shadow-md">
        <!-- URL KEMBALI DIUBAH MENJADI ../latihan.html -->
        <a id="btnBack" href="../latihan.html" aria-label="Kembali" class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition"><i class="fas fa-chevron-left"></i></a>
        <div class="flex-1 min-w-0"><h1 class="text-white font-bold text-sm leading-tight truncate">Pilihan Ganda</h1><p id="hSub" class="text-white/70 text-[10px] leading-tight truncate">Memuat…</p></div>
        <span id="hTimer" class="hidden shrink-0 bg-white text-brand-green px-3 py-1 rounded-full text-xs font-extrabold tabular-nums"><i class="far fa-clock mr-1"></i><span id="hTimerTxt">00:00</span></span>
    </header>
    <div id="barWaktu" class="hidden sticky top-14 z-40 h-1.5 bg-slate-300"><div id="barWaktuIsi" class="h-full bg-brand-green transition-all duration-500" style="width:100%"></div></div>

    <main id="main" class="flex-grow px-3 py-4"><div class="text-center py-16 text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl"></i></div></main>

    <div id="bar" class="hidden sticky bottom-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 p-3 flex items-center gap-3">
        <div class="flex-1 min-w-0"><p id="barInfo" class="text-[11px] font-semibold text-slate-600"></p><div class="h-1.5 bg-slate-200 rounded-full overflow-hidden mt-1.5"><div id="barJawab" class="h-full bg-brand-green rounded-full transition-all" style="width:0"></div></div></div>
        <button onclick="mintaKumpul()" class="shrink-0 bg-brand-green text-white font-bold px-5 py-3 rounded-xl text-xs shadow-md active:scale-95 transition"><i class="fas fa-paper-plane mr-1.5"></i>Kumpulkan</button>
    </div>
</div>

<div id="modal" class="fixed inset-0 bg-slate-900/60 z-[99999] hidden items-end sm:items-center justify-center">
    <div class="up bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5">
        <div id="mIkon" class="w-12 h-12 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-xl mx-auto mb-3"><i class="fas fa-triangle-exclamation"></i></div>
        <h3 id="mJudul" class="font-bold text-slate-800 text-center text-sm"></h3><p id="mKet" class="text-[11px] text-slate-500 text-center mt-1.5 leading-relaxed"></p>
        <div class="grid grid-cols-2 gap-2 mt-5"><button onclick="jawabModal(false)" id="mBatal" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">Batal</button><button onclick="jawabModal(true)" id="mOk" class="py-3 rounded-xl bg-brand-green text-white font-bold text-xs">Lanjutkan</button></div>
    </div>
</div>

<div id="laporan" class="rpt"></div>

<script>
const $ = id => document.getElementById(id), esc = L.esc;
const HURUF = ['A', 'B', 'C', 'D', 'E'];
const TKT = { mudah: ['Mudah', 'emerald', 'fa-seedling'], sedang: ['Sedang', 'sky', 'fa-gauge'], sulit: ['Sulit', 'amber', 'fa-mountain'], hots: ['HOTS', 'rose', 'fa-fire'] };

window.H = null; window.P = null; window.soal = null; window.totalWaktu = 0; window.sesi = null; window.timer = null; window.aktif = false; window.resolveM = null;

// Parse data soal dari Gemini
window.normSoal = function(arr) {
    return (arr || []).map(s => { 
        const tk = String(s.tingkat || 'sedang').toLowerCase(); 
        return { 
            p: s.p ?? s.pertanyaan ?? s.pernyataan ?? s.rumpang ?? s.teks ?? 'Soal', 
            konteks: s.tesis ?? s.klaim ?? s.konteks ?? s.kutipan ?? s.wacana ?? '', 
            opsi: Array.isArray(s.opsi) ? s.opsi : (Array.isArray(s.pilihan) ? s.pilihan : []), 
            j: typeof s.j === 'number' ? s.j : (HURUF.indexOf(String(s.j ?? '').trim().toUpperCase()) >= 0 ? HURUF.indexOf(String(s.j ?? '').trim().toUpperCase()) : (parseInt(s.j) || 0)), 
            tingkat: TKT[tk] ? tk : 'sedang', 
            waktu: s.waktu || 60, 
            bahas: s.bahas ?? s.pembahasan ?? s.alasan ?? ''
        }; 
    }); 
};

window.modal = (judul, ket, ok, batal, ikon) => new Promise(r => { window.resolveM = r; $('mJudul').textContent = judul; $('mKet').textContent = ket; $('mOk').textContent = ok || 'Lanjutkan'; $('mBatal').textContent = batal \vert{}\vert{} 'Batal';$('mIkon').innerHTML = `<i class="fas ${ikon || 'fa-triangle-exclamation'}"></i>`; $('modal').classList.replace('hidden', 'flex'); });
window.jawabModal = v => { $('modal').classList.replace('flex', 'hidden'); if (window.resolveM) { window.resolveM(v); window.resolveM = null; } };
window.badge = t => { const [n, c, i] = TKT[t] || TKT.sedang; return `<span class="inline-flex items-center gap-1 text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-${c}-100 text-${c}-700"><i class="fas ${i}"></i>${n}</span>`; };

async function initLatihan() {
    await L.siap();
    const H = L.hari();
    
    // Pastikan tombol selalu bisa kembali ke latihan utama
    const backUrl = '../latihan.html';
    $('btnBack').href = backUrl;
    
    // Validasi apakah pengguna sudah memutar gacha
    if (!H || !H.pack || !H.pack.pilgan) {
        $('main').innerHTML = `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200"><i class="fas fa-exclamation-triangle text-4xl text-slate-300 mb-3"></i><p class="text-sm font-bold text-slate-700">Latihan Belum Siap</p><p class="text-[11px] text-slate-500 mt-1">Silakan putar gacha dan siapkan soal di halaman utama terlebih dahulu.</p><a href="${backUrl}" class="inline-block mt-4 bg-brand-green text-white text-xs font-bold px-5 py-2.5 rounded-full">Kembali</a></div>`;
        return;
    }

    window.H = H;
    window.P = H.pack.pilgan;
    window.soal = window.normSoal(window.P.soal);
    window.totalWaktu = window.P.total || window.P.waktu || window.soal.reduce((a, b) => a + (b.waktu || 60), 0) || 300;
    
    if($('hSub'))$('hSub').textContent = H.spin.judul || 'Latihan Pilihan Ganda';

    // Periksa status (apakah sudah selesai atau sedang berjalan)
    if (H.hasil && H.hasil.pilgan) return window.tampilHasil();
    if (H.sesi && H.sesi.pilgan) { 
        window.sesi = H.sesi.pilgan; 
        return Date.now() >= window.sesi.batas ? window.kumpulkan(true) : window.renderUjian(); 
    }
    
    window.tampilIntro();
}

/* ================= INTRO ================= */
window.tampilIntro = function() {
    const hit = {}; window.soal.forEach(s => hit[s.tingkat] = (hit[s.tingkat] || 0) + 1);
    $('main').innerHTML = `<div class="up bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-500 flex items-center justify-center text-2xl mx-auto"><i class="fas fa-circle-check"></i></div>
        <h2 class="text-center font-extrabold text-slate-800 text-base mt-3">Siap mengerjakan?</h2><p class="text-center text-[11px] text-slate-500 mt-1 leading-relaxed">Soal disusun dari materi <b>${esc(window.H.spin.judul)}</b>.</p>
        <div class="grid grid-cols-2 gap-2.5 mt-5"><div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-2xl font-extrabold text-slate-800">${window.soal.length}</p><p class="text-[10px] text-slate-500 font-semibold">Soal</p></div><div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-2xl font-extrabold text-slate-800">${L.menit(window.totalWaktu)}</p><p class="text-[10px] text-slate-500 font-semibold">Menit total</p></div></div>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-5 mb-2">Tingkat kesulitan</p>
        <div class="flex flex-wrap gap-2">${['mudah', 'sedang', 'sulit', 'hots'].filter(t => hit[t]).map(t => `<span class="flex items-center gap-1.5">${badge(t)}<b class="text-[11px] text-slate-600">×${hit[t]}</b></span>`).join('')}</div>
        <ul class="mt-5 space-y-2 text-[11px] text-slate-600 leading-relaxed">
            <li class="flex gap-2"><i class="fas fa-clock text-amber-500 mt-0.5"></i><span>Waktu ditentukan otomatis sesuai tingkat kesulitan. Hitung mundur berlaku untuk semua soal.</span></li>
            <li class="flex gap-2"><i class="fas fa-lock text-rose-500 mt-0.5"></i><span><b>Hanya bisa dikerjakan 1 kali per hari.</b> Setelah dimulai, waktu terus berjalan walau halaman ditutup.</span></li>
            <li class="flex gap-2"><i class="fas fa-floppy-disk text-emerald-500 mt-0.5"></i><span>Jawabanmu tersimpan otomatis di perangkat ini.</span></li>
        </ul>
        <button onclick="mulai()" class="mt-6 w-full bg-brand-green text-white font-bold py-3.5 rounded-xl shadow-md text-sm active:scale-95 transition"><i class="fas fa-play mr-1.5"></i>Mulai Ujian</button></div>`;
}

window.mulai = async function() {
    if (!(await modal('Mulai sekarang?', 'Waktu langsung berjalan dan latihan ini tidak bisa diulang.', 'Mulai', 'Belum', 'fa-play'))) return;
    const t = Date.now(); 
    window.H.sesi.pilgan = window.sesi = { mulai: t, batas: t + window.totalWaktu * 1000, jawab: {}, keluar: 0 }; 
    L.simpan(); // Simpan melalui core sistem
    renderUjian(); 
    window.scrollTo({ top: 0 });
};

/* ================= UJIAN ================= */
window.renderUjian = function() {
    window.aktif = true; $('hTimer').classList.remove('hidden'); $('barWaktu').classList.remove('hidden');$('bar').classList.remove('hidden'); $('btnBack').removeAttribute('href');$('btnBack').onclick = e => { e.preventDefault(); L.toast('Ujian sedang berjalan. Selesaikan atau kumpulkan dulu.', true); };
    $('main').innerHTML = `<div class="kertas up p-4 pl-5 mb-4"><p class="text-center text-[10px] font-extrabold tracking-[.25em] text-slate-500">LEMBAR SOAL</p><h2 class="text-center font-reading font-bold text-slate-800 text-[15px] mt-1">Pilihan Ganda</h2>
        <div class="mt-3 text-[11px] text-slate-600 space-y-0.5"><p><b class="inline-block w-14">Nama</b>: ${esc(L.nama())}</p><p><b class="inline-block w-14">Materi</b>: ${esc(window.H.spin.judul)}</p><p><b class="inline-block w-14">Petunjuk</b>: Pilih satu jawaban yang paling tepat.</p></div></div>
        <div id="daftar" class="space-y-4">${window.soal.map((s, i) => `<article id="q${i}" class="kertas p-4 pl-5">
            <div class="flex items-center gap-2 mb-2.5"><span class="w-7 h-7 rounded-full bg-slate-800 text-white text-xs font-extrabold flex items-center justify-center">${i + 1}</span>${badge(s.tingkat)}<span class="ml-auto text-[10px] font-semibold text-slate-400"><i class="far fa-clock"></i> ${L.fmt(s.waktu)}</span></div>
            <p class="font-reading text-[13px] text-slate-800 leading-[1.8] mb-3">${esc(s.p)}</p>
            <div class="space-y-2">${s.opsi.map((o, k) => `<button class="opsi ${window.sesi.jawab[i] === k ? 'sel' : ''}" data-i="${i}" data-k="${k}"><span class="huruf">${HURUF[k]}</span><span class="text-[12px] text-slate-700 leading-snug pt-0.5">${esc(o)}</span></button>`).join('')}</div></article>`).join('')}</div><div class="h-6"></div>`;
    
    $('daftar').addEventListener('click', e => { 
        const b = e.target.closest('.opsi'); if (!b || !window.aktif) return; 
        const i = +b.dataset.i, k = +b.dataset.k;
        window.sesi.jawab[i] = k; 
        L.simpan(); // Auto save progres setiap mengklik jawaban!
        b.parentElement.querySelectorAll('.opsi').forEach(x => x.classList.remove('sel')); 
        b.classList.add('sel'); 
        if (navigator.vibrate) navigator.vibrate(8); 
        hitungJawab(); 
    });
    
    hitungJawab(); jalankanWaktu();
}

window.hitungJawab = function() { const n = Object.keys(window.sesi.jawab).length; $('barInfo').textContent = `${n} dari ${window.soal.length} soal terjawab`; $('barJawab').style.width = (n / window.soal.length * 100) + '%'; }
window.jalankanWaktu = function() {
    const tot = window.sesi.batas - window.sesi.mulai; clearInterval(window.timer);
    const tik = () => { const sisa = Math.ceil((window.sesi.batas - Date.now()) / 1000); $('hTimerTxt').textContent = L.fmt(sisa);$('barWaktuIsi').style.width = Math.max(0, (window.sesi.batas - Date.now()) / tot * 100) + '%';
        const krit = sisa <= 60 || (window.sesi.batas - Date.now()) / tot < .1; $('hTimer').classList.toggle('waktu-kritis', krit);$('hTimer').classList.toggle('text-white', krit); $('hTimer').classList.toggle('text-brand-green', !krit);$('barWaktuIsi').className = 'h-full transition-all duration-500 ' + (krit ? 'bg-red-500' : 'bg-brand-green');
        if (sisa <= 0) kumpulkan(true); };
    tik(); window.timer = setInterval(tik, 400);
}
window.addEventListener('beforeunload', e => { if (window.aktif) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (window.aktif && document.hidden && window.sesi) { window.sesi.keluar = (window.sesi.keluar || 0) + 1; L.simpan(); } });

window.mintaKumpul = async function() {
    const sisa = window.soal.length - Object.keys(window.sesi.jawab).length;
    if (await modal('Kumpulkan jawaban?', sisa ? `Masih ada ${sisa} soal belum dijawab. Setelah dikumpulkan, jawaban tidak bisa diubah dan latihan tidak bisa diulang.` : 'Semua soal sudah dijawab. Setelah dikumpulkan, jawaban tidak bisa diubah.', 'Kumpulkan', 'Periksa Lagi', 'fa-paper-plane')) kumpulkan(false);
};

window.kumpulkan = async function(auto) { 
    if (window.H.hasil.pilgan) return; 
    window.aktif = false; clearInterval(window.timer); 
    const jawab = window.sesi.jawab; 
    let benar = 0, skor = 0;
    
    benar = window.soal.filter((s, i) => jawab[i] === s.j).length;
    skor = Math.round(benar / window.soal.length * 100);
    
    const xp = Math.round(skor / 4) + (skor >= 80 ? 10 : 0); 
    window.L.tambahXp(xp); 
    
    window.H.hasil.pilgan = { skor, benar, total: window.soal.length, jawab, durasi: Math.round((Math.min(Date.now(), window.sesi.batas) - window.sesi.mulai) / 1000), batas: window.totalWaktu, selesai: Date.now(), auto: !!auto, keluar: window.sesi.keluar || 0, xp }; 
    
    delete window.H.sesi.pilgan; // Bersihkan status sesi
    L.simpan(); // Simpan hasil ke storage latihan.html secara permanen
    
    $('hTimer').classList.add('hidden'); $('barWaktu').classList.add('hidden');$('bar').classList.add('hidden'); $('btnBack').onclick = null; $('btnBack').href = '../latihan.html'; 
    if (auto) window.L.toast('Waktu habis. Jawabanmu otomatis dikumpulkan.', true); 
    window.tampilHasil(true); 
}

/* ================= HASIL & PDF ================= */
window.tampilHasil = function(baru) {
    const R = window.H.hasil.pilgan; window.aktif = false; $('hTimer').classList.add('hidden'); $('barWaktu').classList.add('hidden');$('bar').classList.add('hidden');
    const tk = {}; window.soal.forEach((s, i) => { const t = tk[s.tingkat] = tk[s.tingkat] || { n: 0, b: 0 }; t.n++; if (R.jawab[i] === s.j) t.b++; });
    const urut = ['mudah', 'sedang', 'sulit', 'hots'].filter(t => tk[t]);
    const lemah = urut.slice().sort((a, b) => tk[a].b / tk[a].n - tk[b].b / tk[b].n)[0], kuat = urut.slice().sort((a, b) => tk[b].b / tk[b].n - tk[a].b / tk[a].n)[0];
    const pesan = R.skor >= 80 ? ['Luar biasa!', 'Pemahamanmu sangat baik.'] : R.skor >= 60 ? ['Bagus!', 'Sedikit lagi menuju sempurna.'] : ['Tetap semangat!', 'Pelajari pembahasan lalu baca ulang materinya.'];
    const anim = R.skor >= 80 ? '<div class="tos"><i class="fas fa-hand h hl"></i><i class="fas fa-hand h hr"></i><div class="boom"></div><i class="fas fa-star sp" style="top:8px;left:42%"></i><i class="fas fa-star sp" style="top:24px;left:58%"></i><i class="fas fa-sparkles sp" style="top:70px;left:36%"></i><i class="fas fa-star sp" style="top:78px;left:60%"></i></div>'
        : R.skor >= 60 ? '<div class="tos"><i class="fas fa-thumbs-up goyang" style="font-size:66px;color:#fcd34d;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))"></i></div>' : '<div class="tos"><i class="fas fa-heart detak" style="font-size:60px;color:#fda4af;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))"></i></div>';
    const rek = R.skor === 100 ? 'Semua jawabanmu benar. Pertahankan, dan coba jelaskan alasan tiap jawaban dengan kata-katamu sendiri.' : `Kamu paling kuat pada soal <b>${TKT[kuat][0]}</b> (${tk[kuat].b}/${tk[kuat].n}). ${lemah !== kuat || tk[lemah].b < tk[lemah].n ? `Perkuat soal <b>${TKT[lemah][0]}</b> (${tk[lemah].b}/${tk[lemah].n}) dengan membaca pembahasan di bawah.` : ''}`;
    $('main').innerHTML = `<div class="up rounded-3xl p-5 text-center text-white shadow-lg" style="background:linear-gradient(135deg,#064e3b,#059669 60%,#34d399)">${anim}
            <p class="text-[10px] uppercase tracking-[.2em] text-white/70 font-semibold">Skor Akhir</p><div class="flex items-end justify-center gap-1"><span id="skorAngka" class="text-6xl font-extrabold leading-none">0</span><span class="text-xl font-bold text-white/70 mb-1">/100</span></div>
            <p class="font-extrabold text-base mt-2">${pesan[0]}</p><p class="text-[11px] text-white/80">${pesan[1]}</p>
            <span class="inline-block mt-3 bg-white/20 rounded-full px-3 py-1 text-[11px] font-bold"><i class="fas fa-star text-amber-300 mr-1"></i>+${R.xp} XP</span>${R.auto ? '<p class="text-[10px] text-amber-200 mt-2"><i class="fas fa-clock mr-1"></i>Dikumpulkan otomatis karena waktu habis</p>' : ''}</div>
        <div class="grid grid-cols-3 gap-2.5 mt-3"><div class="bg-white rounded-xl p-3 text-center border border-slate-200"><p class="text-lg font-extrabold text-emerald-600">${R.benar}</p><p class="text-[9px] font-semibold text-slate-500">Benar</p></div><div class="bg-white rounded-xl p-3 text-center border border-slate-200"><p class="text-lg font-extrabold text-rose-500">${R.total - R.benar}</p><p class="text-[9px] font-semibold text-slate-500">Salah/Kosong</p></div><div class="bg-white rounded-xl p-3 text-center border border-slate-200"><p class="text-lg font-extrabold text-slate-700">${L.fmt(R.durasi)}</p><p class="text-[9px] font-semibold text-slate-500">dari ${L.fmt(R.batas)}</p></div></div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 mt-3"><h3 class="font-bold text-slate-800 text-sm mb-3">Analisis per Tingkat</h3><div class="space-y-3">${urut.map(t => { const p = Math.round(tk[t].b / tk[t].n * 100); return `<div><div class="flex justify-between items-center mb-1">${badge(t)}<span class="text-[11px] font-bold text-slate-600">${tk[t].b}/${tk[t].n}</span></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-${TKT[t][1]}-500 rounded-full transition-all duration-1000" style="width:0" data-w="${p}"></div></div></div>`; }).join('')}</div>
            <div class="mt-4 bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-[11px] text-emerald-900 leading-relaxed"><i class="fas fa-lightbulb text-amber-500 mr-1"></i>${rek}</div>${R.keluar ? `<p class="text-[10px] text-slate-400 mt-2.5"><i class="fas fa-eye-slash mr-1"></i>Kamu meninggalkan halaman ${R.keluar}× saat ujian.</p>` : ''}</div>
        <div class="grid grid-cols-2 gap-2 mt-3"><button id="btnPdf" onclick="unduhPdf()" class="bg-white border border-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs active:scale-95 transition"><i class="fas fa-file-pdf text-red-500 mr-1.5"></i>Unduh PDF</button><a href="../latihan.html" class="bg-brand-green text-white font-bold py-3 rounded-xl text-xs shadow-md text-center active:scale-95 transition"><i class="fas fa-house mr-1.5"></i>Ruang Latihan</a></div>
        <p class="text-center text-[10px] text-slate-400 mt-4"><i class="fas fa-rotate mr-1"></i>Gacha & latihan baru dibuka setelah ${new Date(window.H.spin.ts + 864e5).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</p>
        <div class="flex items-center justify-between mt-6 mb-3"><h3 class="font-bold text-slate-800 text-sm">Pembahasan</h3><div id="filter" class="flex gap-1.5"></div></div><div id="bahas" class="space-y-3"></div>`;
    window.scrollTo({ top: 0 });
    let c = 0; const st = Math.max(1, Math.round(R.skor / 40)), ti = setInterval(() => { c = Math.min(R.skor, c + st); $('skorAngka').textContent = c; if (c >= R.skor) clearInterval(ti); }, 30);
    setTimeout(() => document.querySelectorAll('[data-w]').forEach(e => e.style.width = e.dataset.w + '%'), 300);
    if (baru) { if (R.skor >= 80) { L.beep('ok'); setTimeout(() => window.confetti && confetti({ particleCount: 140, spread: 80, origin: { y: .4 }, zIndex: 100001 }), 700); } else L.beep(R.skor >= 60 ? 'ok' : 'err'); }
    filterBahas('semua');
}

window.filterBahas = function(f) {
    const R = window.H.hasil.pilgan;
    $('filter').innerHTML = [['semua', 'Semua'], ['salah', 'Salah']].map(([k, l]) => `<button onclick="filterBahas('${k}')" class="px-3 py-1 rounded-full text-[10px] font-bold border ${f === k ? 'bg-brand-green text-white border-brand-green' : 'bg-white text-slate-500 border-slate-200'}">${l}</button>`).join('');
    const arr = window.soal.map((s, i) => [s, i]).filter(([s, i]) => f === 'semua' || R.jawab[i] !== s.j);
    $('bahas').innerHTML = arr.length ? arr.map(([s, i]) => { const u = R.jawab[i], ok = u === s.j;
        return `<article class="bg-white rounded-2xl border ${ok ? 'border-emerald-200' : 'border-rose-200'} p-4"><div class="flex items-center gap-2 mb-2"><span class="w-6 h-6 rounded-full ${ok ? 'bg-emerald-500' : 'bg-rose-500'} text-white text-[11px] font-extrabold flex items-center justify-center">${i + 1}</span>${badge(s.tingkat)}<span class="ml-auto text-[10px] font-bold ${ok ? 'text-emerald-600' : 'text-rose-500'}">${ok ? 'Benar' : u === undefined ? 'Tidak dijawab' : 'Salah'}</span></div>
            <p class="font-reading text-[12px] text-slate-800 leading-[1.75] mb-2.5">${esc(s.p)}</p><div class="space-y-1.5">${s.opsi.map((o, k) => `<div class="opsi ${k === s.j ? 'benar' : k === u ? 'salah' : ''} !py-2"><span class="huruf">${HURUF[k]}</span><span class="text-[11px] text-slate-700 leading-snug pt-0.5">${esc(o)}</span></div>`).join('')}</div>
            ${s.bahas ? `<div class="mt-2.5 bg-slate-50 rounded-lg p-2.5 text-[11px] text-slate-600 leading-relaxed"><b class="text-slate-700">Pembahasan:</b> ${esc(s.bahas)}</div>` : ''}</article>`; }).join('')
        : '<div class="bg-white rounded-2xl p-6 text-center text-xs text-emerald-600 font-semibold border border-emerald-100"><i class="fas fa-party-horn"></i> Tidak ada jawaban yang salah. Hebat!</div>';
}

window.isiLaporan = function() {
    const R = window.H.hasil.pilgan, tk = {}; window.soal.forEach((s, i) => { const t = tk[s.tingkat] = tk[s.tingkat] || { n: 0, b: 0 }; t.n++; if (R.jawab[i] === s.j) t.b++; });
    const tgls = new Date(window.H.spin.ts).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const A = i => R.jawab[i] === undefined ? '-' : HURUF[R.jawab[i]] + '. ' + esc(window.soal[i].opsi[R.jawab[i]]);
    $('laporan').innerHTML = `<div style="padding:4px"><div style="border-bottom:3px solid #059669;padding-bottom:8px;margin-bottom:12px"><div style="font-size:17px;font-weight:800;color:#064e3b">LAPORAN LATIHAN — PILIHAN GANDA</div><div style="color:#64748b;font-size:11px">Platform Argumentasi · Ruang Latihan</div></div>
        <table style="width:100%;font-size:12px;margin-bottom:12px"><tr><td style="width:90px;color:#64748b">Nama</td><td><b>${esc(L.nama())}</b></td></tr><tr><td style="color:#64748b">Tanggal</td><td>${tgls}</td></tr><tr><td style="color:#64748b">Materi</td><td>${esc(window.H.spin.judul)}</td></tr><tr><td style="color:#64748b">Waktu</td><td>${L.fmt(R.durasi)} dari ${L.fmt(R.batas)}${R.auto ? ' (waktu habis)' : ''}</td></tr></table>
        <div class="nobreak" style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;margin-bottom:12px"><span style="font-size:30px;font-weight:800;color:#059669">${R.skor}</span><span style="color:#64748b"> / 100</span> &nbsp;·&nbsp; Benar <b>${R.benar}</b> dari <b>${R.total}</b> soal</div>
        <table class="nobreak" style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px"><tr style="background:#f1f5f9"><th style="text-align:left;padding:5px 8px;border:1px solid #e2e8f0">Tingkat</th><th style="padding:5px 8px;border:1px solid #e2e8f0">Benar</th><th style="padding:5px 8px;border:1px solid #e2e8f0">Jumlah</th><th style="padding:5px 8px;border:1px solid #e2e8f0">Ketepatan</th></tr>${['mudah', 'sedang', 'sulit', 'hots'].filter(t => tk[t]).map(t => `<tr><td style="padding:5px 8px;border:1px solid #e2e8f0">${TKT[t][0]}</td><td style="text-align:center;padding:5px 8px;border:1px solid #e2e8f0">${tk[t].b}</td><td style="text-align:center;padding:5px 8px;border:1px solid #e2e8f0">${tk[t].n}</td><td style="text-align:center;padding:5px 8px;border:1px solid #e2e8f0">${Math.round(tk[t].b / tk[t].n * 100)}%</td></tr>`).join('')}</table>
        <div style="font-size:13px;font-weight:800;margin-bottom:6px;color:#064e3b">Rincian Jawaban & Pembahasan</div>
        ${window.soal.map((s, i) => { const ok = R.jawab[i] === s.j; return `<div class="nobreak" style="border:1px solid ${ok ? '#a7f3d0' : '#fecdd3'};border-radius:6px;padding:8px 10px;margin-bottom:8px"><div style="font-size:11px"><b>${i + 1}.</b> <span style="color:#64748b">[${TKT[s.tingkat][0]}]</span> <b style="color:${ok ? '#059669' : '#e11d48'}">${ok ? 'BENAR' : 'SALAH'}</b></div><div style="margin:3px 0;font-size:12px">${esc(s.p)}</div><div style="font-size:11px"><span style="color:#64748b">Jawabanmu:</span> ${A(i)}</div><div style="font-size:11px"><span style="color:#64748b">Kunci:</span> <b>${HURUF[s.j]}. ${esc(s.opsi[s.j])}</b></div>${s.bahas ? `<div style="font-size:11px;color:#475569;margin-top:3px"><i>Pembahasan:</i> ${esc(s.bahas)}</div>` : ''}</div>`; }).join('')}
        <div style="font-size:9px;color:#94a3b8;margin-top:10px;text-align:center">Dihasilkan otomatis oleh Platform Argumentasi · ${new Date(R.selesai).toLocaleString('id-ID')}</div></div>`;
}

window.unduhPdf = async function() {
    const b = $('btnPdf'), isi = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1.5"></i>Membuat PDF…';
    try { isiLaporan(); await L.pdf($('laporan'), `Laporan-Pilihan-Ganda-${new Date(window.H.spin.ts).toISOString().slice(0, 10)}.pdf`); L.toast('PDF berhasil dibuat.'); }
    catch (e) { console.error(e); L.toast('Gagal membuat PDF. Memakai cetak browser…', true); setTimeout(() => window.print(), 600); }
    finally { b.disabled = false; b.innerHTML = isi; }
};

// Mulai Program
initLatihan();
</script>
</body>
</html>
