    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

        /* SKELETON SHIMMER LOADING TANPA ANIMASI LONCAT */
        .sk {
            position: relative;
            overflow: hidden;
            background: #e2e8f0;
            border-radius: 0.75rem;
        }
        .sk::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        /* SWIPE CONTAINER & PANELS (Bisa digeser kanan-kiri seperti Ruang Belajar) */
        .swipe-container {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            touch-action: pan-x pan-y;
        }

        .swipe-panel {
            width: 100%;
            min-width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            height: 100%;
            overflow-y: auto;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        /* TAB STYLING */

            color: #64748b;

    <!-- LOGIKA SINKRONISASI SWIPE & SEARCH -->
    <script>
        const TAB_KEYS = ['terbaru', 'populer', 'terbaik'];
        let activeTab = 'terbaru';
        let isProgrammaticScroll = false;
        let programmaticTimer = null;
        let allDataTexts = [];
        let queryPencarian = "";

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // Hitung waktu baca riil berdasarkan jumlah kata (Acuan tepat: per 100 kata = 35 detik)
        function hitungWaktuBacaReal(data) {
            const raw = String(data.isi || data.konten || data.deskripsi || '');
            const cleanText = raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            const words = cleanText ? cleanText.split(/\s+/).filter(Boolean).length : 0;

            let totalDetik = 0;
            if (words > 0) {
                totalDetik = Math.round((words / 100) * 35);
            } else if (data.waktuBaca) {
                const parsed = parseInt(data.waktuBaca, 10);
                totalDetik = !isNaN(parsed) ? parsed * 60 : 35;
            } else {
                totalDetik = 35;
            }

            if (totalDetik < 60) {
                return `${Math.max(15, totalDetik)} dtk`;
            }
            const menit = Math.round(totalDetik / 60);
            return `${Math.max(1, menit)} mnt`;
        }

        // Update indikator tab aktif
        function setActiveTabIndicator(tabKey) {
            activeTab = tabKey;
            TAB_KEYS.forEach(k => {
                const btn = document.getElementById('tabBtn_' + k);
                if (!btn) return;
                if (k === tabKey) {
                    btn.classList.add('tab-active');
                } else {
                    btn.classList.remove('tab-active');
                }
            });
        }

        // Berpindah tab saat tombol tab diklik
        function switchTab(tabKey) {
            const idx = TAB_KEYS.indexOf(tabKey);
            if (idx === -1) return;

            const container = document.getElementById('swipeContainer');
            if (container) {
                isProgrammaticScroll = true;
                clearTimeout(programmaticTimer);

                const targetLeft = idx * container.clientWidth;
                container.scrollTo({
                    left: targetLeft,
                    behavior: 'smooth'
                });

                programmaticTimer = setTimeout(() => {
                    isProgrammaticScroll = false;
                }, 350);
            }

            setActiveTabIndicator(tabKey);
        }

        // Inisialisasi navigasi geser (swipeable container)
        function initSwipeNavigation() {
            const container = document.getElementById('swipeContainer');
            if (!container) return;

            // 1. Deteksi scroll sentuh / trackpad
            let scrollDebounce = null;
            container.addEventListener('scroll', () => {
                if (isProgrammaticScroll) return;
                if (scrollDebounce) cancelAnimationFrame(scrollDebounce);
                scrollDebounce = requestAnimationFrame(() => {
                    const width = container.clientWidth;
                    if (!width) return;
                    const idx = Math.round(container.scrollLeft / width);
                    const clamped = Math.max(0, Math.min(TAB_KEYS.length - 1, idx));
                    const targetTab = TAB_KEYS[clamped];
                    if (targetTab && targetTab !== activeTab) {
                        setActiveTabIndicator(targetTab);
                    }
                });
            }, { passive: true });

            // 2. Sesuaikan offset saat orientasi / ukuran window berubah
            window.addEventListener('resize', () => {
                const idx = TAB_KEYS.indexOf(activeTab);
                if (idx >= 0 && container) {
                    container.scrollTo({
                        left: idx * container.clientWidth,
                        behavior: 'auto'
                    });
                }
            });

            // 3. Dukungan Mouse Drag untuk Desktop
            let isMouseDown = false;
            let startX = 0;
            let scrollStart = 0;
            let isDragging = false;
            let dragDistance = 0;

            container.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                if (e.target.closest('input, textarea, select, button')) return;

                isMouseDown = true;
                isDragging = false;
                dragDistance = 0;
                startX = e.pageX;
                scrollStart = container.scrollLeft;
                container.style.scrollBehavior = 'auto';
                container.style.scrollSnapType = 'none';
                container.style.cursor = 'grabbing';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const diffX = e.pageX - startX;
                dragDistance = Math.abs(diffX);
                if (dragDistance > 8) {
                    isDragging = true;
                    container.scrollLeft = scrollStart - diffX;
                }
            });

            const finishDrag = (e) => {
                if (!isMouseDown) return;
                isMouseDown = false;
                container.style.scrollBehavior = 'smooth';
                container.style.scrollSnapType = 'x mandatory';
                container.style.cursor = '';

                if (isDragging) {
                    const diffX = (e ? e.pageX : startX) - startX;
                    const width = container.clientWidth;
                    const currentIndex = TAB_KEYS.indexOf(activeTab);
                    let targetIndex = currentIndex;

                    if (diffX < -50 && currentIndex < TAB_KEYS.length - 1) {
                        targetIndex = currentIndex + 1;
                    } else if (diffX > 50 && currentIndex > 0) {
                        targetIndex = currentIndex - 1;
                    } else {
                        targetIndex = Math.round(container.scrollLeft / width);
                    }
                    targetIndex = Math.max(0, Math.min(TAB_KEYS.length - 1, targetIndex));
                    switchTab(TAB_KEYS[targetIndex]);

                    const blockClick = (ev) => {
                        ev.stopPropagation();
                        ev.stopImmediatePropagation();
                        ev.preventDefault();
                    };
                    window.addEventListener('click', blockClick, { capture: true, once: true });
                    setTimeout(() => window.removeEventListener('click', blockClick, { capture: true }), 150);
                }
                isDragging = false;
            };

            window.addEventListener('mouseup', finishDrag);
        }

        // Render Kartu Teks Argumentasi
        function renderCardHTML(data, rankIndex, tabType) {
            const imgUrl = data.img || "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=300";
            
            // Tagar (Maksimal 2 tag)
            let tagsHtml = "";
            if (data.tags && Array.isArray(data.tags) && data.tags.length > 0) {
                tagsHtml = data.tags.filter(Boolean).slice(0, 2).map(tag => 
                    `<span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md text-[8.5px] font-medium leading-none">#${esc(tag)}</span>`
                ).join(' ');
            } else {
                tagsHtml = `<span class="bg-slate-100 text-slate-400 px-2 py-0.5 rounded-md text-[8.5px] font-medium leading-none">#Argumentasi</span>`;
            }

            // Durasi baca akurat (35 dtk per 100 kata)
            const waktuStr = hitungWaktuBacaReal(data);

            // Views jelas
            const views = Number(data.views || 0);

            // Rank badge khusus untuk tab populer & terbaik (3 teratas)
            let rankBadge = '';
            if (tabType === 'populer' && rankIndex < 3) {
                if (rankIndex === 0) {
                    rankBadge = `<div class="absolute -top-1.5 -left-1.5 w-6 h-6 bg-gradient-to-tr from-rose-600 to-red-500 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-md z-10"><i class="fas fa-fire"></i></div>`;
                } else if (rankIndex === 1) {
                    rankBadge = `<div class="absolute -top-1.5 -left-1.5 w-6 h-6 bg-gradient-to-tr from-orange-500 to-amber-500 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-md z-10">2</div>`;
                } else {
                    rankBadge = `<div class="absolute -top-1.5 -left-1.5 w-6 h-6 bg-gradient-to-tr from-amber-500 to-yellow-400 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-md z-10">3</div>`;
                }
            } else if (tabType === 'terbaik' && rankIndex < 3) {
                if (rankIndex === 0) {
                    rankBadge = `<div class="absolute -top-1.5 -left-1.5 w-6 h-6 bg-gradient-to-tr from-amber-500 to-yellow-300 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-md z-10"><i class="fas fa-crown"></i></div>`;
                } else if (rankIndex === 1) {
                    rankBadge = `<div class="absolute -top-1.5 -left-1.5 w-6 h-6 bg-gradient-to-tr from-slate-400 to-slate-300 text-slate-800 text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-md z-10">2</div>`;
                } else {
                    rankBadge = `<div class="absolute -top-1.5 -left-1.5 w-6 h-6 bg-gradient-to-tr from-amber-700 to-amber-600 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-md z-10">3</div>`;
                }
            }

            return `
            <div class="relative">
                ${rankBadge}
                <a href="baca.html?id=${data.id}" 
                   class="flex gap-3 bg-white p-3 rounded-2xl shadow-xs border border-slate-200/90 hover:border-brand-green transition-colors active:scale-[0.98] group">
                    
                    <img src="${imgUrl}" alt="${esc(data.judul)}" 
                         class="w-24 h-24 object-cover rounded-xl shrink-0 bg-slate-100 border border-slate-100" 
                         loading="lazy">

                    <div class="flex-1 flex flex-col justify-between py-0.5 min-w-0">
                        <div>
                            <div class="flex items-center gap-1.5 flex-wrap mb-1">
                                <span class="text-[8.5px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-100 px-2 py-0.5 rounded-md uppercase tracking-wider">
                                    Argumentasi
                                </span>
                                ${tagsHtml}
                            </div>
                            <h3 class="font-bold text-[13px] text-slate-800 line-clamp-2 leading-snug group-hover:text-brand-green transition-colors">
                                ${esc(data.judul)}
                            </h3>
                            ${data.deskripsi ? `<p class="text-[10px] text-slate-500 line-clamp-1 mt-0.5">${esc(data.deskripsi)}</p>` : ''}
                        </div>

                        <div class="flex justify-between items-center mt-2 pt-1.5 border-t border-slate-100 text-[10px] text-slate-400">
                            <div class="flex items-center gap-3">
                                <span class="flex items-center gap-1 font-medium" title="Durasi Baca: ${waktuStr} (Acuan: 35 dtk per 100 kata)">
                                    <i class="far fa-clock text-amber-500"></i> ${waktuStr}
                                </span>
                                <span class="flex items-center gap-1 font-medium" title="${views} kali dibaca">
                                    <i class="far fa-eye text-emerald-500"></i> ${views}x
                                </span>
                            </div>
                            <span class="text-[11px] font-bold text-brand-green flex items-center gap-0.5 group-hover:translate-x-0.5 transition-transform">
                                Mulai <i class="fas fa-chevron-right text-[8px] ml-0.5"></i>
                            </span>
                        </div>
                    </div>
                </a>
            </div>`;
        }

        // Render data ke 3 panel secara independen
        function renderAllPanels() {
            const q = queryPencarian.trim().toLowerCase();
            
            const filtered = allDataTexts.filter(item => {
                if (!q) return true;
                const judul = (item.judul || '').toLowerCase();
                const desk = (item.deskripsi || '').toLowerCase();
                const tags = Array.isArray(item.tags) ? item.tags.join(' ').toLowerCase() : '';
                return judul.includes(q) || desk.includes(q) || tags.includes(q);
            });

            // 1. Data Terbaru (Diurutkan berdasarkan timestamp)
            const dataTerbaru = [...filtered].sort((a, b) => b.timestamp - a.timestamp);
            renderSinglePanel('Terbaru', dataTerbaru, 'terbaru');

            // 2. Data Populer (Diurutkan berdasarkan views)
            const dataPopuler = [...filtered].sort((a, b) => (b.views || 0) - (a.views || 0));
            renderSinglePanel('Populer', dataPopuler, 'populer');

            // 3. Data Terbaik (Diurutkan berdasarkan rating)
            const dataTerbaik = [...filtered].sort((a, b) => (b.rating || 0) - (a.rating || 0));
            renderSinglePanel('Terbaik', dataTerbaik, 'terbaik');
        }

        function renderSinglePanel(panelName, dataList, tabType) {
            const skel = document.getElementById('skel' + panelName);
            const empty = document.getElementById('empty' + panelName);
            const list = document.getElementById('list' + panelName);
            const msgEmpty = document.getElementById('msgEmpty' + panelName);

            if (skel) skel.classList.add('hidden');

            if (dataList.length === 0) {
                if (list) list.innerHTML = '';
                if (empty) {
                    empty.classList.remove('hidden');
                    empty.classList.add('flex');
                    if (msgEmpty && queryPencarian.trim()) {
                        msgEmpty.textContent = `Pencarian "${queryPencarian}" tidak ditemukan.`;
                    }
                }
            } else {
                if (empty) {
                    empty.classList.add('hidden');
                    empty.classList.remove('flex');
                }
                if (list) {
                    list.innerHTML = dataList.map((item, idx) => renderCardHTML(item, idx, tabType)).join('');
                }
            }
        }

        // Search Input Handler
        let searchTimer = null;
        function onCariInput(val) {
            const btnClear = document.getElementById('btnClearSearch');
            if (btnClear) btnClear.classList.toggle('hidden', !val);

            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                queryPencarian = val;
                renderAllPanels();
            }, 200);
        }

        function bersihkanPencarian() {
            const input = document.getElementById('searchInput');
            if (input) input.value = '';
            const btnClear = document.getElementById('btnClearSearch');
            if (btnClear) btnClear.classList.add('hidden');
            queryPencarian = '';
            renderAllPanels();
        }

        function alihkanKeSearchGlobal() {
            const input = document.getElementById('searchInput');
            const val = input ? input.value.trim() : '';
            if (val) {
                window.location.href = `search.html?q=${encodeURIComponent(val)}`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSwipeNavigation();
        });
    </script>

    <!-- FIREBASE FETCH DATA LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchDataServer() {
            try {
                // Menarik data Teks Argumentasi
                let snap;
                try {
                    const q = query(collection(db, "materials"), where("kategori", "==", "argumentasi"));
                    snap = await getDocs(q);
                    if (snap.empty) {
                        const qAll = query(collection(db, "materials"));
                        snap = await getDocs(qAll);
                    }
                } catch (err) {
                    const qAll = query(collection(db, "materials"));
                    snap = await getDocs(qAll);
                }

                allDataTexts = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    
                    // Jangan masukkan jika statusnya draft atau dihapus
                    if (d.status === 'draft' || d.status === 'dihapus') return;

                    const k = String(d.kategori || '').toLowerCase().trim();
                    // Pastikan kategori teks argumentasi (atau umum non-artikel berita)
                    if (k && !k.includes('argumentasi') && (k.includes('artikel') || k.includes('berita') || k.includes('opini'))) {
                        return;
                    }

                    // Format Timestamp
                    let timeVal = 0;
                    if (d.createdAt && typeof d.createdAt.toMillis === 'function') timeVal = d.createdAt.toMillis();
                    else if (d.createdAt && typeof d.createdAt.toDate === 'function') timeVal = d.createdAt.toDate().getTime();
                    else if (d.createdAt) timeVal = new Date(d.createdAt).getTime();

                    allDataTexts.push({
                        id: doc.id,
                        judul: d.judul || "Tanpa Judul",
                        deskripsi: d.cuplikan || d.deskripsiSingkat || d.ringkasan || "",
                        img: d.coverImage || d.gambarBase64 || "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=300",
                        waktuBaca: d.waktuBaca || "",
                        isi: d.isi || d.konten || "",
                        tags: Array.isArray(d.tags) ? d.tags : [],
                        timestamp: timeVal || 0,
                        views: Number(d.views || d.viewCount || 0),
                        rating: Number(d.rating || 0)
                    });
                });

                renderAllPanels();

            } catch (error) {
                console.error("Firebase Error:", error);
                ['Terbaru', 'Populer', 'Terbaik'].forEach(p => {
                    const skel = document.getElementById('skel' + p);
                    const empty = document.getElementById('empty' + p);
                    const msg = document.getElementById('msgEmpty' + p);
                    if (skel) skel.classList.add('hidden');
                    if (empty) {
                        empty.classList.remove('hidden');
                        empty.classList.add('flex');
                    }
                    if (msg) msg.textContent = "Terjadi gangguan jaringan saat memuat data.";
                });
            }
        }

        document.addEventListener('DOMContentLoaded', fetchDataServer);
    </script>
