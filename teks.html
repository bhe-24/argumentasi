<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galeri Teks Argumentasi - Argumentasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } 
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        
        /* Menyembunyikan scrollbar untuk estetika Mobile App */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tab-active { border-bottom: 3px solid #059669; color: #059669; font-weight: 700; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #64748b; font-weight: 500; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- CONTAINER UTAMA (Mobile App Frame) -->
    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col overflow-hidden sm:border-x border-slate-200">
        
        <!-- HEADER ALA APLIKASI (Emerald Green) -->
        <header class="bg-brand-green pt-4 pb-3 px-4 relative z-20 shadow-sm">
            <!-- Top Bar -->
            <div class="flex items-center gap-3 mb-4">
                <a href="index.html" class="text-white text-lg px-2 py-1 hover:bg-white/20 rounded-full transition-colors"><i class="fas fa-chevron-left"></i></a>
                <h1 class="text-lg font-semibold text-white flex-1 truncate">Teks Argumentasi</h1>
                <a href="profil.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white border border-white/30 hover:bg-white/30 transition-colors">
                    <i class="fas fa-user text-sm"></i>
                </a>
            </div>
            
            <!-- Search Bar -->
            <div class="bg-white rounded-xl flex items-center px-3 py-2 shadow-sm border border-emerald-400">
                <i class="fas fa-search text-slate-400 text-sm mr-2"></i>
                <input type="text" id="searchInput" placeholder="Cari judul materi argumen..." class="w-full bg-transparent outline-none text-slate-700 text-sm placeholder-slate-400" oninput="filterPencarian()">
            </div>
        </header>

        <!-- TABS NAVIGASI (Sticky) -->
        <div class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm px-2">
            <div class="flex overflow-x-auto hide-scrollbar">
                <button onclick="ubahTab('terbaru', this)" class="tab-btn tab-active flex-1 min-w-[100px] py-3.5 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    ✨ Terbaru
                </button>
                <button onclick="ubahTab('populer', this)" class="tab-btn tab-inactive flex-1 min-w-[100px] py-3.5 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    🔥 Paling Ramai
                </button>
                <button onclick="ubahTab('terbaik', this)" class="tab-btn tab-inactive flex-1 min-w-[100px] py-3.5 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    🏆 Terbaik
                </button>
            </div>
        </div>

        <!-- MAIN KONTEN (Scrollable List) -->
        <div class="flex-grow overflow-y-auto hide-scrollbar p-4 relative bg-slate-50">
            
            <!-- STATE: LOADING -->
            <div id="loadingState" class="flex flex-col items-center justify-center py-20">
                <i class="fas fa-circle-notch fa-spin text-3xl text-emerald-500 mb-3"></i>
                <h3 class="font-bold text-slate-700 text-sm">Memuat Koleksi...</h3>
            </div>

            <!-- STATE: EMPTY / ERROR -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-4xl mb-4 text-slate-300">
                    <i class="fas fa-folder-open"></i>
                </div>
                <h3 class="font-bold text-slate-700 text-base mb-1">Data Tidak Ditemukan</h3>
                <p class="text-xs text-slate-500 max-w-[250px] mx-auto" id="emptyMsg">Belum ada teks argumentasi yang dipublikasikan di kategori ini.</p>
            </div>

            <!-- LIST CONTAINER -->
            <div id="listContainer" class="flex flex-col gap-3 fade-in hidden">
                <!-- Card Data akan diinjeksi ke sini oleh JS -->
            </div>

        </div>

    </div>

    <!-- Container Toast -->
    <div id="toastContainer" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <!-- SCRIPT UI DASAR & LOGIKA FILTER -->
    <script>
        let allDataTexts = []; // Menyimpan semua data mentah dari Firebase
        let currentFilter = 'terbaru'; // Tab aktif

        // Logic Ganti Tab
        function ubahTab(jenis, btnElement) {
            currentFilter = jenis;
            
            // Ubah Style Tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            });
            btnElement.classList.remove('tab-inactive');
            btnElement.classList.add('tab-active');

            // Reset Pencarian
            document.getElementById('searchInput').value = '';

            // Terapkan Pengurutan/Filter
            renderListByFilter();
        }

        // Logic Pencarian Realtime
        function filterPencarian() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = allDataTexts.filter(item => item.judul.toLowerCase().includes(query) || item.deskripsi.toLowerCase().includes(query));
            
            renderHTML(filteredData);
            
            if(filteredData.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyMsg').innerText = "Pencarian tidak menemukan hasil yang cocok.";
            } else {
                document.getElementById('emptyState').classList.add('hidden');
            }
        }

        // Logic Pengurutan Data
        function renderListByFilter() {
            let sortedData = [...allDataTexts];

            if (currentFilter === 'terbaru') {
                // Urut berdasarkan waktu terbaru (Firebase createdAt)
                sortedData.sort((a, b) => b.timestamp - a.timestamp);
            } 
            else if (currentFilter === 'populer') {
                // Urut berdasarkan penayangan/kunjungan tertinggi
                // Jika field 'views' tidak ada di DB, kita gunakan fallback panjang deskripsi sebagai simulasi "popularitas" sementara agar tidak error
                sortedData.sort((a, b) => (b.views || b.deskripsi.length) - (a.views || a.deskripsi.length));
            } 
            else if (currentFilter === 'terbaik') {
                // Urut berdasarkan rating sistematika terbaik
                sortedData.sort((a, b) => (b.rating || b.judul.length) - (a.rating || a.judul.length));
            }

            renderHTML(sortedData);
        }

        // Logic Render HTML ke Layar
        function renderHTML(dataArray) {
            const container = document.getElementById('listContainer');
            let html = "";

            dataArray.forEach((data, index) => {
                // Tambahkan ranking/badge spesial untuk tab populer & terbaik
                let rankBadge = '';
                if (currentFilter === 'populer' && index < 3) {
                    rankBadge = `<div class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-sm z-10"><i class="fas fa-fire"></i></div>`;
                } else if (currentFilter === 'terbaik' && index < 3) {
                    rankBadge = `<div class="absolute -top-2 -right-2 w-6 h-6 bg-amber-400 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-sm z-10"><i class="fas fa-star"></i></div>`;
                }

                html += `
                <a href="baca.html?id=${data.id}" class="flex gap-3 bg-white p-3 rounded-2xl shadow-sm border border-slate-100 hover:border-emerald-400 transition-colors active:scale-[0.98] relative">
                    <div class="relative shrink-0">
                        ${rankBadge}
                        <img src="${data.img}" alt="${data.judul}" class="w-24 h-24 object-cover rounded-xl bg-slate-100">
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-1 min-w-0">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-[9px] font-bold bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded uppercase tracking-widest border border-emerald-100">Argumentasi</span>
                                ${currentFilter === 'populer' ? `<span class="text-[10px] text-slate-400 font-medium"><i class="far fa-eye text-red-400"></i> ${data.views || '1.2k'}</span>` : ''}
                            </div>
                            <h3 class="font-bold text-[13px] text-slate-800 line-clamp-2 leading-snug truncate whitespace-normal">${data.judul}</h3>
                            <p class="text-[10px] text-slate-500 mt-1 line-clamp-1">${data.deskripsi}</p>
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-[10px] text-slate-400 font-medium"><i class="far fa-clock"></i> ${data.waktuBaca || '5 Min'}</span>
                            <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg">Baca <i class="fas fa-chevron-right text-[8px] ml-0.5"></i></span>
                        </div>
                    </div>
                </a>`;
            });

            container.innerHTML = html;
            
            // Animasi refresh list
            container.classList.remove('fade-in');
            void container.offsetWidth; // trigger reflow
            container.classList.add('fade-in');
        }
    </script>

    <!-- FIREBASE FETCH DATA (Real Data) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            projectId: "mading-cf676",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchDataServer() {
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const listContainer = document.getElementById('listContainer');

            try {
                // Menarik SEMUA data dengan kategori argumentasi
                const q = query(collection(db, "materials"), where("kategori", "==", "argumentasi"));
                const snap = await getDocs(q);

                loadingState.classList.add('hidden');

                if (snap.empty) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                // Masukkan data ke array global agar bisa disortir/filter secara in-memory (sangat cepat & mulus)
                allDataTexts = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    // Tangkap timestamp untuk pengurutan "Terbaru"
                    let timeVal = 0;
                    if (d.createdAt && d.createdAt.toMillis) timeVal = d.createdAt.toMillis();
                    else if (d.createdAt) timeVal = new Date(d.createdAt).getTime();

                    allDataTexts.push({
                        id: doc.id,
                        judul: d.judul || "Tanpa Judul",
                        deskripsi: d.cuplikan || d.deskripsiSingkat || "Klik untuk membaca argumen selengkapnya...",
                        img: d.coverImage || d.gambarBase64 || "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=500",
                        waktuBaca: d.waktuBaca || "5 Min",
                        timestamp: timeVal,
                        views: d.views || Math.floor(Math.random() * 500) + 50, // Fallback ke random jika DB blm punya fitur views
                        rating: d.rating || Math.floor(Math.random() * 100)      // Fallback ke random jika DB blm punya fitur rating
                    });
                });

                // Tampilkan list untuk pertama kali (Mode 'Terbaru')
                listContainer.classList.remove('hidden');
                renderListByFilter();

            } catch (error) {
                console.error("Firebase Error:", error);
                loadingState.classList.add('hidden');
                emptyState.classList.remove('hidden');
                document.getElementById('emptyMsg').innerText = "Terjadi gangguan jaringan saat memuat data. Silakan muat ulang.";
            }
        }

        // Panggil fungsi saat DOM selesai di-load
        document.addEventListener('DOMContentLoaded', fetchDataServer);
    </script>
</body>
</html>
