<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baca Flipbook - Argumentasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #1e293b; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
        
        /* ── BOOK SHELL ── */
        #stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; perspective: 2400px; padding: 10px; }
        #book { position: relative; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.4,0,.2,1); transform-origin: center center; }
        .spread { display: flex; position: relative; }
        
        /* Pages */
        .page-wrap { position: relative; overflow: hidden; background: #fff; color: #222; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .page-wrap.left { border-radius: 4px 0 0 4px; transform-origin: right center; }
        .page-wrap.right { border-radius: 0 4px 4px 0; transform-origin: left center; }
        
        /* Shadows & spine */
        .page-shadow-l { position: absolute; right: 0; top: 0; bottom: 0; width: 24px; background: linear-gradient(to left, rgba(0,0,0,.15), transparent); pointer-events: none; z-index: 10; }
        .page-shadow-r { position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background: linear-gradient(to right, rgba(0,0,0,.15), transparent); pointer-events: none; z-index: 10; }
        .spine-line { width: 6px; background: linear-gradient(to right, #64748b, #94a3b8, #64748b); flex-shrink: 0; box-shadow: inset 0 0 4px rgba(0,0,0,.3); z-index: 5; }
        
        /* Page number */
        .pg-num { position: absolute; bottom: 10px; font-size: 10px; font-weight: 700; color: #94a3b8; letter-spacing: .05em; z-index: 5; }
        .pg-num.left { right: 14px; } .pg-num.right { left: 14px; }
        
        /* PDF canvas inside page */
        .page-wrap canvas { display: block; width: 100%; height: 100%; }
        
        /* Cover styling */
        .cover-bg { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; text-align: center; }
        
        /* Hit zones */
        .hit-prev, .hit-next { position: absolute; top: 0; bottom: 0; width: 15%; min-width: 60px; z-index: 20; cursor: pointer; }
        .hit-prev { left: -10%; } .hit-next { right: -10%; }
        
        /* Single page mode */
        body.single-mode .spread { flex-direction: column; }
        body.single-mode .page-wrap { border-radius: 8px !important; }
        body.single-mode .spine-line { display: none; }
        body.single-mode .page-shadow-l, body.single-mode .page-shadow-r { display: none; }

        /* General UI Classes */
        .up { animation: up .3s ease-out both; } @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        
        /* Scrollbar */
        .noscroll::-webkit-scrollbar { display: none; }
        .yt-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; }
        .yt-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body class="flex justify-center">

<!-- CONTAINER UTAMA -->
<div id="app-container" class="w-full max-w-5xl relative flex flex-col h-full bg-slate-800 shadow-2xl sm:border-x border-slate-700">
    
    <!-- HEADER (STICKY ATAS) -->
    <header class="shrink-0 bg-amber-500 shadow-md relative z-50">
        <div class="h-14 px-3 flex items-center gap-2">
            <a href="kelola-flipbook.html" aria-label="Kembali" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition"><i class="fas fa-chevron-left"></i></a>
            <div class="flex-1 min-w-0">
                <h1 id="judul" class="text-white font-bold text-sm leading-tight truncate">Memuat dokumen…</h1>
                <p id="sub" class="text-white/80 text-[10px] leading-tight truncate">Flipbook PDF</p>
            </div>
            <button onclick="bukaInfo()" aria-label="Info" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition" title="Info Tambahan"><i class="fas fa-circle-info text-lg"></i></button>
            <button onclick="bukaQR()" aria-label="Bagikan" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition hidden sm:flex" title="Bagikan QR"><i class="fas fa-qrcode text-lg"></i></button>
            <button id="btnUnduh" onclick="unduh()" aria-label="Unduh" class="shrink-0 h-9 px-3 rounded-full bg-white text-amber-600 text-xs font-bold flex items-center gap-1.5 active:scale-95 transition shadow-sm"><i class="fas fa-download"></i><span class="hidden sm:inline">Unduh</span></button>
        </div>
        <div class="h-[3px] bg-amber-700/40"><div id="progres" class="h-full bg-white transition-all duration-200" style="width:0"></div></div>
    </header>

    <!-- AREA FLIPBOOK -->
    <main id="stage" onclick="handleStageClick(event)">
        <!-- Loading Screen -->
        <div id="muat" class="absolute inset-0 flex flex-col items-center justify-center text-white bg-slate-800 z-40">
            <div class="w-14 h-14 border-4 border-white/20 border-t-amber-400 rounded-full animate-spin mb-4"></div>
            <p class="text-sm font-semibold">Membangun Flipbook…</p>
            <p id="muatPersen" class="text-xs text-white/60 mt-1">Menyiapkan aset</p>
        </div>
        
        <!-- Error Screen -->
        <div id="galat" class="absolute inset-0 hidden flex-col items-center justify-center text-center px-6 bg-slate-800 z-50">
            <i class="fas fa-book-dead text-5xl text-white/30 mb-3"></i>
            <p class="text-sm font-bold text-white mb-1">Flipbook Gagal Dimuat</p>
            <p id="galatPesan" class="text-xs text-white/60 leading-relaxed max-w-xs mb-5">Dokumen rusak atau tautan tidak valid.</p>
            <a href="kelola-flipbook.html" class="bg-amber-500 text-white text-xs font-bold px-6 py-2.5 rounded-full active:scale-95">Kembali</a>
        </div>

        <!-- Book Element -->
        <div id="book">
            <div class="spread" id="spread">
                <!-- Halaman dinamis disuntikkan kesini oleh JS -->
            </div>
            <div class="hit-prev" onclick="prevPage(event)"></div>
            <div class="hit-next" onclick="nextPage(event)"></div>
        </div>
    </main>

    <!-- TOOLBAR (STICKY BAWAH) -->
    <div id="bar" class="shrink-0 bg-white/95 backdrop-blur border-t border-slate-200 px-3 py-2 z-50 transition-opacity duration-300">
        <div class="flex items-center justify-between gap-2 max-w-xl mx-auto w-full">
            <!-- Navigasi Halaman -->
            <div class="flex items-center gap-1">
                <button id="btn-prev" onclick="prevPage()" aria-label="Halaman sebelumnya" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 hover:bg-amber-100 hover:text-amber-600 active:scale-95 transition disabled:opacity-30 disabled:pointer-events-none"><i class="fas fa-chevron-left"></i></button>
                <div class="flex items-center gap-1 text-xs font-semibold text-slate-600">
                    <input id="inHal" type="number" min="1" class="w-12 h-9 text-center rounded-lg border border-slate-200 bg-slate-50 text-sm font-bold text-slate-800 outline-none focus:border-amber-500 transition" onkeydown="if(event.key==='Enter'){jumpTo(+this.value);this.blur()}" onchange="jumpTo(+this.value)">
                    <span class="whitespace-nowrap">/ <span id="tot">0</span></span>
                </div>
                <button id="btn-next" onclick="nextPage()" aria-label="Halaman berikutnya" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 hover:bg-amber-100 hover:text-amber-600 active:scale-95 transition disabled:opacity-30 disabled:pointer-events-none"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <!-- Alat Bantu (Zoom & Layout) -->
            <div class="flex items-center gap-1">
                <button id="btn-layout" onclick="toggleLayout()" aria-label="Toggle Layout" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 hover:bg-amber-100 hover:text-amber-600 active:scale-95 transition hidden sm:block" title="Ubah Mode Tampilan"><i class="fas fa-book-open"></i></button>
                <div class="w-px h-5 bg-slate-200 mx-1 hidden sm:block"></div>
                <button onclick="ubahZoom(-0.2)" aria-label="Perkecil" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 hover:bg-amber-100 hover:text-amber-600 active:scale-95 transition"><i class="fas fa-magnifying-glass-minus"></i></button>
                <button onclick="setZoom(1)" id="zoomTxt" class="min-w-[3.2rem] h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-600 active:scale-95 transition">100%</button>
                <button onclick="ubahZoom(0.2)" aria-label="Perbesar" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 hover:bg-amber-100 hover:text-amber-600 active:scale-95 transition"><i class="fas fa-magnifying-glass-plus"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL INFO / YOUTUBE -->
<div id="info" class="fixed inset-0 bg-slate-900/60 z-[99999] hidden items-end sm:items-center justify-center" onclick="if(event.target===this) tutupModal('info')">
    <div class="up bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[85vh] overflow-y-auto noscroll">
        <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-4 sm:hidden"></div>
        <div class="flex items-start justify-between gap-3 mb-3">
            <h2 id="iJudul" class="font-bold text-slate-800 text-sm leading-snug"></h2>
            <button onclick="tutupModal('info')" class="text-slate-400 hover:text-slate-600 shrink-0"><i class="fas fa-xmark text-lg"></i></button>
        </div>

        <div id="iDesk" class="bg-amber-50 border border-amber-100 rounded-xl p-3 mb-4 hidden">
            <p class="text-[9px] font-bold text-amber-700 uppercase tracking-wider mb-1">Ringkasan</p>
            <p id="iDeskTxt" class="text-[11px] text-slate-700 leading-relaxed"></p>
        </div>
        
        <!-- Wadah Video YouTube -->
        <div id="iYt" class="hidden mt-2 space-y-3">
            <p class="text-[10px] font-bold text-red-500 uppercase tracking-wider flex items-center gap-1.5"><i class="fab fa-youtube text-sm"></i> Media Pelengkap</p>
            <div id="iYtList" class="space-y-3"></div>
        </div>
    </div>
</div>

<!-- MODAL QR CODE -->
<div id="qr" class="fixed inset-0 bg-slate-900/60 z-[99999] hidden items-end sm:items-center justify-center" onclick="if(event.target===this) tutupModal('qr')">
    <div class="up bg-white w-full max-w-xs rounded-t-3xl sm:rounded-2xl p-5">
        <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-4 sm:hidden"></div>
        <div class="flex items-start justify-between gap-3 mb-2">
            <h2 class="font-bold text-slate-800 text-sm">Bagikan Flipbook</h2>
            <button onclick="tutupModal('qr')" class="text-slate-400 hover:text-slate-600 shrink-0"><i class="fas fa-xmark text-lg"></i></button>
        </div>
        <p class="text-xs text-slate-500 mb-4 leading-relaxed">Pindai kode QR di bawah untuk membaca di perangkat lain secara instan.</p>
        
        <div class="flex justify-center mb-4 bg-slate-50 border border-slate-100 p-3 rounded-2xl mx-auto w-fit">
            <canvas id="qrCanvas" width="160" height="160"></canvas>
        </div>
        
        <p id="qrUrl" class="text-[9px] text-slate-400 text-center break-all mb-4 px-2"></p>
        <button onclick="copyLink()" class="w-full bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-3 rounded-xl transition active:scale-95 shadow-sm"><i class="fas fa-copy mr-1.5"></i>Salin Tautan</button>
    </div>
</div>

<!-- TOAST WRAPPER -->
<div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[100000] w-11/12 max-w-sm pointer-events-none flex flex-col gap-2 items-center"></div>

<!-- QR generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
// ==========================================
// PENGATURAN UTAMA & UTILITAS
// ==========================================
const qs  = new URLSearchParams(location.search);
const $   = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let meta = { judul: 'Flipbook', url: '', kategori: '', ukuran: '', deskripsi: '', halaman: '', tanggal: '', youtubeIds: [] };
let pdf = null;
let totalPages = 0;
let curSpread = 0; // Index spread (0 = cover)
let dualMode = window.innerWidth >= 640; // Desktop default dua halaman, HP default 1 halaman
let zoom = 1;
let isFlipping = false;
let audioCtx = null;
const pageCache = {};

// Notifikasi
function toast(msg, err=false){
    const t = document.createElement('div');
    const bg = err ? 'bg-red-500' : 'bg-slate-800';
    const ic = err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400';
    t.className = `${bg} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 up`;
    t.innerHTML = `<i class="fas ${ic}"></i><span>${esc(msg)}</span>`;
    $('toast').appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = '0.3s'; setTimeout(()=>t.remove(),300) }, 2600);
}

// Format Angka MB
const fmtMb = (b) => { let v = b/1048576; return v < 0.1 ? '0.1' : v.toFixed(v<10?2:1); };

// ==========================================
// EFEK SUARA FLIP KERTAS
// ==========================================
function getAudioCtx(){ return audioCtx || (audioCtx = new (window.AudioContext||window.webkitAudioContext)()); }
function playFlip(){
    try {
        const ctx = getAudioCtx();
        if(ctx.state === 'suspended') ctx.resume();
        const buf = ctx.createBuffer(1, ctx.sampleRate*.18, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for(let i=0; i<d.length; i++){
            const t = i/ctx.sampleRate, env = Math.exp(-t*28)*(t<.02?t/.02:1);
            d[i] = (Math.random()*2-1)*.6*env + Math.sin(2*Math.PI*180*t)*env*.08;
        }
        const src = ctx.createBufferSource(), gain = ctx.createGain();
        src.buffer = buf; gain.gain.value = 0.4;
        src.connect(gain); gain.connect(ctx.destination); src.start();
    } catch(e){}
}

// ==========================================
// LOGIKA TATA LETAK & DIMENSI HALAMAN
// ==========================================
function spreadDims(){
    // Menghitung ukuran ruang baca (Stage) dikurangi padding
    const stW = $('stage').clientWidth - 40; 
    const stH = $('stage').clientHeight - 40;
    const ratio = 1.414; // Rasio standar A4 Portrait (Tinggi = 1.414 x Lebar)

    if(dualMode) {
        let pgW = Math.min(stW/2, stH/ratio);
        let pgH = pgW * ratio;
        if(pgH > stH){ pgH = stH; pgW = pgH/ratio; }
        return { pgW: Math.floor(pgW), pgH: Math.floor(pgH), dual: true };
    } else {
        let pgW = Math.min(stW, stH/ratio);
        let pgH = pgW * ratio;
        if(pgH > stH){ pgH = stH; pgW = pgH/ratio; }
        return { pgW: Math.floor(pgW), pgH: Math.floor(pgH), dual: false };
    }
}

// Menentukan pasangan halaman per spread
function spreadPages(sIdx){
    if(sIdx === 0) return [1, 0]; // Sampul depan
    const left = sIdx * 2;
    const right = left + 1;
    return [left, right <= totalPages ? right : 0]; // Pasangan Halaman (Genap - Ganjil)
}

function totalSpreads(){
    if(totalPages <= 1) return 1;
    return 1 + Math.ceil((totalPages-1)/2);
}

function spreadForPage(p){
    if(p<=1) return 0;
    return Math.ceil((p-1)/2);
}

// ==========================================
// RENDER PDF KE CANVAS
// ==========================================
async function renderPdfPage(pageNum, canvas){
    if(!pdf || pageNum < 1 || pageNum > totalPages) return;
    const cacheKey = `${pageNum}_${Math.round(canvas.width)}`;
    
    // Gunakan cache jika halaman dengan ukuran yang sama sudah pernah di-render
    if(pageCache[cacheKey]){
        const ctx = canvas.getContext('2d');
        ctx.drawImage(pageCache[cacheKey], 0, 0);
        return;
    }

    try {
        const page = await pdf.getPage(pageNum);
        const vp0 = page.getViewport({scale: 1});
        const dpr = Math.min(window.devicePixelRatio || 1, 2); // Dukungan retina display
        const scale = (canvas.width * dpr) / vp0.width;
        const vp = page.getViewport({scale});
        
        canvas.width = Math.floor(vp.width);
        canvas.height = Math.floor(vp.height);
        
        await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
        
        // Simpan ke cache
        const offscreen = document.createElement('canvas');
        offscreen.width = canvas.width; offscreen.height = canvas.height;
        offscreen.getContext('2d').drawImage(canvas, 0, 0);
        pageCache[cacheKey] = offscreen;
    } catch(e) {
        console.warn('Gagal render halaman '+pageNum, e);
    }
}

function buildPageEl(pageNum, side){
    const { pgW, pgH } = spreadDims();
    const wrap = document.createElement('div');
    wrap.className = `page-wrap ${side}`;
    wrap.style.cssText = `width: ${pgW}px; height: ${pgH}px;`;

    // Halaman Kosong (Akhir buku)
    if(pageNum === 0){
        wrap.style.background = '#f8fafc';
        return wrap;
    }

    // Pembuatan Canvas Halaman PDF
    const canvas = document.createElement('canvas');
    canvas.width = pgW * 2; // Supersampling
    canvas.height = pgH * 2;
    wrap.appendChild(canvas);
    renderPdfPage(pageNum, canvas); // Trigger render

    // Tambahan Shadow Gradient Tepi Halaman
    if(dualMode) {
        const shad = document.createElement('div');
        shad.className = side === 'left' ? 'page-shadow-l' : 'page-shadow-r';
        wrap.appendChild(shad);
    }

    // Nomor Halaman (Hanya jika bukan cover)
    if(pageNum > 1) {
        const num = document.createElement('div');
        num.className = `pg-num ${side}`;
        num.textContent = pageNum;
        wrap.appendChild(num);
    }

    return wrap;
}

// ==========================================
// MESIN FLIP & RENDER BUKU
// ==========================================
function renderSpread(sIdx, animate=null){
    const spread = $('spread');
    const { dual } = spreadDims();
    const [lp, rp] = spreadPages(sIdx);

    spread.innerHTML = '';
    
    // Penyesuaian Kelas Body untuk Layout Mode
    if(dual) document.body.classList.remove('single-mode');
    else document.body.classList.add('single-mode');

    if(dual){
        const L = buildPageEl(lp, 'left');
        const spine = document.createElement('div');
        spine.className = 'spine-line';
        const R = buildPageEl(rp, 'right');

        // Animasi Lipatan (CSS Transitions)
        if(animate === 'forward' && rp > 0){
            R.style.transform = 'rotateY(-8deg)';
            R.style.transition = 'transform .45s ease-out';
            setTimeout(() => { R.style.transform = 'rotateY(0)'; }, 30);
        } else if(animate === 'back' && lp > 0){
            L.style.transform = 'rotateY(8deg)';
            L.style.transition = 'transform .45s ease-out';
            setTimeout(() => { L.style.transform = 'rotateY(0)'; }, 30);
        }

        spread.appendChild(L);
        spread.appendChild(spine);
        spread.appendChild(R);
    } else {
        // Mode Satu Halaman (Mobile / Toggle)
        const pageNum = lp || rp; // Prioritaskan kiri, jika kosong ambil kanan
        const P = buildPageEl(pageNum, 'right');
        spread.appendChild(P);
    }

    updateNavUI();
    saveProgress();
}

function goSpread(sIdx, dir=null){
    const max = totalSpreads() - 1;
    if(sIdx < 0 || sIdx > max || isFlipping) return;
    
    isFlipping = true;
    playFlip();
    curSpread = sIdx;
    renderSpread(curSpread, dir);
    
    // Mencegah spam klik tombol next/prev
    setTimeout(() => { isFlipping = false; }, 450); 
}

function nextPage(e){ if(e) e.stopPropagation(); goSpread(curSpread+1, 'forward'); }
function prevPage(e){ if(e) e.stopPropagation(); goSpread(curSpread-1, 'back'); }

function jumpTo(pageNum){
    if(!totalPages) return;
    pageNum = Math.max(1, Math.min(totalPages, Math.round(pageNum) || 1));
    goSpread(spreadForPage(pageNum));
}

function updateNavUI(){
    const max = totalSpreads() - 1;
    $('btn-prev').disabled = curSpread <= 0;
    $('btn-next').disabled = curSpread >= max;
    
    // Progres bar atas
    const percent = Math.min(100, Math.max(0, (curSpread / (max||1)) * 100));
    $('progres').style.width = percent + '%';
    
    // Kotak input halaman
    const [lp, rp] = spreadPages(curSpread);
    $('inHal').value = lp || rp || 1;
    $('tot').textContent = totalPages;
}

// Navigasi Klik Area
function handleStageClick(e){
    // Jangan lakukan navigasi jika sedang zoom in (biar bisa geser)
    if(zoom > 1) return;
    const w = $('stage').clientWidth;
    if(e.clientX < w*0.25) prevPage();
    else if(e.clientX > w*0.75) nextPage();
}

// ==========================================
// TOOLBAR & LAYOUT
// ==========================================
function applyZoom(){
    $('book').style.transform = `scale(${zoom})`;
    $('zoomTxt').textContent = Math.round(zoom*100)+'%';
}
window.ubahZoom = (d) => { zoom = Math.max(0.4, Math.min(zoom+d, 3)); applyZoom(); };
window.setZoom  = (z) => { zoom = z; applyZoom(); };

window.toggleLayout = () => {
    dualMode = !dualMode;
    $('btn-layout').querySelector('i').className = dualMode ? 'fas fa-book-open' : 'fas fa-file-pdf';
    renderSpread(curSpread);
    toast(dualMode ? 'Tampilan Dua Halaman' : 'Tampilan Satu Halaman');
};

// Auto-hide toolbar idle timer
let uiTimer;
function resetUiTimer(){
    $('bar').style.opacity = '1';
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => { if(zoom === 1) $('bar').style.opacity = '0'; }, 3000);
}
document.addEventListener('mousemove', resetUiTimer);
document.addEventListener('touchstart', resetUiTimer, {passive: true});

// Gestur Layar Sentuh & Keyboard
let touchX = null;
$('stage').addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
$('stage').addEventListener('touchend', e => {
    if(touchX === null || zoom > 1) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50) dx < 0 ? nextPage() : prevPage();
    touchX = null;
}, {passive:true});

document.addEventListener('keydown', e => {
    if(document.activeElement === $('inHal')) return;
    if(['ArrowRight','PageDown'].includes(e.key)) nextPage();
    if(['ArrowLeft','PageUp'].includes(e.key))  prevPage();
    if(e.key === 'Home') goSpread(0);
    if(e.key === 'End')  goSpread(totalSpreads()-1);
});

// ==========================================
// FITUR UNDUH & MODAL INFO/YOUTUBE/QR
// ==========================================
window.unduh = async function(){
    if(!meta.url) return toast('Tautan tidak valid.', true);
    const btn = $('btnUnduh');
    const oriText = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i><span class="hidden sm:inline">Mengunduh</span>';
    
    try {
        const r = await fetch(meta.url, {mode:'cors'}); 
        if(!r.ok) throw new Error();
        const b = await r.blob(), a = document.createElement('a');
        a.href = URL.createObjectURL(b); 
        a.download = (meta.judul || 'flipbook').toLowerCase().replace(/\s+/g,'-') + '.pdf';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        toast('Unduhan dimulai.');
    } catch(e) {
        window.open(meta.url, '_blank', 'noopener');
        toast('File dibuka di tab baru.');
    } finally {
        btn.disabled = false; btn.innerHTML = oriText;
    }
};

window.bukaInfo = () => {
    $('iJudul').textContent = meta.judul;
    const chip = (ic, t) => t ? `<span class="text-[10px] font-semibold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-full"><i class="fas ${ic} text-amber-500 mr-1.5"></i>${esc(t)}</span>` : '';
    $('iMeta').innerHTML = chip('fa-tag', meta.kategori) + chip('fa-file-lines', totalPages ? totalPages+' Halaman' : '') + chip('fa-weight-hanging', meta.ukuran ? meta.ukuran+' MB' : '') + chip('fa-calendar', meta.tanggal);
    
    $('iDesk').classList.toggle('hidden', !meta.deskripsi);
    $('iDeskTxt').textContent = meta.deskripsi || '';

    if(meta.youtubeIds && meta.youtubeIds.length > 0) {
        $('iYt').classList.remove('hidden');
        $('iYtList').innerHTML = meta.youtubeIds.map(id => `
            <div class="yt-wrap shadow-md border border-slate-200">
                <iframe src="https://www.youtube.com/embed/${esc(id)}?rel=0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
        `).join('');
    } else {
        $('iYt').classList.add('hidden');
        $('iYtList').innerHTML = '';
    }

    $('info').classList.remove('hidden');
    $('info').style.display = 'flex';
};

let qrDibuat = false;
window.bukaQR = () => {
    $('qr').classList.remove('hidden');
    $('qr').style.display = 'flex';
    const url = location.href;
    $('qrUrl').textContent = url;
    
    if(!qrDibuat) {
        qrDibuat = true;
        try {
            if(typeof QRCode !== 'undefined'){
                $('qrCanvas').style.display = 'none';
                const div = document.createElement('div');
                $('qrCanvas').parentNode.appendChild(div);
                new QRCode(div, {text: url, width: 140, height: 140, colorDark: '#1e293b', colorLight: '#f8fafc', correctLevel: QRCode.CorrectLevel.M});
            }
        } catch(e) {}
    }
};

window.tutupModal = (id) => {
    $(id).classList.add('hidden');
    $(id).style.display = 'none';
    // Hentikan video youtube jika ada yang di-play saat modal info ditutup
    if(id === 'info') $('iYtList').innerHTML = $('iYtList').innerHTML; 
};

window.copyLink = () => {
    navigator.clipboard.writeText(location.href).then(() => toast('Tautan berhasil disalin!')).catch(() => toast('Gagal menyalin tautan.', true));
};

// ==========================================
// PENYIMPANAN POSISI TERAKHIR (LOCALSTORAGE)
// ==========================================
function saveProgress(){
    if(totalPages && meta.url) {
        try { localStorage.setItem('fb_pos_' + (qs.get('id') || meta.url), String(curSpread)); } catch(e){}
    }
}
function loadProgress(){
    try { return parseInt(localStorage.getItem('fb_pos_' + (qs.get('id') || meta.url)) || '0'); } catch(e){ return 0; }
}

// Respon Layar Responsif (Ubah mode otomatis jika mengecil)
let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        const wantDual = window.innerWidth >= 640;
        if(wantDual !== dualMode){
            dualMode = wantDual;
            $('btn-layout').querySelector('i').className = dualMode ? 'fas fa-book-open' : 'fas fa-file-pdf';
        }
        renderSpread(curSpread); // Re-render ukuran canvas
    }, 200);
});

// ==========================================
// INISIALISASI MESIN PDF
// ==========================================
window.mulaiMembangun = async function(m){
    meta = Object.assign(meta, m);
    $('judul').textContent = meta.judul;
    document.title = meta.judul + ' - Flipbook';
    $('sub').textContent = [meta.kategori, meta.ukuran ? meta.ukuran+' MB' : ''].filter(Boolean).join(' • ') || 'Flipbook';
    
    if(!meta.url) return gagalMuat('Tautan dokumen tidak tersedia di server.');
    
    if(!window.pdfjsLib) return gagalMuat('Sistem PDF.js gagal dimuat. Periksa koneksi internet Anda.');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    try {
        const loadTask = pdfjsLib.getDocument({ url: meta.url });
        loadTask.onProgress = p => {
            if(p.total) $('muatPersen').textContent = Math.round((p.loaded/p.total)*100) + '%';
        };
        
        pdf = await loadTask.promise;
        totalPages = pdf.numPages;

        $('sub').textContent = `${totalPages} Halaman` + (meta.ukuran ? ` • ${meta.ukuran} MB` : '');
        $('tot').textContent = totalPages;
        $('inHal').max = totalPages;
        
        // Sembunyikan layer loading
        $('muat').classList.add('hidden');
        
        // Tarik progres tersimpan
        const tersimpan = loadProgress();
        curSpread = Math.min(tersimpan, totalSpreads()-1);
        
        renderSpread(curSpread);
        
        // Pre-warm halaman selanjutnya di background
        setTimeout(()=> { renderPdfPage(3, document.createElement('canvas')) }, 1000);

        if(tersimpan > 0) toast('Melanjutkan baca dari halaman ' + (spreadPages(curSpread)[0] || 1));

    } catch (e) {
        console.error(e);
        gagalMuat('Gagal membaca PDF. Pastikan tautan tidak kadaluarsa atau rusak.');
    }
};

function gagalMuat(pesan) {
    $('muat').classList.add('hidden');
    $('bar').classList.add('hidden');
    $('btnUnduh').classList.add('hidden');
    
    $('galatPesan').textContent = pesan;
    $('galat').classList.remove('hidden');
    $('galat').style.display = 'flex';
}
window.gagalMuat = gagalMuat;
</script>

<!-- FIREBASE CONNECTION -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const cfg = { apiKey:"AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId:"mading-cf676" };
const qs = new URLSearchParams(location.search);
const id = qs.get('id');
const urlLangsung = qs.get('url');

if(id){
    try {
        const db = getFirestore(initializeApp(cfg));
        const ref = doc(db, "flipbooks", id);
        const snap = await getDoc(ref);
        
        if(!snap.exists() || snap.data().status === 'dihapus'){
            window.gagalMuat('Flipbook ini tidak ditemukan atau telah dihapus oleh pengelola.');
        } else {
            const v = snap.data();
            const t = v.createdAt && (v.createdAt.toDate ? v.createdAt.toDate() : new Date(v.createdAt));
            
            window.mulaiMembangun({
                judul: v.judul || 'Dokumen Flipbook',
                url: v.fileUrl || '',
                kategori: v.kategori || 'Bahan Ajar',
                ukuran: v.ukuranFile || '',
                deskripsi: v.deskripsi || '',
                youtubeIds: v.youtubeIds || [],
                tanggal: t && !isNaN(t) ? t.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : ''
            });

            // Tambah jumlah view (maks 1x per sesi)
            if(!sessionStorage.getItem('fview_' + id)){
                sessionStorage.setItem('fview_' + id, '1');
                try { await updateDoc(ref, { views: increment(1) }); } catch(e){}
            }
        }
    } catch(e) {
        console.error(e);
        window.gagalMuat('Gagal terhubung ke database. Periksa koneksi jaringan Anda.');
    }
} else if(urlLangsung) {
    window.mulaiMembangun({ judul: qs.get('judul') || 'Dokumen Flipbook', url: urlLangsung });
} else {
    window.gagalMuat('ID atau URL Flipbook tidak disertakan. Silakan buka melalui halaman Koleksi Flipbook.');
}
</script>
