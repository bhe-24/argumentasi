<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gabung Ruang Kelas - Argumentasi</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } }
                }
            }
        }
    </script>

    <style>
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Skeleton Shimmer (Kokoh & presisi sesuai tampilan asli) */
        .sk { position: relative; overflow: hidden; background: #e2e8f0; border-radius: .375rem; }
        .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shimmer 1.4s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* Modal Alert */
        #modalAlert { z-index: 99999; opacity: 0; pointer-events: none; transition: opacity .25s; }
        #modalAlert.show { opacity: 1; pointer-events: auto; }
        #modalAlert .modal-box { transform: scale(.95); transition: transform .25s; }
        #modalAlert.show .modal-box { transform: scale(1); }
        
        /* Efek UI Loading saat bergabung */
        .loading-mode { pointer-events: none; filter: blur(2px) grayscale(40%); opacity: 0.7; transition: all 0.4s ease; }
    </style>
</head>
<body class="flex justify-center bg-slate-50 sm:bg-slate-200">

    <!-- FRAME APLIKASI (Kokoh/statis, tanpa animasi fade-in yang aneh di awal) -->
    <div class="w-full max-w-md bg-slate-50 relative h-[100dvh] shadow-2xl flex flex-col overflow-hidden sm:border-x border-slate-300">

        <!-- HEADER: absolute di dalam frame, tidak ikut scroll -->
        <header class="bg-brand-green absolute top-0 left-0 right-0 z-50 px-4 flex items-center justify-between shadow-md"
                style="height:calc(60px + env(safe-area-inset-top,0px)); padding-top:env(safe-area-inset-top,0px);">
            <div class="flex items-center gap-3">
                <a href="index.html" aria-label="Kembali" class="w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 transition-colors active:scale-95">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h1 class="text-sm font-bold text-white tracking-wide">Ruang Kelas Digital</h1>
            </div>
            <a href="pindai_kode.html" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1.5 backdrop-blur-sm active:scale-95">
                <i class="fas fa-qrcode"></i> Scan QR
            </a>
            
            <!-- Progress bar Tipis di bawah header (akan terlihat saat loading gabung) -->
            <div class="absolute bottom-0 left-0 w-full h-[3px] bg-brand-dark/40 overflow-hidden">
                <div id="loadingBar" class="h-full bg-white w-0 transition-all duration-300 ease-out"></div>
            </div>
        </header>

        <!-- AREA SCROLL -->
        <main id="mainContent" class="flex-1 min-h-0 overflow-y-auto hide-scrollbar relative transition-all duration-400"
              style="padding-top:calc(60px + env(safe-area-inset-top,0px)); overscroll-behavior:contain;">

            <!-- Lengkungan hijau (ikut ter-scroll) -->
            <div class="bg-brand-green h-16 rounded-b-[2rem]"></div>

            <div class="px-4 space-y-6 -mt-12 relative pb-10">
                <!-- KARTU INPUT KODE -->
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 text-center relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-emerald-50 rounded-bl-full -mr-4 -mt-4 pointer-events-none"></div>

                    <div class="w-14 h-14 bg-emerald-100 text-brand-green rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-inner relative">
                        <i class="fas fa-door-open"></i>
                    </div>

                    <h2 class="text-xl font-bold text-slate-800 mb-1 relative">Gabung Kelas Baru</h2>
                    <p class="text-xs text-slate-500 mb-6 relative">Masukkan kode kelas (5–6 karakter) dari Guru Anda untuk masuk.</p>

                    <form id="formGabung" class="relative space-y-4" autocomplete="off">
                        <input type="text" id="inputKode" maxlength="6" required
                               autocapitalize="characters" autocorrect="off" spellcheck="false"
                               class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl py-4 text-center text-2xl font-black uppercase tracking-[0.3em] text-slate-800 focus:outline-none focus:border-brand-green focus:bg-white transition-all placeholder-slate-300"
                               placeholder="ABC123">

                        <button type="submit" id="btnGabung" class="w-full bg-brand-green hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all active:scale-95 text-sm flex items-center justify-center gap-2 disabled:opacity-80">
                            <i class="fas fa-sign-in-alt"></i> Masuk Ruangan
                        </button>
                    </form>
                </div>

                <!-- KELAS AKTIF (Skeleton Default Statis - Presisi & Tampilan Penuh) -->
                <section>
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2 mb-3">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Kelas Aktif Saya
                    </h2>
                    <div id="listKelasAktif" class="space-y-3">
                        <!-- Skeleton Card 1 -->
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
                            <div class="space-y-2 flex-1 min-w-0">
                                <div class="sk w-14 h-3.5"></div>
                                <div class="sk w-40 h-4"></div>
                                <div class="sk w-24 h-3"></div>
                            </div>
                            <div class="sk w-16 h-8 !rounded-xl shrink-0"></div>
                        </div>
                        <!-- Skeleton Card 2 -->
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
                            <div class="space-y-2 flex-1 min-w-0">
                                <div class="sk w-14 h-3.5"></div>
                                <div class="sk w-32 h-4"></div>
                                <div class="sk w-20 h-3"></div>
                            </div>
                            <div class="sk w-16 h-8 !rounded-xl shrink-0"></div>
                        </div>
                    </div>
                </section>

                <!-- ARSIP (Skeleton Default Statis - Presisi & Tampilan Penuh) -->
                <section>
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2 mb-3">
                        <i class="fas fa-archive text-slate-400"></i> Arsip Kelas Selesai
                    </h2>
                    <div id="listKelasArsip" class="space-y-3">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3 opacity-80">
                            <div class="space-y-2 flex-1 min-w-0">
                                <div class="sk w-14 h-3.5"></div>
                                <div class="sk w-36 h-4"></div>
                                <div class="sk w-24 h-3"></div>
                            </div>
                            <div class="sk w-20 h-7 !rounded-lg shrink-0"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- MODAL PERINGATAN -->
    <div id="modalAlert" class="fixed inset-0 bg-slate-900/80 flex items-center justify-center p-4" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle">
        <div class="modal-box bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 text-center">
            <div id="alertIcon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"></div>
            <h3 id="alertTitle" class="text-xl font-bold text-slate-800 mb-2"></h3>
            <p id="alertMessage" class="text-sm text-slate-500 mb-6 leading-relaxed"></p>
            <button id="btnTutupAlert" type="button" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3.5 rounded-xl active:scale-95 transition-all text-sm">
                Oke, Mengerti
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" });
        const db = getFirestore(app);

        const $ = (id) => document.getElementById(id);
        const withTimeout = (promise, ms) => Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT')), ms))
        ]);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const cleanKode = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
        const isArsip = (s) => s === 'archived' || s === 'selesai';

        /* ---------- MODAL ---------- */
        let alertTimer = null;
        function showAlert(title, message, type = 'error') {
            const styles = {
                error:   ['bg-red-50 text-red-500 border border-red-100', 'fa-times'],
                warning: ['bg-amber-50 text-amber-500 border border-amber-100', 'fa-exclamation-triangle'],
                success: ['bg-emerald-50 text-emerald-500 border border-emerald-100', 'fa-check']
            };
            const [cls, ico] = styles[type] || styles.error;
            $('alertIcon').className = `w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl ${cls}`;
            $('alertIcon').innerHTML = `<i class="fas ${ico}"></i>`;
            $('alertTitle').textContent = title;
            $('alertMessage').textContent = message;
            clearTimeout(alertTimer);
            $('modalAlert').classList.add('show');
        }
        function tutupAlert() { $('modalAlert').classList.remove('show'); }
        $('btnTutupAlert').addEventListener('click', tutupAlert);
        $('modalAlert').addEventListener('click', (e) => { if (e.target === e.currentTarget) tutupAlert(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') tutupAlert(); });

        /* ---------- RIWAYAT LOKAL ---------- */
        function bacaRiwayat() {
            try {
                const arr = JSON.parse(localStorage.getItem('riwayatKelasArg') || '[]');
                return Array.isArray(arr) ? arr.filter((x) => x && x.id) : [];
            } catch (e) { return []; }
        }
        function tulisRiwayat(list) {
            try { localStorage.setItem('riwayatKelasArg', JSON.stringify(list)); } catch (e) {}
        }
        function simpanKeRiwayatLokal(id, nama, status) {
            const list = bacaRiwayat().filter((x) => x.id !== id);
            list.unshift({ id, nama, status });
            tulisRiwayat(list);
        }

        /* ID siswa dibuat SEKALI per kelas, agar gabung ulang tidak membuat data ganda */
        function getStudentId(kode) {
            const key = 'studentIdArg_' + kode;
            let id = null;
            try { id = localStorage.getItem(key); } catch (e) {}
            if (!id) {
                id = 'student_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36).slice(-4);
                try { localStorage.setItem(key, id); } catch (e) {}
            }
            return id;
        }

        /* ---------- GABUNG KELAS ---------- */
        let sedangProses = false;
        async function verifikasiDanMasukKelas(kode) {
            if (sedangProses) return;
            sedangProses = true;

            const btn = $('btnGabung');
            const teksAsli = btn.innerHTML;
            
            // Efek UI Loading (Blur + Tombol + Progress Bar)
            $('mainContent').classList.add('loading-mode');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Mencari Kelas...';
            btn.disabled = true;
            $('inputKode').blur(); // Menutup keyboard HP
            $('loadingBar').style.width = '30%';

            const reset = () => { 
                $('mainContent').classList.remove('loading-mode');
                btn.innerHTML = teksAsli; 
                btn.disabled = false; 
                sedangProses = false; 
                $('loadingBar').style.width = '0%';
            };

            try {
                // Proses Ambil Data (Simulasi loading berlanjut)
                $('loadingBar').style.width = '50%';
                const snap = await withTimeout(getDoc(doc(db, 'classes', kode)), 10000);

                if (!snap.exists()) {
                    showAlert('Kelas Tidak Ditemukan', 'Sistem tidak menemukan ruang kelas dengan kode tersebut. Periksa kembali kode dari Guru Anda.', 'error');
                    return reset();
                }

                $('loadingBar').style.width = '75%';
                const data = snap.data();
                const namaKelas = data.namaKelas || 'Kelas Pembelajaran';

                if (isArsip(data.status)) {
                    simpanKeRiwayatLokal(kode, namaKelas, 'archived');
                    renderRiwayat();
                    showAlert('Kelas Telah Ditutup', `Akses ditolak. Ruang kelas "${namaKelas}" telah ditutup atau diarsipkan oleh Guru.`, 'warning');
                    return reset();
                }

                const namaSiswa = localStorage.getItem('namaSiswaCendekia') || 'Siswa Anonim';
                const fotoSiswa = localStorage.getItem('fotoSiswaCendekia') || localStorage.getItem('fotoProfilBase64') || '';
                const xp = parseInt(localStorage.getItem('kelasPointsArg') || '0', 10) || 0;
                const sid = getStudentId(kode);

                $('loadingBar').style.width = '85%';
                await withTimeout(
                    setDoc(doc(db, `classes/${kode}/students`, sid), {
                        nama: namaSiswa, xp, fotoUrl: fotoSiswa, joinedAt: serverTimestamp()
                    }, { merge: true }),
                    10000
                );

                simpanKeRiwayatLokal(kode, namaKelas, 'active');
                $('loadingBar').style.width = '100%';
                btn.innerHTML = '<i class="fas fa-check"></i> Memasuki Ruang...';
                
                // Jeda sebentar agar transisinya terasa mulus sebelum pindah halaman
                setTimeout(() => { window.location.href = `ruang_belajar_siswa.html?id=${encodeURIComponent(kode)}&sid=${encodeURIComponent(sid)}`; }, 400);

            } catch (error) {
                console.error('Error gabung kelas:', error);
                const izin = error && error.code === 'permission-denied';
                showAlert(
                    izin ? 'Akses Ditolak' : 'Gangguan Jaringan',
                    izin ? 'Anda tidak memiliki izin untuk bergabung ke kelas ini. Hubungi Guru Anda.'
                         : 'Sistem gagal terhubung ke server. Pastikan koneksi internet Anda stabil lalu coba lagi.',
                    'error'
                );
                reset();
            }
        }

        /* ---------- RENDER RIWAYAT ---------- */
        const kartuKosong = (pesan, gelap) => `
            <div class="${gelap ? 'bg-slate-100' : 'bg-white shadow-sm'} p-5 rounded-2xl border border-slate-200 text-center">
                <p class="text-xs text-slate-400">${pesan}</p>
            </div>`;

        const htmlAktif = (id, nama) => `
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3 hover:border-brand-green transition-colors">
                <div class="min-w-0">
                    <span class="bg-emerald-100 text-emerald-700 text-[9px] font-bold px-2 py-0.5 rounded uppercase">Berjalan</span>
                    <h3 class="font-bold text-slate-800 text-sm mt-1 truncate">${esc(nama)}</h3>
                    <p class="text-[10px] text-slate-400">Kode: ${esc(id)}</p>
                </div>
                <a href="ruang_belajar_siswa.html?id=${encodeURIComponent(id)}&sid=${encodeURIComponent(getStudentId(id))}" class="bg-brand-green text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-700 transition-colors shadow-sm shrink-0">Masuk</a>
            </div>`;

        const htmlArsip = (id, nama) => `
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3 opacity-80 hover:opacity-100 transition-opacity">
                <div class="min-w-0">
                    <span class="bg-slate-200 text-slate-600 text-[9px] font-bold px-2 py-0.5 rounded uppercase">Selesai</span>
                    <h3 class="font-bold text-slate-700 text-sm mt-1 truncate">${esc(nama)}</h3>
                    <p class="text-[10px] text-slate-400">Kode: ${esc(id)}</p>
                </div>
                <a href="ruang_belajar_siswa.html?id=${encodeURIComponent(id)}&sid=${encodeURIComponent(getStudentId(id))}" class="bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-100 transition-colors shadow-sm shrink-0">Lihat Nilai</a>
            </div>`;

        /* Gambar dari data lokal (instan, skeleton langsung hilang) */
        function gambarDariLokal(list) {
            const aktif = list.filter((c) => !isArsip(c.status));
            const arsip = list.filter((c) => isArsip(c.status));
            $('listKelasAktif').innerHTML = aktif.length
                ? aktif.map((c) => htmlAktif(c.id, c.nama)).join('')
                : kartuKosong('Belum ada kelas aktif yang Anda ikuti.', false);
            $('listKelasArsip').innerHTML = arsip.length
                ? arsip.map((c) => htmlArsip(c.id, c.nama)).join('')
                : kartuKosong('Tidak ada riwayat arsip kelas.', true);
        }

        /* Lalu sinkronkan status terbaru dari server secara paralel (timeout 5 detik per kelas) */
        async function renderRiwayat() {
            const list = bacaRiwayat();
            gambarDariLokal(list);          // 1) tampilkan langsung
            if (!list.length) return;

            const hasil = await Promise.all(list.map(async (c) => {
                try {
                    const snap = await withTimeout(getDoc(doc(db, 'classes', c.id)), 5000);
                    if (!snap.exists()) return c;
                    const d = snap.data();
                    return { id: c.id, nama: d.namaKelas || c.nama, status: d.status || 'active' };
                } catch (e) { return c; }   // offline/timeout: pakai data lokal
            }));

            const berubah = JSON.stringify(hasil) !== JSON.stringify(list);
            if (berubah) {                  // 2) perbarui hanya jika ada perubahan
                tulisRiwayat(hasil);
                gambarDariLokal(hasil);
            }
        }

        /* ---------- EVENT ---------- */
        const input = $('inputKode');
        input.addEventListener('input', () => {
            const bersih = cleanKode(input.value);
            if (input.value !== bersih) input.value = bersih;
        });

        $('formGabung').addEventListener('submit', (e) => {
            e.preventDefault();
            const kode = cleanKode(input.value);
            if (kode.length < 5) {
                showAlert('Kode Tidak Valid', 'Kode kelas terdiri dari 5 hingga 6 karakter (huruf atau angka). Periksa kembali kode Anda.', 'error');
                return;
            }
            verifikasiDanMasukKelas(kode);
        });

        function init() {
            renderRiwayat();
            const idUrl = cleanKode(new URLSearchParams(location.search).get('id'));
            if (idUrl) {
                input.value = idUrl;
                if (idUrl.length >= 5) setTimeout(() => verifikasiDanMasukKelas(idUrl), 300);
            }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
