<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Formulir Materi AI - Argumentasi Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] }, colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } } } } }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ===== Editor ===== */
        .ql-toolbar.ql-snow { border-radius: 12px 12px 0 0; background: #f8fafc; border-color: #e2e8f0; padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 2px 4px; }
        .ql-toolbar.ql-snow .ql-formats { margin-right: 6px; display: inline-flex; align-items: center; padding: 2px 0; }
        .ql-toolbar.ql-snow button { width: 30px; height: 30px; border-radius: 6px; padding: 5px; }
        .ql-toolbar.ql-snow button:hover, .ql-toolbar.ql-snow button.ql-active { background: #d1fae5; }
        .ql-toolbar.ql-snow button .fas { font-size: 13px; color: #444; }
        .ql-toolbar.ql-snow .ql-picker { height: 30px; }
        .ql-container.ql-snow { border-color: #e2e8f0; border-radius: 0 0 12px 12px; background: #fff; font-family: 'Poppins', sans-serif; font-size: 14px; height: 52vh; min-height: 320px; max-height: 560px; }
        .ql-editor { padding: 14px; line-height: 1.7; }
        .ql-editor p { margin-bottom: .6em; }
        .ql-editor iframe.ql-video { width: 100%; aspect-ratio: 16/9; height: auto; border-radius: 10px; }
        .ql-editor img { max-width: 100%; border-radius: 8px; }
        .ql-editor table { border-collapse: collapse; width: 100%; table-layout: fixed; margin: .6em 0; }
        .ql-editor td { border: 1px solid #94a3b8; padding: 6px 8px; font-size: 13px; vertical-align: top; }
        .ql-snow .ql-picker.ql-size .ql-picker-label::before, .ql-snow .ql-picker.ql-size .ql-picker-item::before { content: 'Normal'; }
        .ql-snow .ql-picker.ql-size .ql-picker-label[data-value=small]::before, .ql-snow .ql-picker.ql-size .ql-picker-item[data-value=small]::before { content: 'Kecil'; }
        .ql-snow .ql-picker.ql-size .ql-picker-label[data-value=large]::before, .ql-snow .ql-picker.ql-size .ql-picker-item[data-value=large]::before { content: 'Besar'; }
        .ql-snow .ql-picker.ql-size .ql-picker-label[data-value=huge]::before, .ql-snow .ql-picker.ql-size .ql-picker-item[data-value=huge]::before { content: 'Sangat Besar'; }
        .ql-snow .ql-picker.ql-size { width: 92px; }

        .bg-ai-gradient { background: linear-gradient(-45deg, #10b981, #3b82f6, #8b5cf6, #10b981); background-size: 400% 400%; animation: gradientBG 5s ease infinite; color: white; border: none; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .sheet { animation: up .25s ease-out; }
        @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
        .tb { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 5px 8px; font-size: 10px; font-weight: 600; color: #475569; white-space: nowrap; }
        .tb:active { transform: scale(.95); }
        .fld { width: 100%; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 14px; outline: none; font-size: 13px; background: #f8fafc; }
        .fld:focus { border-color: #10b981; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden">
        <div class="w-14 h-14 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-3"></div>
        <h2 class="text-sm font-bold text-slate-800 tracking-wide" id="loadingText">Menyimpan Data...</h2>
    </div>

    <!-- MODAL UMUM (gambar / video / tabel) -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-[90] hidden items-end sm:items-center justify-center" onclick="if(event.target===this) tutupModal()">
        <div id="modalBox" class="sheet bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto"></div>
    </div>

    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">

        <header class="bg-emerald-600 fixed w-full max-w-md z-50 px-4 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <a href="materi.html" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 transition-colors active:scale-95"><i class="fas fa-arrow-left text-sm"></i></a>
                <h1 class="text-white font-bold text-sm tracking-wide" id="headerTitle">Tulis Materi</h1>
            </div>
            <button id="btnHapus" onclick="hapusMateri()" class="hidden bg-red-500 hover:bg-red-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg transition-colors items-center gap-1.5 shadow-sm active:scale-95"><i class="fas fa-trash-alt"></i> Hapus</button>
        </header>

        <div class="h-[60px] bg-emerald-600 shrink-0"></div>
        <div class="bg-emerald-600 h-6 px-4 relative z-10 rounded-b-[2rem] -mt-1 shrink-0"></div>

        <main class="flex-grow overflow-y-auto hide-scrollbar p-3 sm:p-4 relative z-20 -mt-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200">
                <form id="materiForm" onsubmit="handleSave(event)">

                    <div class="bg-slate-50 border-b border-slate-100 p-4 flex justify-between items-center rounded-t-2xl">
                        <h2 class="font-bold text-slate-700 text-xs"><i class="fas fa-cog text-emerald-600 mr-1.5"></i> Publikasi</h2>
                        <select id="inputStatus" class="text-xs font-bold border border-slate-200 text-slate-700 bg-white rounded-lg shadow-sm px-3 py-2 outline-none">
                            <option value="draft">Simpan Draft</option>
                            <option value="published">Terbitkan Publik</option>
                        </select>
                    </div>

                    <div class="p-4 sm:p-5 space-y-5">

                        <div>
                            <div class="flex justify-between items-end mb-1.5">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest">Judul Materi</label>
                                <button type="button" onclick="aiTitleRecommendation()" class="bg-ai-gradient px-3 py-1 rounded-md text-[9px] font-bold shadow-sm active:scale-95 flex items-center gap-1"><i class="fas fa-magic"></i> AI Title</button>
                            </div>
                            <input type="text" id="inputJudul" required class="fld font-semibold text-slate-800" placeholder="Ketik ide judul di sini...">
                            <div id="aiTitleBox" class="hidden mt-2 p-3 bg-indigo-50 border border-indigo-100 rounded-xl">
                                <div class="flex justify-between items-center mb-2">
                                    <p class="text-[9px] font-bold text-indigo-600 uppercase tracking-wider"><i class="fas fa-robot"></i> Rekomendasi AI:</p>
                                    <button type="button" onclick="tutupAITitle()" class="text-indigo-400 hover:text-indigo-700"><i class="fas fa-times text-xs"></i></button>
                                </div>
                                <div id="aiTitleList" class="space-y-1.5"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Kategori</label>
                                <select id="inputKategori" class="fld text-xs font-medium text-slate-700 !px-3"><option value="argumentasi">Argumentasi</option><option value="artikel">Artikel Berita</option></select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Tagar (Maks 3)</label>
                                <input type="text" id="inputTags" class="fld text-xs font-medium !px-3" placeholder="Opini, Sosial...">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Gambar Cover</label>
                            <div class="border-2 border-dashed border-slate-200 rounded-xl p-5 text-center hover:bg-slate-50 hover:border-emerald-400 transition cursor-pointer relative group mb-2 bg-slate-50/50">
                                <input type="file" id="inputCoverImage" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="previewImage(this)">
                                <div id="previewContainer" class="hidden flex flex-col items-center">
                                    <img id="imgPreview" src="" class="h-32 object-contain rounded-lg shadow-sm mb-2">
                                    <span class="text-[9px] font-bold text-slate-500 bg-white border border-slate-200 px-3 py-1 rounded-full">Ganti Gambar</span>
                                </div>
                                <div id="uploadPlaceholder" class="flex flex-col items-center">
                                    <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-2 group-hover:scale-110 transition-transform"><i class="fas fa-image"></i></div>
                                    <p class="text-xs font-bold text-slate-600">Ketuk untuk unggah sampul</p>
                                    <p class="text-[9px] text-slate-400 mt-0.5">Otomatis diresize & kompres</p>
                                </div>
                            </div>
                            <input type="hidden" id="base64Image">
                            <input type="text" id="inputSumberGambar" class="fld !py-2.5 text-[11px] font-medium" placeholder="Sumber gambar cover (Freepik, Unsplash, dll)...">
                        </div>

                        <!-- EDITOR -->
                        <div>
                            <div class="flex justify-between items-end mb-1.5">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest">Isi Materi</label>
                                <div class="flex gap-1.5">
                                    <button type="button" onclick="undoEditor()" class="tb"><i class="fas fa-undo"></i> Undo</button>
                                    <button type="button" onclick="redoEditor()" class="tb"><i class="fas fa-redo"></i> Redo</button>
                                </div>
                            </div>
                            <div id="editorWrap" class="shadow-sm rounded-xl">
                                <div id="toolbar">
                                    <span class="ql-formats"><select class="ql-header"><option value="1"></option><option value="2"></option><option value="3"></option><option selected></option></select><select class="ql-size"><option value="small"></option><option selected></option><option value="large"></option><option value="huge"></option></select></span>
                                    <span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button><button class="ql-strike"></button></span>
                                    <span class="ql-formats"><select class="ql-color"></select><select class="ql-background"></select></span>
                                    <span class="ql-formats"><button class="ql-align" value=""></button><button class="ql-align" value="center"></button><button class="ql-align" value="right"></button><button class="ql-align" value="justify"></button></span>
                                    <span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button><button class="ql-indent" value="-1"></button><button class="ql-indent" value="+1"></button></span>
                                    <span class="ql-formats"><button class="ql-blockquote"></button><button class="ql-link"></button><button class="ql-image"></button><button class="ql-video"></button><button class="ql-table" type="button"></button><button class="ql-clean"></button></span>
                                </div>
                                <div id="editor-container"></div>
                            </div>

                            <!-- Kontrol tabel (muncul saat kursor di dalam tabel) -->
                            <div id="tableBar" class="hidden mt-2 p-2 bg-sky-50 border border-sky-100 rounded-xl">
                                <p class="text-[9px] font-bold text-sky-600 uppercase tracking-wider mb-1.5"><i class="fas fa-table"></i> Atur Tabel</p>
                                <div class="flex flex-wrap gap-1.5" onpointerdown="event.preventDefault()">
                                    <button type="button" class="tb" onclick="tbl('insertRowAbove')">+ Baris atas</button>
                                    <button type="button" class="tb" onclick="tbl('insertRowBelow')">+ Baris bawah</button>
                                    <button type="button" class="tb" onclick="tbl('insertColumnLeft')">+ Kolom kiri</button>
                                    <button type="button" class="tb" onclick="tbl('insertColumnRight')">+ Kolom kanan</button>
                                    <button type="button" class="tb !text-red-500" onclick="tbl('deleteRow')">Hapus baris</button>
                                    <button type="button" class="tb !text-red-500" onclick="tbl('deleteColumn')">Hapus kolom</button>
                                    <button type="button" class="tb !text-red-500" onclick="tbl('deleteTable')">Hapus tabel</button>
                                </div>
                            </div>

                            <p id="sizeInfo" class="text-[9px] text-slate-400 mt-1.5 text-right"></p>

                            <div class="mt-2 p-3 bg-purple-50 border border-purple-100 rounded-xl shadow-inner flex flex-col gap-2">
                                <div class="flex items-center justify-between">
                                    <p class="text-[9px] font-bold text-purple-600 uppercase tracking-wider flex items-center gap-1"><i class="fas fa-robot text-xs"></i> AI Paraphrase Assistant</p>
                                    <span class="text-[8px] text-purple-400">Blok teks untuk mencoba</span>
                                </div>
                                <div class="flex gap-2">
                                    <button type="button" onclick="aiParaphrase('smp')" class="flex-1 bg-white border border-purple-200 text-purple-600 text-[10px] font-bold py-1.5 rounded-lg shadow-sm hover:bg-purple-100 active:scale-95 transition-all">Gaya SMP</button>
                                    <button type="button" onclick="aiParaphrase('sma')" class="flex-1 bg-white border border-purple-200 text-purple-600 text-[10px] font-bold py-1.5 rounded-lg shadow-sm hover:bg-purple-100 active:scale-95 transition-all">Gaya SMA</button>
                                </div>
                                <div id="aiMsgBox" class="hidden mt-1 text-[9px] text-purple-500 font-medium animate-pulse text-center">Sedang merangkai kata...</div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Referensi / Pustaka</label>
                            <textarea id="inputReferensi" rows="3" class="fld text-[11px] font-medium leading-relaxed" placeholder="Tuliskan daftar pustaka atau link rujukan di sini..."></textarea>
                        </div>
                    </div>

                    <div class="p-4 border-t border-slate-100 bg-white flex gap-3 rounded-b-2xl sticky bottom-0 z-30">
                        <button type="button" onclick="window.location.href='materi.html'" class="flex-1 py-3 rounded-xl font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition text-xs">Batal</button>
                        <button type="submit" id="btnSave" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 text-xs"><i class="fas fa-save"></i> Simpan</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" });
        const db = getFirestore(app);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        /* ===== Modal ===== */
        const modal = document.getElementById('modal'), box = document.getElementById('modalBox');
        function bukaModal(html) { box.innerHTML = html; modal.classList.remove('hidden'); modal.classList.add('flex'); }
        window.tutupModal = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); box.innerHTML = ''; };
        const head = (ikon, judul) => `<div class="flex items-center justify-between mb-4"><h3 class="font-bold text-slate-800 text-sm"><i class="${ikon} text-emerald-600 mr-2"></i>${judul}</h3><button type="button" onclick="tutupModal()" class="text-slate-400"><i class="fas fa-times"></i></button></div>`;
        const lbl = t => `<label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 mt-3">${t}</label>`;
        const btnOk = (id, t) => `<button type="button" id="${id}" class="mt-5 w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs active:scale-95">${t}</button>`;

        /* ===== Quill 2 + tabel ===== */
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Mulai menulis di sini... Blok teks untuk memakai format atau AI Assistant.',
            modules: {
                history: { delay: 1000, maxStack: 100, userOnly: true },
                table: true,
                toolbar: { container: '#toolbar', handlers: { image: modalGambar, video: modalVideo, table: modalTabel } }
            }
        });
        document.querySelector('.ql-table').innerHTML = '<i class="fas fa-table"></i>';
        document.querySelector('.ql-video').innerHTML = '<i class="fab fa-youtube"></i>';
        document.querySelector('.ql-image').innerHTML = '<i class="far fa-image"></i>';
        const tips = { 'ql-align[value=""]': 'Rata kiri', 'ql-align[value="center"]': 'Rata tengah', 'ql-align[value="right"]': 'Rata kanan', 'ql-align[value="justify"]': 'Rata kiri-kanan', 'ql-indent[value="-1"]': 'Kurangi menjorok', 'ql-indent[value="+1"]': 'Menjorok', 'ql-image': 'Sisipkan gambar + sumber', 'ql-video': 'Sisipkan video YouTube', 'ql-table': 'Sisipkan tabel', 'ql-clean': 'Hapus format' };
        Object.entries(tips).forEach(([sel, t]) => { const e = document.querySelector('#toolbar .' + sel.replace('[', '[')); if (e) e.title = t; });

        window.undoEditor = () => quill.getModule('history').undo();
        window.redoEditor = () => quill.getModule('history').redo();

        function infoUkuran() {
            const kb = Math.round(new Blob([quill.getSemanticHTML()]).size / 1024);
            const el = document.getElementById('sizeInfo');
            el.innerHTML = `Ukuran isi: ${kb} KB / batas ±900 KB`;
            el.className = 'text-[9px] mt-1.5 text-right ' + (kb > 900 ? 'text-red-500 font-bold' : kb > 700 ? 'text-amber-500' : 'text-slate-400');
        }
        quill.on('editor-change', () => {
            const r = quill.getSelection();
            const f = r ? quill.getFormat(r) : {};
            document.getElementById('tableBar').classList.toggle('hidden', !f.table);
            infoUkuran();
        });
        window.tbl = fn => { try { quill.getModule('table')[fn](); } catch (e) { console.error(e); } };

        /* ===== Sisipkan GAMBAR + sumber foto ===== */
        function kompres(file, maxW = 800, q = 0.72) {
            return new Promise(res => {
                const fr = new FileReader();
                fr.onload = e => { const im = new Image(); im.onload = () => {
                    let w = im.width, h = im.height; if (w > maxW) { h *= maxW / w; w = maxW; }
                    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
                    res(c.toDataURL('image/jpeg', q)); }; im.src = e.target.result; };
                fr.readAsDataURL(file);
            });
        }
        function modalGambar() {
            const range = quill.getSelection(true);
            let dataUrl = '';
            bukaModal(head('far fa-image', 'Sisipkan Gambar') + `
                <label class="block border-2 border-dashed border-slate-200 rounded-xl p-4 text-center cursor-pointer hover:border-emerald-400">
                    <input type="file" id="mFile" accept="image/*" class="hidden">
                    <img id="mPrev" class="hidden mx-auto max-h-40 rounded-lg mb-2"><span id="mHint" class="text-xs font-bold text-slate-500"><i class="fas fa-camera mr-1"></i> Pilih gambar</span>
                </label>
                ${lbl('Sumber Foto')}<input id="mSumber" class="fld" placeholder="Contoh: Unsplash / Dok. pribadi (kosongkan jika tidak ada)">
                <label class="flex items-center gap-2 mt-3 text-xs text-slate-600"><input type="checkbox" id="mTengah" checked class="accent-emerald-600"> Taruh di tengah</label>
                ${btnOk('mOk', 'Sisipkan')}`);
            document.getElementById('mFile').onchange = async e => {
                if (!e.target.files[0]) return;
                dataUrl = await kompres(e.target.files[0]);
                const p = document.getElementById('mPrev'); p.src = dataUrl; p.classList.remove('hidden'); document.getElementById('mHint').innerText = 'Ganti gambar';
            };
            document.getElementById('mOk').onclick = () => {
                if (!dataUrl) return alert('Pilih gambar terlebih dahulu.');
                const sumber = document.getElementById('mSumber').value.trim(), tengah = document.getElementById('mTengah').checked;
                const i = range.index, cap = sumber ? 'Sumber Foto: ' + sumber : '';
                quill.insertEmbed(i, 'image', dataUrl, 'user');
                quill.insertText(i + 1, '\n', 'user');
                if (cap) { quill.insertText(i + 2, cap + '\n', 'user'); quill.formatText(i + 2, cap.length, { italic: true, size: 'small', color: '#64748b' }, 'user'); }
                quill.formatLine(i, 1, 'align', tengah ? 'center' : false, 'user');
                if (cap) quill.formatLine(i + 2, 1, 'align', 'center', 'user');
                quill.setSelection(i + 2 + (cap ? cap.length + 1 : 0), 0);
                tutupModal();
            };
        }

        /* ===== Sisipkan VIDEO YouTube ===== */
        function ytId(u) { const m = String(u).trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/); return m ? m[1] : null; }
        function modalVideo() {
            const range = quill.getSelection(true);
            bukaModal(head('fab fa-youtube', 'Sisipkan Video YouTube') + `${lbl('Link YouTube')}<input id="mLink" class="fld" placeholder="https://youtu.be/... atau youtube.com/watch?v=...">
                <p class="text-[10px] text-slate-400 mt-2">Video akan tampil responsif 16:9 di tengah teks.</p>${btnOk('mOk', 'Sisipkan Video')}`);
            document.getElementById('mOk').onclick = () => {
                const id = ytId(document.getElementById('mLink').value);
                if (!id) return alert('Link YouTube tidak valid.');
                quill.insertEmbed(range.index, 'video', `https://www.youtube.com/embed/${id}?rel=0`, 'user');
                quill.insertText(range.index + 1, '\n', 'user');
                quill.setSelection(range.index + 2, 0);
                tutupModal();
            };
        }

        /* ===== Sisipkan TABEL ===== */
        function modalTabel() {
            const range = quill.getSelection(true);
            bukaModal(head('fas fa-table', 'Sisipkan Tabel') + `<div class="grid grid-cols-2 gap-3"><div>${lbl('Jumlah Baris')}<input id="mR" type="number" min="1" max="12" value="3" class="fld"></div><div>${lbl('Jumlah Kolom')}<input id="mC" type="number" min="1" max="6" value="3" class="fld"></div></div>
                <p class="text-[10px] text-slate-400 mt-2">Setelah tabel dibuat, klik di dalamnya untuk menambah/menghapus baris dan kolom.</p>${btnOk('mOk', 'Buat Tabel')}`);
            document.getElementById('mOk').onclick = () => {
                const r = Math.min(12, Math.max(1, +document.getElementById('mR').value || 3)), c = Math.min(6, Math.max(1, +document.getElementById('mC').value || 3));
                quill.setSelection(range.index, 0);
                quill.getModule('table').insertTable(r, c);
                tutupModal();
            };
        }

        /* ===== AI: judul ===== */
        window.aiTitleRecommendation = async function() {
            const ide = document.getElementById('inputJudul').value.trim();
            const titleBox = document.getElementById('aiTitleBox'), list = document.getElementById('aiTitleList');
            if (ide.length < 3) return alert("Ketikkan minimal 3 huruf ide judul terlebih dahulu sebelum meminta rekomendasi AI.");
            titleBox.classList.remove('hidden');
            list.innerHTML = `<div class="text-[10px] text-indigo-500 animate-pulse"><i class="fas fa-circle-notch fa-spin mr-1"></i> Sedang meracik judul yang menarik...</div>`;
            try {
                const res = await fetch('/api/form', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "title", teksUtama: ide, isiMateri: quill.getText().slice(0, 4000) }), signal: AbortSignal.timeout(15000) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail_error || "Gagal mendapatkan saran judul.");
                const titles = Array.isArray(data.result) ? data.result : [data.result];
                list.innerHTML = titles.map(t => `<button type="button" data-t="${esc(t)}" class="ai-t w-full text-left bg-white border border-indigo-100 p-2 rounded-lg text-[11px] text-slate-700 font-medium hover:bg-indigo-50 hover:border-indigo-300 transition-colors shadow-sm mb-1.5 flex justify-between items-center group"><span>${esc(t)}</span><i class="fas fa-check-circle text-indigo-400 opacity-0 group-hover:opacity-100 transition-opacity"></i></button>`).join('');
                list.querySelectorAll('.ai-t').forEach(b => b.onclick = () => { document.getElementById('inputJudul').value = b.dataset.t; tutupAITitle(); });
            } catch (e) { console.error(e); list.innerHTML = `<div class="text-[10px] text-red-500 font-medium">Gagal memuat rekomendasi. Coba sesaat lagi.</div>`; }
        };
        window.tutupAITitle = () => document.getElementById('aiTitleBox').classList.add('hidden');

        /* ===== AI: paraphrase ===== */
        window.aiParaphrase = async function(gaya) {
            const range = quill.getSelection();
            if (!range || range.length === 0) return alert("Harap blok (sorot) bagian kalimat/paragraf di dalam editor yang ingin diperbaiki oleh AI.");
            const teks = quill.getText(range.index, range.length), msg = document.getElementById('aiMsgBox');
            if (teks.trim().length < 10) return alert("Teks yang diblok terlalu pendek. Minimal blok 1 kalimat.");
            msg.classList.remove('hidden'); msg.innerText = `Menyesuaikan gaya bahasa ke anak ${gaya.toUpperCase()}...`;
            try {
                const res = await fetch('/api/form', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "paraphrase", targetLevel: gaya, teksUtama: teks }), signal: AbortSignal.timeout(20000) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail_error || "Gagal memparafrase kalimat.");
                quill.deleteText(range.index, range.length, 'user');
                quill.insertText(range.index, data.result, 'user');
                quill.setSelection(range.index, data.result.length);
                msg.innerText = "Selesai! Tekan 'Undo' jika kurang pas.";
                setTimeout(() => msg.classList.add('hidden'), 3000);
            } catch (e) {
                console.error(e); msg.innerText = "Gagal memproses AI. Coba lagi."; msg.classList.replace('text-purple-500', 'text-red-500');
                setTimeout(() => { msg.classList.add('hidden'); msg.classList.replace('text-red-500', 'text-purple-500'); }, 3000);
            }
        };

        /* ===== Cover ===== */
        window.previewImage = async function(input) {
            if (!input.files[0]) return;
            const url = await kompres(input.files[0], 800, 0.7);
            document.getElementById('imgPreview').src = url;
            document.getElementById('previewContainer').classList.remove('hidden');
            document.getElementById('uploadPlaceholder').classList.add('hidden');
            document.getElementById('base64Image').value = url;
        };

        /* ===== Edit / baru ===== */
        let editDocId = null;
        const qs = new URLSearchParams(window.location.search);
        if (qs.get('action') === 'edit' && qs.get('id')) {
            editDocId = qs.get('id');
            document.getElementById('headerTitle').innerText = "Edit Materi";
            const hb = document.getElementById('btnHapus'); hb.classList.remove('hidden'); hb.classList.add('flex');
            getDoc(doc(db, "materials", editDocId)).then(snap => {
                if (!snap.exists()) return;
                const d = snap.data();
                document.getElementById('inputJudul').value = d.judul || "";
                document.getElementById('inputStatus').value = d.status || "draft";
                document.getElementById('inputKategori').value = d.kategori || "argumentasi";
                document.getElementById('inputSumberGambar').value = d.sumberGambar || "";
                document.getElementById('inputReferensi').value = d.daftarPustaka || "";
                if (Array.isArray(d.tags)) document.getElementById('inputTags').value = d.tags.join(', ');
                const cover = d.coverImage || d.gambarBase64;
                if (cover) {
                    document.getElementById('imgPreview').src = cover;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('base64Image').value = cover;
                }
                quill.setContents(quill.clipboard.convert({ html: d.isi || d.konten || "" }), 'silent');
                infoUkuran();
            });
        }

        window.hapusMateri = async function() {
            if (!editDocId || !confirm("Yakin ingin menghapus materi ini? Data tidak bisa dikembalikan.")) return;
            const ov = document.getElementById('loadingOverlay');
            document.getElementById('loadingText').innerText = "Menghapus..."; ov.classList.remove('hidden');
            try { await deleteDoc(doc(db, "materials", editDocId)); window.location.replace("materi.html"); }
            catch (e) { console.error(e); alert("Gagal menghapus: " + e.message); ov.classList.add('hidden'); }
        };

        window.handleSave = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSave'), ov = document.getElementById('loadingOverlay');
            const judul = document.getElementById('inputJudul').value.trim();
            const status = document.getElementById('inputStatus').value;
            const isi = quill.getSemanticHTML().replace(/&nbsp;/g, ' ');
            if (!judul) return alert("Judul tidak boleh kosong!");
            if (new Blob([isi]).size > 900 * 1024) return alert("Isi materi terlalu besar (maks ±900 KB). Kurangi jumlah/ukuran gambar di dalam teks.");

            btn.disabled = true; document.getElementById('loadingText').innerText = "Menyimpan Data..."; ov.classList.remove('hidden');
            const dataToSave = {
                judul, status, isi,
                kategori: document.getElementById('inputKategori').value,
                tags: document.getElementById('inputTags').value.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean).slice(0, 3),
                sumberGambar: document.getElementById('inputSumberGambar').value.trim(),
                daftarPustaka: document.getElementById('inputReferensi').value.trim(),
                coverImage: document.getElementById('base64Image').value,
                updatedAt: serverTimestamp()
            };
            try {
                let savedId = editDocId;
                if (editDocId) await updateDoc(doc(db, "materials", editDocId), dataToSave);
                else {
                    dataToSave.createdAt = serverTimestamp(); dataToSave.views = 0; dataToSave.penulis = "Administrator";
                    savedId = (await addDoc(collection(db, "materials"), dataToSave)).id;
                }
                if (status === 'published') window.open(`../baca.html?id=${savedId}`, '_blank');
                window.location.replace("materi.html");
            } catch (err) {
                console.error(err); alert("Terjadi masalah saat menyimpan data. Coba lagi.");
                btn.disabled = false; ov.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
