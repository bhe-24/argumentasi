<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Materi - Argumentasi Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        // Auto-redirect jika masuk membawa parameter aksi form (dari dashboard)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('action') === 'create' || urlParams.get('action') === 'edit') {
            window.location.replace('form_materi.html' + window.location.search);
        }

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Tabs */
        .tab-active { border-bottom: 3px solid #059669; color: #059669; font-weight: 700; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #64748b; font-weight: 500; }

        /* Skeleton shimmer */
        .sk { position: relative; overflow: hidden; background: #e2e8f0; border-radius: .5rem; }
        .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shimmer 1.4s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">
        
        <header class="bg-emerald-600 fixed w-full max-w-md z-50 px-4 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 transition-colors active:scale-95">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-white font-bold text-sm tracking-wide">Daftar Materi</h1>
            </div>
            
            <a href="form_materi.html?action=create" class="bg-white text-emerald-600 hover:bg-emerald-50 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors items-center gap-1.5 shadow-sm active:scale-95 flex">
                <i class="fas fa-plus"></i> Tambah
            </a>
        </header>

        <div class="h-[60px] bg-emerald-600 shrink-0"></div>

        <div class="bg-white border-b border-slate-200 z-40 relative shadow-sm shrink-0">
            <div class="absolute inset-x-0 top-0 h-4 bg-emerald-600 rounded-b-2xl -z-10"></div>
            <div class="flex overflow-x-auto hide-scrollbar px-2 bg-white rounded-t-2xl pt-2">
                <button onclick="ubahTab('published', this)" class="tab-btn tab-active flex-1 min-w-[100px] py-3 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    🌍 Terbit
                </button>
                <button onclick="ubahTab('draft', this)" class="tab-btn tab-inactive flex-1 min-w-[100px] py-3 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    📝 Draft
                </button>
            </div>
        </div>

        <div class="flex-grow overflow-y-auto hide-scrollbar p-4 bg-slate-50 relative">

            <div id="loadingState" class="flex flex-col gap-3 fade-in">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3"><div class="sk w-20 h-20 rounded-lg"></div><div class="flex-1 space-y-2 py-1"><div class="sk h-3 w-1/3"></div><div class="sk h-4 w-full"></div><div class="sk h-4 w-2/3"></div></div></div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3"><div class="sk w-20 h-20 rounded-lg"></div><div class="flex-1 space-y-2 py-1"><div class="sk h-3 w-1/3"></div><div class="sk h-4 w-full"></div><div class="sk h-4 w-2/3"></div></div></div>
            </div>

            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-16 h-16 bg-white border border-slate-200 rounded-full flex items-center justify-center text-3xl mb-3 text-slate-300 shadow-sm"><i class="fas fa-folder-open"></i></div>
                <h3 class="font-bold text-slate-700 text-sm mb-1">Data Kosong</h3>
                <p class="text-[11px] text-slate-500">Belum ada materi di kategori ini.</p>
            </div>

            <div id="listContainer" class="flex flex-col gap-3 hidden fade-in"></div>

        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentTab = 'published';

        // Ganti Tab
        window.ubahTab = function(status, btnElement) {
            currentTab = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            });
            btnElement.classList.remove('tab-inactive');
            btnElement.classList.add('tab-active');
            muatDataList();
        }

        function renderCard(id, data) {
            const img = data.coverImage || data.gambarBase64 || "https://via.placeholder.com/300x300?text=No+Image";
            const kTg = data.kategori === 'artikel' ? 'Artikel' : 'Argumentasi';
            const kTgColor = data.kategori === 'artikel' ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-emerald-50 text-emerald-600 border-emerald-100';
            
            // Format Tanggal
            let tgl = "-";
            if(data.createdAt) {
                const d = data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt);
                tgl = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            return `
            <a href="form_materi.html?action=edit&id=${id}" class="flex gap-3 bg-white p-3 rounded-xl shadow-sm border border-slate-100 hover:border-emerald-400 transition-colors active:scale-[0.98]">
                <img src="${img}" class="w-20 h-20 object-cover rounded-lg shrink-0 bg-slate-100">
                <div class="flex-1 flex flex-col justify-between py-0.5 min-w-0">
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-[8px] font-bold ${kTgColor} border px-1.5 py-0.5 rounded uppercase tracking-widest">${kTg}</span>
                            <span class="text-[9px] text-slate-400"><i class="far fa-calendar-alt"></i> ${tgl}</span>
                        </div>
                        <h3 class="font-bold text-xs text-slate-800 line-clamp-2 mt-1.5 leading-snug">${data.judul || 'Tanpa Judul'}</h3>
                    </div>
                    <div class="text-[10px] font-bold text-slate-500 mt-2 flex items-center gap-1.5">
                        <i class="fas fa-edit"></i> Edit Materi
                    </div>
                </div>
            </a>`;
        }

        async function muatDataList() {
            const listContainer = document.getElementById('listContainer');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');

            listContainer.classList.add('hidden');
            emptyState.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                // Tarik data berdasarkan status tab aktif
                const q = query(
                    collection(db, "materials"), 
                    where("status", "==", currentTab),
                    orderBy("createdAt", "desc")
                );
                
                const snap = await getDocs(q);

                loadingState.classList.add('hidden');

                if (snap.empty) {
                    emptyState.classList.remove('hidden');
                    listContainer.innerHTML = '';
                    return;
                }

                let html = "";
                snap.forEach(doc => { html += renderCard(doc.id, doc.data()); });
                
                listContainer.innerHTML = html;
                listContainer.classList.remove('hidden');
                
            } catch (error) {
                console.error("Firebase Error:", error);
                loadingState.classList.add('hidden');
                listContainer.innerHTML = `<p class="text-xs text-center text-red-500 py-10"><i class="fas fa-exclamation-triangle mb-2 text-xl"></i><br>Gagal memuat data.</p>`;
                listContainer.classList.remove('hidden');
            }
        }

        // Load saat pertama buka
        document.addEventListener('DOMContentLoaded', muatDataList);
    </script>
</body>
</html>
