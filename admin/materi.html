<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Materi - Argumentasi Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Quill Editor CSS (Rich Text) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], display: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-display { font-family: 'Playfair Display', serif; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Quill Editor Custom Height */
        #editor-container { height: 400px; font-family: 'Poppins', sans-serif; font-size: 16px; border-radius: 0 0 12px 12px; }
        .ql-toolbar.ql-snow { border-radius: 12px 12px 0 0; background: #f8fafc; border-color: #e2e8f0; }
        .ql-container.ql-snow { border-color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-100 font-sans flex h-screen overflow-hidden text-slate-800">

    <!-- OVERLAY LOADING -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden">
        <div class="w-16 h-16 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-4"></div>
        <h2 class="text-xl font-bold text-slate-800 font-display">Memproses Data...</h2>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- TOPBAR -->
        <header class="bg-emerald-600 shadow-md px-4 md:px-6 py-3 flex justify-between items-center z-30 shrink-0">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 transition-colors active:scale-95">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <h1 class="font-bold text-white tracking-tight">Editor Materi</h1>
            </div>
            <!-- Tombol Hapus (Hanya Muncul Saat Mode Edit) -->
            <button id="btnHapus" onclick="hapusMateri()" class="hidden bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-colors items-center gap-1.5 shadow-sm">
                <i class="fas fa-trash-alt"></i> Hapus
            </button>
        </header>

        <!-- FORM CONTENT -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto custom-scroll p-4 md:p-6 bg-slate-50">
            <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                
                <form id="materiForm" onsubmit="handleSave(event)">
                    
                    <div class="p-6 border-b border-slate-100 flex flex-wrap justify-between items-center gap-4 bg-slate-50/50">
                        <h2 class="font-bold text-slate-800"><i class="fas fa-edit text-emerald-600 mr-2"></i>Informasi Dasar</h2>
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-bold text-slate-500 uppercase">Status:</label>
                            <select id="inputStatus" class="text-sm font-bold border-none bg-white rounded-lg shadow-sm px-3 py-1.5 outline-none cursor-pointer">
                                <option value="draft">Draft (Simpan Sementara)</option>
                                <option value="published">Terbitkan (Publik)</option>
                            </select>
                        </div>
                    </div>

                    <div class="p-6 space-y-6">
                        <!-- Judul -->
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Judul Materi</label>
                            <input type="text" id="inputJudul" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition text-sm font-semibold text-slate-800" placeholder="Masukkan judul materi...">
                        </div>

                        <!-- Kategori & Tagar -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Kategori</label>
                                <select id="inputKategori" class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none text-sm font-medium text-slate-700 bg-white">
                                    <option value="argumentasi">Teks Argumentasi</option>
                                    <option value="artikel">Artikel Berita</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Tagar / Label (Pisahkan dgn koma)</label>
                                <input type="text" id="inputTags" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition text-sm font-medium text-slate-800" placeholder="Pendidikan, Opini, Berita">
                                <p class="text-[10px] text-slate-400 mt-1">Maksimal 3 tagar akan ditampilkan.</p>
                            </div>
                        </div>

                        <!-- Gambar Cover & Sumber -->
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Gambar Cover</label>
                            <div class="border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center hover:bg-slate-50 hover:border-emerald-400 transition cursor-pointer relative group mb-3" id="dropArea">
                                <input type="file" id="inputCoverImage" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="previewImage(this)">
                                
                                <div id="previewContainer" class="hidden flex flex-col items-center">
                                    <img id="imgPreview" src="" class="h-40 object-contain rounded-lg shadow-sm mb-3">
                                    <p class="text-[10px] text-slate-500 font-bold bg-white px-3 py-1 rounded-full shadow-sm">Ganti Gambar</p>
                                </div>
                                
                                <div id="uploadPlaceholder" class="flex flex-col items-center">
                                    <div class="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                                        <i class="fas fa-image text-xl"></i>
                                    </div>
                                    <p class="text-xs font-bold text-slate-600">Ketuk untuk unggah sampul</p>
                                    <p class="text-[10px] text-slate-400 mt-1">JPG/PNG (Otomatis dikompres)</p>
                                </div>
                            </div>
                            <input type="hidden" id="base64Image">

                            <!-- Sumber Gambar -->
                            <input type="text" id="inputSumberGambar" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition text-[11px] font-medium text-slate-700" placeholder="Sumber gambar (opsional), misal: freepik.com, dokumentasi pribadi...">
                        </div>

                        <!-- Rich Text Editor (Quill) -->
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Isi Materi Utama</label>
                            <div id="editor-container" class="bg-white"></div>
                        </div>

                        <!-- Daftar Pustaka / Referensi -->
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Daftar Pustaka / Referensi</label>
                            <textarea id="inputReferensi" rows="3" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition text-[11px] font-medium text-slate-700" placeholder="Tuliskan sumber referensi, buku, atau link artikel (opsional)..."></textarea>
                        </div>
                    </div>

                    <!-- Footer & Aksi -->
                    <div class="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 rounded-b-2xl">
                        <button type="button" onclick="window.history.back()" class="px-5 py-2.5 rounded-xl font-bold text-slate-500 hover:bg-slate-200 transition text-sm">Batal</button>
                        <button type="submit" id="btnSave" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-2 text-sm">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <!-- LIBRARY SCRIPTS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- INISIALISASI QUILL EDITOR ---
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Mulai ketikkan isi materi di sini...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'image', 'video']
                ]
            }
        });

        // --- LOGIKA KOMPRESI GAMBAR (BASE64) ---
        window.previewImage = function(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        const maxWidth = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        
                        document.getElementById('imgPreview').src = compressedDataUrl;
                        document.getElementById('imgPreview').classList.remove('hidden');
                        document.getElementById('previewContainer').classList.remove('hidden');
                        document.getElementById('uploadPlaceholder').classList.add('hidden');
                        document.getElementById('base64Image').value = compressedDataUrl;
                    };
                };
                reader.readAsDataURL(file);
            }
        };

        // --- CEK MODE EDIT ATAU TAMBAH BARU ---
        let editDocId = null;
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const id = urlParams.get('id');

        if (action === 'edit' && id) {
            editDocId = id;
            document.getElementById('btnHapus').classList.remove('hidden'); // Tampilkan tombol hapus
            document.getElementById('btnHapus').classList.add('flex');
            
            getDoc(doc(db, "materials", id)).then((docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('inputJudul').value = data.judul || "";
                    document.getElementById('inputStatus').value = data.status || "draft";
                    document.getElementById('inputKategori').value = data.kategori || "argumentasi";
                    document.getElementById('inputSumberGambar').value = data.sumberGambar || "";
                    document.getElementById('inputReferensi').value = data.daftarPustaka || "";
                    
                    // Kembalikan Array Tags ke bentuk string koma
                    if (data.tags && Array.isArray(data.tags)) {
                        document.getElementById('inputTags').value = data.tags.join(', ');
                    }

                    if(data.coverImage) {
                        document.getElementById('imgPreview').src = data.coverImage;
                        document.getElementById('imgPreview').classList.remove('hidden');
                        document.getElementById('previewContainer').classList.remove('hidden');
                        document.getElementById('uploadPlaceholder').classList.add('hidden');
                        document.getElementById('base64Image').value = data.coverImage;
                    }

                    quill.root.innerHTML = data.isi || data.konten || "";
                }
            });
        }

        // --- FUNGSI HAPUS MATERI ---
        window.hapusMateri = async function() {
            if(!editDocId) return;
            const konfirmasi = confirm("Yakin ingin menghapus materi ini selamanya? Data yang terhapus tidak dapat dikembalikan.");
            if(konfirmasi) {
                const overlay = document.getElementById('loadingOverlay');
                overlay.querySelector('h2').innerText = "Menghapus Data...";
                overlay.classList.remove('hidden');
                
                try {
                    await deleteDoc(doc(db, "materials", editDocId));
                    alert("Materi berhasil dihapus.");
                    window.location.href = "index.html"; // Kembali ke dashboard
                } catch(err) {
                    console.error(err);
                    alert("Gagal menghapus data: " + err.message);
                    overlay.classList.add('hidden');
                }
            }
        };

        // --- FUNGSI SIMPAN ---
        window.handleSave = async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSave');
            const overlay = document.getElementById('loadingOverlay');
            
            btn.disabled = true;
            overlay.querySelector('h2').innerText = "Menyimpan Data...";
            overlay.classList.remove('hidden');

            const judul = document.getElementById('inputJudul').value.trim();
            const status = document.getElementById('inputStatus').value;
            const kategori = document.getElementById('inputKategori').value;
            const sumberGambar = document.getElementById('inputSumberGambar').value.trim();
            const daftarPustaka = document.getElementById('inputReferensi').value.trim();
            const coverImage = document.getElementById('base64Image').value; 
            const isi = quill.root.innerHTML; 
            
            // Proses Tagar (Pisahkan dengan koma, hapus spasi berlebih, filter kosong)
            const tagsRaw = document.getElementById('inputTags').value;
            let tagsArray = tagsRaw.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

            if(!judul) {
                alert("Judul harus diisi!");
                overlay.classList.add('hidden');
                btn.disabled = false;
                return;
            }

            const dataToSave = {
                judul: judul,
                kategori: kategori,
                status: status,
                tags: tagsArray,
                sumberGambar: sumberGambar,
                daftarPustaka: daftarPustaka,
                coverImage: coverImage,
                isi: isi,
                updatedAt: serverTimestamp()
            };

            try {
                let savedId = editDocId;
                if (editDocId) {
                    await updateDoc(doc(db, "materials", editDocId), dataToSave);
                } else {
                    dataToSave.createdAt = serverTimestamp();
                    dataToSave.views = 0;
                    dataToSave.penulis = "Administrator";
                    const newDocRef = await addDoc(collection(db, "materials"), dataToSave);
                    savedId = newDocRef.id;
                }
                
                // REDIRECT LOGIC
                if (status === 'published') {
                    // Buka tab baru melihat hasil di publik
                    window.open(`../baca.html?id=${savedId}`, '_blank');
                    // Tab saat ini balik ke dashboard
                    window.location.href = "index.html"; 
                } else {
                    alert("Draft materi berhasil disimpan.");
                    window.location.href = "index.html";
                }

            } catch (error) {
                console.error(error);
                alert("Gagal menyimpan: " + error.message);
                btn.disabled = false;
                overlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
