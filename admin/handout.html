<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Handout - Argumentasi Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] } } } }
        // Pintasan: ?action=create / ?action=edit langsung ke formulir
        const p = new URLSearchParams(location.search);
        if (p.get('action') === 'create' || p.get('action') === 'edit') location.replace('form_handout.html' + location.search);
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { scrollbar-width: none; }
        .lc2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .up { animation: up .3s ease-out both; } @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .sk { position: relative; overflow: hidden; background: #e2e8f0; }
        .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: sh 1.3s infinite; } @keyframes sh { 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">

    <div class="sticky top-0 z-50 shadow-md">
        <header class="bg-amber-500 h-14 px-4 flex items-center gap-3">
            <a href="index.html" aria-label="Kembali" class="shrink-0 w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 active:scale-95 transition"><i class="fas fa-arrow-left text-sm"></i></a>
            <div class="flex-1 min-w-0"><h1 class="text-white font-bold text-sm leading-tight truncate">Kelola Handout</h1><p id="sub" class="text-white/80 text-[10px] leading-tight truncate">Memuat…</p></div>
            <button onclick="bukaTes()" title="Cek penyimpanan" aria-label="Cek penyimpanan" class="shrink-0 w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 active:scale-95 transition"><i class="fas fa-stethoscope text-sm"></i></button>
            <a href="form_handout.html?action=create" class="shrink-0 bg-white text-amber-600 hover:bg-amber-50 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm active:scale-95 transition flex items-center gap-1.5"><i class="fas fa-plus"></i> Unggah</a>
        </header>
        <div class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center gap-2">
            <div class="flex-1 flex items-center bg-slate-100 rounded-lg px-3 py-2"><i class="fas fa-search text-slate-400 text-xs mr-2"></i><input id="q" oninput="saring()" placeholder="Cari judul…" class="w-full bg-transparent outline-none text-xs text-slate-700"></div>
            <div id="chips" class="flex gap-1.5"></div>
        </div>
    </div>

    <main class="flex-grow p-4">
        <div id="sMuat" class="flex flex-col gap-3">
            <div class="flex gap-3 bg-white p-3 rounded-xl border border-slate-100"><div class="sk w-16 h-20 rounded-lg"></div><div class="flex-1 space-y-2 py-1"><div class="sk h-3 w-1/3 rounded"></div><div class="sk h-4 w-full rounded"></div><div class="sk h-3 w-2/3 rounded"></div></div></div>
        </div>
        <div id="sKosong" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-16 h-16 bg-white border border-slate-200 rounded-full flex items-center justify-center text-3xl mb-3 text-slate-300 shadow-sm"><i class="fas fa-folder-open"></i></div>
            <h3 id="kosongJ" class="font-bold text-slate-700 text-sm mb-1">Belum ada handout</h3><p id="kosongP" class="text-[11px] text-slate-500 max-w-[240px]">Unggah PDF pertamamu. Sampul dan ringkasan dibuat otomatis.</p>
            <a id="kosongA" href="form_handout.html?action=create" class="mt-4 bg-amber-500 text-white text-xs font-bold px-5 py-2.5 rounded-full active:scale-95"><i class="fas fa-cloud-arrow-up mr-1.5"></i>Unggah PDF</a>
        </div>
        <div id="list" class="hidden flex-col gap-3"></div>
    </main>
</div>

<!-- CEK PENYIMPANAN -->
<div id="tes" class="fixed inset-0 bg-slate-900/60 z-[99999] hidden items-end sm:items-center justify-center" onclick="if(event.target===this) tutupTes()">
    <div class="up bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[88vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-1"><h3 class="font-bold text-slate-800 text-sm"><i class="fas fa-stethoscope text-amber-500 mr-2"></i>Cek Penyimpanan</h3><button onclick="tutupTes()" class="text-slate-400"><i class="fas fa-xmark text-lg"></i></button></div>
        <p class="text-[11px] text-slate-500 leading-relaxed">Mencoba mengunggah, membaca, lalu menghapus satu file kecil di Cloudinary untuk memastikan penyimpanan siap dipakai.</p>
        <div id="tesList" class="mt-4 space-y-2"></div>
        <button id="tesMulai" onclick="jalankanTes()" class="w-full mt-4 bg-amber-500 text-white font-bold py-3 rounded-xl text-xs active:scale-95 transition disabled:opacity-50"><i class="fas fa-play mr-1.5"></i>Jalankan Tes</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const app = initializeApp({ apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", authDomain: "mading-cf676.firebaseapp.com", projectId: "mading-cf676" });
const auth = getAuth(app), db = getFirestore(app);
const ALLOWED_ROLES = ['admin'];   // tambahkan 'teacher' bila dipakai guru
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let semua = [], filter = 'semua';
const FIL = [['semua', 'Semua'], ['published', 'Terbit'], ['draft', 'Draf']];

function render() {
    const q = $('q').value.trim().toLowerCase();
    const arr = semua.filter(h => (filter === 'semua' || h.status === filter) && (!q || h.judul.toLowerCase().includes(q)));
    $('chips').innerHTML = FIL.map(([k, l]) => `<button onclick="setFilter('${k}')" class="px-2.5 py-1.5 rounded-lg text-[10px] font-bold border transition ${filter === k ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-500 border-slate-200'}">${l}</button>`).join('');
    const total = semua.reduce((a, h) => a + (parseFloat(h.ukuranFile) || 0), 0);
    $('sub').textContent = `${semua.length} dokumen · ${total.toFixed(1)} MB`;
    if (!arr.length) { $('list').classList.add('hidden'); $('sKosong').classList.replace('hidden', 'flex'); const ada = semua.length > 0; $('kosongJ').textContent = ada ? 'Tidak ditemukan' : 'Belum ada handout'; $('kosongP').textContent = ada ? 'Coba kata kunci atau filter lain.' : 'Unggah PDF pertamamu. Sampul dan ringkasan dibuat otomatis.'; $('kosongA').classList.toggle('hidden', ada); return; }
    $('sKosong').classList.replace('flex', 'hidden');
    $('list').innerHTML = arr.map((h, i) => `<div class="up bg-white rounded-xl border border-slate-100 shadow-sm flex overflow-hidden" style="animation-delay:${Math.min(i, 8) * 40}ms">
        <a href="form_handout.html?action=edit&id=${encodeURIComponent(h.id)}" class="flex gap-3 p-3 flex-1 min-w-0 active:bg-slate-50 transition">
            <div class="w-14 h-[74px] rounded-lg overflow-hidden bg-slate-100 border border-slate-200 shrink-0">${h.coverImage ? `<img src="${esc(h.coverImage)}" alt="" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-amber-400"><i class="fas fa-file-pdf text-xl"></i></div>'}</div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 mb-1"><span class="text-[8px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${h.status === 'draft' ? 'bg-slate-100 text-slate-500' : 'bg-emerald-50 text-emerald-600'}">${h.status === 'draft' ? 'Draf' : 'Terbit'}</span><span class="text-[8px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-amber-50 text-amber-600 truncate">${esc(h.kategori)}</span></div>
                <h3 class="font-bold text-[12px] text-slate-800 leading-snug lc2">${esc(h.judul)}</h3>
                <p class="text-[10px] text-slate-400 mt-1"><i class="fas fa-file-lines"></i> ${esc(h.halaman || '-')} hal · ${esc(h.ukuranFile || '-')} MB · <i class="far fa-eye"></i> ${h.views || 0}</p>
            </div></a>
        <a href="../view-pdf.html?id=${encodeURIComponent(h.id)}" target="_blank" title="Lihat" aria-label="Lihat" class="w-11 flex items-center justify-center border-l border-slate-100 text-slate-400 hover:text-amber-500 hover:bg-amber-50 transition"><i class="fas fa-arrow-up-right-from-square text-xs"></i></a></div>`).join('');
    $('list').classList.remove('hidden'); $('list').classList.add('flex');
}
window.setFilter = k => { filter = k; render(); };
window.saring = render;


/* ===== CEK PENYIMPANAN (Cloudinary) ===== */
const LANGKAH = ['Hubungi server (kunci Cloudinary & akses admin)', 'Unggah file uji ke Cloudinary', 'Baca file dari situs (izin PDF & CORS)', 'Hapus file uji'];
let tesJalan = false;
async function apiCloud(action, body) {
    const token = await auth.currentUser.getIdToken();
    const r = await fetch('/api/cloudinary', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ action, ...body }) });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(d.detail_error || 'Server error'), { status: r.status }); return d;
}
function bantu(e, tahap) {
    const m = String((e && e.message) || e || '');
    if (tahap === 1) {
        if (/Variabel belum diisi/i.test(m)) return m;
        if (e && e.status === 404) return 'File api/cloudinary.js belum ter-deploy. Upload file tersebut ke folder api lalu deploy ulang.';
        if (e && (e.status === 401 || e.status === 403)) return m + ' Pastikan kamu login sebagai admin.';
        return m;
    }
    if (tahap === 2) {
        if (/signature/i.test(m)) return 'Tanda tangan ditolak. Periksa CLOUDINARY_API_SECRET di Vercel (salin ulang tanpa spasi), lalu deploy ulang.';
        if (/api[_ ]key|cloud/i.test(m)) return 'Cloud name atau API Key salah. Periksa CLOUDINARY_CLOUD_NAME dan CLOUDINARY_API_KEY di Vercel.';
        if (/Failed to fetch|NetworkError/i.test(m)) return 'Tidak bisa menghubungi Cloudinary. Periksa internet atau pemblokir iklan/VPN.';
        return m;
    }
    if (tahap === 3) {
        if (e && e.status === 401) return 'Cloudinary menahan pengiriman PDF (HTTP 401). Buka Cloudinary → Settings → Security → aktifkan "Allow delivery of PDF and ZIP files", lalu Save.';
        if (e && e.status === 404) return 'File tidak ditemukan di Cloudinary (HTTP 404). Coba jalankan ulang tes.';
        return 'Browser tidak boleh membaca file itu (CORS/jaringan). Matikan pemblokir iklan lalu ulangi; bila tetap gagal, kirim pesan ini kepada saya: ' + m;
    }
    return m;
}
function gambarTes(st) {
    $('tesList').innerHTML = LANGKAH.map((l, i) => { const x = st[i] || { s: 'tunggu' };
        const ic = x.s === 'ok' ? '<i class="fas fa-circle-check text-emerald-500"></i>' : x.s === 'gagal' ? '<i class="fas fa-circle-xmark text-red-500"></i>' : x.s === 'jalan' ? '<i class="fas fa-circle-notch fa-spin text-amber-500"></i>' : '<i class="far fa-circle text-slate-300"></i>';
        return `<div class="rounded-xl border ${x.s === 'gagal' ? 'border-red-200 bg-red-50' : 'border-slate-100 bg-slate-50'} p-3"><div class="flex items-center gap-2.5 text-[12px] font-semibold text-slate-700">${ic}<span>${i + 1}. ${l}</span></div>${x.pesan ? `<p class="text-[11px] text-red-700 leading-relaxed mt-1.5 ml-6">${esc(x.pesan)}</p>` : ''}</div>`; }).join('');
}
window.bukaTes = () => { $('tes').classList.replace('hidden', 'flex'); gambarTes([]); $('tesMulai').disabled = false; };
window.tutupTes = () => $('tes').classList.replace('flex', 'hidden');
window.jalankanTes = async () => {
    if (tesJalan) return; tesJalan = true; $('tesMulai').disabled = true; $('tesMulai').innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1.5"></i>Menguji…';
    const st = []; const set = (i, s, pesan) => { st[i] = { s, pesan }; gambarTes(st); };
    let t = null, hasil = null;
    try { set(0, 'jalan'); t = await apiCloud('tanda', { namaFile: 'tes-penyimpanan.pdf' }); set(0, 'ok'); } catch (e) { console.error(e); set(0, 'gagal', bantu(e, 1)); }
    if (t) {
        try {
            set(1, 'jalan'); const fd = new FormData(); fd.append('file', new Blob(['%PDF-1.4 tes penyimpanan'], { type: 'application/pdf' }), 'tes.pdf'); fd.append('api_key', t.api_key); fd.append('timestamp', t.timestamp); fd.append('public_id', t.public_id); fd.append('signature', t.signature);
            const r = await fetch(`https://api.cloudinary.com/v1_1/${t.cloud_name}/raw/upload`, { method: 'POST', body: fd }), j = await r.json().catch(() => ({}));
            if (!r.ok || !j.secure_url) throw new Error((j.error && j.error.message) || 'HTTP ' + r.status); hasil = j; set(1, 'ok');
            set(2, 'jalan'); try { const g = await fetch(j.secure_url); if (!g.ok) throw Object.assign(new Error('HTTP ' + g.status), { status: g.status }); await g.blob(); set(2, 'ok'); } catch (e) { set(2, 'gagal', bantu(e, 3)); }
        } catch (e) { console.error(e); set(hasil ? 2 : 1, 'gagal', bantu(e, hasil ? 3 : 2)); }
    }
    if (hasil) { try { set(3, 'jalan'); await apiCloud('hapus', { publicId: hasil.public_id }); set(3, 'ok'); } catch (e) { set(3, 'gagal', bantu(e, 4)); } }
    if (LANGKAH.every((_, i) => st[i] && st[i].s === 'ok')) $('tesList').insertAdjacentHTML('beforeend', '<p class="text-[12px] font-bold text-emerald-600 text-center pt-2"><i class="fas fa-circle-check"></i> Penyimpanan siap dipakai. Silakan unggah handout.</p>');
    tesJalan = false; $('tesMulai').disabled = false; $('tesMulai').innerHTML = '<i class="fas fa-rotate mr-1.5"></i>Jalankan Ulang';
};

onAuthStateChanged(auth, async user => {
    if (!user) { location.href = '../login.html'; return; }
    try {
        const u = await getDoc(doc(db, 'users', user.uid));
        if (!u.exists() || !ALLOWED_ROLES.includes(u.data().role)) { alert('Akses ditolak! Halaman ini khusus pengelola.'); location.href = '../login.html'; return; }
        const snap = await getDocs(collection(db, 'handouts')), ms = t => t ? (t.toMillis ? t.toMillis() : new Date(t).getTime() || 0) : 0;
        semua = []; snap.forEach(d => { const v = d.data(); if (v.status === 'dihapus') return; semua.push({ id: d.id, judul: v.judul || 'Tanpa judul', kategori: v.kategori || 'Bahan Ajar', status: v.status === 'draft' ? 'draft' : 'published', coverImage: v.coverImage || '', ukuranFile: v.ukuranFile || '', halaman: v.halaman || '', views: v.views || 0, t: ms(v.createdAt) }); });
        semua.sort((a, b) => b.t - a.t); $('sMuat').classList.add('hidden'); render();
    } catch (e) {
        console.error(e); $('sMuat').classList.add('hidden'); $('sKosong').classList.replace('hidden', 'flex'); $('kosongJ').textContent = 'Gagal memuat'; $('kosongP').textContent = 'Periksa koneksi atau aturan Firestore, lalu muat ulang.'; $('kosongA').classList.add('hidden');
    }
});
</script>
</body>
</html>
