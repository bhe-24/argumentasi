<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Formulir Pengembang - Argumentasi Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- OVERLAY LOADING SISTEM -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden">
        <div class="w-14 h-14 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin mb-3"></div>
        <h2 class="text-sm font-bold text-slate-800 tracking-wide" id="loadingText">Menyimpan Data...</h2>
    </div>

    <!-- CONTAINER UTAMA -->
    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">
        
        <!-- HEADER STICKY -->
        <header class="bg-purple-600 fixed w-full max-w-md z-50 px-4 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <a href="develop.html" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 transition-colors active:scale-95">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-white font-bold text-sm tracking-wide" id="headerTitle">Tambah Data</h1>
            </div>
            <!-- Tombol Hapus (Hidden Default) -->
            <button id="btnHapus" onclick="hapusMateri()" class="hidden bg-red-500 hover:bg-red-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg transition-colors items-center gap-1.5 shadow-sm active:scale-95">
                <i class="fas fa-trash-alt"></i> Hapus
            </button>
        </header>

        <div class="h-[60px] bg-purple-600 shrink-0"></div>
        <div class="bg-purple-600 h-6 px-4 relative z-10 rounded-b-[2rem] -mt-1 shrink-0"></div>

        <!-- AREA FORM -->
        <main class="flex-grow overflow-y-auto hide-scrollbar p-4 relative z-20 -mt-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                
                <form id="developForm" onsubmit="handleSave(event)">
                    
                    <div class="bg-slate-50 border-b border-slate-100 p-4">
                        <h2 class="font-bold text-slate-700 text-xs"><i class="fas fa-id-badge text-purple-600 mr-1.5"></i> Identitas Pengembang</h2>
                    </div>

                    <div class="p-5 space-y-4">
                        
                        <!-- Kategori (Dosen / Mahasiswa / Umum) -->
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Kategori / Peran</label>
                            <select id="inputKategori" onchange="updateLabelIdentitas()" class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none text-xs font-bold text-purple-700 bg-purple-50">
                                <option value="mahasiswa">Mahasiswa</option>
                                <option value="dosen">Dosen</option>
                                <option value="umum">Umum</option>
                            </select>
                        </div>

                        <!-- NPM / NIP -->
                        <div>
                            <label id="labelIdentitas" class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">NPM / NIM</label>
                            <input type="text" id="inputIdentitas" required class="w-full border border-slate-200 rounded-xl px-4 py-3 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none text-sm font-semibold text-slate-800 bg-slate-50" placeholder="Masukkan NPM/NIM...">
                        </div>

                        <!-- Nama Lengkap -->
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Nama Lengkap & Gelar</label>
                            <input type="text" id="inputNama" required class="w-full border border-slate-200 rounded-xl px-4 py-3 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none text-sm font-semibold text-slate-800 bg-slate-50" placeholder="Contoh: Dr. Budi Santoso, M.Pd.">
                        </div>

                        <!-- Jabatan Tim -->
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Posisi / Jabatan di Tim</label>
                            <input type="text" id="inputJabatan" required class="w-full border border-slate-200 rounded-xl px-4 py-3 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none text-sm font-semibold text-slate-800 bg-slate-50" placeholder="Contoh: Dosen Pengampu / Tim IT">
                        </div>

                        <!-- Deskripsi Singkat -->
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Deskripsi Singkat / Bio (Opsional)</label>
                            <textarea id="inputDeskripsi" rows="3" class="w-full border border-slate-200 rounded-xl px-4 py-3 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none text-xs font-medium text-slate-700 bg-slate-50" placeholder="Tuliskan bio atau deskripsi singkat tugasnya..."></textarea>
                        </div>

                        <!-- Gambar Cover & Sumber -->
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Foto Profil</label>
                            <div class="border-2 border-dashed border-slate-200 rounded-xl p-5 text-center hover:bg-slate-50 hover:border-purple-400 transition cursor-pointer relative group bg-slate-50/50" id="dropArea">
                                <input type="file" id="inputCoverImage" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="previewImage(this)">
                                
                                <div id="previewContainer" class="hidden flex flex-col items-center">
                                    <img id="imgPreview" src="" class="w-24 h-24 object-cover rounded-full shadow-md mb-2 border-2 border-white">
                                    <span class="text-[9px] font-bold text-slate-500 bg-white border border-slate-200 px-3 py-1 rounded-full">Ganti Foto</span>
                                </div>
                                
                                <div id="uploadPlaceholder" class="flex flex-col items-center">
                                    <div class="w-10 h-10 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-2 group-hover:scale-110 transition-transform"><i class="fas fa-camera"></i></div>
                                    <p class="text-xs font-bold text-slate-600">Ketuk untuk unggah foto</p>
                                    <p class="text-[9px] text-slate-400 mt-0.5">Disarankan rasio 1:1 (Persegi)</p>
                                </div>
                            </div>
                            <input type="hidden" id="base64Image">
                        </div>
                    </div>

                    <!-- Footer / Tombol Aksi -->
                    <div class="p-4 border-t border-slate-100 bg-white flex gap-3 rounded-b-2xl sticky bottom-0 z-30">
                        <button type="button" onclick="window.location.href='develop.html'" class="flex-1 py-3 rounded-xl font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition text-xs">Batal</button>
                        <button type="submit" id="btnSave" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 text-xs">
                            <i class="fas fa-save"></i> Simpan Data
                        </button>
                    </div>

                </form>
            </div>
        </main>
    </div>

    <!-- UI Logic Script -->
    <script>
        function updateLabelIdentitas() {
            const val = document.getElementById('inputKategori').value;
            const label = document.getElementById('labelIdentitas');
            const input = document.getElementById('inputIdentitas');

            if (val === 'dosen') {
                label.innerText = 'NIP / NIDN';
                input.placeholder = 'Masukkan NIP atau NIDN...';
            } else if (val === 'mahasiswa') {
                label.innerText = 'NPM / NIM';
                input.placeholder = 'Masukkan NPM atau NIM...';
            } else {
                label.innerText = 'No. Identitas';
                input.placeholder = 'NIK atau identitas lain...';
            }
        }
    </script>

    <!-- FIREBASE & LOGIKA APLIKASI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- PREVIEW & COMPRESS IMAGE ---
        window.previewImage = function(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Lebih kecil ukurannya karena hanya butuh foto profil (Maks 500px)
                        const maxWidth = 500; 
                        let width = img.width; let height = img.height;
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }

                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        
                        document.getElementById('imgPreview').src = compressedDataUrl;
                        document.getElementById('previewContainer').classList.remove('hidden');
                        document.getElementById('uploadPlaceholder').classList.add('hidden');
                        document.getElementById('base64Image').value = compressedDataUrl;
                    };
                };
                reader.readAsDataURL(file);
            }
        };

        // --- CEK EDIT ATAU BARU ---
        let editDocId = null;
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const id = urlParams.get('id');

        if (action === 'edit' && id) {
            editDocId = id;
            document.getElementById('headerTitle').innerText = "Edit Data Tim";
            document.getElementById('btnHapus').classList.remove('hidden');
            document.getElementById('btnHapus').classList.add('flex');
            
            getDoc(doc(db, "developers", id)).then((docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    document.getElementById('inputKategori').value = data.kategori || "mahasiswa";
                    updateLabelIdentitas(); // Trigger update placeholder

                    document.getElementById('inputIdentitas').value = data.identitas || "";
                    document.getElementById('inputNama').value = data.nama || "";
                    document.getElementById('inputJabatan').value = data.jabatan || "";
                    document.getElementById('inputDeskripsi').value = data.deskripsi || "";

                    if(data.foto || data.gambarBase64) {
                        const imgSrc = data.foto || data.gambarBase64;
                        document.getElementById('imgPreview').src = imgSrc;
                        document.getElementById('previewContainer').classList.remove('hidden');
                        document.getElementById('uploadPlaceholder').classList.add('hidden');
                        document.getElementById('base64Image').value = imgSrc;
                    }
                }
            });
        }

        // --- FUNGSI HAPUS ---
        window.hapusMateri = async function() {
            if(!editDocId) return;
            const konfirmasi = confirm("Yakin ingin menghapus data pengembang ini? Data tidak bisa dikembalikan.");
            if(konfirmasi) {
                const overlay = document.getElementById('loadingOverlay');
                document.getElementById('loadingText').innerText = "Menghapus...";
                overlay.classList.remove('hidden');
                
                try {
                    await deleteDoc(doc(db, "developers", editDocId));
                    window.location.replace("develop.html"); 
                } catch(err) {
                    console.error(err);
                    alert("Gagal menghapus: " + err.message);
                    overlay.classList.add('hidden');
                }
            }
        };

        // --- FUNGSI SIMPAN ---
        window.handleSave = async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSave');
            const overlay = document.getElementById('loadingOverlay');
            
            btn.disabled = true;
            document.getElementById('loadingText').innerText = "Menyimpan Data...";
            overlay.classList.remove('hidden');

            const kategori = document.getElementById('inputKategori').value;
            const identitas = document.getElementById('inputIdentitas').value.trim();
            const nama = document.getElementById('inputNama').value.trim();
            const jabatan = document.getElementById('inputJabatan').value.trim();
            const deskripsi = document.getElementById('inputDeskripsi').value.trim();
            const foto = document.getElementById('base64Image').value; 
            
            if(!nama || !identitas) {
                alert("Nama dan Identitas tidak boleh kosong!");
                overlay.classList.add('hidden');
                btn.disabled = false;
                return;
            }

            const dataToSave = {
                kategori: kategori,
                identitas: identitas,
                nama: nama,
                jabatan: jabatan,
                deskripsi: deskripsi,
                foto: foto, // Kita standarkan key menjadi 'foto'
                updatedAt: serverTimestamp()
            };

            try {
                if (editDocId) {
                    await updateDoc(doc(db, "developers", editDocId), dataToSave);
                } else {
                    dataToSave.createdAt = serverTimestamp();
                    await addDoc(collection(db, "developers"), dataToSave);
                }
                
                window.location.replace("develop.html");

            } catch (error) {
                console.error(error);
                alert("Terjadi masalah saat menyimpan data. Coba lagi.");
                btn.disabled = false;
                overlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
