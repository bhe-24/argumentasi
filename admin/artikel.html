<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Artikel & Berita - Argumentasi Admin</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        // Auto-redirect jika membawa parameter aksi form (dari dashboard)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('action') === 'create' || urlParams.get('action') === 'edit') {
            window.location.replace('admin/form_artikel.html' + window.location.search);
        }

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } }
                }
            }
        }

        // Penyelaras Tautan Admin
        document.addEventListener('click', function(e) {
            const a = e.target.closest('a');
            if (!a) return;
            const href = a.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('http') || href.startsWith('mailto:')) return;
            if (href.startsWith('admin/')) {
                const p = (window.location && window.location.pathname) || '';
                const proto = (window.location && window.location.protocol) || '';
                if (p.includes('/admin/') || p.endsWith('/admin/index.html') || proto === 'file:') {
                    e.preventDefault();
                    window.location.href = href.replace(/^admin\//, '');
                }
            }
        });
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Tabs (Tema Indigo/Blue untuk Artikel) */
        .tab-active { border-bottom: 3px solid #3b82f6; color: #2563eb; font-weight: 700; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #64748b; font-weight: 500; }

        /* Skeleton shimmer kokoh */
        .sk { position: relative; overflow: hidden; background: #e2e8f0; border-radius: .5rem; }
        .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shimmer 1.4s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- CONTAINER UTAMA -->
    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">
        
        <!-- HEADER STICKY (Tema Blue/Indigo) -->
        <header class="bg-blue-600 fixed w-full max-w-md z-50 px-4 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <a href="admin/index.html" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 transition-colors active:scale-95">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="text-white font-bold text-sm tracking-wide leading-tight">Kelola Artikel</h1>
                    <p class="text-white/70 text-[10px] leading-tight">Pusat Publikasi Konten Admin</p>
                </div>
            </div>
            
            <a href="admin/form_artikel.html?action=create" class="bg-white text-blue-600 hover:bg-blue-50 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors items-center gap-1.5 shadow-sm active:scale-95 flex">
                <i class="fas fa-plus"></i> Tambah
            </a>
        </header>

        <!-- RUANG KOSONG UNTUK HEADER -->
        <div class="h-[60px] bg-blue-600 shrink-0"></div>

        <!-- SUBHEADER INFO ADMIN -->
        <div class="bg-blue-50 border-b border-blue-100 px-4 py-2.5 flex items-center justify-between">
            <span class="text-[10px] font-semibold text-blue-800"><i class="fas fa-newspaper mr-1 text-blue-600"></i>Pusat Data & Publikasi Artikel Admin</span>
            <span class="text-[9px] font-bold text-blue-600 bg-white border border-blue-200 px-2 py-0.5 rounded-full">Admin Panel</span>
        </div>

        <!-- TABS NAVIGASI -->
        <div class="bg-white border-b border-slate-200 z-40 relative shadow-sm shrink-0">
            <div class="flex overflow-x-auto hide-scrollbar px-2 bg-white">
                <button onclick="ubahTab('published', this)" class="tab-btn tab-active flex-1 min-w-[100px] py-3 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    🌍 Terbit
                </button>
                <button onclick="ubahTab('draft', this)" class="tab-btn tab-inactive flex-1 min-w-[100px] py-3 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    📝 Draft
                </button>
            </div>
        </div>

        <!-- AREA LIST ARTIKEL -->
        <div class="flex-grow overflow-y-auto hide-scrollbar p-4 bg-slate-50 relative">

            <!-- STATE LOADING -->
            <div id="loadingState" class="flex flex-col gap-3">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3"><div class="sk w-20 h-20 rounded-lg shrink-0"></div><div class="flex-1 space-y-2 py-1"><div class="sk h-3 w-1/3"></div><div class="sk h-4 w-full"></div><div class="sk h-4 w-2/3"></div></div></div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3"><div class="sk w-20 h-20 rounded-lg shrink-0"></div><div class="flex-1 space-y-2 py-1"><div class="sk h-3 w-1/3"></div><div class="sk h-4 w-full"></div><div class="sk h-4 w-2/3"></div></div></div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3"><div class="sk w-20 h-20 rounded-lg shrink-0"></div><div class="flex-1 space-y-2 py-1"><div class="sk h-3 w-1/3"></div><div class="sk h-4 w-full"></div><div class="sk h-4 w-2/3"></div></div></div>
            </div>

            <!-- STATE KOSONG -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-16 h-16 bg-white border border-slate-200 rounded-full flex items-center justify-center text-3xl mb-3 text-slate-300 shadow-sm"><i class="fas fa-newspaper"></i></div>
                <h3 class="font-bold text-slate-700 text-sm mb-1">Data Kosong</h3>
                <p class="text-[11px] text-slate-500">Belum ada artikel di kategori status ini.</p>
                <a href="form_artikel.html?action=create" class="mt-4 inline-flex items-center gap-1.5 bg-blue-600 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-sm active:scale-95 transition"><i class="fas fa-pen-nib"></i> Tulis Artikel Baru</a>
            </div>

            <!-- KONTINER LIST -->
            <div id="listContainer" class="flex flex-col gap-3 hidden"></div>

        </div>

    </div>

    <!-- SCRIPT UI & FIREBASE -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center shrink-0 mt-auto">
    <img src="https://i.imgur.com/a9S8h2Z.png" alt="Logo" class="h-4 object-contain mx-auto mb-2 grayscale opacity-50">
    <p class="text-[9px] text-slate-400 font-medium">&copy; 2026 Platform Argumentasi.</p>
</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentTab = 'published';

        // Ganti Tab
        window.ubahTab = function(status, btnElement) {
            currentTab = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            });
            btnElement.classList.remove('tab-inactive');
            btnElement.classList.add('tab-active');
            muatDataList();
        }

        function renderCard(id, data) {
            const img = data.coverImage || data.gambarBase64 || "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=300&q=80";
            
            // Format Tanggal
            let tgl = "-";
            if(data.createdAt) {
                const d = data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt);
                tgl = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            return `
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 hover:border-blue-300 transition-colors">
                <div class="flex gap-3">
                    <img src="${img}" class="w-20 h-20 object-cover rounded-lg shrink-0 bg-slate-100" onerror="this.src='https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=300&q=80'">
                    <div class="flex-1 flex flex-col justify-between py-0.5 min-w-0">
                        <div>
                            <div class="flex justify-between items-start gap-1">
                                <span class="text-[8px] font-bold bg-blue-50 text-blue-600 border border-blue-100 px-1.5 py-0.5 rounded uppercase tracking-wider">Artikel Admin</span>
                                <span class="text-[9px] text-slate-400 shrink-0"><i class="far fa-calendar-alt mr-0.5"></i>${tgl}</span>
                            </div>
                            <h3 class="font-bold text-xs text-slate-800 line-clamp-2 mt-1 leading-snug">${data.judul || 'Tanpa Judul'}</h3>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-50 mt-1">
                            <span class="text-[9px] text-slate-400"><i class="far fa-eye mr-0.5"></i>${data.views || 0} tayang</span>
                            <div class="flex items-center gap-1.5">
                                <a href="admin/form_artikel.html?action=edit&id=${id}" class="text-[10px] font-bold text-blue-600 hover:text-blue-700 px-3 py-1 rounded-lg bg-blue-50 border border-blue-200 active:scale-95"><i class="fas fa-pen mr-1"></i>Kelola / Edit</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        async function muatDataList() {
            const listContainer = document.getElementById('listContainer');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');

            listContainer.classList.add('hidden');
            emptyState.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                // Tarik data yg kategorinya artikel dan status tab saat ini
                const q = query(
                    collection(db, "materials"), 
                    where("kategori", "==", "artikel"),
                    where("status", "==", currentTab),
                    orderBy("createdAt", "desc")
                );
                
                const snap = await getDocs(q);

                loadingState.classList.add('hidden');

                if (snap.empty) {
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                    listContainer.innerHTML = '';
                    return;
                }

                let html = "";
                snap.forEach(doc => { html += renderCard(doc.id, doc.data()); });
                
                listContainer.innerHTML = html;
                listContainer.classList.remove('hidden');
                
            } catch (error) {
                console.error("Firebase Error:", error);
                loadingState.classList.add('hidden');
                listContainer.innerHTML = `<p class="text-xs text-center text-red-500 py-10"><i class="fas fa-exclamation-triangle mb-2 text-xl"></i><br>Gagal memuat data artikel: ${error.message}</p>`;
                listContainer.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', muatDataList);
    </script>
</body>
</html>
