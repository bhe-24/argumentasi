<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tim Pengembang - Argumentasi Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        // Auto-redirect jika masuk membawa parameter aksi form
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('action') === 'create' || urlParams.get('action') === 'edit') {
            window.location.replace('form_develop.html' + window.location.search);
        }

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Skeleton shimmer */
        .sk { position: relative; overflow: hidden; background: #e2e8f0; border-radius: .5rem; }
        .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shimmer 1.4s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- CONTAINER UTAMA -->
    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">
        
        <!-- HEADER STICKY (Tema Ungu) -->
        <header class="bg-purple-600 fixed w-full max-w-md z-50 px-4 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 transition-colors active:scale-95">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-white font-bold text-sm tracking-wide">Tim Pengembang</h1>
            </div>
            
            <a href="form_develop.html?action=create" class="bg-white text-purple-600 hover:bg-purple-50 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors items-center gap-1.5 shadow-sm active:scale-95 flex">
                <i class="fas fa-plus"></i> Tambah
            </a>
        </header>

        <!-- RUANG KOSONG -->
        <div class="h-[60px] bg-purple-600 shrink-0"></div>
        <div class="bg-purple-600 h-6 px-4 relative z-10 rounded-b-[2rem] -mt-1 shrink-0"></div>

        <!-- AREA LIST MATERI -->
        <div class="flex-grow overflow-y-auto hide-scrollbar p-4 bg-slate-50 relative -mt-4 z-20">

            <!-- STATE LOADING -->
            <div id="loadingState" class="flex flex-col gap-3 fade-in mt-2">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3"><div class="sk w-16 h-16 rounded-full"></div><div class="flex-1 space-y-2 py-1"><div class="sk h-3 w-1/3"></div><div class="sk h-4 w-full"></div><div class="sk h-3 w-2/3"></div></div></div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3"><div class="sk w-16 h-16 rounded-full"></div><div class="flex-1 space-y-2 py-1"><div class="sk h-3 w-1/3"></div><div class="sk h-4 w-full"></div><div class="sk h-3 w-2/3"></div></div></div>
            </div>

            <!-- STATE KOSONG -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-16 h-16 bg-white border border-slate-200 rounded-full flex items-center justify-center text-3xl mb-3 text-slate-300 shadow-sm"><i class="fas fa-users-slash"></i></div>
                <h3 class="font-bold text-slate-700 text-sm mb-1">Data Kosong</h3>
                <p class="text-[11px] text-slate-500">Belum ada tim pengembang yang terdaftar.</p>
            </div>

            <!-- KONTINER LIST -->
            <div id="listContainer" class="flex flex-col gap-3 hidden fade-in mt-2"></div>

        </div>

    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function renderCard(id, data) {
            const img = data.foto || data.gambarBase64 || "https://ui-avatars.com/api/?name=" + encodeURIComponent(data.nama || 'Dev') + "&background=random";
            
            // Format Badge Kategori
            let badgeColor = "bg-slate-100 text-slate-600 border-slate-200";
            if (data.kategori === 'dosen') badgeColor = "bg-blue-50 text-blue-600 border-blue-100";
            else if (data.kategori === 'mahasiswa') badgeColor = "bg-amber-50 text-amber-600 border-amber-100";

            return `
            <a href="form_develop.html?action=edit&id=${id}" class="flex gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100 hover:border-purple-400 transition-colors active:scale-[0.98]">
                <img src="${img}" class="w-16 h-16 object-cover rounded-full border border-slate-100 shadow-sm bg-slate-50 shrink-0">
                <div class="flex-1 flex flex-col justify-center min-w-0">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[8px] font-bold ${badgeColor} border px-1.5 py-0.5 rounded uppercase tracking-widest">${data.kategori || 'Umum'}</span>
                        <span class="text-[9px] text-slate-400 font-bold bg-slate-50 px-1.5 py-0.5 rounded"><i class="fas fa-id-card text-[8px] mr-0.5"></i> ${data.identitas || '-'}</span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-800 line-clamp-1 leading-snug">${data.nama || 'Nama Tidak Diketahui'}</h3>
                    <p class="text-[10px] font-medium text-purple-600 mt-0.5 line-clamp-1">${data.jabatan || 'Anggota Tim'}</p>
                </div>
            </a>`;
        }

        async function muatDataList() {
            const listContainer = document.getElementById('listContainer');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');

            listContainer.classList.add('hidden');
            emptyState.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                // Tarik data dari koleksi developers
                const q = query(collection(db, "developers"));
                const snap = await getDocs(q);

                loadingState.classList.add('hidden');

                if (snap.empty) {
                    emptyState.classList.remove('hidden');
                    listContainer.innerHTML = '';
                    return;
                }

                let html = "";
                snap.forEach(doc => { html += renderCard(doc.id, doc.data()); });
                
                listContainer.innerHTML = html;
                listContainer.classList.remove('hidden');
                
            } catch (error) {
                console.error("Firebase Error:", error);
                loadingState.classList.add('hidden');
                listContainer.innerHTML = `<p class="text-xs text-center text-red-500 py-10"><i class="fas fa-exclamation-triangle mb-2 text-xl"></i><br>Gagal memuat data.</p>`;
                listContainer.classList.remove('hidden');
            }
        }

        // Load saat pertama buka
        document.addEventListener('DOMContentLoaded', muatDataList);
    </script>
</body>
</html>
