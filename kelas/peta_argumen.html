    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], reading: ['Merriweather', 'serif'] }, colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } } } } }</script>
    <script>
    (function () {
        const qCore = new URLSearchParams(window.location.search);
        const cId = qCore.get('id') || 'umum';
        const LS = 'lat_v1_' + cId, DBN = 'latihan-db-' + cId; 
        
        let S = null, siapP = null;
        const pad = n => String(n).padStart(2, '0');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
        const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
        const idbOpen = () => new Promise((ok, no) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
        const idbGet = async () => { try { const d = await idbOpen(); return await new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } };
        const idbSet = async v => { try { const d = await idbOpen(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'state'); t.oncomplete = ok; t.onerror = ok; t.onabort = ok; }); } catch (e) {} };

        const L = {
            esc, today, pad,
            siap() { return siapP || (siapP = (async () => {
                const a = lsRead(), b = await idbGet();
                S = [a, b].filter(x => x && x.hari).sort((x, y) => (y.u || 0) - (x.u || 0))[0] || { v: 1, id: uuid(), u: Date.now(), hari: {} };
                L.simpan(true); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
                return S; })()); },
            state: () => S,
            simpan(tetap) {
                if (!tetap) S.u = Date.now();
                const ks = Object.keys(S.hari).sort(); while (ks.length > 45) delete S.hari[ks.shift()];
                try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
                idbSet(JSON.parse(JSON.stringify(S)));
            },
            aktif() { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.spin && now < h.spin.ts + 864e5 && (!best || h.spin.ts > S.hari[best].spin.ts)) best = k; } return best; },
            hari(kunci) { if (kunci === undefined || kunci === null) { const a = L.aktif(); return a ? S.hari[a] : null; } return S.hari[kunci] || null; },
            // Cari hari yang punya hasil untuk misi tertentu (tanpa batas waktu 24 jam)
            cariHariDenganHasil(misiKey) { let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.hasil && h.hasil[misiKey]) { if (!best || (h.spin && S.hari[best] && h.spin.ts > (S.hari[best].spin ? S.hari[best].spin.ts : 0))) best = k; } } return best ? S.hari[best] : null; },
            // Cari hari dengan sesi aktif yang sedang berjalan untuk misi tertentu
            cariHariDenganSesi(misiKey) { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.sesi && h.sesi[misiKey] && now < h.sesi[misiKey].batas) { if (!best || h.sesi[misiKey].mulai > S.hari[best].sesi[misiKey].mulai) best = k; } } return best ? S.hari[best] : null; },
            nama: () => localStorage.getItem('namaSiswaCendekia') || 'Siswa',
            xp: () => (parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + parseInt(localStorage.getItem('kelasPointsArg') || '0')),
            tambahXp(n) { localStorage.setItem('latihanPointsCendekia', String(parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + n)); },
            fmt(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); },
            menit: s => Math.max(1, Math.round(s / 60)),
            toast(msg, err) {
                let c = document.getElementById('lToast');
                if (!c) { c = document.createElement('div'); c.id = 'lToast'; c.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100000] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none'; document.body.appendChild(c); }
                const t = document.createElement('div'); t.className = (err ? 'bg-red-500' : 'bg-slate-800') + ' text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 up';
                t.innerHTML = '<i class="fas ' + (err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400') + '"></i><span class="flex-1">' + esc(msg) + '</span>'; c.appendChild(t); setTimeout(() => t.remove(), 3000);
            },
            beep(jenis) {
                try { const x = new (window.AudioContext || window.webkitAudioContext)(), o = x.createOscillator(), g = x.createGain(); o.connect(g); g.connect(x.destination);
                    if (jenis === 'ok') { o.type = 'sine'; o.frequency.setValueAtTime(523, x.currentTime); o.frequency.exponentialRampToValueAtTime(1046, x.currentTime + .12); }
                    else if (jenis === 'tik') { o.type = 'square'; o.frequency.setValueAtTime(900, x.currentTime); }
                    else { o.type = 'sawtooth'; o.frequency.setValueAtTime(150, x.currentTime); }
                    g.gain.setValueAtTime(.06, x.currentTime); g.gain.exponentialRampToValueAtTime(.001, x.currentTime + (jenis === 'tik' ? .06 : .4)); o.start(); o.stop(x.currentTime + .4); } catch (e) {}
            },
            async pdf(el, namaBerkas) {
                if (!window.html2pdf) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; s.onload = ok; s.onerror = () => no(new Error('Pembuat PDF gagal dimuat')); document.head.appendChild(s); });
                const c = el.cloneNode(true); c.style.cssText = 'display:block;position:static;width:700px;background:#fff;color:#0f172a';
                await html2pdf().set({ margin: [10, 10, 12, 10], filename: namaBerkas, image: { type: 'jpeg', quality: .95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'], avoid: '.nobreak' } }).from(c).save();
            }
        };
        window.L = L;
    })();
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #e2e8f0; -webkit-tap-highlight-color: transparent; }

        @keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.025); } 100% { transform: scale(1); } }

        .hl { animation: tosL 1.2s cubic-bezier(.2,.9,.3,1.15) .1s both; } .hr { animation: tosR 1.2s cubic-bezier(.2,.9,.3,1.15) .1s both; }
        @keyframes tosL { 0% { transform: translateX(-170px) rotate(-55deg); opacity: 0; } 50% { transform: translateX(-6px) rotate(-8deg); opacity: 1; } 62% { transform: translateX(-20px) rotate(-22deg); } 100% { transform: translateX(-12px) rotate(-14deg); opacity: 1; } }
        @keyframes tosR { 0% { transform: scaleX(-1) translateX(-170px) rotate(-55deg); opacity: 0; } 50% { transform: scaleX(-1) translateX(-6px) rotate(-8deg); opacity: 1; } 62% { transform: scaleX(-1) translateX(-20px) rotate(-22deg); } 100% { transform: scaleX(-1) translateX(-12px) rotate(-14deg); opacity: 1; } }
        .tos .boom { position: absolute; width: 20px; height: 20px; border-radius: 9999px; border: 4px solid #fde047; opacity: 0; animation: boom .7s ease-out .62s both; }
        @keyframes boom { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(6); opacity: 0; } }
        .tos .sp { position: absolute; color: #fde047; font-size: 14px; opacity: 0; animation: sp .9s ease-out .65s both; }
        @keyframes sp { 0% { transform: scale(0) rotate(0); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1.4) rotate(120deg); opacity: 0; } }
        .goyang { animation: goy 1.2s ease-in-out infinite; } @keyframes goy { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-12px) rotate(6deg); } }
        .detak { animation: dtk 1.2s ease-in-out infinite; } @keyframes dtk { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        .bahas-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: .8rem; }
        .rpt { display: none; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; }
        @media print { body > *:not(#laporan) { display: none !important; } #laporan { display: block !important; } body { background: #fff; } }
    </style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({ apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" });
const db = getFirestore(app);
window.db = db;

const $ = id => document.getElementById(id), esc = window.L.esc;
const HURUF = ['A', 'B', 'C', 'D', 'E'];
const TKT = { mudah: ['Mudah', 'emerald', 'fa-seedling'], sedang: ['Sedang', 'sky', 'fa-gauge'], sulit: ['Sulit', 'amber', 'fa-mountain'], hots: ['HOTS', 'rose', 'fa-fire'] };
const TKT_HEX = { mudah: '#10b981', sedang: '#0ea5e9', sulit: '#f59e0b', hots: '#f43f5e' };
const NAV_BAGIAN = [
    ['pilgan', 'Pilihan Ganda', 'pilgan.html', 'fa-circle-check', 'blue'],
    ['struktur', 'Bedah Struktur', 'struktur.html', 'fa-layer-group', 'amber'],
    ['esai', 'Esai Argumentasi', 'esai.html', 'fa-pen-nib', 'emerald'],
    ['kritis', 'Uji Berpikir', 'kritis.html', 'fa-brain', 'rose'],
    ['peta', 'Peta Argumen', 'peta_argumen.html', 'fa-map-signs', 'indigo'],
    ['ilmiah', 'Kata Ilmiah', 'kata_ilmiah.html', 'fa-flask', 'teal']
];

window.H = null; window.P = null; window.soal = null; window.totalWaktu = 0; window.sesi = null; window.timer = null; window.aktif = false; window.resolveM = null;

const qsParams = new URLSearchParams(window.location.search);
const classId = qsParams.get('id') || '';
const studentId = qsParams.get('sid') || localStorage.getItem('studentId') || localStorage.getItem('siswa_' + classId) || '';

function urlKembali() {
    let u = '../ruang_belajar_siswa.html';
    const qs = new URLSearchParams();
    if (classId) qs.set('id', classId);
    if (studentId) qs.set('sid', studentId);
    return u + (qs.toString() ? '?' + qs.toString() : '');
}

window.normSoal = function(arr) {
    return (arr || []).map(s => { 
        const tk = String(s.tingkat || 'sedang').toLowerCase(); 
        return { 
            p: s.p ?? s.pertanyaan ?? s.rumpang ?? s.teks ?? 'Soal', 
            opsi: Array.isArray(s.opsi) ? s.opsi : (Array.isArray(s.pilihan) ? s.pilihan : []), 
            j: typeof s.j === 'number' ? s.j : (HURUF.indexOf(String(s.j ?? '').trim().toUpperCase()) >= 0 ? HURUF.indexOf(String(s.j ?? '').trim().toUpperCase()) : (parseInt(s.j) || 0)), 
            tingkat: TKT[tk] ? tk : 'sedang', 
            waktu: s.waktu || 90, 
            bahas: s.bahas ?? s.pembahasan ?? s.alasan ?? ''
        }; 
    }); 
};

window.modal = (judul, ket, ok, batal, ikon) => new Promise(r => { window.resolveM = r; $('mJudul').textContent = judul; $('mKet').textContent = ket; $('mOk').textContent = ok || 'Lanjutkan'; $('mBatal').textContent = batal || 'Batal'; $('mIkon').innerHTML = '<i class="fas ' + (ikon || 'fa-triangle-exclamation') + '"></i>'; $('modal').classList.replace('hidden', 'flex'); });
window.jawabModal = v => { $('modal').classList.replace('flex', 'hidden'); if (window.resolveM) { window.resolveM(v); window.resolveM = null; } };
window.badge = t => { const arr = TKT[t] || TKT.sedang; return '<span class="inline-flex items-center gap-1 text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-' + arr[1] + '-100 text-' + arr[1] + '-700"><i class="fas ' + arr[2] + '"></i>' + arr[0] + '</span>'; };

/* ===== KIRIM HASIL KE SERVER (tidak menahan tampilan hasil) ===== */
async function kirimServer() {
    const R = window.H && window.H.hasil && window.H.hasil.peta;
    if (!R || R.sync || !studentId || !classId) return;
    try {
        await setDoc(doc(db, `classes/${classId}/students`, studentId), { latihan: { peta: R } }, { merge: true });
        R.sync = true; L.simpan(true);
    } catch (e) {
        console.warn('Gagal menyimpan hasil ke server:', e);
    }
}

async function initLatihan() {
    await L.siap();
    
    const backUrl = urlKembali();
    if ($('btnBack')) $('btnBack').href = backUrl;

    // 1. Cek apakah ada hasil lama (dari hari manapun, tanpa batas waktu)
    const hDenganHasil = L.cariHariDenganHasil('peta');
    if (hDenganHasil && hDenganHasil.hasil && hDenganHasil.hasil.peta) {
        window.H = hDenganHasil;
        let pack = (hDenganHasil.pack && hDenganHasil.pack.peta) || (hDenganHasil.pack && hDenganHasil.pack.pilgan);
        if (!pack) {
            const S = L.state();
            if (S && S.hari) {
                for (const k in S.hari) {
                    if (S.hari[k].pack && (S.hari[k].pack.peta || S.hari[k].pack.pilgan)) {
                        pack = S.hari[k].pack.peta || S.hari[k].pack.pilgan;
                        hDenganHasil.pack = S.hari[k].pack;
                        if (!hDenganHasil.spin && S.hari[k].spin) hDenganHasil.spin = S.hari[k].spin;
                        break;
                    }
                }
            }
        }
        if (!pack && classId) {
            try {
                const docSnap = await getDoc(doc(db, "classes", classId));
                if (docSnap.exists() && docSnap.data().aiPaket) {
                    hDenganHasil.pack = docSnap.data().aiPaket;
                    if (!hDenganHasil.spin) hDenganHasil.spin = { judul: docSnap.data().namaKelas || 'Kelas', ts: Date.now() };
                    pack = hDenganHasil.pack.peta || hDenganHasil.pack.pilgan;
                    L.simpan(true);
                }
            } catch (e) { console.warn("Gagal memuat aiPaket:", e); }
        }
        if (pack) {
            window.P = pack;
            window.soal = window.normSoal(window.P.soal);
            window.totalWaktu = window.P.total || window.P.waktu || window.soal.reduce((a, b) => a + (b.waktu || 90), 0) || 450;
            if ($('hSub')) $('hSub').textContent = (hDenganHasil.spin && hDenganHasil.spin.judul) || 'Peta Argumen';
            kirimServer();
            return window.tampilHasil();
        }
    }

    // 2. Cek apakah ada sesi yang masih berjalan (belum timeout)
    const hDenganSesi = L.cariHariDenganSesi('peta');
    if (hDenganSesi && hDenganSesi.sesi && hDenganSesi.sesi.peta) {
        window.H = hDenganSesi;
        let pack = (hDenganSesi.pack && hDenganSesi.pack.peta) || (hDenganSesi.pack && hDenganSesi.pack.pilgan);
        if (!pack) {
            const S = L.state();
            if (S && S.hari) {
                for (const k in S.hari) {
                    if (S.hari[k].pack && (S.hari[k].pack.peta || S.hari[k].pack.pilgan)) {
                        pack = S.hari[k].pack.peta || S.hari[k].pack.pilgan;
                        hDenganSesi.pack = S.hari[k].pack;
                        if (!hDenganSesi.spin && S.hari[k].spin) hDenganSesi.spin = S.hari[k].spin;
                        break;
                    }
                }
            }
        }
        if (!pack && classId) {
            try {
                const docSnap = await getDoc(doc(db, "classes", classId));
                if (docSnap.exists() && docSnap.data().aiPaket) {
                    hDenganSesi.pack = docSnap.data().aiPaket;
                    if (!hDenganSesi.spin) hDenganSesi.spin = { judul: docSnap.data().namaKelas || 'Kelas', ts: Date.now() };
                    pack = hDenganSesi.pack.peta || hDenganSesi.pack.pilgan;
                    L.simpan(true);
                }
            } catch (e) { console.warn("Gagal memuat aiPaket:", e); }
        }
        if (pack) {
            window.P = pack;
            window.soal = window.normSoal(window.P.soal);
            window.totalWaktu = window.P.total || window.P.waktu || window.soal.reduce((a, b) => a + (b.waktu || 90), 0) || 450;
            if ($('hSub')) $('hSub').textContent = (hDenganSesi.spin && hDenganSesi.spin.judul) || 'Peta Argumen';
            window.sesi = hDenganSesi.sesi.peta;
            return Date.now() >= window.sesi.batas ? window.kumpulkan(true) : window.renderUjian();
        }
    }

    // 3. Tidak ada hasil/sesi — cari atau buat hari aktif
    let H = L.hari();
    if (!H) {
        const S = L.state();
        const k = 'c' + Date.now();
        S.hari[k] = { sesi: {}, hasil: {}, spin: { ts: Date.now(), judul: 'Memuat...' } };
        H = S.hari[k];
        L.simpan(true);
    }

    let pack = (H.pack && H.pack.peta) || (H.pack && H.pack.pilgan);
    if (!pack) {
        const S = L.state();
        if (S && S.hari) {
            for (const k in S.hari) {
                if (S.hari[k].pack && (S.hari[k].pack.peta || S.hari[k].pack.pilgan)) {
                    pack = S.hari[k].pack.peta || S.hari[k].pack.pilgan;
                    H.pack = S.hari[k].pack;
                    if (!H.spin && S.hari[k].spin) H.spin = S.hari[k].spin;
                    L.simpan(true);
                    break;
                }
            }
        }
    }

    if (!pack && classId) {
        try {
            const docSnap = await getDoc(doc(db, "classes", classId));
            if (docSnap.exists() && docSnap.data().aiPaket) {
                H.pack = docSnap.data().aiPaket;
                H.spin = { judul: docSnap.data().namaKelas || 'Kelas', ts: Date.now() };
                pack = H.pack.peta || H.pack.pilgan;
                L.simpan(true);
            }
        } catch(e) { console.error("Firebase error:", e); }
    }

    if (!H || !pack) {
        $('main').innerHTML = [
            '<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 mt-10">',
            '<i class="fas fa-exclamation-triangle text-4xl text-slate-300 mb-3"></i>',
            '<p class="text-sm font-bold text-slate-700">Latihan Belum Siap</p>',
            '<p class="text-[11px] text-slate-500 mt-1">Sistem belum menemukan paket latihan Peta Argumen di kelas ini.</p>',
            '<a href="' + backUrl + '" class="inline-block mt-4 bg-brand-green text-white text-xs font-bold px-5 py-2.5 rounded-full">Kembali</a>',
            '</div>'
        ].join('');
        if ($('hSub')) $('hSub').textContent = 'Belum Siap';
        return;
    }

    window.H = H;
    window.P = pack; 
    window.soal = window.normSoal(window.P.soal);
    window.totalWaktu = window.P.total || window.P.waktu || window.soal.reduce((a, b) => a + (b.waktu || 90), 0) || 450;
    if ($('hSub')) $('hSub').textContent = (H.spin && H.spin.judul) || 'Peta Argumen';
    
    window.tampilIntro();
}

window.mulai = async function() {
    if (!(await modal('Mulai sekarang?', 'Waktu langsung berjalan dan latihan ini tidak bisa diulang.', 'Mulai', 'Belum', 'fa-play'))) return;
    const t = Date.now();

    L.simpan(); 
    renderUjian(); 
    window.scrollTo({ top: 0 });
};

window.hitungJawab = function() { const n = Object.keys(window.sesi.jawab).length; $('barInfo').textContent = n + ' dari ' + window.soal.length + ' paragraf terlengkapi'; $('barJawab').style.width = (n / window.soal.length * 100) + '%'; }

window.jalankanWaktu = function() {
    const tot = window.sesi.batas - window.sesi.mulai; clearInterval(window.timer);
    const tik = () => { const sisa = Math.ceil((window.sesi.batas - Date.now()) / 1000); $('hTimerTxt').textContent = L.fmt(sisa); $('barWaktuIsi').style.width = Math.max(0, (window.sesi.batas - Date.now()) / tot * 100) + '%';
        const krit = sisa <= 60 || (window.sesi.batas - Date.now()) / tot < .1; $('hTimer').classList.toggle('waktu-kritis', krit); $('hTimer').classList.toggle('text-white', krit); $('hTimer').classList.toggle('text-brand-green', !krit); $('barWaktuIsi').className = 'h-full transition-all duration-500 ' + (krit ? 'bg-red-500' : 'bg-brand-green');
        if (sisa <= 0) kumpulkan(true); };
    tik(); window.timer = setInterval(tik, 400);
}

window.mintaKumpul = async function() {
    const sisa = window.soal.length - Object.keys(window.sesi.jawab).length;
    if (await modal('Kumpulkan jawaban?', sisa ? 'Masih ada ' + sisa + ' paragraf belum dijawab. Setelah dikumpulkan, jawaban tidak bisa diubah.' : 'Semua paragraf sudah dijawab. Setelah dikumpulkan, jawaban tidak bisa diubah.', 'Kumpulkan', 'Periksa Lagi', 'fa-paper-plane')) kumpulkan(false);
};

window.kumpulkan = async function(auto) { 
    if (window.H.hasil.peta) return; 
    window.aktif = false; clearInterval(window.timer); 
    const jawab = window.sesi.jawab; 
    let benar = 0;
    
    benar = window.soal.filter((s, i) => jawab[i] === s.j).length;
    let skor = Math.round(benar / window.soal.length * 100);
    
    const xp = Math.round(skor / 4) + (skor >= 80 ? 10 : 0); 
    window.L.tambahXp(xp); 
    
    window.H.hasil.peta = { skor: skor, benar: benar, total: window.soal.length, jawab: jawab, durasi: Math.round((Math.min(Date.now(), window.sesi.batas) - window.sesi.mulai) / 1000), batas: window.totalWaktu, selesai: Date.now(), auto: !!auto, keluar: window.sesi.keluar || 0, xp: xp }; 
    
    delete window.H.sesi.peta;
    L.simpan(); 
    
    if (studentId && classId) {
        try {
            await setDoc(doc(db, `classes/${classId}/students`, studentId), { latihan: { peta: window.H.hasil.peta } }, { merge: true });
        } catch(e) {}
    }

    $('hTimer').classList.add('hidden'); $('barWaktu').classList.add('hidden'); $('bar').classList.add('hidden'); 
    let backUrl = '../ruang_belajar_siswa.html';
    if(classId) backUrl += '?id=' + encodeURIComponent(classId);
    if(studentId) backUrl += '&sid=' + encodeURIComponent(studentId);
    $('btnBack').onclick = null; $('btnBack').href = backUrl; 

    if (auto) window.L.toast('Waktu habis. Jawabanmu otomatis dikumpulkan.', true); 
    window.tampilHasil(true); 
}

window.filterBahas = function(f) {
    const R = window.H.hasil.peta;
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const cnt = { semua: window.soal.length, salah: 0, benar: 0 };
    window.soal.forEach((s, i) => { const st = status(i); if (st === 'benar') cnt.benar++; else cnt.salah++; });

    $('filter').innerHTML = [['semua', 'Semua'], ['salah', 'Salah / Kosong'], ['benar', 'Benar']].map(x =>
        '<button onclick="filterBahas(\'' + x[0] + '\')" class="px-3 py-1.5 rounded-full text-[10px] font-bold border ' + (f === x[0] ? 'bg-brand-green text-white border-brand-green' : 'bg-white text-slate-500 border-slate-200') + '">' + x[1] + ' (' + cnt[x[0]] + ')</button>').join('');

    const arr = window.soal.map((s, i) => [s, i]).filter(x => {
        const st = status(x[1]);
        return f === 'semua' || (f === 'benar' ? st === 'benar' : st !== 'benar');
    });

    if (!arr.length) {
        $('bahas').innerHTML = '<div class="bg-white rounded-2xl p-6 text-center text-xs text-emerald-600 font-semibold border border-emerald-100"><i class="fas fa-circle-check mr-1"></i> Tidak ada soal pada kategori ini.</div>';
        return;
    }

    $('bahas').innerHTML = arr.map(x => {
        const s = x[0], i = x[1], u = R.jawab[i], st = status(i), ok = st === 'benar';
        const warna = ok ? 'emerald' : 'rose';
        const label = ok ? 'Benar' : st === 'kosong' ? 'Tidak dijawab' : 'Salah';
        const kunciJawabanText = s.opsi[s.j];
        const teksReview = esc(s.p).replace(/\[\.\.\.\.\.\.\.\]/g, '<span class="inline-block bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold underline">' + esc(kunciJawabanText) + '</span>');

        let item = '<article class="bg-white rounded-2xl border border-' + warna + '-200 p-4" style="border-left:5px solid ' + (ok ? '#10b981' : '#f43f5e') + '">';
        item += '<div class="flex items-center gap-2 mb-2.5"><span class="w-7 h-7 rounded-full ' + (ok ? 'bg-emerald-500' : 'bg-rose-500') + ' text-white text-xs font-extrabold flex items-center justify-center">' + (i + 1) + '</span>' + badge(s.tingkat) + '<span class="ml-auto text-[10px] font-extrabold uppercase tracking-wide px-2.5 py-1 rounded-full ' + (ok ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600') + '">' + label + '</span></div>';
        item += '<p class="font-reading text-[12.5px] text-slate-800 leading-[1.8] mb-3 p-3 bg-slate-50/60 rounded-xl border border-slate-100">' + teksReview + '</p><div class="space-y-1.5">';
        item += s.opsi.map((o, k) => {
            let tag = '';
            if (k === s.j && k === u) tag = '<span class="inline-block text-[8.5px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-emerald-500 text-white ml-1.5">Pilihanmu = Kunci</span>';
            else if (k === s.j) tag = '<span class="inline-block text-[8.5px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-emerald-500 text-white ml-1.5">Kunci</span>';
            else if (k === u) tag = '<span class="inline-block text-[8.5px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-rose-500 text-white ml-1.5">Pilihanmu</span>';
            return '<div class="opsi ' + (k === s.j ? 'benar' : k === u ? 'salah' : '') + ' !py-2"><span class="huruf">' + HURUF[k] + '</span><span class="text-[11.5px] text-slate-700 leading-snug pt-0.5 flex-1">' + esc(o) + tag + '</span></div>';
        }).join('');
        item += '</div>';
        item += '<div class="bahas-box mt-3 p-3"><p class="text-[10px] font-extrabold uppercase tracking-wider text-amber-600 mb-1"><i class="fas fa-lightbulb mr-1"></i>Pembahasan</p><p class="text-[11.5px] text-slate-700 leading-relaxed">' + (s.bahas ? esc(s.bahas) : '<span class="text-slate-400">Pembahasan belum tersedia untuk soal ini.</span>') + '</p></div>';
        item += '</article>';
        return item;
    }).join('');
};

/* ===== UNDUH PDF (pdfMake, teks asli) ===== */
function buatDokumenPdf() {
    const R = window.H.hasil.peta;
    const nama = L.nama(), materi = (window.H.spin && window.H.spin.judul) || '-';
    const W = { gelap: '#064e3b', hijau: '#059669', hijauMuda: '#d1fae5', merah: '#e11d48', merahMuda: '#ffe4e6', amber: '#d97706', amberMuda: '#fffbeb', abu: '#64748b', garis: '#e2e8f0', latar: '#f8fafc', biruMuda: '#e0f2fe', biru: '#0369a1' };
    const warnaSkor = R.skor >= 80 ? W.hijau : R.skor >= 60 ? '#f59e0b' : W.merah;
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const kosong = window.soal.filter((s, i) => R.jawab[i] === undefined).length;
    const salah = R.total - R.benar - kosong;

    const lbl = t => ({ text: t, fontSize: 7.5, bold: true, color: '#ffffff', fillColor: W.hijau, margin: [7, 5, 7, 5] });
    const val = t => ({ text: String(t), bold: true, fontSize: 10, color: W.gelap, fillColor: W.latar, margin: [7, 7, 7, 7] });
    const layoutKotak = { hLineWidth: () => 0.7, vLineWidth: () => 0.7, hLineColor: () => W.hijau, vLineColor: () => '#ffffff', paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 };
    const judulBagian = t => ({ stack: [{ text: t, bold: true, fontSize: 12, color: W.gelap }, { canvas: [{ type: 'line', x1: 0, y1: 3, x2: 523, y2: 3, lineWidth: 1.2, lineColor: W.hijau }] }], margin: [0, 16, 0, 8] });

    const content = [];

    // Banner
    content.push({
        table: { widths: ['*'], body: [[{ stack: [
            { text: 'LEMBAR HASIL LATIHAN', fontSize: 8.5, bold: true, color: '#a7f3d0', characterSpacing: 2 },
            { text: 'Peta Argumen', fontSize: 22, bold: true, color: '#ffffff', margin: [0, 3, 0, 2] },
            { text: 'Ruang Belajar Argumentasi', fontSize: 9.5, color: '#d1fae5' }
        ], fillColor: W.gelap, margin: [18, 16, 18, 16] }]] },
        layout: 'noBorders'
    });

    // Identitas
    content.push({ margin: [0, 12, 0, 0], table: { widths: ['*', '*', '*', '*'], body: [
        [lbl('NAMA SISWA'), lbl('JENIS TUGAS'), lbl('MATERI'), lbl('TANGGAL')],
        [val(nama), val('Peta Argumen'), val(materi), val(tglIndo(R.selesai))]
    ] }, layout: layoutKotak });

    // Skor
    const sel = (label, nilai, fill, warnaTeks, ukuran) => ({ fillColor: fill, margin: [7, 8, 7, 8], stack: [
        { text: label, fontSize: 7.5, bold: true, color: warnaTeks, characterSpacing: 0.5 },
        { text: String(nilai), fontSize: ukuran || 16, bold: true, color: warnaTeks, margin: [0, 2, 0, 0] }
    ] });
    content.push({ margin: [0, 8, 0, 0], table: { widths: ['*', '*', '*', '*', '*'], body: [[
        sel('SKOR AKHIR', R.skor + ' / 100', warnaSkor, '#ffffff', 18),
        sel('BENAR', R.benar, W.hijauMuda, W.gelap),
        sel('SALAH', salah, W.merahMuda, W.merah),
        sel('KOSONG', kosong, W.latar, W.abu),
        sel('XP DIPEROLEH', '+' + R.xp, W.amberMuda, W.amber)
    ]] }, layout: layoutKotak });

    content.push({ text: 'Durasi pengerjaan ' + L.fmt(R.durasi) + ' dari ' + L.fmt(R.batas) + (R.auto ? '  •  dikumpulkan otomatis (waktu habis)' : ''), fontSize: 8.5, color: W.abu, margin: [0, 6, 0, 0] });

    // Analisis per tingkat
    const tk = {}; window.soal.forEach((s, i) => { const t = tk[s.tingkat] = tk[s.tingkat] || { n: 0, b: 0 }; t.n++; if (R.jawab[i] === s.j) t.b++; });
    const urut = ['mudah', 'sedang', 'sulit', 'hots'].filter(t => tk[t]);
    const th = t => ({ text: t, bold: true, fontSize: 8.5, color: '#ffffff', fillColor: W.gelap, margin: [7, 5, 7, 5] });
    content.push(judulBagian('Analisis per Tingkat Kesulitan'));
    content.push({ table: { widths: [80, 60, '*'], body: [
        [th('Tingkat'), th('Benar / Total'), th('Persentase')],
        ...urut.map(t => {
            const p = Math.round(tk[t].b / tk[t].n * 100);
            return [
                { text: TKT[t][0], bold: true, fontSize: 9.5, color: TKT_HEX[t], margin: [7, 6, 7, 6] },
                { text: tk[t].b + ' / ' + tk[t].n, fontSize: 9.5, margin: [7, 6, 7, 6] },
                { margin: [7, 6, 7, 6], columns: [
                    { width: 110, canvas: [{ type: 'rect', x: 0, y: 3, w: 110, h: 7, r: 3, color: W.garis }, { type: 'rect', x: 0, y: 3, w: Math.max(0.1, 110 * p / 100), h: 7, r: 3, color: TKT_HEX[t] }] },
                    { text: p + '%', bold: true, fontSize: 9.5, margin: [6, 1, 0, 0] }
                ] }
            ];
        })
    ] }, layout: { hLineWidth: () => 0.6, vLineWidth: () => 0.6, hLineColor: () => W.garis, vLineColor: () => W.garis, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 } });

    // Soal, jawaban siswa, dan pembahasan
    content.push(judulBagian('Paragraf Rumpang, Jawaban & Pembahasan'));
    window.soal.forEach((s, i) => {
        const st = status(i), u = R.jawab[i];
        const c = st === 'benar' ? W.hijau : W.merah;
        const label = st === 'benar' ? 'BENAR' : st === 'kosong' ? 'TIDAK DIJAWAB' : 'SALAH';
        const tanpaPadding = { hLineWidth: () => 0, vLineWidth: () => 0, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 };

        const opsiRows = s.opsi.map((o, k) => {
            const kunci = k === s.j, pilih = k === u;
            const fill = kunci ? W.hijauMuda : (pilih ? W.merahMuda : '#ffffff');
            const fillHuruf = kunci ? W.hijau : (pilih ? W.merah : W.garis);
            const teks = [{ text: String(o), color: kunci ? W.gelap : '#334155', bold: kunci || pilih }];
            if (kunci && pilih) teks.push({ text: '   [PILIHAN SISWA = KUNCI]', fontSize: 7.5, bold: true, color: W.hijau });
            else if (kunci) teks.push({ text: '   [KUNCI]', fontSize: 7.5, bold: true, color: W.hijau });
            else if (pilih) teks.push({ text: '   [PILIHAN SISWA]', fontSize: 7.5, bold: true, color: W.merah });
            return [
                { text: HURUF[k] || String(k + 1), bold: true, alignment: 'center', color: (kunci || pilih) ? '#ffffff' : W.abu, fillColor: fillHuruf, margin: [0, 4, 0, 4] },
                { text: teks, fillColor: fill, margin: [8, 4, 8, 4], fontSize: 9.5 }
            ];
        });

        const teksJawab = u === undefined ? 'Tidak dijawab' : (HURUF[u] + '. ' + (s.opsi[u] ?? ''));
        const teksKunci = HURUF[s.j] + '. ' + (s.opsi[s.j] ?? '');

        content.push({
            margin: [0, 0, 0, 12],
            unbreakable: true,
            table: {
                dontBreakRows: true, widths: ['*'],
                body: [
                    [{ fillColor: c, margin: [10, 6, 10, 6], columns: [
                        { text: 'PARAGRAF ' + (i + 1) + '   |   ' + TKT[s.tingkat][0].toUpperCase(), bold: true, fontSize: 9, color: '#ffffff' },
                        { text: label, bold: true, fontSize: 9, color: '#ffffff', alignment: 'right' }
                    ] }],
                    [{ text: String(s.p), bold: true, fontSize: 10, lineHeight: 1.4, color: '#0f172a', fillColor: W.latar, margin: [10, 8, 10, 8] }],
                    [{ table: { widths: [20, '*'], body: opsiRows }, layout: tanpaPadding }],
                    [{ table: { widths: ['*', '*'], body: [[
                        { fillColor: W.biruMuda, margin: [10, 6, 10, 6], stack: [{ text: 'PILIHAN SISWA', fontSize: 7.5, bold: true, color: W.biru }, { text: teksJawab, fontSize: 9.5, bold: true, color: u === undefined ? W.abu : '#0f172a', margin: [0, 2, 0, 0] }] },
                        { fillColor: W.hijauMuda, margin: [10, 6, 10, 6], stack: [{ text: 'KUNCI KALIMAT ARGUMEN', fontSize: 7.5, bold: true, color: W.hijau }, { text: teksKunci, fontSize: 9.5, bold: true, color: W.gelap, margin: [0, 2, 0, 0] }] }
                    ]] }, layout: tanpaPadding }],
                    [{ fillColor: W.amberMuda, margin: [10, 7, 10, 8], stack: [
                        { text: 'PENJELASAN / PEMBAHASAN', fontSize: 7.5, bold: true, color: W.amber },
                        { text: s.bahas ? String(s.bahas) : 'Pembahasan belum tersedia untuk soal ini.', fontSize: 9.5, lineHeight: 1.35, color: s.bahas ? '#334155' : W.abu, margin: [0, 3, 0, 0] }
                    ] }]
                ]
            },
            layout: { hLineWidth: () => 0.8, vLineWidth: () => 0.8, hLineColor: () => c, vLineColor: () => c, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 }
        });
    });

    content.push({ text: 'Dokumen ini dibuat otomatis oleh Argumentasi App pada ' + tglIndo(Date.now()) + '.', fontSize: 8, color: W.abu, alignment: 'center', margin: [0, 8, 0, 0] });

    return {
        info: { title: 'Hasil Latihan Peta Argumen - ' + nama, author: 'Argumentasi App', subject: materi },
        pageSize: 'A4',
        pageMargins: [36, 36, 36, 46],
        defaultStyle: { fontSize: 10, lineHeight: 1.2, color: '#334155' },
        footer: (cur, total) => ({ columns: [
            { text: 'Argumentasi App  •  ' + nama + '  •  Peta Argumen', fontSize: 8, color: W.abu, margin: [36, 0, 0, 0] },
            { text: 'Halaman ' + cur + ' dari ' + total, fontSize: 8, color: W.abu, alignment: 'right', margin: [0, 0, 36, 0] }
        ], margin: [0, 18, 0, 0] }),
        content
    };
}

window.unduhPdf = function() {
    if (typeof pdfMake === 'undefined') { L.toast('Pustaka PDF belum termuat. Periksa koneksi lalu coba lagi.', true); return; }
    try {
        const R = window.H.hasil.peta;
        const d = new Date(R.selesai);
        const tgl = d.getFullYear() + '-' + L.pad(d.getMonth() + 1) + '-' + L.pad(d.getDate());
        const nama = ('Hasil-Peta-Argumen_' + L.nama() + '_' + tgl + '.pdf').replace(/[^\w\-.]+/g, '_');
        pdfMake.createPdf(buatDokumenPdf()).download(nama);
        L.toast('PDF sedang diunduh…');
    } catch (e) {
        console.error(e);
        L.toast('Gagal membuat PDF.', true);
    }
};

initLatihan().catch(err => {
    console.error("Gagal memuat latihan:", err);
    $('main').innerHTML = [
        '<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 mt-10">',
        '<i class="fas fa-circle-exclamation text-4xl text-rose-500 mb-3"></i>',
        '<p class="text-sm font-bold text-slate-800">Terjadi Kendala Memuat Halaman</p>',
        '<p class="text-[11px] text-slate-500 mt-1 mb-4">Gagal memuat data latihan. Silakan muat ulang atau kembali.</p>',
        '<div class="flex gap-2 justify-center">',
        '<button onclick="location.reload()" class="bg-brand-green text-white text-xs font-bold px-4 py-2 rounded-xl">Muat Ulang</button>',
        '<a href="' + urlKembali() + '" class="bg-slate-100 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl">Kembali</a>',
        '</div>',
        '</div>'
    ].join('');
    if ($('hSub')) $('hSub').textContent = 'Gagal Memuat';
});
