    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], reading: ['Merriweather', 'serif'] }, colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } } } } }</script>

    <script>
    /* ===== PUSTAKA LATIHAN (LocalStorage + IndexedDB) ===== */
    (function () {
        const qCore = new URLSearchParams(window.location.search);
        const cId = qCore.get('id') || 'umum';
        const LS = 'lat_v1_' + cId, DBN = 'latihan-db-' + cId;

        let S = null, siapP = null;
        const pad = n => String(n).padStart(2, '0');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
        const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
        const idbOpen = () => new Promise((ok, no) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
        const idbGet = async () => { try { const d = await idbOpen(); return await new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } };
        const idbSet = async v => { try { const d = await idbOpen(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'state'); t.oncomplete = ok; t.onerror = ok; t.onabort = ok; }); } catch (e) {} };

        const L = {
            esc, today, pad,
            siap() { return siapP || (siapP = (async () => {
                const a = lsRead(), b = await idbGet();
                S = [a, b].filter(x => x && x.hari).sort((x, y) => (y.u || 0) - (x.u || 0))[0] || { v: 1, id: uuid(), u: Date.now(), hari: {} };
                L.simpan(true); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
                return S; })()); },
            state: () => S,
            simpan(tetap) {
                if (!tetap) S.u = Date.now();
                const ks = Object.keys(S.hari).sort(); while (ks.length > 45) delete S.hari[ks.shift()];
                try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
                idbSet(JSON.parse(JSON.stringify(S)));
            },
            aktif() { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.spin && now < h.spin.ts + 864e5 && (!best || h.spin.ts > S.hari[best].spin.ts)) best = k; } return best; },
            hari(kunci) { if (kunci === undefined || kunci === null) { const a = L.aktif(); return a ? S.hari[a] : null; } return S.hari[kunci] || null; },
            nama: () => localStorage.getItem('namaSiswaCendekia') || 'Siswa',
            xp: () => (parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + parseInt(localStorage.getItem('kelasPointsArg') || '0')),
            tambahXp(n) { localStorage.setItem('latihanPointsCendekia', String(parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + n)); },
            fmt(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); },
            menit: s => Math.max(1, Math.round(s / 60)),
            // Nada singkat saat hasil keluar (sebelumnya fungsi ini belum ada sehingga pembahasan bisa gagal tampil)
            beep(t) {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
                    const c = new AC(), seq = t === 'ok' ? [523, 659, 784] : [330, 262];
                    seq.forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.value = .07; o.connect(g); g.connect(c.destination); o.start(c.currentTime + i * .14); o.stop(c.currentTime + i * .14 + .12); });
                    setTimeout(() => { try { c.close(); } catch (e) {} }, 900);
                } catch (e) {}
            },
            toast(msg, err) {
                let c = document.getElementById('lToast');
                if (!c) { c = document.createElement('div'); c.id = 'lToast'; c.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100000] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none'; document.body.appendChild(c); }
                const t = document.createElement('div'); t.className = (err ? 'bg-red-500' : 'bg-slate-800') + ' text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2';
                t.innerHTML = '<i class="fas ' + (err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400') + '"></i><span class="flex-1">' + esc(msg) + '</span>'; c.appendChild(t); setTimeout(() => t.remove(), 3200);
            }
        };
        window.L = L;
    })();
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background: #e2e8f0; -webkit-tap-highlight-color: transparent; }

        /* Kepala lembar kerja bergaya kertas bergaris */
        .kertas-head { background: #fffdf8; background-image: repeating-linear-gradient(transparent 0 27px, rgba(148,163,184,.2) 27px 28px); border-left: 3px solid #fca5a5; }

        /* Kartu soal */
        .q-card { background: #fff; border: 1px solid #e2e8f0; border-left: 5px solid var(--c, #0ea5e9); border-radius: 16px; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
        .q-no { width: 2rem; height: 2rem; border-radius: 9999px; background: var(--c, #0ea5e9); color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* Pilihan jawaban (tanpa animasi masuk, langsung kokoh) */
        .opsi { display: flex; gap: .7rem; align-items: flex-start; width: 100%; text-align: left; padding: .7rem .8rem; border: 2px solid #e2e8f0; border-radius: .9rem; background: #fff; transition: background-color .12s, border-color .12s; position: relative; }
        .opsi:active { background: #f8fafc; }
        .opsi .huruf { width: 1.7rem; height: 1.7rem; flex-shrink: 0; border-radius: 9999px; background: #f1f5f9; color: #64748b; font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .opsi .cek { display: none; margin-left: auto; color: #059669; font-size: 14px; padding-top: 4px; }
        .opsi.sel { border-color: #059669; background: #ecfdf5; }
        .opsi.sel .huruf { background: #059669; color: #fff; }
        .opsi.sel .cek { display: block; }
        .opsi.benar { border-color: #10b981; background: #ecfdf5; } .opsi.benar .huruf { background: #10b981; color: #fff; }
        .opsi.salah { border-color: #fb7185; background: #fff1f2; } .opsi.salah .huruf { background: #fb7185; color: #fff; }
        .tag { display: inline-block; font-size: 8.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 9999px; margin-left: 6px; vertical-align: middle; }
        .tag-benar { background: #10b981; color: #fff; } .tag-salah { background: #fb7185; color: #fff; }

        /* Tombol ragu-ragu */
        .flag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 9999px; border: 1.5px solid #e2e8f0; color: #94a3b8; background: #fff; }
        .flag.on { border-color: #f59e0b; background: #fffbeb; color: #b45309; }

        /* Navigator soal */
        .nav-n { position: relative; height: 2.6rem; border-radius: .8rem; border: 2px solid #e2e8f0; background: #fff; font-weight: 800; font-size: 13px; color: #64748b; }
        .nav-n.nav-a { background: #059669; border-color: #059669; color: #fff; }
        .nav-n.nav-r { border-color: #f59e0b; }
        .nav-n i { position: absolute; top: -6px; right: -4px; font-size: 10px; color: #f59e0b; background: #fff; border-radius: 9999px; padding: 2px; }

        .waktu-kritis { animation: dk 1s infinite; } @keyframes dk { 50% { background: #dc2626; } }

        .bahas-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: .8rem; }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-100 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-300">
    <header class="sticky top-0 z-50 bg-brand-green h-14 px-4 flex items-center gap-3 shadow-md">
        <a id="btnBack" href="#" aria-label="Kembali" class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition"><i class="fas fa-chevron-left"></i></a>
        <div class="flex-1 min-w-0"><h1 class="text-white font-bold text-sm leading-tight truncate">Uji Berpikir</h1><p id="hSub" class="text-white/70 text-[10px] leading-tight truncate">Memuat…</p></div>
        <span id="hTimer" class="hidden shrink-0 bg-white text-brand-green px-3 py-1 rounded-full text-xs font-extrabold tabular-nums"><i class="far fa-clock mr-1"></i><span id="hTimerTxt">00:00</span></span>
    </header>
    <div id="barWaktu" class="hidden sticky top-14 z-40 h-1.5 bg-slate-300"><div id="barWaktuIsi" class="h-full bg-brand-green transition-all duration-500" style="width:100%"></div></div>

    <main id="main" class="flex-grow px-3 py-4"><div class="text-center py-16 text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl"></i></div></main>

        <button onclick="mintaKumpul()" class="shrink-0 bg-brand-green text-white font-bold px-4 py-3 rounded-xl text-xs shadow-md active:scale-95 transition"><i class="fas fa-paper-plane mr-1.5"></i>Kumpulkan</button>

<!-- NAVIGATOR SOAL -->
<div id="sheet" class="fixed inset-0 bg-slate-900/60 z-[99998] hidden items-end sm:items-center justify-center" onclick="if(event.target===this) tutupNav()">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5">
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-slate-800 text-sm"><i class="fas fa-table-cells-large text-brand-green mr-1.5"></i>Daftar Soal</h3>
            <button onclick="tutupNav()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Tutup"><i class="fas fa-xmark"></i></button>
        </div>

            <span><i class="fas fa-square text-brand-green mr-1"></i>Terjawab</span>
            <span><i class="far fa-square text-slate-400 mr-1"></i>Belum dijawab</span>
            <span><i class="fas fa-flag text-amber-500 mr-1"></i>Ragu-ragu</span>
        </div>
        <div id="navGrid" class="grid grid-cols-5 gap-2.5 max-h-[50vh] overflow-y-auto p-1"></div>

<!-- MODAL KONFIRMASI -->
<div id="modal" class="fixed inset-0 bg-slate-900/60 z-[99999] hidden items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5">
        <div id="mIkon" class="w-12 h-12 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-xl mx-auto mb-3"></div>
        <h3 id="mJudul" class="font-bold text-slate-800 text-center text-sm"></h3><p id="mKet" class="text-[11px] text-slate-500 text-center mt-1.5 leading-relaxed"></p>
        <div class="grid grid-cols-2 gap-2 mt-5"><button onclick="jawabModal(false)" id="mBatal" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">Batal</button><button onclick="jawabModal(true)" id="mOk" class="py-3 rounded-xl bg-brand-green text-white font-bold text-xs">Lanjutkan</button></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({ apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" });
const db = getFirestore(app);
window.db = db;

const $ = id => document.getElementById(id), esc = window.L.esc;
const HURUF = ['A', 'B', 'C', 'D', 'E'];
const TKT = { mudah: ['Mudah', 'emerald', 'fa-seedling'], sedang: ['Sedang', 'sky', 'fa-gauge'], sulit: ['Sulit', 'amber', 'fa-mountain'], hots: ['HOTS', 'rose', 'fa-fire'] };
const TKT_HEX = { mudah: '#10b981', sedang: '#0ea5e9', sulit: '#f59e0b', hots: '#f43f5e' };
const NAV_BAGIAN = [
    ['pilgan', 'Pilihan Ganda', 'pilgan.html', 'fa-circle-check', 'blue'],
    ['struktur', 'Bedah Struktur', 'struktur.html', 'fa-layer-group', 'amber'],
    ['esai', 'Esai Argumentasi', 'esai.html', 'fa-pen-nib', 'emerald'],
    ['kritis', 'Uji Berpikir', 'kritis.html', 'fa-brain', 'rose'],
    ['peta', 'Peta Argumen', 'peta_argumen.html', 'fa-map-signs', 'indigo'],
    ['ilmiah', 'Kata Ilmiah', 'kata_ilmiah.html', 'fa-flask', 'teal']
];

window.H = null; window.P = null; window.soal = null; window.totalWaktu = 0; window.sesi = null; window.timer = null; window.aktif = false; window.resolveM = null;

const qsParams = new URLSearchParams(window.location.search);
const classId = qsParams.get('id') || '';
const studentId = qsParams.get('sid') || localStorage.getItem('studentId') || localStorage.getItem('siswa_' + classId) || '';

function urlKembali() {
    let u = '../ruang_belajar_siswa.html';
    const qs = new URLSearchParams();
    if (classId) qs.set('id', classId);
    if (studentId) qs.set('sid', studentId);
    return u + (qs.toString() ? '?' + qs.toString() : '');
}

window.normSoal = function(arr) {
    return (arr || []).map(s => {
        const tk = String(s.tingkat || 'sedang').toLowerCase();
        return {
            p: s.p ?? s.pertanyaan ?? s.pernyataan ?? 'Soal',
            kasus: s.tesis ?? s.klaim ?? s.konteks ?? s.kutipan ?? s.wacana ?? s.kasus ?? '',
            aspek: s.aspek ?? s.fokus ?? '',
            opsi: Array.isArray(s.opsi) ? s.opsi : (Array.isArray(s.pilihan) ? s.pilihan : []),
            j: typeof s.j === 'number' ? s.j : (HURUF.indexOf(String(s.j ?? '').trim().toUpperCase()) >= 0 ? HURUF.indexOf(String(s.j ?? '').trim().toUpperCase()) : (parseInt(s.j) || 0)),
            tingkat: TKT[tk] ? tk : 'sedang',
            waktu: s.waktu || 60,
            bahas: s.bahas ?? s.pembahasan ?? ''
        };
    });
};

window.modal = (judul, ket, ok, batal, ikon) => new Promise(r => { window.resolveM = r; $('mJudul').textContent = judul; $('mKet').textContent = ket; $('mOk').textContent = ok || 'Lanjutkan'; $('mBatal').textContent = batal || 'Batal'; $('mIkon').innerHTML = '<i class="fas ' + (ikon || 'fa-triangle-exclamation') + '"></i>'; $('modal').classList.replace('hidden', 'flex'); });
window.jawabModal = v => { $('modal').classList.replace('flex', 'hidden'); if (window.resolveM) { window.resolveM(v); window.resolveM = null; } };
window.badge = t => { const arr = TKT[t] || TKT.sedang; return '<span class="inline-flex items-center gap-1 text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-' + arr[1] + '-100 text-' + arr[1] + '-700"><i class="fas ' + arr[2] + '"></i>' + arr[0] + '</span>'; };

/* ===== KIRIM HASIL KE SERVER (tidak menahan tampilan hasil) ===== */
async function kirimServer() {
    const R = window.H && window.H.hasil && window.H.hasil.kritis;
    if (!R || R.sync || !studentId || !classId) return;
    try {
        await setDoc(doc(db, `classes/${classId}/students`, studentId), { latihan: { kritis: R } }, { merge: true });
        R.sync = true; L.simpan(true);
    } catch (e) {
        console.warn('Gagal menyimpan hasil ke server (akan dicoba lagi saat halaman dibuka):', e);
    }
}

/* ===== INISIALISASI ===== */
async function initLatihan() {
    await L.siap();

    const backUrl = urlKembali();
    $('btnBack').href = backUrl;

    let H = L.hari();
    if (!H) {
        const S = L.state();
        const k = 'c' + Date.now();
        S.hari[k] = { sesi: {}, hasil: {}, spin: { ts: Date.now(), judul: 'Memuat...' } };
        H = S.hari[k];
        L.simpan(true);
    }

    if (!H.pack || !H.pack.kritis) {
        try {
            const docSnap = await getDoc(doc(db, "classes", classId));
            if (docSnap.exists() && docSnap.data().aiPaket) {
                H.pack = docSnap.data().aiPaket;
                H.spin = { judul: docSnap.data().namaKelas, ts: Date.now() };
                L.simpan(true);
            }
        } catch (e) { console.error("Firebase error:", e); }
    }

    if (!H || !H.pack || !H.pack.kritis) {
        $('main').innerHTML = [
            '<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 mt-10">',
            '<i class="fas fa-exclamation-triangle text-4xl text-slate-300 mb-3"></i>',
            '<p class="text-sm font-bold text-slate-700">Latihan Belum Siap</p>',
            '<p class="text-[11px] text-slate-500 mt-1">Sistem belum menemukan paket latihan di kelas ini.</p>',
            '<a href="' + backUrl + '" class="inline-block mt-4 bg-brand-green text-white text-xs font-bold px-5 py-2.5 rounded-full">Kembali</a>',
            '</div>'
        ].join('');
        return;
    }

    window.H = H;
    window.P = H.pack.kritis;
    window.soal = window.normSoal(window.P.soal);
    window.totalWaktu = window.P.total || window.P.waktu || window.soal.reduce((a, b) => a + (b.waktu || 60), 0) || 300;
    if ($('hSub')) $('hSub').textContent = (H.spin && H.spin.judul) || 'Uji Berpikir';

    if (H.hasil && H.hasil.kritis) return window.tampilHasil();
    if (H.sesi && H.sesi.kritis) {
        window.sesi = H.sesi.kritis;
        return Date.now() >= window.sesi.batas ? window.kumpulkan(true) : window.renderUjian();
    }
    window.tampilIntro();
}

/* ===== INTRO ===== */
window.tampilIntro = function() {
    const hit = {}; window.soal.forEach(s => hit[s.tingkat] = (hit[s.tingkat] || 0) + 1);
    const tkBadge = ['mudah', 'sedang', 'sulit', 'hots'].filter(t => hit[t]).map(t => '<span class="flex items-center gap-1.5">' + badge(t) + '<b class="text-[11px] text-slate-600">×' + hit[t] + '</b></span>').join('');

    $('main').innerHTML = [
        '<div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mt-2">',
        '<div class="px-5 py-6 text-center text-white" style="background:linear-gradient(135deg,#064e3b,#059669 65%,#34d399)">',
        '<div class="w-16 h-16 rounded-2xl bg-white/15 border border-white/25 flex items-center justify-center text-3xl mx-auto"><i class="fas fa-brain"></i></div>',
        '<p class="text-[10px] font-bold tracking-[.25em] text-white/70 mt-3">LEMBAR KERJA</p>',
        '<h2 class="font-extrabold text-lg leading-tight mt-0.5">Uji Berpikir</h2>',
        '<p class="text-[11px] text-white/80 mt-1.5 leading-relaxed">Materi: <b>' + esc(window.H.spin.judul) + '</b></p>',
        '</div>',
        '<div class="p-5">',
        '<div class="grid grid-cols-3 gap-2.5">',
        '<div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-xl font-extrabold text-slate-800">' + window.soal.length + '</p><p class="text-[10px] text-slate-500 font-semibold">Soal</p></div>',
        '<div class="bg-slate-50 rounded-xl p-3 text-center"><p class="text-xl font-extrabold text-slate-800">' + L.menit(window.totalWaktu) + '</p><p class="text-[10px] text-slate-500 font-semibold">Menit</p></div>',

window.mulai = async function() {
    if (!(await modal('Mulai sekarang?', 'Waktu langsung berjalan dan latihan ini tidak bisa diulang.', 'Mulai', 'Belum', 'fa-play'))) return;
    const t = Date.now();
    window.H.sesi.kritis = window.sesi = { mulai: t, batas: t + window.totalWaktu * 1000, jawab: {}, ragu: {}, keluar: 0 };

    renderUjian();
    window.scrollTo({ top: 0 });
};

/* ===== LEMBAR KERJA ===== */
window.renderUjian = function() {
    window.aktif = true;
    window.sesi.ragu = window.sesi.ragu || {};
    $('hTimer').classList.remove('hidden'); $('barWaktu').classList.remove('hidden'); $('bar').classList.remove('hidden');
    $('btnBack').onclick = e => { e.preventDefault(); L.toast('Ujian sedang berjalan. Selesaikan atau kumpulkan dulu.', true); };

    const html = [
        '<div class="rounded-2xl overflow-hidden border border-slate-200 bg-white shadow-sm">',
        '<div class="px-4 py-3 text-white" style="background:linear-gradient(135deg,#064e3b,#059669)">',
        '<p class="text-[9px] font-extrabold tracking-[.3em] text-white/70">LEMBAR KERJA SISWA</p>',
        '<h2 class="font-reading font-bold text-base leading-tight mt-0.5">Uji Berpikir</h2></div>',
        '<div class="kertas-head px-4 py-3 text-[11px] text-slate-600 space-y-1.5">',
        '<p class="flex"><b class="w-20 shrink-0 text-slate-700">Nama</b><span class="mr-1">:</span><span class="font-semibold text-slate-800 break-words min-w-0">' + esc(L.nama()) + '</span></p>',
        '<p class="flex"><b class="w-20 shrink-0 text-slate-700">Materi</b><span class="mr-1">:</span><span class="break-words min-w-0">' + esc(window.H.spin.judul) + '</span></p>',
        '<p class="flex"><b class="w-20 shrink-0 text-slate-700">Jumlah soal</b><span class="mr-1">:</span><span>' + window.soal.length + ' butir</span></p>',
        '<p class="flex"><b class="w-20 shrink-0 text-slate-700">Petunjuk</b><span class="mr-1">:</span><span>Analisis penalaran dan pilih satu jawaban paling tepat.</span></p>',
        '</div></div>',
        '<div id="daftar" class="space-y-4 mt-4">'
    ];

    window.soal.forEach((s, i) => {
        const ragu = window.sesi.ragu[i] ? ' on' : '';
        html.push('<article id="q' + i + '" class="q-card scroll-mt-24 p-4" style="--c:' + TKT_HEX[s.tingkat] + '">');
        html.push('<div class="flex items-center gap-2 mb-3"><span class="q-no">' + (i + 1) + '</span>' + badge(s.tingkat) + (s.aspek ? '<span class="text-[9px] font-bold bg-rose-50 text-rose-600 px-2 py-0.5 rounded-full">' + esc(s.aspek) + '</span>' : '') + '<button class="flag ml-auto' + ragu + '" data-flag="' + i + '"><i class="fas fa-flag"></i><span>Ragu</span></button></div>');
        if (s.kasus && s.kasus !== s.p) html.push('<div class="mb-3 bg-rose-50/70 border-l-4 border-rose-400 p-3 rounded-r-xl font-reading text-[12.5px] text-slate-700 leading-[1.8]">' + esc(s.kasus) + '</div>');
        html.push('<p class="font-reading text-[13.5px] text-slate-800 leading-[1.85] mb-3.5">' + esc(s.p) + '</p>');
        html.push('<div class="space-y-2">');
        s.opsi.forEach((o, k) => {
            const sel = window.sesi.jawab[i] === k ? ' sel' : '';
            html.push('<button class="opsi' + sel + '" data-i="' + i + '" data-k="' + k + '"><span class="huruf">' + HURUF[k] + '</span><span class="text-[12.5px] text-slate-700 leading-snug pt-0.5 flex-1">' + esc(o) + '</span><i class="fas fa-circle-check cek"></i></button>');
        });
        html.push('</div></article>');
    });

    html.push('</div><div class="h-6"></div>');
    $('main').innerHTML = html.join('');

    $('daftar').addEventListener('click', e => {
        if (!window.aktif) return;
        const fl = e.target.closest('.flag');
        if (fl) {
            const i = +fl.dataset.flag;
            if (window.sesi.ragu[i]) delete window.sesi.ragu[i]; else window.sesi.ragu[i] = 1;
            fl.classList.toggle('on', !!window.sesi.ragu[i]);
            L.simpan(); hitungJawab();
            return;
        }
        const b = e.target.closest('.opsi'); if (!b) return;
        const i = +b.dataset.i, k = +b.dataset.k;
        const sudah = b.classList.contains('sel');
        b.parentElement.querySelectorAll('.opsi').forEach(x => x.classList.remove('sel'));
        if (sudah) { delete window.sesi.jawab[i]; }       // ketuk lagi untuk membatalkan pilihan
        else { window.sesi.jawab[i] = k; b.classList.add('sel'); if (navigator.vibrate) navigator.vibrate(8); }
        L.simpan();
        hitungJawab();
    });

    $('navGrid').onclick = e => {
        const b = e.target.closest('[data-go]'); if (!b) return;
        tutupNav();
        const el = $('q' + b.dataset.go);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    hitungJawab(); jalankanWaktu();
};

window.hitungJawab = function() {
    const n = Object.keys(window.sesi.jawab).length;
    $('barInfo').textContent = n + ' dari ' + window.soal.length + ' soal terjawab';
    $('barJawab').style.width = (n / window.soal.length * 100) + '%';
    const r = Object.keys(window.sesi.ragu || {}).length, br = $('barRagu');
    br.textContent = r; br.classList.toggle('hidden', r === 0);
};

window.bukaNav = function() {
    let h = '';
    window.soal.forEach((s, i) => {
        const a = window.sesi.jawab[i] !== undefined, r = !!(window.sesi.ragu && window.sesi.ragu[i]);
        h += '<button data-go="' + i + '" class="nav-n' + (a ? ' nav-a' : '') + (r ? ' nav-r' : '') + '">' + (i + 1) + (r ? '<i class="fas fa-flag"></i>' : '') + '</button>';
    });
    $('navGrid').innerHTML = h;
    $('sheet').classList.replace('hidden', 'flex');
};
window.tutupNav = function() { $('sheet').classList.replace('flex', 'hidden'); };

window.jalankanWaktu = function() {
    const tot = window.sesi.batas - window.sesi.mulai; clearInterval(window.timer);
    const tik = () => {
        const sisa = Math.ceil((window.sesi.batas - Date.now()) / 1000);
        $('hTimerTxt').textContent = L.fmt(sisa);
        $('barWaktuIsi').style.width = Math.max(0, (window.sesi.batas - Date.now()) / tot * 100) + '%';
        const krit = sisa <= 60 || (window.sesi.batas - Date.now()) / tot < .1;
        $('hTimer').classList.toggle('waktu-kritis', krit); $('hTimer').classList.toggle('text-white', krit); $('hTimer').classList.toggle('text-brand-green', !krit);
        $('barWaktuIsi').className = 'h-full transition-all duration-500 ' + (krit ? 'bg-red-500' : 'bg-brand-green');
        if (sisa <= 0) kumpulkan(true);
    };
    tik(); window.timer = setInterval(tik, 400);
};

window.addEventListener('beforeunload', e => { if (window.aktif) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (window.aktif && document.hidden && window.sesi) { window.sesi.keluar = (window.sesi.keluar || 0) + 1; L.simpan(); } });

window.mintaKumpul = async function() {
    const sisa = window.soal.length - Object.keys(window.sesi.jawab).length;
    const ragu = Object.keys(window.sesi.ragu || {}).length;
    let ket = sisa ? 'Masih ada ' + sisa + ' soal belum dijawab. ' : 'Semua soal sudah dijawab. ';
    if (ragu) ket += 'Ada ' + ragu + ' soal yang kamu tandai ragu-ragu. ';
    ket += 'Setelah dikumpulkan, jawaban tidak bisa diubah.';
    if (await modal('Kumpulkan jawaban?', ket, 'Kumpulkan', 'Periksa Lagi', 'fa-paper-plane')) kumpulkan(false);
};

window.kumpulkan = async function(auto) {
    if (window.H.hasil.kritis) return;
    window.aktif = false; clearInterval(window.timer); tutupNav();
    const jawab = window.sesi.jawab;

    const benar = window.soal.filter((s, i) => jawab[i] === s.j).length;
    const skor = Math.round(benar / window.soal.length * 100);
    const xp = Math.round(skor / 4) + (skor >= 80 ? 10 : 0);
    window.L.tambahXp(xp);

    window.H.hasil.kritis = { skor: skor, benar: benar, total: window.soal.length, jawab: jawab, durasi: Math.round((Math.min(Date.now(), window.sesi.batas) - window.sesi.mulai) / 1000), batas: window.totalWaktu, selesai: Date.now(), auto: !!auto, keluar: window.sesi.keluar || 0, xp: xp };

    delete window.H.sesi.kritis;
    L.simpan();

    $('btnBack').onclick = null; $('btnBack').href = urlKembali();

    if (auto) window.L.toast('Waktu habis. Jawabanmu otomatis dikumpulkan.', true);
    window.tampilHasil(true);
};

window.filterBahas = function(f) {
    const R = window.H.hasil.kritis;
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const cnt = { semua: window.soal.length, salah: 0, benar: 0 };
    window.soal.forEach((s, i) => { const st = status(i); if (st === 'benar') cnt.benar++; else cnt.salah++; });

    $('filter').innerHTML = [['semua', 'Semua'], ['salah', 'Salah / Kosong'], ['benar', 'Benar']].map(x =>
        '<button onclick="filterBahas(\'' + x[0] + '\')" class="px-3 py-1.5 rounded-full text-[10px] font-bold border ' + (f === x[0] ? 'bg-brand-green text-white border-brand-green' : 'bg-white text-slate-500 border-slate-200') + '">' + x[1] + ' (' + cnt[x[0]] + ')</button>').join('');

    const arr = window.soal.map((s, i) => [s, i]).filter(x => {
        const st = status(x[1]);
        return f === 'semua' || (f === 'benar' ? st === 'benar' : st !== 'benar');
    });

    if (!arr.length) {
        $('bahas').innerHTML = '<div class="bg-white rounded-2xl p-6 text-center text-xs text-emerald-600 font-semibold border border-emerald-100"><i class="fas fa-circle-check mr-1"></i> Tidak ada soal pada kategori ini.</div>';
        return;
    }

    $('bahas').innerHTML = arr.map(x => {
        const s = x[0], i = x[1], u = R.jawab[i], st = status(i), ok = st === 'benar';
        const warna = ok ? 'emerald' : 'rose';
        const label = ok ? 'Benar' : st === 'kosong' ? 'Tidak dijawab' : 'Salah';
        let item = '<article class="bg-white rounded-2xl border border-' + warna + '-200 p-4" style="border-left:5px solid ' + (ok ? '#10b981' : '#f43f5e') + '">';
        item += '<div class="flex items-center gap-2 mb-2.5"><span class="w-7 h-7 rounded-full ' + (ok ? 'bg-emerald-500' : 'bg-rose-500') + ' text-white text-xs font-extrabold flex items-center justify-center">' + (i + 1) + '</span>' + badge(s.tingkat) + (s.aspek ? '<span class="text-[9px] font-bold bg-rose-50 text-rose-600 px-2 py-0.5 rounded-full">' + esc(s.aspek) + '</span>' : '') + '<span class="ml-auto text-[10px] font-extrabold uppercase tracking-wide px-2.5 py-1 rounded-full ' + (ok ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600') + '">' + label + '</span></div>';
        if (s.kasus && s.kasus !== s.p) item += '<div class="mb-2.5 bg-rose-50/70 border-l-4 border-rose-400 p-2.5 rounded-r-lg font-reading text-[11.5px] text-slate-600 leading-relaxed">' + esc(s.kasus) + '</div>';
        item += '<p class="font-reading text-[12.5px] text-slate-800 leading-[1.8] mb-3">' + esc(s.p) + '</p><div class="space-y-1.5">';
        item += s.opsi.map((o, k) => {
            let tag = '';
            if (k === s.j && k === u) tag = '<span class="tag tag-benar">Jawabanmu = Kunci</span>';
            else if (k === s.j) tag = '<span class="tag tag-benar">Kunci</span>';
            else if (k === u) tag = '<span class="tag tag-salah">Jawabanmu</span>';
            return '<div class="opsi ' + (k === s.j ? 'benar' : k === u ? 'salah' : '') + ' !py-2"><span class="huruf">' + HURUF[k] + '</span><span class="text-[11.5px] text-slate-700 leading-snug pt-0.5 flex-1">' + esc(o) + tag + '</span></div>';
        }).join('');
        item += '</div>';
        item += '<div class="bahas-box mt-3 p-3"><p class="text-[10px] font-extrabold uppercase tracking-wider text-amber-600 mb-1"><i class="fas fa-lightbulb mr-1"></i>Pembahasan</p><p class="text-[11.5px] text-slate-700 leading-relaxed">' + (s.bahas ? esc(s.bahas) : '<span class="text-slate-400">Pembahasan belum tersedia untuk soal ini.</span>') + '</p></div>';
        item += '</article>';
        return item;
    }).join('');
};

/* ===== UNDUH PDF (pdfMake, teks asli, bukan gambar) ===== */
function buatDokumenPdf() {
    const R = window.H.hasil.kritis;
    const nama = L.nama(), materi = (window.H.spin && window.H.spin.judul) || '-';
    const W = { gelap: '#064e3b', hijau: '#059669', hijauMuda: '#d1fae5', merah: '#e11d48', merahMuda: '#ffe4e6', amber: '#d97706', amberMuda: '#fffbeb', abu: '#64748b', garis: '#e2e8f0', latar: '#f8fafc', biruMuda: '#e0f2fe', biru: '#0369a1' };
    const warnaSkor = R.skor >= 80 ? W.hijau : R.skor >= 60 ? '#f59e0b' : W.merah;
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const kosong = window.soal.filter((s, i) => R.jawab[i] === undefined).length;
    const salah = R.total - R.benar - kosong;

    const lbl = t => ({ text: t, fontSize: 7.5, bold: true, color: '#ffffff', fillColor: W.hijau, margin: [7, 5, 7, 5] });
    const val = t => ({ text: String(t), bold: true, fontSize: 10, color: W.gelap, fillColor: W.latar, margin: [7, 7, 7, 7] });
    const layoutKotak = { hLineWidth: () => 0.7, vLineWidth: () => 0.7, hLineColor: () => W.hijau, vLineColor: () => '#ffffff', paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 };
    const judulBagian = t => ({ stack: [{ text: t, bold: true, fontSize: 12, color: W.gelap }, { canvas: [{ type: 'line', x1: 0, y1: 3, x2: 523, y2: 3, lineWidth: 1.2, lineColor: W.hijau }] }], margin: [0, 16, 0, 8] });

    const content = [];

    // Banner
    content.push({
        table: { widths: ['*'], body: [[{ stack: [
            { text: 'LEMBAR HASIL LATIHAN', fontSize: 8.5, bold: true, color: '#a7f3d0', characterSpacing: 2 },
            { text: 'Uji Berpikir', fontSize: 22, bold: true, color: '#ffffff', margin: [0, 3, 0, 2] },
            { text: 'Ruang Belajar Argumentasi', fontSize: 9.5, color: '#d1fae5' }
        ], fillColor: W.gelap, margin: [18, 16, 18, 16] }]] },
        layout: 'noBorders'
    });

    // Identitas (kolom: nama, jenis tugas, materi, tanggal)
    content.push({ margin: [0, 12, 0, 0], table: { widths: ['*', '*', '*', '*'], body: [
        [lbl('NAMA SISWA'), lbl('JENIS TUGAS'), lbl('MATERI'), lbl('TANGGAL')],
        [val(nama), val('Uji Berpikir'), val(materi), val(tglIndo(R.selesai))]
    ] }, layout: layoutKotak });

    // Skor
    const sel = (label, nilai, fill, warnaTeks, ukuran) => ({ fillColor: fill, margin: [7, 8, 7, 8], stack: [
        { text: label, fontSize: 7.5, bold: true, color: warnaTeks, characterSpacing: 0.5 },
        { text: String(nilai), fontSize: ukuran || 16, bold: true, color: warnaTeks, margin: [0, 2, 0, 0] }
    ] });
    content.push({ margin: [0, 8, 0, 0], table: { widths: ['*', '*', '*', '*', '*'], body: [[
        sel('SKOR AKHIR', R.skor + ' / 100', warnaSkor, '#ffffff', 18),
        sel('BENAR', R.benar, W.hijauMuda, W.gelap),
        sel('SALAH', salah, W.merahMuda, W.merah),
        sel('KOSONG', kosong, W.latar, W.abu),
        sel('XP DIPEROLEH', '+' + R.xp, W.amberMuda, W.amber)
    ]] }, layout: layoutKotak });

    content.push({ text: 'Durasi pengerjaan ' + L.fmt(R.durasi) + ' dari ' + L.fmt(R.batas) + (R.auto ? '  •  dikumpulkan otomatis (waktu habis)' : ''), fontSize: 8.5, color: W.abu, margin: [0, 6, 0, 0] });

    // Analisis per tingkat
    const tk = {}; window.soal.forEach((s, i) => { const t = tk[s.tingkat] = tk[s.tingkat] || { n: 0, b: 0 }; t.n++; if (R.jawab[i] === s.j) t.b++; });
    const urut = ['mudah', 'sedang', 'sulit', 'hots'].filter(t => tk[t]);
    const th = t => ({ text: t, bold: true, fontSize: 8.5, color: '#ffffff', fillColor: W.gelap, margin: [7, 5, 7, 5] });
    content.push(judulBagian('Analisis per Tingkat Kesulitan'));
    content.push({ table: { widths: [80, 60, '*'], body: [
        [th('Tingkat'), th('Benar / Total'), th('Persentase')],
        ...urut.map(t => {
            const p = Math.round(tk[t].b / tk[t].n * 100);
            return [
                { text: TKT[t][0], bold: true, fontSize: 9.5, color: TKT_HEX[t], margin: [7, 6, 7, 6] },
                { text: tk[t].b + ' / ' + tk[t].n, fontSize: 9.5, margin: [7, 6, 7, 6] },
                { margin: [7, 6, 7, 6], columns: [
                    { width: 110, canvas: [{ type: 'rect', x: 0, y: 3, w: 110, h: 7, r: 3, color: W.garis }, { type: 'rect', x: 0, y: 3, w: Math.max(0.1, 110 * p / 100), h: 7, r: 3, color: TKT_HEX[t] }] },
                    { text: p + '%', bold: true, fontSize: 9.5, margin: [6, 1, 0, 0] }
                ] }
            ];
        })
    ] }, layout: { hLineWidth: () => 0.6, vLineWidth: () => 0.6, hLineColor: () => W.garis, vLineColor: () => W.garis, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 } });

    // Soal, jawaban siswa, dan pembahasan
    content.push(judulBagian('Soal, Jawaban & Pembahasan'));
    window.soal.forEach((s, i) => {
        const st = status(i), u = R.jawab[i];
        const c = st === 'benar' ? W.hijau : W.merah;
        const label = st === 'benar' ? 'BENAR' : st === 'kosong' ? 'TIDAK DIJAWAB' : 'SALAH';
        const tanpaPadding = { hLineWidth: () => 0, vLineWidth: () => 0, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 };

        const opsiRows = s.opsi.map((o, k) => {
            const kunci = k === s.j, pilih = k === u;
            const fill = kunci ? W.hijauMuda : (pilih ? W.merahMuda : '#ffffff');
            const fillHuruf = kunci ? W.hijau : (pilih ? W.merah : W.garis);
            const teks = [{ text: String(o), color: kunci ? W.gelap : '#334155', bold: kunci || pilih }];
            if (kunci && pilih) teks.push({ text: '   [JAWABAN SISWA = KUNCI]', fontSize: 7.5, bold: true, color: W.hijau });
            else if (kunci) teks.push({ text: '   [KUNCI]', fontSize: 7.5, bold: true, color: W.hijau });
            else if (pilih) teks.push({ text: '   [JAWABAN SISWA]', fontSize: 7.5, bold: true, color: W.merah });
            return [
                { text: HURUF[k] || String(k + 1), bold: true, alignment: 'center', color: (kunci || pilih) ? '#ffffff' : W.abu, fillColor: fillHuruf, margin: [0, 4, 0, 4] },
                { text: teks, fillColor: fill, margin: [8, 4, 8, 4], fontSize: 9.5 }
            ];
        });

        const teksJawab = u === undefined ? 'Tidak dijawab' : (HURUF[u] + '. ' + (s.opsi[u] ?? ''));
        const teksKunci = HURUF[s.j] + '. ' + (s.opsi[s.j] ?? '');

        content.push({
            margin: [0, 0, 0, 12],
            unbreakable: true,
            table: {
                dontBreakRows: true, widths: ['*'],
                body: [
                    [{ fillColor: c, margin: [10, 6, 10, 6], columns: [
                        { text: 'SOAL ' + (i + 1) + '   |   ' + TKT[s.tingkat][0].toUpperCase() + (s.aspek ? '   |   ' + String(s.aspek).toUpperCase() : ''), bold: true, fontSize: 9, color: '#ffffff' },
                        { text: label, bold: true, fontSize: 9, color: '#ffffff', alignment: 'right' }
                    ] }],
                    ...((s.kasus && s.kasus !== s.p) ? [[{ fillColor: '#fff1f2', margin: [10, 7, 10, 7], stack: [
                        { text: 'WACANA / KASUS', fontSize: 7.5, bold: true, color: W.merah },
                        { text: String(s.kasus), italics: true, fontSize: 9.5, lineHeight: 1.35, color: '#475569', margin: [0, 3, 0, 0] }
                    ] }]] : []),
                    [{ text: String(s.p), bold: true, fontSize: 10.5, lineHeight: 1.35, color: '#0f172a', fillColor: W.latar, margin: [10, 8, 10, 8] }],
                    [{ table: { widths: [20, '*'], body: opsiRows }, layout: tanpaPadding }],
                    [{ table: { widths: ['*', '*'], body: [[
                        { fillColor: W.biruMuda, margin: [10, 6, 10, 6], stack: [{ text: 'JAWABAN SISWA', fontSize: 7.5, bold: true, color: W.biru }, { text: teksJawab, fontSize: 9.5, bold: true, color: u === undefined ? W.abu : '#0f172a', margin: [0, 2, 0, 0] }] },
                        { fillColor: W.hijauMuda, margin: [10, 6, 10, 6], stack: [{ text: 'KUNCI JAWABAN', fontSize: 7.5, bold: true, color: W.hijau }, { text: teksKunci, fontSize: 9.5, bold: true, color: W.gelap, margin: [0, 2, 0, 0] }] }
                    ]] }, layout: tanpaPadding }],
                    [{ fillColor: W.amberMuda, margin: [10, 7, 10, 8], stack: [
                        { text: 'PENJELASAN / PEMBAHASAN', fontSize: 7.5, bold: true, color: W.amber },
                        { text: s.bahas ? String(s.bahas) : 'Pembahasan belum tersedia untuk soal ini.', fontSize: 9.5, lineHeight: 1.35, color: s.bahas ? '#334155' : W.abu, margin: [0, 3, 0, 0] }
                    ] }]
                ]
            },
            layout: { hLineWidth: () => 0.8, vLineWidth: () => 0.8, hLineColor: () => c, vLineColor: () => c, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 }
        });
    });

    content.push({ text: 'Dokumen ini dibuat otomatis oleh Argumentasi App pada ' + tglIndo(Date.now()) + '.', fontSize: 8, color: W.abu, alignment: 'center', margin: [0, 8, 0, 0] });

    return {
        info: { title: 'Hasil Latihan Uji Berpikir - ' + nama, author: 'Argumentasi App', subject: materi },
        pageSize: 'A4',
        pageMargins: [36, 36, 36, 46],
        defaultStyle: { fontSize: 10, lineHeight: 1.2, color: '#334155' },
        footer: (cur, total) => ({ columns: [
            { text: 'Argumentasi App  •  ' + nama + '  •  Uji Berpikir', fontSize: 8, color: W.abu, margin: [36, 0, 0, 0] },
            { text: 'Halaman ' + cur + ' dari ' + total, fontSize: 8, color: W.abu, alignment: 'right', margin: [0, 0, 36, 0] }
        ], margin: [0, 18, 0, 0] }),
        content
    };
}

window.unduhPdf = function() {
    if (typeof pdfMake === 'undefined') { L.toast('Pustaka PDF belum termuat. Periksa koneksi lalu coba lagi.', true); return; }
    try {
        const R = window.H.hasil.kritis;
        const d = new Date(R.selesai);
        const tgl = d.getFullYear() + '-' + L.pad(d.getMonth() + 1) + '-' + L.pad(d.getDate());
        const nama = ('Hasil-Kritis_' + L.nama() + '_' + tgl + '.pdf').replace(/[^\w\-.]+/g, '_');
        pdfMake.createPdf(buatDokumenPdf()).download(nama);
        L.toast('PDF sedang diunduh…');
    } catch (e) {
        console.error(e);
        L.toast('Gagal membuat PDF.', true);
    }
};

initLatihan();
</script>
