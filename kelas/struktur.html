<html lang="id">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], reading: ['Merriweather', 'serif'] }, colors: { brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } } } } }</script>

    <script>
    /* ===== PUSTAKA LATIHAN (LocalStorage + IndexedDB) ===== */
    (function () {
        const qCore = new URLSearchParams(window.location.search);
        const cId = qCore.get('id') || 'umum';
        const LS = 'lat_v1_' + cId, DBN = 'latihan-db-' + cId;

        let S = null, siapP = null;
        const pad = n => String(n).padStart(2, '0');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
        const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
        const idbOpen = () => new Promise((ok, no) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
        const idbGet = async () => { try { const d = await idbOpen(); return await new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } };
        const idbSet = async v => { try { const d = await idbOpen(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'state'); t.oncomplete = ok; t.onerror = ok; t.onabort = ok; }); } catch (e) {} };

        const L = {
            esc, today, pad,
            siap() { return siapP || (siapP = (async () => {
                const a = lsRead(), b = await idbGet();
                S = [a, b].filter(x => x && x.hari).sort((x, y) => (y.u || 0) - (x.u || 0))[0] || { v: 1, id: uuid(), u: Date.now(), hari: {} };
                L.simpan(true); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
                return S; })()); },
            state: () => S,
            simpan(tetap) {
                if (!tetap) S.u = Date.now();
                const ks = Object.keys(S.hari).sort(); while (ks.length > 45) delete S.hari[ks.shift()];
                try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
                idbSet(JSON.parse(JSON.stringify(S)));
            },
            aktif() { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.spin && now < h.spin.ts + 864e5 && (!best || h.spin.ts > S.hari[best].spin.ts)) best = k; } return best; },
            hari(kunci) { if (kunci === undefined || kunci === null) { const a = L.aktif(); return a ? S.hari[a] : null; } return S.hari[kunci] || null; },
            nama: () => localStorage.getItem('namaSiswaCendekia') || 'Siswa',
            xp: () => (parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + parseInt(localStorage.getItem('kelasPointsArg') || '0')),
            tambahXp(n) { localStorage.setItem('latihanPointsCendekia', String(parseInt(localStorage.getItem('latihanPointsCendekia') || '0') + n)); },
            fmt(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); },
            menit: s => Math.max(1, Math.round(s / 60)),
            // Nada singkat saat hasil keluar (sebelumnya fungsi ini belum ada sehingga pembahasan bisa gagal tampil)
            beep(t) {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
                    const c = new AC(), seq = t === 'ok' ? [523, 659, 784] : [330, 262];
                    seq.forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.value = .07; o.connect(g); g.connect(c.destination); o.start(c.currentTime + i * .14); o.stop(c.currentTime + i * .14 + .12); });
                    setTimeout(() => { try { c.close(); } catch (e) {} }, 900);
                } catch (e) {}
            },
            toast(msg, err) {
                let c = document.getElementById('lToast');
                if (!c) { c = document.createElement('div'); c.id = 'lToast'; c.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100000] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none'; document.body.appendChild(c); }
                const t = document.createElement('div'); t.className = (err ? 'bg-red-500' : 'bg-slate-800') + ' text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2';
                t.innerHTML = '<i class="fas ' + (err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400') + '"></i><span class="flex-1">' + esc(msg) + '</span>'; c.appendChild(t); setTimeout(() => t.remove(), 3200);
            }
        };
        window.L = L;
    })();
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background: #e2e8f0; -webkit-tap-highlight-color: transparent; }

        /* Kepala lembar kerja bergaya kertas bergaris */

        /* Pilihan jawaban (tanpa animasi masuk, langsung kokoh) */

        .opsi:active { background: #f8fafc; }

        .tag-benar { background: #10b981; color: #fff; } .tag-salah { background: #fb7185; color: #fff; }

        /* Tombol ragu-ragu */
        .flag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 9999px; border: 1.5px solid #e2e8f0; color: #94a3b8; background: #fff; }
        .flag.on { border-color: #f59e0b; background: #fffbeb; color: #b45309; }

        /* Navigator soal */
        .nav-n { position: relative; height: 2.6rem; border-radius: .8rem; border: 2px solid #e2e8f0; background: #fff; font-weight: 800; font-size: 13px; color: #64748b; }
        .nav-n.nav-a { background: #059669; border-color: #059669; color: #fff; }
        .nav-n.nav-r { border-color: #f59e0b; }
        .nav-n i { position: absolute; top: -6px; right: -4px; font-size: 10px; color: #f59e0b; background: #fff; border-radius: 9999px; padding: 2px; }

        .waktu-kritis { animation: dk 1s infinite; } @keyframes dk { 50% { background: #dc2626; } }

        .bahas-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: .8rem; }
    
        .pil-lbl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; padding: .7rem .4rem; border: 2px solid #e2e8f0; border-radius: .85rem; background: #fff; font-size: 11px; font-weight: 700; color: #64748b; transition: background-color .12s, border-color .12s, color .12s; }
        .pil-lbl:active { background: #f8fafc; }
        .pil-lbl.sel-tesis { border-color: #8b5cf6; background: #f5f3ff; color: #6d28d9; }
        .pil-lbl.sel-argumen { border-color: #0ea5e9; background: #f0f9ff; color: #0369a1; }
        .pil-lbl.sel-kesimpulan { border-color: #f59e0b; background: #fffbeb; color: #b45309; }
        .kal-span { border-radius: 5px; padding: 1px 3px; cursor: pointer; }
        .kal-span.hl-tesis { background: #ede9fe; color: #5b21b6; border-bottom: 2px solid #8b5cf6; }
        .kal-span.hl-argumen { background: #e0f2fe; color: #075985; border-bottom: 2px solid #0ea5e9; }
        .kal-span.hl-kesimpulan { background: #fef3c7; color: #92400e; border-bottom: 2px solid #f59e0b; }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-100 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-300">
    <header class="sticky top-0 z-50 bg-brand-green h-14 px-4 flex items-center gap-3 shadow-md">

<!-- MODAL KONFIRMASI -->
<div id="modal" class="fixed inset-0 bg-slate-900/60 z-[99999] hidden items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5">
        <div id="mIkon" class="w-12 h-12 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-xl mx-auto mb-3"></div>
        <h3 id="mJudul" class="font-bold text-slate-800 text-center text-sm"></h3><p id="mKet" class="text-[11px] text-slate-500 text-center mt-1.5 leading-relaxed"></p>
        <div class="grid grid-cols-2 gap-2 mt-5"><button onclick="jawabModal(false)" id="mBatal" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">Batal</button><button onclick="jawabModal(true)" id="mOk" class="py-3 rounded-xl bg-brand-green text-white font-bold text-xs">Lanjutkan</button></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({ apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" });
const db = getFirestore(app);
window.db = db;

const $ = id => document.getElementById(id), esc = window.L.esc;
const KEY = 'struktur';
const JENIS = 'Bedah Struktur';
const SATUAN = 'kalimat';
const AKSI = 'dilabeli';
const DEF_WAKTU = 60;
const FALLBACK_WAKTU = 300;
const PREFIX_FILE = 'Hasil-Struktur';

const TKT = { mudah: ['Mudah', 'emerald', 'fa-seedling'], sedang: ['Sedang', 'sky', 'fa-gauge'], sulit: ['Sulit', 'amber', 'fa-mountain'], hots: ['HOTS', 'rose', 'fa-fire'] };
const TKT_HEX = { mudah: '#10b981', sedang: '#0ea5e9', sulit: '#f59e0b', hots: '#f43f5e' };
const NAV_BAGIAN = [
    ['pilgan', 'Pilihan Ganda', 'pilgan.html', 'fa-circle-check', 'blue'],
    ['struktur', 'Bedah Struktur', 'struktur.html', 'fa-layer-group', 'amber'],
    ['esai', 'Esai Argumentasi', 'esai.html', 'fa-pen-nib', 'emerald'],
    ['kritis', 'Uji Berpikir', 'kritis.html', 'fa-brain', 'rose'],
    ['peta', 'Peta Argumen', 'peta_argumen.html', 'fa-map-signs', 'indigo'],
    ['ilmiah', 'Kata Ilmiah', 'kata_ilmiah.html', 'fa-flask', 'teal']
];

window.H = null; window.P = null; window.soal = null; window.totalWaktu = 0; window.sesi = null; window.timer = null; window.aktif = false; window.resolveM = null;

const qsParams = new URLSearchParams(window.location.search);
const classId = qsParams.get('id') || '';
const studentId = qsParams.get('sid') || localStorage.getItem('studentId') || localStorage.getItem('siswa_' + classId) || '';

function urlKembali() {
    const qs = new URLSearchParams();
    if (classId) qs.set('id', classId);
    if (studentId) qs.set('sid', studentId);
    return '../ruang_belajar_siswa.html' + (qs.toString() ? '?' + qs.toString() : '');
}
const tglIndo = (t) => new Date(t).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

window.modal = (judul, ket, ok, batal, ikon) => new Promise(r => { window.resolveM = r; $('mJudul').textContent = judul; $('mKet').textContent = ket; $('mOk').textContent = ok || 'Lanjutkan'; $('mBatal').textContent = batal || 'Batal'; $('mIkon').innerHTML = '<i class="fas ' + (ikon || 'fa-triangle-exclamation') + '"></i>'; $('modal').classList.replace('hidden', 'flex'); });
window.jawabModal = v => { $('modal').classList.replace('flex', 'hidden'); if (window.resolveM) { window.resolveM(v); window.resolveM = null; } };
window.badgeTk = t => { const arr = TKT[t] || TKT.sedang; return '<span class="inline-flex items-center gap-1 text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-' + arr[1] + '-100 text-' + arr[1] + '-700"><i class="fas ' + arr[2] + '"></i>' + arr[0] + '</span>'; };

/* ===== KIRIM HASIL KE SERVER (tidak menahan tampilan hasil) ===== */
async function kirimServer() {
    const R = window.H && window.H.hasil && window.H.hasil[KEY];
    if (!R || R.sync || !studentId || !classId) return;
    try {
        await setDoc(doc(db, `classes/${classId}/students`, studentId), { latihan: { [KEY]: R } }, { merge: true });
        R.sync = true; L.simpan(true);
    } catch (e) {
        console.warn('Gagal menyimpan hasil ke server (akan dicoba lagi saat halaman dibuka):', e);
    }
}

/* ===== INISIALISASI ===== */
async function initLatihan() {
    await L.siap();
    const backUrl = urlKembali();
    $('btnBack').href = backUrl;

    let H = L.hari();
    if (!H) {
        const S = L.state();
        const k = 'c' + Date.now();
        S.hari[k] = { sesi: {}, hasil: {}, spin: { ts: Date.now(), judul: 'Memuat...' } };
        H = S.hari[k];
        L.simpan(true);
    }

    if (!H.pack || !H.pack[KEY]) {
        try {
            const docSnap = await getDoc(doc(db, "classes", classId));
            if (docSnap.exists() && docSnap.data().aiPaket) {
                H.pack = docSnap.data().aiPaket;
                H.spin = { judul: docSnap.data().namaKelas, ts: Date.now() };
                L.simpan(true);
            }
        } catch (e) { console.error("Firebase error:", e); }
    }

    if (!H || !H.pack || !H.pack[KEY]) {
        $('main').innerHTML = [
            '<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 mt-10">',
            '<i class="fas fa-exclamation-triangle text-4xl text-slate-300 mb-3"></i>',
            '<p class="text-sm font-bold text-slate-700">Latihan Belum Siap</p>',
            '<p class="text-[11px] text-slate-500 mt-1">Sistem belum menemukan paket latihan di kelas ini.</p>',
            '<a href="' + backUrl + '" class="inline-block mt-4 bg-brand-green text-white text-xs font-bold px-5 py-2.5 rounded-full">Kembali</a>',
            '</div>'
        ].join('');
        return;
    }

    window.H = H;
    window.P = H.pack[KEY];
    window.soal = window.normSoal(window.P);
    window.totalWaktu = window.P.total || window.P.waktu || window.soal.reduce((a, b) => a + (b.waktu || DEF_WAKTU), 0) || FALLBACK_WAKTU;
    if ($('hSub')) $('hSub').textContent = (H.spin && H.spin.judul) || JENIS;

    if (H.hasil && H.hasil[KEY]) return window.tampilHasil();
    if (H.sesi && H.sesi[KEY]) {
        window.sesi = H.sesi[KEY];
        return Date.now() >= window.sesi.batas ? window.kumpulkan(true) : window.renderUjian();
    }
    window.tampilIntro();
}

window.mulai = async function() {
    if (!(await modal('Mulai sekarang?', 'Waktu langsung berjalan dan latihan ini tidak bisa diulang.', 'Mulai', 'Belum', 'fa-play'))) return;
    const t = Date.now();
    window.H.sesi[KEY] = window.sesi = { mulai: t, batas: t + window.totalWaktu * 1000, jawab: {}, ragu: {}, keluar: 0 };
    L.simpan();
    window.renderUjian();
    window.scrollTo({ top: 0 });
};

/* ===== BAGIAN UMUM LEMBAR KERJA ===== */
window.siapkanUjian = function() {
    window.aktif = true;
    window.sesi.ragu = window.sesi.ragu || {};
    $('hTimer').classList.remove('hidden'); $('barWaktu').classList.remove('hidden'); $('bar').classList.remove('hidden');
    $('btnBack').onclick = e => { e.preventDefault(); L.toast('Ujian sedang berjalan. Selesaikan atau kumpulkan dulu.', true); };
    $('navGrid').onclick = e => {
        const b = e.target.closest('[data-go]'); if (!b) return;
        tutupNav();
        const el = $('q' + b.dataset.go);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
};

// Tombol ragu-ragu; mengembalikan true bila klik ditangani
window.tanganiFlag = function(e) {
    const fl = e.target.closest('.flag');
    if (!fl) return false;

window.jalankanWaktu = function() {

        $('barWaktuIsi').style.width = Math.max(0, (window.sesi.batas - Date.now()) / tot * 100) + '%';

        $('hTimer').classList.toggle('waktu-kritis', krit); $('hTimer').classList.toggle('text-white', krit); $('hTimer').classList.toggle('text-brand-green', !krit);
        $('barWaktuIsi').className = 'h-full transition-all duration-500 ' + (krit ? 'bg-red-500' : 'bg-brand-green');

window.kumpulkan = async function(auto) {
    if (window.H.hasil[KEY]) return;

    const jawab = window.sesi.jawab;
    const h = window.hitungSkor(jawab);

    window.H.hasil[KEY] = { skor: h.skor, benar: h.benar, total: window.soal.length, jawab: jawab, durasi: Math.round((Math.min(Date.now(), window.sesi.batas) - window.sesi.mulai) / 1000), batas: window.totalWaktu, selesai: Date.now(), auto: !!auto, keluar: window.sesi.keluar || 0, xp: h.xp };

    $('btnBack').onclick = null; $('btnBack').href = urlKembali();

/* ===== KHUSUS BEDAH STRUKTUR ===== */
const LBL = {
    tesis: ['Tesis', 'violet', 'fa-lightbulb', 'Pernyataan utama / posisi penulis'],
    argumen: ['Argumen', 'sky', 'fa-shield-halved', 'Bukti atau alasan pendukung'],
    kesimpulan: ['Kesimpulan', 'amber', 'fa-flag-checkered', 'Penegasan ulang / penutup']
};
const URUT_LBL = ['tesis', 'argumen', 'kesimpulan'];
const LBL_HEX = { tesis: '#8b5cf6', argumen: '#0ea5e9', kesimpulan: '#f59e0b' };
const LBL_GELAP = { tesis: '#5b21b6', argumen: '#075985', kesimpulan: '#92400e' };
const LBL_MUDA = { tesis: '#ede9fe', argumen: '#e0f2fe', kesimpulan: '#fef3c7' };

// Label dari data bisa berbeda tulisan (mis. "Penegasan Ulang"); samakan ke tiga jenis baku
function normLabel(x) {
    const s = String(x || '').toLowerCase();
    if (/tesis|pernyataan|pendapat|posisi/.test(s)) return 'tesis';
    if (/kesimpul|simpul|penegas|penutup|ulang/.test(s)) return 'kesimpulan';
    return 'argumen';
}
window.badgeLbl = t => { const a = LBL[t] || LBL.tesis; return '<span class="inline-flex items-center gap-1 text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-' + a[1] + '-100 text-' + a[1] + '-700"><i class="fas ' + a[2] + '"></i>' + a[0] + '</span>'; };

window.normSoal = function(P) {
    const arr = P.teks || P.soal || [];
    return arr.map((s, i) => ({
        id: i,
        k: typeof s === 'string' ? s : (s.t || s.teks || ''),
        j: normLabel(typeof s === 'string' ? '' : s.label),
        bahas: typeof s === 'string' ? '' : (s.alasan || s.bahas || s.pembahasan || '')
    }));
};
window.isAnswered = i => !!(window.sesi && window.sesi.jawab[i]);
window.hitungSkor = function(jawab) {
    const benar = window.soal.filter((s, i) => jawab[i] === s.j).length;
    const skor = Math.round(benar / window.soal.length * 100);
    return { skor, benar, xp: Math.round(skor / 4) + (skor >= 80 ? 10 : 0) };
};

        '</div></div>',

        '<div class="mt-4 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">',
        '<div class="flex items-center justify-between px-4 py-2.5 bg-slate-50 border-b border-slate-200"><p class="text-[10px] font-extrabold uppercase tracking-wider text-slate-500"><i class="fas fa-book-open mr-1.5"></i>Wacana Utuh <span class="font-semibold normal-case text-slate-400">(ketuk kalimat untuk melompat)</span></p><button id="btnWacana" onclick="toggleWacana()" class="text-[10px] font-bold text-brand-green"><i class="fas fa-chevron-up mr-1"></i>Tutup</button></div>',
        '<div id="wacanaIsi" class="p-4"><p class="font-reading text-[12.5px] text-slate-700 leading-[2]">'
    ];
    window.soal.forEach((s, i) => html.push('<span id="sp' + i + '" onclick="lompat(' + i + ')" class="kal-span"><b>[' + (i + 1) + ']</b> ' + esc(s.k) + '</span> '));
    html.push('</p><div class="flex flex-wrap gap-x-3 gap-y-1 mt-3 pt-3 border-t border-slate-100 text-[10px] font-semibold text-slate-500">');
    URUT_LBL.forEach(k => html.push('<span><i class="fas fa-square mr-1" style="color:' + LBL_HEX[k] + '"></i>' + LBL[k][0] + '</span>'));
    html.push('</div></div></div><div id="daftar" class="space-y-3.5 mt-4">');

    window.soal.forEach((s, i) => {
        html.push('<article id="q' + i + '" class="q-card scroll-mt-24 p-4" style="--c:#94a3b8">');
        html.push('<div class="flex items-center gap-2 mb-2.5"><span class="q-no">' + (i + 1) + '</span><span class="text-[11px] font-extrabold text-slate-600">Kalimat ke-' + (i + 1) + '</span><span id="st' + i + '" class="ml-1"></span>' + flagHtml(i) + '</div>');
        html.push('<p class="font-reading text-[13.5px] text-slate-800 leading-[1.85] mb-3.5">' + esc(s.k) + '</p><div class="grid grid-cols-3 gap-2">');
        URUT_LBL.forEach(k => html.push('<button class="pil-lbl" data-i="' + i + '" data-k="' + k + '"><i class="fas ' + LBL[k][2] + ' text-sm"></i><span>' + LBL[k][0] + '</span></button>'));
        html.push('</div></article>');
    });
    html.push('</div><div class="h-6"></div>');
    $('main').innerHTML = html.join('');

    $('daftar').addEventListener('click', e => {
        if (!window.aktif) return;
        if (tanganiFlag(e)) return;
        const b = e.target.closest('.pil-lbl'); if (!b) return;
        const i = +b.dataset.i, k = b.dataset.k;
        if (window.sesi.jawab[i] === k) delete window.sesi.jawab[i];     // ketuk lagi untuk membatalkan
        else { window.sesi.jawab[i] = k; if (navigator.vibrate) navigator.vibrate(8); }
        L.simpan(); cat(i); hitungJawab();
    });

    window.soal.forEach((s, i) => cat(i));
    hitungJawab(); jalankanWaktu();
};

/* ===== HASIL + PEMBAHASAN ===== */
window.tampilHasil = function(baru) {
    const R = window.H.hasil[KEY];
    sembunyikanUjian();
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const kosong = window.soal.filter((s, i) => status(i) === 'kosong').length;
    const salah = R.total - R.benar - kosong;

    const tk = {}; window.soal.forEach((s, i) => { const t = tk[s.j] = tk[s.j] || { n: 0, b: 0 }; t.n++; if (R.jawab[i] === s.j) t.b++; });
    const urut = URUT_LBL.filter(t => tk[t]);
    const pesan = R.skor >= 80 ? ['Luar biasa!', 'Kamu sangat tajam membedakan struktur argumentasi.', 'fa-trophy']
        : R.skor >= 60 ? ['Bagus!', 'Pemahaman strukturmu sudah cukup baik.', 'fa-thumbs-up']
        : ['Tetap semangat!', 'Pelajari kembali perbedaan tesis, argumen, dan kesimpulan.', 'fa-heart'];

    // Peta wacana: warna sesuai KUNCI, tanda silang untuk kalimat yang keliru
    let peta = '<p class="font-reading text-[12.5px] text-slate-700 leading-[2]">';
    window.soal.forEach((s, i) => {
        const st = status(i);
        peta += '<span class="kal-span hl-' + s.j + '"><b>[' + (i + 1) + ']</b> ' + esc(s.k) + (st === 'benar' ? '' : ' <i class="fas fa-circle-xmark text-rose-500"></i>') + '</span> ';
    });
    peta += '</p><div class="flex flex-wrap gap-x-3 gap-y-1 mt-3 pt-3 border-t border-slate-100 text-[10px] font-semibold text-slate-500">' +
        URUT_LBL.map(k => '<span><i class="fas fa-square mr-1" style="color:' + LBL_HEX[k] + '"></i>' + LBL[k][0] + '</span>').join('') +
        '<span><i class="fas fa-circle-xmark text-rose-500 mr-1"></i>Pilihanmu keliru / kosong</span></div>';

    $('main').innerHTML = [
        '<div class="rounded-3xl p-5 text-center text-white shadow-lg" style="background:linear-gradient(135deg,#064e3b,#059669 60%,#34d399)">',
        '<i class="fas ' + pesan[2] + '" style="font-size:54px;color:' + (R.skor >= 60 ? '#fcd34d' : '#fda4af') + ';filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))"></i>',
        '<p class="text-[10px] uppercase tracking-[.2em] text-white/70 font-semibold mt-3">Skor Akhir</p>',
        '<div class="flex items-end justify-center gap-1"><span class="text-6xl font-extrabold leading-none">' + R.skor + '</span><span class="text-xl font-bold text-white/70 mb-1">/100</span></div>',
        '<p class="font-extrabold text-base mt-2">' + pesan[0] + '</p><p class="text-[11px] text-white/80">' + pesan[1] + '</p>',
        '<span class="inline-block mt-3 bg-white/20 rounded-full px-3 py-1 text-[11px] font-bold"><i class="fas fa-star text-amber-300 mr-1"></i>+' + R.xp + ' XP</span>',
        R.auto ? '<p class="text-[10px] text-amber-200 mt-2"><i class="fas fa-clock mr-1"></i>Dikumpulkan otomatis karena waktu habis</p>' : '',
        '</div>',
        statHtml([[R.benar, 'Tepat', 'text-emerald-600'], [salah, 'Keliru', 'text-rose-500'], [kosong, 'Kosong', 'text-slate-400'], [L.fmt(R.durasi), 'Durasi', 'text-slate-700']]),
        raporHtml(R),

        '<div class="bg-white rounded-2xl border border-slate-200 p-4 mt-3"><h3 class="font-bold text-slate-800 text-sm mb-3">Ketepatan per Struktur</h3><div class="space-y-3">',
        urut.map(t => { const p = Math.round(tk[t].b / tk[t].n * 100); return '<div><div class="flex justify-between items-center mb-1">' + badgeLbl(t) + '<span class="text-[11px] font-bold text-slate-600">' + tk[t].b + '/' + tk[t].n + '</span></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:' + p + '%;background:' + LBL_HEX[t] + '"></div></div></div>'; }).join(''),
        '</div></div>',

        '<div class="bg-white rounded-2xl border border-slate-200 mt-3 overflow-hidden"><div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200"><h3 class="font-bold text-slate-800 text-xs"><i class="fas fa-map text-brand-green mr-1.5"></i>Peta Wacana (sesuai kunci)</h3></div><div class="p-4">' + peta + '</div></div>',

        '<div class="flex items-center justify-between mt-6 mb-3"><h3 class="font-bold text-slate-800 text-sm"><i class="fas fa-lightbulb text-amber-500 mr-1.5"></i>Pembahasan Kalimat</h3></div>',
        '<div id="filter" class="flex gap-1.5 mb-3 flex-wrap"></div><div id="bahas" class="space-y-3"></div>',
        navLatihanHtml()
    ].join('');

    filterBahas('semua');
    efekHasil(baru, R.skor >= 80 ? 'great' : R.skor >= 60 ? 'ok' : 'err');
};

window.filterBahas = function(f) {
    const R = window.H.hasil[KEY];
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const cnt = { semua: window.soal.length, salah: 0, benar: 0 };
    window.soal.forEach((s, i) => { if (status(i) === 'benar') cnt.benar++; else cnt.salah++; });

    $('filter').innerHTML = [['semua', 'Semua'], ['salah', 'Keliru / Kosong'], ['benar', 'Tepat']].map(x =>
        '<button onclick="filterBahas(\'' + x[0] + '\')" class="px-3 py-1.5 rounded-full text-[10px] font-bold border ' + (f === x[0] ? 'bg-brand-green text-white border-brand-green' : 'bg-white text-slate-500 border-slate-200') + '">' + x[1] + ' (' + cnt[x[0]] + ')</button>').join('');

    const arr = window.soal.map((s, i) => [s, i]).filter(x => { const st = status(x[1]); return f === 'semua' || (f === 'benar' ? st === 'benar' : st !== 'benar'); });
    if (!arr.length) {
        $('bahas').innerHTML = '<div class="bg-white rounded-2xl p-6 text-center text-xs text-emerald-600 font-semibold border border-emerald-100"><i class="fas fa-circle-check mr-1"></i> Tidak ada kalimat pada kategori ini.</div>';
        return;
    }

    $('bahas').innerHTML = arr.map(x => {
        const s = x[0], i = x[1], u = R.jawab[i], st = status(i), ok = st === 'benar';
        const label = ok ? 'Tepat' : st === 'kosong' ? 'Tidak dilabeli' : 'Keliru';
        let item = '<article class="bg-white rounded-2xl border ' + (ok ? 'border-emerald-200' : 'border-rose-200') + ' p-4" style="border-left:5px solid ' + (ok ? '#10b981' : '#f43f5e') + '">';
        item += '<div class="flex items-center gap-2 mb-2.5"><span class="w-7 h-7 rounded-full ' + (ok ? 'bg-emerald-500' : 'bg-rose-500') + ' text-white text-xs font-extrabold flex items-center justify-center">' + (i + 1) + '</span>' + badgeLbl(s.j) + '<span class="ml-auto text-[10px] font-extrabold uppercase tracking-wide px-2.5 py-1 rounded-full ' + (ok ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600') + '">' + label + '</span></div>';
        item += '<p class="font-reading text-[12.5px] text-slate-800 leading-[1.8] mb-3">' + esc(s.k) + '</p>';
        item += '<div class="grid grid-cols-2 gap-2 text-[11px]"><div class="rounded-xl p-2.5 ' + (ok ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700') + '"><p class="text-[9px] font-extrabold uppercase tracking-wider opacity-70">Pilihanmu</p><p class="font-bold mt-0.5">' + (u ? LBL[u][0] : '—') + '</p></div><div class="rounded-xl p-2.5 bg-emerald-50 text-emerald-700"><p class="text-[9px] font-extrabold uppercase tracking-wider opacity-70">Kunci</p><p class="font-bold mt-0.5">' + LBL[s.j][0] + '</p></div></div>';
        item += '<div class="bahas-box mt-3 p-3"><p class="text-[10px] font-extrabold uppercase tracking-wider text-amber-600 mb-1"><i class="fas fa-lightbulb mr-1"></i>Pembahasan</p><p class="text-[11.5px] text-slate-700 leading-relaxed">' + (s.bahas ? esc(s.bahas) : '<span class="text-slate-400">Pembahasan belum tersedia untuk kalimat ini.</span>') + '</p></div>';
        item += '</article>';
        return item;
    }).join('');
};

/* ===== PDF ===== */
window.buatDokumenPdf = function() {
    const R = window.H.hasil[KEY];
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const kosong = window.soal.filter((s, i) => status(i) === 'kosong').length;
    const salah = R.total - R.benar - kosong;
    const warnaSkor = R.skor >= 80 ? WR.hijau : R.skor >= 60 ? '#f59e0b' : WR.merah;
    const content = [pdfBanner(), pdfIdentitas(R)];

    content.push({ margin: [0, 8, 0, 0], table: { widths: ['*', '*', '*', '*', '*'], body: [[
        pdfSel('SKOR AKHIR', R.skor + ' / 100', warnaSkor, '#ffffff', 18),
        pdfSel('TEPAT', R.benar, WR.hijauMuda, WR.gelap),
        pdfSel('KELIRU', salah, WR.merahMuda, WR.merah),
        pdfSel('KOSONG', kosong, WR.latar, WR.abu),
        pdfSel('XP DIPEROLEH', '+' + R.xp, WR.amberMuda, WR.amber)
    ]] }, layout: layoutKotak });
    content.push({ text: 'Durasi pengerjaan ' + L.fmt(R.durasi) + ' dari ' + L.fmt(R.batas) + (R.auto ? '  •  dikumpulkan otomatis (waktu habis)' : ''), fontSize: 8.5, color: WR.abu, margin: [0, 6, 0, 0] });

    // Ketepatan per struktur
    const tk = {}; window.soal.forEach((s, i) => { const t = tk[s.j] = tk[s.j] || { n: 0, b: 0 }; t.n++; if (R.jawab[i] === s.j) t.b++; });
    content.push(pdfJudul('Ketepatan per Struktur'));
    content.push({ table: { widths: [90, 60, '*'], body: [
        [pdfTh('Struktur'), pdfTh('Tepat / Total'), pdfTh('Persentase')],
        ...URUT_LBL.filter(t => tk[t]).map(t => {
            const p = Math.round(tk[t].b / tk[t].n * 100);
            return [
                { text: LBL[t][0], bold: true, color: LBL_GELAP[t], fillColor: LBL_MUDA[t], margin: [7, 6, 7, 6] },
                { text: tk[t].b + ' / ' + tk[t].n, margin: [7, 6, 7, 6] },
                { margin: [7, 6, 7, 6], columns: [pdfBar(p, LBL_HEX[t]), { text: p + '%', bold: true, margin: [6, 1, 0, 0] }] }
            ];
        })
    ] }, layout: layoutTipis });

    // Peta wacana
    content.push(pdfJudul('Peta Wacana (sesuai kunci)'));
    content.push({ table: { widths: ['*'], body: [[{ fillColor: WR.latar, margin: [10, 9, 10, 9], lineHeight: 1.5, text: window.soal.map((s, i) => ({
        text: '[' + (i + 1) + '] ' + s.k + (status(i) === 'benar' ? '' : '  (x)') + '  ',
        color: LBL_GELAP[s.j], background: LBL_MUDA[s.j]
    })) }]] }, layout: layoutTipis });
    const ket = [{ text: 'Keterangan:  ', bold: true, fontSize: 8.5 }];
    URUT_LBL.forEach(k => { ket.push({ text: ' ' + LBL[k][0] + ' ', bold: true, fontSize: 8.5, color: LBL_GELAP[k], background: LBL_MUDA[k] }); ket.push({ text: '   ', fontSize: 8.5 }); });
    ket.push({ text: '(x) = pilihanmu keliru atau kosong', fontSize: 8.5, color: WR.abu });
    content.push({ margin: [0, 5, 0, 0], text: ket });

    // Pembahasan tiap kalimat
    content.push(pdfJudul('Pembahasan per Kalimat'));
    window.soal.forEach((s, i) => {
        const st = status(i), u = R.jawab[i], c = st === 'benar' ? WR.hijau : WR.merah;
        const label = st === 'benar' ? 'TEPAT' : st === 'kosong' ? 'TIDAK DILABELI' : 'KELIRU';
        const rows = [
            pdfKepala(c, 'KALIMAT ' + (i + 1) + '   |   KUNCI: ' + LBL[s.j][0].toUpperCase(), label),
            [{ text: String(s.k), bold: true, fontSize: 10.5, lineHeight: 1.35, color: '#0f172a', fillColor: WR.latar, margin: [10, 8, 10, 8] }],
            [{ table: { widths: ['*', '*'], body: [[
                { fillColor: WR.biruMuda, margin: [10, 6, 10, 6], stack: [{ text: 'PILIHAN SISWA', fontSize: 7.5, bold: true, color: WR.biru }, { text: u ? LBL[u][0] : 'Tidak dilabeli', fontSize: 10, bold: true, color: u ? '#0f172a' : WR.abu, margin: [0, 2, 0, 0] }] },
                { fillColor: WR.hijauMuda, margin: [10, 6, 10, 6], stack: [{ text: 'KUNCI JAWABAN', fontSize: 7.5, bold: true, color: WR.hijau }, { text: LBL[s.j][0], fontSize: 10, bold: true, color: WR.gelap, margin: [0, 2, 0, 0] }] }
            ]] }, layout: noPad }],
            [{ fillColor: WR.amberMuda, margin: [10, 7, 10, 8], stack: [
                { text: 'PENJELASAN / PEMBAHASAN', fontSize: 7.5, bold: true, color: WR.amber },
                { text: s.bahas ? String(s.bahas) : 'Pembahasan belum tersedia untuk kalimat ini.', fontSize: 9.5, lineHeight: 1.35, color: s.bahas ? '#334155' : WR.abu, margin: [0, 3, 0, 0] }
            ] }]
        ];
        content.push(pdfKartu(c, rows, true));
    });

    return pdfDoc(content);
};

initLatihan();

</script>
</body>
</html>
