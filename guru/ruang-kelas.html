<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pusat Kendali Kelas - Argumentasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    },
                    colors: { 
                        brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } 
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        .font-display { font-family: 'Playfair Display', serif; }
        .texture-dots { background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px); background-size: 16px 16px; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Skeleton Animation */
        .skeleton-pulse { animation: skeleton-loading 1.2s ease-in-out infinite alternate; }
        @keyframes skeleton-loading { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="flex justify-center h-screen h-[100dvh] overflow-hidden bg-slate-100">

    <!-- CONTAINER UTAMA -->
    <div class="w-full max-w-md bg-slate-50 relative h-full shadow-2xl flex flex-col sm:border-x border-slate-200 overflow-hidden fade-in">

        <!-- HEADER STICKY -->
        <header class="flex-shrink-0 bg-slate-900 border-b-4 border-amber-500 relative z-40">
            <div class="absolute inset-0 texture-dots opacity-20 pointer-events-none"></div>
            <div class="px-4 py-3 flex items-center justify-between relative z-10">
                <a href="index.html" class="flex items-center justify-center w-8 h-8 rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors active:scale-95 border border-white/20">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                
                <div class="flex flex-col items-center flex-1 overflow-hidden px-2">
                    <span class="text-[9px] font-bold text-amber-400 uppercase tracking-widest mb-0.5">Ruang Kelas Aktif</span>
                    
                    <!-- Skeleton Nama Kelas -->
                    <div id="skeletonClassName" class="w-24 h-4 bg-white/20 rounded skeleton-pulse"></div>
                    <!-- Real Nama Kelas -->
                    <h1 class="font-bold text-white text-sm tracking-wide leading-tight truncate w-full text-center hidden" id="navClassName">Memuat...</h1>
                </div>

                <div class="bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm" title="Kode Kelas">
                    <i class="fas fa-key text-emerald-400 text-xs"></i>
                    <span class="text-white font-bold text-xs tracking-widest" id="classCodeDisplay">------</span>
                </div>
            </div>
        </header>

        <!-- KONTEN UTAMA: SCROLLABLE AREA -->
        <main class="flex-grow overflow-y-auto hide-scrollbar relative z-20 flex flex-col bg-slate-50">
            
            <!-- STATE: DASHBOARD KELAS -->
            <div id="dashboardState" class="hidden w-full p-4 fade-in pb-10">

                <!-- BAGIAN: INFO KELAS (CP/TP) -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-5">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 mb-3 pb-2 border-b border-slate-100">
                        <i class="fas fa-info-circle text-blue-500"></i> Informasi Target Pembelajaran
                    </h3>
                    <div class="space-y-3">
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Capaian Pembelajaran</p>
                            <p class="text-xs text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100 leading-relaxed" id="infoCP">Memuat...</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Tujuan Pembelajaran</p>
                            <p class="text-xs text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100 leading-relaxed whitespace-pre-line" id="infoTP">Memuat...</p>
                        </div>
                    </div>
                </div>
                
                <!-- BAGIAN: MATERI AI -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-5">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 mb-1">
                        <i class="fas fa-wand-magic-sparkles text-violet-500"></i> Kelola Materi & Latihan
                    </h3>
                    <p class="text-[10px] text-slate-500 mb-4 pb-2 border-b border-slate-100 leading-relaxed">Review, tambahkan, atau ubah soal yang dihasilkan AI untuk menyesuaikan dengan kebutuhan siswa.</p>
                    
                    <div class="grid grid-cols-2 gap-3" id="aiModulesContainer">
                        <!-- Skeleton Loading Level -->
                        <div class="bg-slate-50 h-28 rounded-xl skeleton-pulse border border-slate-100"></div>
                        <div class="bg-slate-50 h-28 rounded-xl skeleton-pulse border border-slate-100"></div>
                        <div class="bg-slate-50 h-28 rounded-xl skeleton-pulse border border-slate-100"></div>
                        <div class="bg-slate-50 h-28 rounded-xl skeleton-pulse border border-slate-100"></div>
                    </div>
                </div>

                <!-- BAGIAN: PAPAN PRESTASI (LEADERBOARD) -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-gradient-to-r from-emerald-500 to-emerald-600 p-3 flex items-center justify-between text-white">
                        <h3 class="font-bold text-xs flex items-center gap-2"><i class="fas fa-trophy text-amber-300"></i> Papan Peringkat Siswa</h3>
                    </div>
                    <div class="p-3 space-y-2" id="leaderboardList">
                        <!-- Skeleton Leaderboard -->
                        <div class="bg-slate-50 h-10 rounded-lg skeleton-pulse border border-slate-100"></div>
                        <div class="bg-slate-50 h-10 rounded-lg skeleton-pulse border border-slate-100"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Notifikasi Toast -->
    <div id="toastContainer" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none w-[90%] max-w-sm"></div>

    <!-- SCRIPT LOGIC (Multi-Page Navigation & Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, onSnapshot, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let classCodeGlobal = null;
        let classDataGlobal = null;

        // Custom Toast (Tidak menggunakan default Alert Browser)
        window.showToast = function(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-600' : (type === 'info' ? 'bg-blue-600' : 'bg-slate-800');
            const iconClass = type === 'error' ? 'fa-exclamation-circle' : (type === 'info' ? 'fa-info-circle' : 'fa-check-circle text-emerald-400');
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold flex items-center justify-center gap-2 transform translate-y-5 opacity-0 transition-all duration-300 pointer-events-auto w-full text-center`;
            toast.innerHTML = `<i class="fas ${iconClass}"></i> ${msg}`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-5', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-5', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // 1. INIT: MENGAMBIL DATA KELAS DARI URL
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const urlParams = new URLSearchParams(window.location.search);
                classCodeGlobal = urlParams.get('id');

                if(!classCodeGlobal) {
                    window.location.href = "index.html"; 
                    return;
                }

                // Ambil Data Kelas
                const docRef = doc(db, "classes", classCodeGlobal);
                const docSnap = await getDoc(docRef);

                if(docSnap.exists()) {
                    classDataGlobal = docSnap.data();
                    
                    // Verifikasi bahwa user yang login adalah guru pemilik kelas ini atau admin
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    const userData = userDoc.data();
                    if(userData.role !== 'admin' && classDataGlobal.guruId !== user.uid) {
                        window.location.href = "index.html";
                        return;
                    }

                    // Tampilkan Nama & Kode Kelas
                    const navClassName = document.getElementById('navClassName');
                    navClassName.innerText = classDataGlobal.namaKelas;
                    navClassName.classList.remove('hidden');
                    document.getElementById('skeletonClassName').classList.add('hidden');
                    document.getElementById('classCodeDisplay').innerText = classCodeGlobal;
                    
                    // Isi Info Kelas
                    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                    document.getElementById('infoCP').innerHTML = esc(classDataGlobal.cp) || '-';
                    document.getElementById('infoTP').innerHTML = esc(classDataGlobal.tp) || '-';

                    // Tampilkan Dashboard
                    document.getElementById('dashboardState').classList.remove('hidden');
                    document.getElementById('dashboardState').classList.add('block');
                    
                    renderLatihanAI(classDataGlobal.aiPaket || null);
                    mulaiListenerLeaderboard();
                } else {
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = '../login.html';
            }
        });

        // 2. RENDER MATERI & LATIHAN AI
        function renderLatihanAI(aiPaket) {
            const container = document.getElementById('aiModulesContainer');
            
            if(!aiPaket) {
                container.innerHTML = `<div class="col-span-2 p-4 text-center text-slate-400 text-xs bg-slate-50 rounded-xl border border-slate-200">Data AI belum tersedia.</div>`;
                return;
            }

            const formatWaktu = s => Math.max(1, Math.round(s / 60)) + " mnt";
            
            const BAGIAN = [
                { key: 'pilgan', n: 'Pilihan Ganda', ic: 'fa-circle-check', c: 'blue', d: 'Soal bertingkat s.d HOTS', meta: p => `${(p.pilgan?.soal || []).length} soal · ${formatWaktu(p.pilgan?.total || 300)}` },
                { key: 'struktur', n: 'Bedah Struktur', ic: 'fa-layer-group', c: 'amber', d: 'Labeli struktur argumen', meta: p => `${(p.struktur?.teks || []).length} baris · ${formatWaktu(p.struktur?.waktu || 180)}` },
                { key: 'esai', n: 'Esai Argumentasi', ic: 'fa-pen-nib', c: 'emerald', d: 'Jawab dengan analisis logis', meta: p => `${(p.esai?.soal || []).length} soal · ${formatWaktu(p.esai?.total || 300)}` },
                { key: 'kritis', n: 'Uji Berpikir', ic: 'fa-brain', c: 'rose', d: 'Teori & logika penalaran', meta: p => `${(p.kritis?.soal || []).length} soal · ${formatWaktu(p.kritis?.total || 300)}` }
            ];

            let html = "";
            BAGIAN.forEach((b, i) => {
                const url = `preview-latihan.html?id=${classCodeGlobal}&mod=${b.key}`;
                html += `
                <a href="${url}" class="group bg-slate-50 rounded-xl border border-slate-200 p-3 flex flex-col active:scale-95 transition-transform hover:border-violet-300 relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 opacity-5 text-4xl group-hover:scale-125 transition-transform group-hover:rotate-12 group-hover:text-violet-500"><i class="fas ${b.ic}"></i></div>
                    <div class="w-8 h-8 rounded-lg bg-${b.c}-100 text-${b.c}-600 flex items-center justify-center text-sm mb-2 shadow-sm relative z-10"><i class="fas ${b.ic}"></i></div>
                    <h4 class="font-bold text-[11px] text-slate-800 leading-tight mb-1 relative z-10">${b.n}</h4>
                    <p class="text-[9px] text-slate-500 leading-snug flex-grow relative z-10">${b.d}</p>
                    <div class="mt-2 relative z-10 flex justify-between items-center">
                        <span class="text-[9px] font-bold text-slate-400 bg-white/80 w-max px-2 py-0.5 rounded-full border border-slate-100">${b.meta(aiPaket)}</span>
                        <span class="text-[9px] font-bold text-violet-500 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">Review <i class="fas fa-arrow-right"></i></span>
                    </div>
                </a>`;
            });
            container.innerHTML = html;
        }

        // 3. LEADERBOARD REALTIME LISTENER
        function mulaiListenerLeaderboard() {
            const board = document.getElementById('leaderboardList');
            
            // Urutkan siswa berdasarkan XP terbanyak
            const qStudent = query(collection(db, `classes/${classCodeGlobal}/students`), orderBy("xp", "desc"));
            
            onSnapshot(qStudent, (snapshot) => {
                if(snapshot.empty) {
                    board.innerHTML = '<div class="text-center text-[10px] text-slate-400 p-3">Belum ada aktivitas.</div>';
                    return;
                }
                
                let html = "";
                let rank = 1;
                
                snapshot.forEach(doc => {
                    const d = doc.data();
                    let rankIco = `<span class="font-bold text-slate-400 w-4 text-center text-xs">${rank}</span>`;
                    
                    if(rank === 1) rankIco = `<i class="fas fa-crown text-amber-500 w-4 text-center text-xs"></i>`;
                    else if(rank === 2) rankIco = `<i class="fas fa-medal text-slate-400 w-4 text-center text-xs"></i>`;
                    else if(rank === 3) rankIco = `<i class="fas fa-medal text-amber-700 w-4 text-center text-xs"></i>`;
                    
                    html += `
                    <div class="flex justify-between items-center bg-slate-50 px-2 py-1.5 rounded-lg border border-slate-100">
                        <div class="flex items-center gap-2 text-[11px]">
                            ${rankIco}
                            <span class="font-bold text-slate-700 truncate w-32">${d.nama}</span>
                        </div>
                        <span class="text-[9px] font-black bg-amber-100 text-amber-600 px-1.5 py-0.5 rounded">${d.xp} XP</span>
                    </div>`;
                    rank++;
                });
                
                board.innerHTML = html;
            });
        }
    </script>
</body>
</html>
