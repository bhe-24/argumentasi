<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koleksi Handout - Argumentasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: { amber: '#f59e0b', light: '#fef3c7', dark: '#b45309' } 
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        
        /* Menyembunyikan scrollbar untuk estetika Mobile App */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Tab Styles (Amber Theme) */
        .tab-active { border-bottom: 3px solid #f59e0b; color: #f59e0b; font-weight: 700; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #64748b; font-weight: 500; }

        /* Efek Buku */
        .book-spine { border-left: 4px solid rgba(0,0,0,0.15); border-radius: 4px 8px 8px 4px; }
        .modal-z { z-index: 99999 !important; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- CONTAINER UTAMA (Mobile App Frame) -->
    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col overflow-hidden sm:border-x border-slate-200">
        
        <!-- HEADER ALA APLIKASI (Amber Theme) -->
        <header class="bg-amber-500 pt-4 pb-3 px-4 relative z-20 shadow-sm">
            <!-- Top Bar -->
            <div class="flex items-center gap-3 mb-4">
                <a href="index.html" class="text-white text-lg px-2 py-1 hover:bg-white/20 rounded-full transition-colors"><i class="fas fa-chevron-left"></i></a>
                <h1 class="text-lg font-semibold text-white flex-1 truncate">Koleksi Handout</h1>
                <a href="profil.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white border border-white/30 hover:bg-white/30 transition-colors">
                    <i class="fas fa-user text-sm"></i>
                </a>
            </div>
            
            <!-- Search Bar -->
            <div class="bg-white rounded-xl flex items-center px-3 py-2 shadow-sm border border-amber-300">
                <i class="fas fa-search text-slate-400 text-sm mr-2"></i>
                <input type="text" id="searchInput" placeholder="Cari judul buku atau modul..." class="w-full bg-transparent outline-none text-slate-700 text-sm placeholder-slate-400" oninput="filterPencarian()">
            </div>
        </header>

        <!-- TABS NAVIGASI (Sticky) -->
        <div class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm px-2">
            <div class="flex overflow-x-auto hide-scrollbar">
                <button onclick="ubahTab('semua', this)" class="tab-btn tab-active flex-1 min-w-[100px] py-3.5 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    📚 Semua
                </button>
                <button onclick="ubahTab('modul', this)" class="tab-btn tab-inactive flex-1 min-w-[100px] py-3.5 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    📝 Modul Ajar
                </button>
                <button onclick="ubahTab('buku', this)" class="tab-btn tab-inactive flex-1 min-w-[100px] py-3.5 text-center text-[11px] uppercase tracking-wider transition-all whitespace-nowrap">
                    📖 Buku Referensi
                </button>
            </div>
        </div>

        <!-- MAIN KONTEN (Scrollable List) -->
        <div class="flex-grow overflow-y-auto hide-scrollbar p-4 relative bg-slate-50">
            
            <!-- STATE: LOADING -->
            <div id="loadingState" class="flex flex-col items-center justify-center py-20">
                <i class="fas fa-circle-notch fa-spin text-3xl text-brand-amber mb-3"></i>
                <h3 class="font-bold text-slate-700 text-sm">Memuat Rak Buku...</h3>
            </div>

            <!-- STATE: EMPTY / ERROR -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-4xl mb-4 text-slate-300">
                    <i class="fas fa-folder-open"></i>
                </div>
                <h3 class="font-bold text-slate-700 text-base mb-1">Rak Kosong</h3>
                <p class="text-xs text-slate-500 max-w-[250px] mx-auto" id="emptyMsg">Belum ada file PDF/Handout yang diunggah ke server.</p>
            </div>

            <!-- GRID CONTAINER (2 Kolom) -->
            <div id="handoutGrid" class="grid grid-cols-2 gap-3 fade-in hidden">
                <!-- Card Data akan diinjeksi ke sini oleh JS -->
            </div>

        </div>

    </div>

    <!-- ============================================================ -->
    <!-- MODAL PRATINJAU PDF (Mobile Frame Constraint)                -->
    <!-- ============================================================ -->
    <div id="modalPreview" class="fixed inset-0 bg-slate-900/90 hidden modal-z flex flex-col items-center opacity-0 transition-opacity duration-300">
        <div class="w-full max-w-md bg-white h-full flex flex-col relative shadow-2xl">
            
            <!-- Topbar Modal Preview -->
            <div class="bg-white px-4 py-3 flex justify-between items-center shadow-md z-10 border-b border-slate-200">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-8 h-8 bg-red-100 rounded-lg flex items-center justify-center text-red-600 shrink-0">
                        <i class="fas fa-file-pdf text-sm"></i>
                    </div>
                    <div class="truncate">
                        <h3 class="font-bold text-slate-800 text-xs truncate leading-none mb-0.5" id="previewTitle">Judul Buku</h3>
                        <span class="text-[9px] font-medium text-slate-400 uppercase tracking-widest block">Pratinjau Dokumen</span>
                    </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <a href="#" id="btnUnduhModal" target="_blank" download class="bg-amber-50 text-amber-600 hover:bg-amber-500 hover:text-white w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                        <i class="fas fa-download text-xs"></i>
                    </a>
                    <button onclick="tutupPreview()" class="text-slate-400 hover:text-red-500 bg-slate-100 hover:bg-red-50 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                        <i class="fas fa-times text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Loading Indicator untuk Iframe -->
            <div id="previewLoading" class="absolute inset-0 flex flex-col items-center justify-center z-0 bg-slate-800">
                <i class="fas fa-circle-notch fa-spin text-3xl text-white mb-3"></i>
                <p class="text-white text-xs font-medium">Memuat Dokumen PDF...</p>
            </div>

            <!-- Body Modal (Iframe Container) -->
            <div class="flex-1 w-full bg-slate-800 relative z-10 overflow-hidden">
                <iframe id="pdfIframe" src="" class="w-full h-full border-0" title="PDF Preview" onload="document.getElementById('previewLoading').classList.add('hidden');"></iframe>
            </div>
        </div>
    </div>

    <!-- SCRIPT UI DASAR & LOGIKA FILTER -->
    <script>
        let allHandouts = []; // Menyimpan semua data mentah dari Firebase
        let currentFilter = 'semua'; // Tab aktif

        // Logic Ganti Tab
        function ubahTab(jenis, btnElement) {
            currentFilter = jenis;
            
            // Ubah Style Tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            });
            btnElement.classList.remove('tab-inactive');
            btnElement.classList.add('tab-active');

            // Reset Pencarian
            document.getElementById('searchInput').value = '';

            // Terapkan Pengurutan/Filter
            renderListByFilter();
        }

        // Logic Pencarian Realtime
        function filterPencarian() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = allHandouts.filter(item => item.judul.toLowerCase().includes(query));
            
            renderHTML(filteredData);
            
            if(filteredData.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyMsg').innerText = "Pencarian tidak menemukan buku/modul yang cocok.";
            } else {
                document.getElementById('emptyState').classList.add('hidden');
            }
        }

        // Logic Pengurutan/Filter Data
        function renderListByFilter() {
            let filteredData = [...allHandouts];

            if (currentFilter !== 'semua') {
                // Filter kategori (mencari kecocokan kata 'modul' atau 'buku')
                filteredData = filteredData.filter(item => {
                    const kat = (item.kategori || "").toLowerCase();
                    return kat.includes(currentFilter);
                });
            }

            if(filteredData.length === 0) {
                document.getElementById('handoutGrid').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyMsg').innerText = "Belum ada dokumen di kategori ini.";
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                renderHTML(filteredData);
            }
        }

        // Logic Render HTML ke Layar
        function renderHTML(dataArray) {
            const container = document.getElementById('handoutGrid');
            let html = "";

            dataArray.forEach((data) => {
                // Escape petik satu pada judul untuk fungsi JS
                const safeJudul = data.judul.replace(/'/g, "\\'");
                const sizeText = data.ukuranFile ? `${data.ukuranFile} MB` : 'PDF';
                const coverImg = data.coverImage || "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300";

                html += `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-3 flex flex-col group hover:border-amber-400 transition-all active:scale-95 fade-in">
                    <div class="relative w-full aspect-[3/4] rounded-lg overflow-hidden mb-3 shadow-sm bg-slate-100">
                        <img src="${coverImg}" alt="${data.judul}" class="w-full h-full object-cover book-spine">
                        <div class="absolute top-2 right-2 bg-red-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow-sm tracking-wider">PDF</div>
                    </div>
                    <h3 class="font-bold text-slate-800 text-[12px] leading-snug line-clamp-2 mb-1">${data.judul}</h3>
                    <p class="text-[9px] text-slate-500 mb-3 line-clamp-1">${data.kategori || 'Handout'} • ${sizeText}</p>
                    <div class="mt-auto flex gap-1.5">
                        <button onclick="bukaPreview('${data.fileUrl}', '${safeJudul}')" class="flex-1 bg-amber-50 text-amber-600 hover:bg-amber-500 hover:text-white text-[10px] font-bold py-2 rounded-lg transition-colors text-center">Buka</button>
                        <a href="${data.fileUrl}" target="_blank" download class="w-8 flex items-center justify-center bg-slate-50 border border-slate-100 text-slate-500 hover:bg-emerald-500 hover:text-white hover:border-emerald-500 rounded-lg transition-colors" title="Unduh File">
                            <i class="fas fa-download text-[10px]"></i>
                        </a>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            
            // Animasi refresh grid
            container.classList.remove('hidden');
            container.classList.remove('fade-in');
            void container.offsetWidth; // trigger reflow
            container.classList.add('fade-in');
        }

        // Logic Buka/Tutup Modal PDF
        window.bukaPreview = function(url, judul) {
            const modal = document.getElementById('modalPreview');
            const iframe = document.getElementById('pdfIframe');
            
            document.getElementById('previewTitle').innerText = judul;
            document.getElementById('btnUnduhModal').href = url;
            document.getElementById('previewLoading').classList.remove('hidden');
            
            // Gunakan Google Docs Viewer sebagai iframe renderer universal
            const viewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
            iframe.src = viewerUrl;

            modal.classList.remove('hidden');
            requestAnimationFrame(() => modal.classList.remove('opacity-0'));
            document.body.style.overflow = 'hidden';
        };

        window.tutupPreview = function() {
            const modal = document.getElementById('modalPreview');
            const iframe = document.getElementById('pdfIframe');
            
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                iframe.src = ''; 
                document.body.style.overflow = 'auto';
            }, 300);
        };
    </script>

    <!-- FIREBASE FETCH DATA (Real Data) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            projectId: "mading-cf676",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchHandoutsServer() {
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const handoutGrid = document.getElementById('handoutGrid');

            try {
                // Sesuai sistem sebelumnya, kita menarik dari koleksi 'handouts'
                const q = query(collection(db, "handouts"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);

                loadingState.classList.add('hidden');

                if (snap.empty) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                allHandouts = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    if(data.fileUrl) {
                        allHandouts.push({
                            id: doc.id,
                            judul: data.judul || "Handout Tanpa Judul",
                            coverImage: data.coverImage,
                            fileUrl: data.fileUrl,
                            ukuranFile: data.ukuranFile,
                            kategori: data.kategori || "Bahan Ajar"
                        });
                    }
                });

                if (allHandouts.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                // Tampilkan list untuk pertama kali (Mode 'Semua')
                handoutGrid.classList.remove('hidden');
                renderListByFilter();

            } catch (error) {
                console.error("Firebase Error:", error);
                loadingState.classList.add('hidden');
                emptyState.classList.remove('hidden');
                document.getElementById('emptyMsg').innerText = "Terjadi gangguan jaringan saat memuat data rak buku. Silakan muat ulang.";
            }
        }

        // Panggil fungsi saat DOM selesai di-load
        document.addEventListener('DOMContentLoaded', fetchHandoutsServer);
    </script>
</body>
</html>
