<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koleksi Handout - Argumentasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] }, colors: { brand: { amber: '#f59e0b', light: '#fef3c7', dark: '#b45309' } } } } }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { scrollbar-width: none; }
        .lc2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .lc1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .item { animation: up .35s ease-out both; } @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .sk { position: relative; overflow: hidden; background: #e2e8f0; }
        .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: sh 1.3s infinite; } @keyframes sh { 100% { transform: translateX(100%); } }
        .spine { box-shadow: inset 4px 0 0 rgba(0,0,0,.12); }
        .tab-on { border-bottom: 3px solid #f59e0b; color: #d97706; font-weight: 700; } .tab-off { border-bottom: 3px solid transparent; color: #64748b; font-weight: 500; }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">

    <!-- HEADER + TAB (STICKY) -->
    <div class="sticky top-0 z-50 shadow-md">
        <header class="bg-amber-500 px-4 h-14 flex items-center gap-3">
            <a href="index.html" aria-label="Kembali" class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition"><i class="fas fa-chevron-left"></i></a>
            <div class="flex-1 min-w-0"><h1 class="text-white font-bold text-sm leading-tight truncate">Koleksi Handout</h1><p id="sub" class="text-white/80 text-[10px] leading-tight truncate">Memuat rak buku…</p></div>
            <button id="btnCari" onclick="tglCari()" aria-label="Cari" class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition"><i class="fas fa-search"></i></button>
            <a href="profil.html" aria-label="Profil" class="shrink-0 w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white border border-white/30"><i class="fas fa-user text-sm"></i></a>
        </header>
        <div id="boxCari" class="hidden bg-amber-500 px-4 pb-3">
            <div class="bg-white rounded-xl flex items-center px-3 py-2 shadow-sm"><i class="fas fa-search text-slate-400 text-sm mr-2"></i><input id="q" type="text" placeholder="Cari judul, kategori, atau isi ringkasan…" class="w-full bg-transparent outline-none text-slate-700 text-sm placeholder-slate-400" oninput="cariTunda()"><button onclick="hapusCari()" class="text-slate-300 hover:text-slate-500 ml-2"><i class="fas fa-circle-xmark"></i></button></div>
        </div>
        <nav id="tabs" class="bg-white border-b border-slate-200 flex overflow-x-auto hide-scrollbar px-2"></nav>
    </div>

    <main class="flex-grow p-4">
        <div id="sLoading" class="grid grid-cols-2 gap-3"></div>
        <div id="sKosong" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-4xl mb-4 text-slate-300"><i class="fas fa-folder-open"></i></div>
            <h3 class="font-bold text-slate-700 text-base mb-1" id="kosongJudul">Rak Kosong</h3>
            <p class="text-xs text-slate-500 max-w-[260px] mx-auto leading-relaxed" id="kosongPesan">Belum ada handout yang diunggah.</p>
            <button id="btnUlang" onclick="location.reload()" class="hidden mt-4 bg-amber-500 text-white text-xs font-bold px-5 py-2.5 rounded-full active:scale-95"><i class="fas fa-rotate mr-1.5"></i>Muat Ulang</button>
        </div>
        <div id="grid" class="hidden grid grid-cols-2 gap-3"></div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center shrink-0"><p class="text-[9px] text-slate-400 font-medium">&copy; 2026 Platform Argumentasi.</p></footer>
</div>

<div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[100] w-11/12 max-w-sm pointer-events-none"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS = [['semua', '📚 Semua'], ['modul', '📝 Modul Ajar'], ['buku', '📖 Buku Referensi']];
let semua = [], tab = 'semua', kueri = '', timer = null;

$('sLoading').innerHTML = [1, 2, 3, 4].map(() => '<div class="bg-white rounded-2xl border border-slate-100 p-3"><div class="sk aspect-[3/4] rounded-lg mb-3"></div><div class="sk h-3 w-5/6 rounded mb-2"></div><div class="sk h-3 w-1/2 rounded"></div></div>').join('');

function toast(msg, err) {
    const t = document.createElement('div');
    t.className = `${err ? 'bg-red-500' : 'bg-slate-800'} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 mb-2 item`;
    t.innerHTML = `<i class="fas ${err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400'}"></i><span class="flex-1">${esc(msg)}</span>`;
    $('toast').appendChild(t); setTimeout(() => t.remove(), 2800);
}
const slug = s => String(s || 'handout').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'handout';

/* ---------- Unduh mandiri ---------- */
window.unduhFile = async function (url, judul, tombol) {
    const ikon = tombol && tombol.innerHTML; if (tombol) { tombol.disabled = true; tombol.innerHTML = '<i class="fas fa-circle-notch fa-spin text-[10px]"></i>'; }
    try {
        const r = await fetch(url, { mode: 'cors' }); if (!r.ok) throw new Error('http ' + r.status);
        const b = await r.blob(), a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = slug(judul) + '.pdf'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('Unduhan dimulai.');
    } catch (e) { console.warn('Unduh langsung gagal, buka tab baru:', e); window.open(url, '_blank', 'noopener'); toast('File dibuka di tab baru. Simpan dari sana.'); }
    finally { if (tombol) { tombol.disabled = false; tombol.innerHTML = ikon; } }
};

/* ---------- Cover dari halaman pertama PDF (cadangan bila belum ada) ---------- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfLibP = null, antri = [], jalan = 0;
function muatPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return pdfLibP || (pdfLibP = new Promise((ok, no) => { const s = document.createElement('script'); s.src = PDFJS; s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER; ok(pdfjsLib); }; s.onerror = () => { pdfLibP = null; no(new Error('pdf.js gagal dimuat')); }; document.head.appendChild(s); }));
}
async function buatCover(h) {
    const lib = await muatPdfJs(), task = lib.getDocument({ url: h.fileUrl });
    const pdf = await task.promise;
    try {
        const p = await pdf.getPage(1), v1 = p.getViewport({ scale: 1 }), vp = p.getViewport({ scale: 280 / v1.width });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        return { data: c.toDataURL('image/jpeg', 0.72), halaman: pdf.numPages };
    } finally { pdf.destroy(); }
}
function jalankan() {
    while (jalan < 2 && antri.length) {
        const h = antri.shift(); jalan++;
        (async () => {
            try {
                let hasil = null; try { hasil = JSON.parse(sessionStorage.getItem('cv_' + h.id) || 'null'); } catch (e) {}
                if (!hasil) { hasil = await buatCover(h); try { sessionStorage.setItem('cv_' + h.id, JSON.stringify(hasil)); } catch (e) {} }
                pasangCover(h.id, hasil.data, hasil.halaman);
            } catch (e) { console.warn('Cover tidak bisa dibuat untuk', h.judul, e && e.message); }
            finally { jalan--; jalankan(); }
        })();
    }
}
function pasangCover(id, data, halaman) {
    const el = document.querySelector(`[data-cover="${id}"]`); if (!el) return;
    el.innerHTML = `<img src="${data}" alt="" class="w-full h-full object-cover spine">${el.dataset.badge || ''}`;
    if (halaman) { const b = document.createElement('div'); b.className = 'absolute bottom-2 left-2 bg-black/60 text-white text-[8px] font-bold px-1.5 py-0.5 rounded'; b.textContent = halaman + ' hal'; el.appendChild(b); }
}
const pengamat = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { pengamat.unobserve(e.target); const h = semua.find(x => x.id === e.target.dataset.cover); if (h) { antri.push(h); jalankan(); } } }), { rootMargin: '300px' }) : null;

/* ---------- Tampilan ---------- */
function cocok(h, k) { const kat = (h.kategori || '').toLowerCase(); return k === 'semua' || kat.includes(k); }
function renderTabs() {
    $('tabs').innerHTML = TABS.map(([k, l]) => `<button onclick="ubahTab('${k}')" class="flex-1 min-w-[110px] py-3 text-center text-[11px] uppercase tracking-wider whitespace-nowrap transition-all ${tab === k ? 'tab-on' : 'tab-off'}">${l} <span class="text-[10px] opacity-60">${semua.filter(h => cocok(h, k)).length}</span></button>`).join('');
}
function daftar() {
    const q = kueri.trim().toLowerCase();
    return semua.filter(h => cocok(h, tab) && (!q || (h.judul + ' ' + h.kategori + ' ' + (h.deskripsi || '')).toLowerCase().includes(q)));
}
function kartu(h, i) {
    const badge = '<div class="absolute top-2 right-2 bg-red-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow-sm tracking-wider">PDF</div>';
    const ukuran = h.ukuranFile ? `${h.ukuranFile} MB` : 'PDF';
    const cover = h.coverImage
        ? `<img src="${esc(h.coverImage)}" alt="" loading="lazy" class="w-full h-full object-cover spine" onerror="this.parentNode.dataset.rusak=1;window.__coverRusak&&window.__coverRusak('${esc(h.id)}')">${badge}${h.halaman ? `<div class="absolute bottom-2 left-2 bg-black/60 text-white text-[8px] font-bold px-1.5 py-0.5 rounded">${esc(h.halaman)} hal</div>` : ''}`
        : `<div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-amber-100 to-amber-200 p-3 text-center"><i class="fas fa-file-pdf text-3xl text-amber-500 mb-2"></i><p class="text-[10px] font-bold text-amber-800 lc2 leading-snug">${esc(h.judul)}</p></div>${badge}`;
    return `<article class="item bg-white rounded-2xl shadow-sm border border-slate-100 p-3 flex flex-col hover:border-amber-400 transition" style="animation-delay:${Math.min(i, 10) * 40}ms">
        <button data-act="baca" data-id="${esc(h.id)}" data-cover="${esc(h.id)}" data-badge='${badge}' class="relative w-full aspect-[3/4] rounded-lg overflow-hidden mb-3 shadow-sm bg-slate-100 block text-left" aria-label="Baca ${esc(h.judul)}">${cover}</button>
        <h3 class="font-bold text-slate-800 text-[12px] leading-snug lc2 mb-1">${esc(h.judul)}</h3>
        <p class="text-[9px] text-slate-500 mb-3 lc1">${esc(h.kategori)} • ${esc(ukuran)}</p>
        <div class="mt-auto flex gap-1.5">
            <button data-act="baca" data-id="${esc(h.id)}" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white text-[11px] font-bold py-2 rounded-lg transition active:scale-95"><i class="fas fa-book-open mr-1"></i>Baca</button>
            <button data-act="unduh" data-id="${esc(h.id)}" title="Unduh" aria-label="Unduh" class="w-9 flex items-center justify-center bg-slate-50 border border-slate-200 text-slate-500 hover:bg-emerald-500 hover:text-white hover:border-emerald-500 rounded-lg transition active:scale-95"><i class="fas fa-download text-[11px]"></i></button>
        </div></article>`;
}
function tampil() {
    const arr = daftar(); renderTabs();
    $('sub').textContent = semua.length ? `${arr.length} dari ${semua.length} dokumen` : 'Belum ada dokumen';
    if (!arr.length) {
        $('grid').classList.add('hidden'); $('sKosong').classList.replace('hidden', 'flex');
        $('kosongJudul').textContent = kueri ? 'Tidak ditemukan' : 'Rak Kosong';
        $('kosongPesan').textContent = kueri ? 'Tidak ada handout yang cocok dengan pencarianmu.' : (semua.length ? 'Belum ada dokumen di kategori ini.' : 'Belum ada handout yang diunggah.');
        $('btnUlang').classList.add('hidden'); return;
    }
    $('sKosong').classList.replace('flex', 'hidden');
    $('grid').innerHTML = arr.map(kartu).join(''); $('grid').classList.remove('hidden');
    arr.forEach(h => { const el = document.querySelector(`[data-cover="${h.id}"]`); if (el && !h.coverImage && pengamat) pengamat.observe(el); });
}
window.__coverRusak = id => { const h = semua.find(x => x.id === id), el = document.querySelector(`[data-cover="${id}"]`); if (h && el && pengamat) { h.coverImage = ''; el.innerHTML = '<div class="w-full h-full sk"></div>'; antri.push(h); jalankan(); } };

window.ubahTab = k => { tab = k; tampil(); window.scrollTo({ top: 0 }); };
window.tglCari = () => { const b = $('boxCari'); b.classList.toggle('hidden'); if (!b.classList.contains('hidden')) $('q').focus(); };
window.hapusCari = () => { $('q').value = ''; kueri = ''; tampil(); };
window.cariTunda = () => { clearTimeout(timer); timer = setTimeout(() => { kueri = $('q').value; tampil(); }, 200); };

$('grid').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const h = semua.find(x => x.id === b.dataset.id); if (!h) return;
    if (b.dataset.act === 'baca') location.href = 'view-pdf.html?id=' + encodeURIComponent(h.id);
    else unduhFile(h.fileUrl, h.judul, b);
});

/* ---------- Dipanggil oleh pemuat Firestore ---------- */
window.muatData = list => { semua = list; $('sLoading').classList.add('hidden'); tampil(); };
window.galat = pesan => { $('sLoading').classList.add('hidden'); $('sub').textContent = 'Gagal memuat'; $('sKosong').classList.replace('hidden', 'flex'); $('kosongJudul').textContent = 'Gagal Memuat'; $('kosongPesan').textContent = pesan; $('btnUlang').classList.remove('hidden'); };
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const db = getFirestore(initializeApp({ apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" }));
try {
    // Tanpa orderBy agar dokumen tanpa createdAt tetap tampil; diurutkan di sisi klien.
    const snap = await getDocs(collection(db, "handouts"));
    const ms = t => t ? (t.toMillis ? t.toMillis() : new Date(t).getTime() || 0) : 0;
    const list = [];
    snap.forEach(d => { const v = d.data();
        if (!v.fileUrl || v.status === 'draft' || v.status === 'dihapus') return;
        list.push({ id: d.id, judul: v.judul || 'Handout Tanpa Judul', coverImage: v.coverImage || '', fileUrl: v.fileUrl, ukuranFile: v.ukuranFile || '', kategori: v.kategori || 'Bahan Ajar', halaman: v.halaman || '', deskripsi: v.deskripsi || '', t: ms(v.createdAt) }); });
    list.sort((a, b) => b.t - a.t);
    window.muatData(list);
} catch (e) { console.error("Firebase Error:", e); window.galat('Terjadi gangguan jaringan saat memuat rak buku. Silakan muat ulang.'); }
</script>
</body>
</html>
