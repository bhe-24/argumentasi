<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profil Saya - Argumentasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Cropper.js CSS (Untuk fitur Crop Foto) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } 
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .modal-z { z-index: 99999 !important; }
        
        /* Hilangkan scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .list-item-active:active { background-color: #f8fafc; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- CONTAINER UTAMA (Mobile App Frame) -->
    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">
        
        <!-- HEADER -->
        <header class="bg-white flex items-center px-4 py-4 sticky top-0 z-20 shadow-sm">
            <a href="index.html" class="text-slate-800 text-xl px-2 py-1 hover:text-brand-green transition-colors">
                <i class="fas fa-chevron-left"></i>
            </a>
            <h1 class="text-lg font-bold text-slate-800 ml-4">Profil Siswa</h1>
        </header>

        <!-- MAIN KONTEN -->
        <div class="flex-grow overflow-y-auto hide-scrollbar pb-10 pt-4 px-4">
            
            <!-- KARTU 1: DATA DIRI -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden mb-6">
                
                <!-- Foto (Base64) - DIUBAH KLIKNYA KE PREVIEW -->
                <div class="flex justify-between items-center p-4 border-b border-slate-100 cursor-pointer list-item-active transition-colors" onclick="bukaPreviewModal()">
                    <span class="text-[14px] text-slate-700">Foto</span>
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center shrink-0">
                            <img id="profilImage" src="" alt="Foto" class="w-full h-full object-cover hidden">
                            <i id="profilIcon" class="fas fa-user text-slate-400 text-sm"></i>
                        </div>
                        <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                    </div>
                </div>
                <!-- Hidden File Input untuk Base64 -->
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="prosesFoto(event)">

                <!-- Nama Lengkap -->
                <div class="flex justify-between items-center p-4 border-b border-slate-100 cursor-pointer list-item-active transition-colors" onclick="bukaEditModal('nama')">
                    <span class="text-[14px] text-slate-700">Nama Lengkap</span>
                    <div class="flex items-center gap-3">
                        <span id="textNama" class="text-[13px] text-slate-500 font-medium">Belum diatur</span>
                        <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                    </div>
                </div>

                <!-- No Handphone -->
                <div class="flex justify-between items-center p-4 border-b border-slate-100 cursor-pointer list-item-active transition-colors" onclick="bukaEditModal('nohp')">
                    <span class="text-[14px] text-slate-700">No. Handphone</span>
                    <div class="flex items-center gap-3">
                        <span id="textNohp" class="text-[13px] text-slate-500 font-medium">Belum diatur</span>
                        <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                    </div>
                </div>

                <!-- Tanggal Lahir -->
                <div class="flex justify-between items-center p-4 cursor-pointer list-item-active transition-colors" onclick="bukaEditModal('tgllahir')">
                    <span class="text-[14px] text-slate-700">Tanggal Lahir</span>
                    <div class="flex items-center gap-3">
                        <span id="textTglLahir" class="text-[13px] text-slate-500 font-medium">Belum diatur</span>
                        <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- KARTU 2: AKSI BAHAYA -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="flex justify-between items-center p-4 cursor-pointer hover:bg-red-50 transition-colors" onclick="konfirmasiHapusAkun()">
                    <span class="text-[14px] text-red-500 font-medium">Ajukan Penghapusan Akun</span>
                    <i class="fas fa-chevron-right text-red-300 text-xs"></i>
                </div>
            </div>

            <p class="text-center text-[10px] text-slate-400 mt-6 px-4">
                Data profil siswa disimpan secara aman di perangkat lokal Anda dan tidak dikirim ke server publik.
            </p>

        </div>
    </div>

    <!-- MODAL EDIT DATA (Teks) -->
    <div id="modalEdit" class="fixed inset-0 bg-black/60 hidden modal-z flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-300 pb-0 sm:pb-10" onclick="if(event.target === this) tutupModal('modalEdit')">
        <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-2xl p-6 transform translate-y-full sm:translate-y-10 transition-transform duration-300 relative">
            <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-5 sm:hidden"></div>
            
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800 mb-4">Edit Data</h3>
            
            <div id="inputContainer">
                <input type="text" id="editInput" class="w-full border-b-2 border-brand-green py-2 px-1 focus:outline-none text-slate-700 font-medium mb-6" placeholder="Ketik di sini...">
            </div>

            <div class="flex gap-3">
                <button onclick="tutupModal('modalEdit')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all text-sm">Batal</button>
                <button onclick="simpanEdit()" class="flex-1 bg-brand-green hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-md active:scale-95 text-sm">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL PREVIEW FOTO UTUH -->
    <div id="modalPreviewFoto" class="fixed inset-0 bg-black/80 hidden modal-z flex items-center justify-center opacity-0 transition-opacity duration-300" onclick="if(event.target === this) tutupModal('modalPreviewFoto')">
        <div class="w-full max-w-sm flex flex-col items-center transform scale-95 transition-transform duration-300 relative p-4">
            
            <button onclick="tutupModal('modalPreviewFoto')" class="absolute -top-12 right-4 text-white text-3xl opacity-80 hover:opacity-100">
                <i class="fas fa-times"></i>
            </button>

            <!-- Tampilan Foto Utuh -->
            <div class="w-64 h-64 sm:w-72 sm:h-72 rounded-full bg-slate-200 border-4 border-white overflow-hidden shadow-2xl flex items-center justify-center mb-8 relative">
                <img id="previewLargeImage" src="" class="w-full h-full object-cover hidden">
                <i id="previewLargeIcon" class="fas fa-user text-slate-400 text-7xl"></i>
            </div>
            
            <button onclick="document.getElementById('fileInput').click()" class="bg-white text-slate-800 font-bold py-3.5 px-8 rounded-full shadow-lg hover:bg-slate-100 transition-colors active:scale-95 flex items-center gap-3 text-sm">
                <i class="fas fa-camera text-brand-green"></i> Ganti Foto Profil
            </button>
        </div>
    </div>

    <!-- MODAL CROP FOTO -->
    <div id="modalCrop" class="fixed inset-0 bg-black/95 hidden modal-z flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="w-full h-full sm:max-w-md sm:h-[85vh] sm:rounded-2xl bg-slate-900 flex flex-col transform scale-95 transition-transform duration-300 overflow-hidden">
            
            <!-- Header Crop -->
            <div class="flex justify-between items-center px-4 py-4 bg-slate-800 text-white shrink-0">
                <h3 class="font-bold">Sesuaikan Foto</h3>
                <button onclick="tutupModalCrop()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>

            <!-- Area Cropper -->
            <div class="flex-grow relative bg-black flex items-center justify-center overflow-hidden">
                <img id="imageToCrop" src="" class="max-w-full max-h-full block">
            </div>

            <!-- Footer Crop -->
            <div class="p-4 bg-slate-800 shrink-0 flex gap-3">
                <button onclick="tutupModalCrop()" class="flex-1 bg-slate-700 text-white font-bold py-3.5 rounded-xl hover:bg-slate-600 transition-colors active:scale-95 text-sm">Batal</button>
                <button onclick="simpanCrop()" class="flex-1 bg-brand-green text-white font-bold py-3.5 rounded-xl hover:bg-emerald-600 transition-colors active:scale-95 text-sm">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Container Toast -->
    <div id="toastContainer" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100000] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        // Variabel global
        let currentEditField = '';
        let cropper = null; // Menyimpan instansi Cropper.js

        // --- SISTEM PENYIMPANAN LOKAL (ANONIM) ---
        const keys = {
            nama: 'namaSiswaCendekia',
            foto: 'fotoSiswaCendekia',
            nohp: 'noHpSiswaCendekia',
            tgllahir: 'tglLahirSiswaCendekia'
        };

        // Memuat Data saat halaman dibuka
        document.addEventListener('DOMContentLoaded', loadProfileData);

        function loadProfileData() {
            // Load Nama
            const nama = localStorage.getItem(keys.nama);
            if(nama) document.getElementById('textNama').innerText = nama;

            // Load No HP
            const nohp = localStorage.getItem(keys.nohp);
            if(nohp) document.getElementById('textNohp').innerText = nohp;

            // Load Tgl Lahir
            const tgl = localStorage.getItem(keys.tgllahir);
            if(tgl) document.getElementById('textTglLahir').innerText = tgl;

            // Load Foto Base64
            const foto = localStorage.getItem(keys.foto);
            if(foto) {
                const img = document.getElementById('profilImage');
                img.src = foto;
                img.classList.remove('hidden');
                document.getElementById('profilIcon').classList.add('hidden');
            }
        }

        // --- SISTEM PREVIEW & CROP FOTO ---
        
        // 1. Tampilkan modal preview sebelum ganti foto
        function bukaPreviewModal() {
            const foto = localStorage.getItem(keys.foto);
            const imgEl = document.getElementById('previewLargeImage');
            const iconEl = document.getElementById('previewLargeIcon');

            if(foto) {
                imgEl.src = foto;
                imgEl.classList.remove('hidden');
                iconEl.classList.add('hidden');
            } else {
                imgEl.classList.add('hidden');
                iconEl.classList.remove('hidden');
            }
            
            bukaModal('modalPreviewFoto');
        }

        // 2. Saat file foto dipilih
        function prosesFoto(event) {
            const file = event.target.files[0];
            if(file) {
                // Batasi max 5MB (diperbesar karena proses crop biasanya mengecilkan ukuran)
                if(file.size > 5 * 1024 * 1024) {
                    showToast("Ukuran foto terlalu besar. Maksimal 5MB.", true);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    // Tutup modal preview dengan cepat secara paksa
                    document.getElementById('modalPreviewFoto').classList.add('opacity-0');
                    setTimeout(() => document.getElementById('modalPreviewFoto').classList.add('hidden'), 100);

                    // Siapkan gambar untuk di crop
                    const imageToCrop = document.getElementById('imageToCrop');
                    imageToCrop.src = e.target.result;

                    // Buka modal crop
                    bukaModal('modalCrop');

                    // Inisialisasi Cropper setelah modal dirender
                    setTimeout(() => {
                        if (cropper) cropper.destroy(); // Hapus sisa cropper lama jika ada
                        
                        cropper = new Cropper(imageToCrop, {
                            aspectRatio: 1, // Memaksa kotak crop 1:1 (Persegi)
                            viewMode: 1,    // Membatasi crop box agar tidak keluar dari gambar
                            dragMode: 'move', // Menggeser gambar
                            autoCropArea: 0.9,
                            restore: false,
                            guides: true,
                            center: true,
                            highlight: false,
                            cropBoxMovable: true,
                            cropBoxResizable: true,
                            toggleDragModeOnDblclick: false,
                        });
                    }, 300);
                };
                reader.readAsDataURL(file);
            }
        }

        // 3. Saat klik Simpan di modal crop
        function simpanCrop() {
            if (!cropper) return;

            // Dapatkan hasil gambar yang ter-crop dengan ukuran wajar agar performa tetap baik
            const canvas = cropper.getCroppedCanvas({
                width: 500,
                height: 500,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            // Ubah menjadi Base64 (Format JPEG, kualitas 80% untuk menghemat storage lokal)
            const base64Data = canvas.toDataURL('image/jpeg', 0.8);
            
            // Simpan ke local storage
            localStorage.setItem(keys.foto, base64Data);
            
            // Update UI di list profil utama
            const img = document.getElementById('profilImage');
            img.src = base64Data;
            img.classList.remove('hidden');
            document.getElementById('profilIcon').classList.add('hidden');
            
            showToast("Foto profil berhasil diperbarui.");
            tutupModalCrop();
        }

        // Khusus untuk menutup modal crop dan menghancurkan memory cropper
        function tutupModalCrop() {
            tutupModal('modalCrop');
            setTimeout(() => {
                if (cropper) {
                    cropper.destroy();
                    cropper = null;
                }
                document.getElementById('fileInput').value = ''; // Reset file input
            }, 300);
        }

        // --- SISTEM EDIT MODAL TEKS ---
        function bukaEditModal(field) {
            currentEditField = field;
            const input = document.getElementById('editInput');
            const title = document.getElementById('modalTitle');
            
            if(field === 'nama') {
                title.innerText = "Ubah Nama Lengkap";
                input.type = "text";
                input.placeholder = "Nama Lengkap Anda";
                input.value = localStorage.getItem(keys.nama) || '';
            } else if(field === 'nohp') {
                title.innerText = "Ubah No. Handphone";
                input.type = "tel";
                input.placeholder = "08xxxxxxxxxx";
                input.value = localStorage.getItem(keys.nohp) || '';
            } else if(field === 'tgllahir') {
                title.innerText = "Ubah Tanggal Lahir";
                input.type = "date";
                input.value = localStorage.getItem(keys.tgllahir) || '';
            }

            bukaModal('modalEdit');
            setTimeout(() => input.focus(), 100);
        }

        function simpanEdit() {
            const val = document.getElementById('editInput').value.trim();
            
            if(currentEditField === 'nama') {
                if(val === '') { showToast("Nama tidak boleh kosong", true); return; }
                localStorage.setItem(keys.nama, val);
                document.getElementById('textNama').innerText = val;
            } 
            else if(currentEditField === 'nohp') {
                localStorage.setItem(keys.nohp, val);
                document.getElementById('textNohp').innerText = val || 'Belum diatur';
            } 
            else if(currentEditField === 'tgllahir') {
                localStorage.setItem(keys.tgllahir, val);
                document.getElementById('textTglLahir').innerText = val || 'Belum diatur';
            }

            showToast("Data berhasil disimpan.");
            tutupModal('modalEdit');
        }

        // --- SISTEM HAPUS AKUN ANONIM ---
        function konfirmasiHapusAkun() {
            const konfirmasi = confirm("PERINGATAN!\n\nApakah Anda yakin ingin menghapus akun? Semua data profil, skor XP, dan riwayat belajar di perangkat ini akan dihapus permanen.");
            
            if(konfirmasi) {
                localStorage.removeItem(keys.nama);
                localStorage.removeItem(keys.foto);
                localStorage.removeItem(keys.nohp);
                localStorage.removeItem(keys.tgllahir);
                localStorage.removeItem('latihanPointsCendekia');
                localStorage.removeItem('kreasiPointsArg'); 
                localStorage.removeItem('kelasPointsArg');

                showToast("Akun berhasil dihapus. Mengalihkan...");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            }
        }

        // --- UTILITY MODAL & TOAST ---
        function bukaModal(id) {
            const modal = document.getElementById(id);
            const box = modal.querySelector('div');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                // Support animasi dari bawah (modalEdit) dan animasi skala (modalCrop/modalPreviewFoto)
                if (box.classList.contains('translate-y-full')) {
                    box.classList.remove('translate-y-full', 'sm:translate-y-10');
                    box.classList.add('translate-y-0');
                } else if (box.classList.contains('scale-95')) {
                    box.classList.remove('scale-95');
                    box.classList.add('scale-100');
                }
            });
        }

        function tutupModal(id) {
            const modal = document.getElementById(id);
            const box = modal.querySelector('div');
            modal.classList.add('opacity-0');
            
            if (box.classList.contains('translate-y-0')) {
                box.classList.remove('translate-y-0');
                box.classList.add('translate-y-full', 'sm:translate-y-10');
            } else if (box.classList.contains('scale-100')) {
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
            }
            
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = isError ? 'bg-red-500' : 'bg-slate-800';
            const iconClass = isError ? 'fa-exclamation-circle' : 'fa-check-circle text-emerald-400';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-3 transform translate-y-[-20px] opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fas ${iconClass} text-lg"></i> <span>${msg}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
