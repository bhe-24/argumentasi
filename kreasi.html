<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:["Poppins","sans-serif"],reading:["Merriweather","serif"]}}}}</script>
<script src="kreasi-core.js"></script><title>Ruang Kreasi - Argumentasi</title></head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col overflow-x-hidden sm:border-x border-slate-200 fade-in">
<div id="hdr"></div>
<div class="flex-grow overflow-y-auto hide-scrollbar pb-10">

  <!-- HERO -->
  <div class="m-4 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden" style="background:linear-gradient(135deg,#7c3aed,#4f46e5 60%,#0ea5e9)">
    <div class="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-white/10"></div>
    <p class="text-[10px] uppercase tracking-widest text-white/70 font-semibold">Level <span id="lvNum"></span></p>
    <h2 id="lvTitle" class="text-xl font-extrabold leading-tight"></h2>
    <div class="h-2 bg-white/20 rounded-full mt-3 overflow-hidden"><div id="lvBar" class="h-full bg-amber-300 rounded-full transition-all duration-700" style="width:0"></div></div>
    <p class="text-[10px] text-white/80 mt-1.5"><span id="lvXp"></span> XP menuju level berikutnya</p>
    <a id="ctaMain" href="kreasi-ide.html" class="btn mt-4 bg-white text-purple-700 py-3 text-sm shadow-md"><i class="fas fa-rocket"></i> <span id="ctaText">Mulai Misi Menulis</span></a>
  </div>

  <!-- PERJALANAN -->
  <div class="px-4">
    <h3 class="font-bold text-slate-800 text-sm mb-3">Perjalanan Menulis</h3>
    <div id="jalan" class="space-y-2.5"></div>
  </div>

  <!-- TANTANGAN HARIAN -->
  <div class="px-4 mt-6">
    <div class="rounded-2xl p-4 bg-amber-50 border border-amber-200 flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl shrink-0"><i class="fas fa-bolt"></i></div>
      <div class="flex-1 min-w-0"><p class="text-[9px] font-bold text-amber-600 uppercase tracking-widest">Tantangan Hari Ini</p><p id="tantangan" class="text-xs font-semibold text-slate-700 leading-snug"></p></div>
      <a id="tantanganGo" class="btn bg-amber-500 text-white text-[11px] px-3 py-2 shrink-0">Ambil</a>
    </div>
  </div>

  <!-- LENCANA -->
  <div class="px-4 mt-6"><h3 class="font-bold text-slate-800 text-sm mb-3">Lencana</h3><div id="lencana" class="grid grid-cols-5 gap-2"></div></div>

  <!-- KARYA SAYA -->
  <div class="px-4 mt-6"><h3 class="font-bold text-slate-800 text-sm mb-3">Karya Saya</h3><div id="karya" class="space-y-2"></div></div>

  <!-- CONTOH STRUKTUR (Firestore) -->
  <div class="px-4 mt-6">
    <h3 class="font-bold text-slate-800 text-sm mb-3">Inspirasi Struktur Teks</h3>
    <div id="ref" class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm"><div class="p-4"><div class="sk h-3 w-1/2 mb-2"></div><div class="sk h-3 w-full"></div></div></div>
  </div>
</div>
</div>

<script>
K.mountHeader('Ruang Kreasi','index.html');
const p=K.profile(), L=K.level(p.xp), d=K.draft();
document.getElementById('lvNum').textContent=L.lv; document.getElementById('lvTitle').textContent=L.title;
document.getElementById('lvXp').textContent=(L.next-L.cur); setTimeout(()=>document.getElementById('lvBar').style.width=L.pct+'%',100);

const adaIde=d&&d.ide, adaTulis=d&&(d.tesis||d.argumen||d.kesimpulan), adaHasil=d&&d.result;
if(adaIde){document.getElementById('ctaText').textContent=adaHasil?'Lihat Naskah Jadi':'Lanjutkan Menulis';document.getElementById('ctaMain').href=adaHasil?'kreasi-hasil.html':'kreasi-tulis.html';}
const step=(n,ico,judul,ket,href,st)=>`<a href="${href}" class="flex items-center gap-3 bg-white p-3 rounded-2xl border ${st==='now'?'border-purple-300 shadow-md':'border-slate-100'} active:scale-[.98] transition">
  <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0 ${st==='done'?'bg-emerald-100 text-emerald-600':st==='now'?'bg-purple-100 text-purple-600':'bg-slate-100 text-slate-400'}"><i class="fas ${st==='done'?'fa-check':ico}"></i></div>
  <div class="flex-1 min-w-0"><p class="text-xs font-bold text-slate-800">${n}. ${judul}</p><p class="text-[10px] text-slate-500 truncate">${ket}</p></div><i class="fas fa-chevron-right text-slate-300 text-xs"></i></a>`;
document.getElementById('jalan').innerHTML=
 step(1,'fa-lightbulb','Pilih Ide & Bahan Informasi',adaIde?d.ide.judul:'Cari ide dari AI atau tulis idemu sendiri','kreasi-ide.html',adaIde?'done':'now')+
 step(2,'fa-pen-nib','Tulis & Revisi',adaTulis?'Draf sedang dikerjakan':'Susun tesis, argumen, kesimpulan dengan bantuan mentor AI',adaIde?'kreasi-tulis.html':'kreasi-ide.html',adaHasil?'done':adaIde?'now':'todo')+
 step(3,'fa-scroll','Naskah Jadi','Lihat nilai rubrik, salin, bagikan, atau cetak',adaHasil?'kreasi-hasil.html':'kreasi-ide.html',adaHasil?'now':'todo');

const T=[['Teknologi','Haruskah ponsel dilarang di sekolah?'],['Lingkungan','Perlukah plastik sekali pakai dilarang di kantin sekolah?'],['Pendidikan','Apakah PR masih diperlukan?'],['Kesehatan','Pantaskah minuman manis dikenai cukai?'],['Sosial','Apakah media sosial membuat remaja lebih peduli atau lebih cuek?'],['Budaya','Perlukah bahasa daerah menjadi pelajaran wajib?'],['Pendidikan','Sekolah lima hari: untung atau buntung?']];
const tt=T[new Date().getDay()]; document.getElementById('tantangan').textContent=tt[1];
document.getElementById('tantanganGo').href='kreasi-ide.html?tema='+encodeURIComponent(tt[0])+'&judul='+encodeURIComponent(tt[1]);

document.getElementById('lencana').innerHTML=Object.entries(K.BADGES).map(([id,[n,i]])=>{const on=p.badges.includes(id);return `<div class="text-center"><div class="w-12 h-12 mx-auto rounded-2xl flex items-center justify-center text-lg ${on?'bg-gradient-to-br from-amber-300 to-orange-400 text-white shadow':'bg-slate-200 text-slate-400'}"><i class="fas ${on?i:'fa-lock'}"></i></div><p class="text-[8px] font-semibold mt-1 ${on?'text-slate-700':'text-slate-400'} leading-tight">${n}</p></div>`}).join('');

const ks=K.karya();
document.getElementById('karya').innerHTML=ks.length?ks.slice(0,5).map(k=>`<a href="kreasi-hasil.html?id=${k.id}" class="flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-100 active:scale-[.98] transition"><div class="w-11 h-11 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-extrabold text-sm shrink-0">${k.skor}</div><div class="flex-1 min-w-0"><p class="text-xs font-bold text-slate-800 lc2 leading-snug">${K.esc(k.judul)}</p><p class="text-[9px] text-slate-400 mt-0.5">${new Date(k.tanggal).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</p></div><i class="fas fa-chevron-right text-slate-300 text-xs"></i></a>`).join(''):'<div class="text-center py-6 bg-white rounded-2xl border border-dashed border-slate-200 text-[11px] text-slate-400"><i class="fas fa-feather text-2xl text-slate-300 mb-2 block"></i>Belum ada karya. Selesaikan misi pertamamu!</div>';
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getFirestore,collection,query,where,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",projectId:"mading-cf676"}));
const box=document.getElementById('ref');
try{
 const s=await getDocs(query(collection(db,"materials"),where("kategori","==","argumentasi"),limit(5)));
 const a=[];s.forEach(x=>{const v=x.data();if(v.status!=='draft'&&v.status!=='dihapus')a.push({id:x.id,...v})});
 if(!a.length)throw 0;
 const m=a[Math.floor(Math.random()*a.length)];
 const ps=(m.isi||m.konten||'').replace(/<\/(p|h\d|li)>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').split('\n').map(t=>t.trim()).filter(t=>t.length>25);
 const sh=(t)=>K.esc((t||'-').slice(0,230))+((t||'').length>230?'…':'');
 box.innerHTML=`<div class="bg-slate-900 p-4"><span class="bg-white/20 text-white text-[8px] font-bold px-2 py-0.5 rounded uppercase tracking-widest">Contoh dari Galeri</span><h4 class="font-bold text-white text-sm mt-1.5 leading-snug lc2">${K.esc(m.judul)}</h4></div>
 <div class="p-4 space-y-3 font-reading">
  <div class="border-l-2 border-emerald-400 pl-3"><b class="text-[10px] text-emerald-600 font-sans">Tesis</b><p class="text-xs text-slate-600 italic">${sh(ps[0])}</p></div>
  <div class="border-l-2 border-amber-400 pl-3"><b class="text-[10px] text-amber-600 font-sans">Argumen</b><p class="text-xs text-slate-600 italic">${sh(ps[1])}</p></div>
  <div class="border-l-2 border-blue-400 pl-3"><b class="text-[10px] text-blue-600 font-sans">Kesimpulan</b><p class="text-xs text-slate-600 italic">${sh(ps[ps.length-1])}</p></div>
  <a href="baca.html?id=${m.id}" class="block text-center text-[11px] font-bold text-purple-600 font-sans">Baca selengkapnya <i class="fas fa-arrow-right"></i></a></div>`;
}catch(e){box.innerHTML='<p class="p-4 text-center text-xs text-slate-400">Contoh belum tersedia.</p>'}
</script>
</body></html>
