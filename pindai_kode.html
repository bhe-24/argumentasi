<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pindai Kode Kelas - Argumentasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } 
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; /* Latar gelap untuk mode scanner */ -webkit-tap-highlight-color: transparent; }
        
        /* Hide Scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CUSTOM SCANNER OVERLAY */
        #reader { width: 100%; border-radius: 1rem; overflow: hidden; border: none !important; }
        #reader video { object-fit: cover; border-radius: 1rem; }
        
        .scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            z-index: 20;
            pointer-events: none;
        }

        /* Sudut Bingkai Scanner */
        .corner { position: absolute; width: 40px; height: 40px; border-color: #10b981; border-style: solid; }
        .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 16px; }
        .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 16px; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 16px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 16px; }

        /* Garis Pindai Laser */
        .laser-line {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 2px;
            background: #10b981;
            box-shadow: 0 0 10px 2px rgba(16, 185, 129, 0.7);
            animation: scanning 2.5s infinite linear;
        }

        @keyframes scanning {
            0% { top: 5%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }
    </style>
</head>
<body class="flex justify-center min-h-screen text-slate-100">

    <!-- CONTAINER UTAMA -->
    <div class="w-full max-w-md bg-slate-900 relative min-h-screen shadow-2xl flex flex-col overflow-hidden sm:border-x border-slate-800 fade-in">
        
        <!-- HEADER STICKY -->
        <header class="fixed w-full max-w-md z-50 px-4 py-4 flex items-center justify-between bg-gradient-to-b from-slate-900 to-transparent">
            <button onclick="kembali()" class="w-10 h-10 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white/20 transition-colors">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="text-sm font-bold text-white tracking-widest uppercase bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full">Pindai Kode</h1>
            <div class="w-10 h-10"></div> <!-- Placeholder untuk keseimbangan flex -->
        </header>

        <!-- KONTEN SCANNER -->
        <main class="flex-grow flex flex-col items-center justify-center relative px-6 w-full">
            
            <div class="text-center mb-8 relative z-30">
                <i class="fas fa-qrcode text-4xl text-emerald-400 mb-3 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]"></i>
                <h2 class="text-xl font-bold text-white mb-1">Arahkan Kamera ke QR Code</h2>
                <p class="text-xs text-slate-400 max-w-[250px] mx-auto">Sistem akan secara otomatis memindai dan memasukkan Anda ke Ruang Kelas Guru.</p>
            </div>

            <!-- CAMERA BOX CONTAINER -->
            <div class="relative w-full max-w-[300px] aspect-square mx-auto bg-slate-800 rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.5)] overflow-hidden border border-slate-700">
                
                <!-- Pesan Loading/Izin -->
                <div id="cameraLoading" class="absolute inset-0 flex flex-col items-center justify-center z-10 p-6 text-center">
                    <i class="fas fa-circle-notch fa-spin text-3xl text-emerald-500 mb-3"></i>
                    <p class="text-xs font-bold text-slate-300 mb-1">Meminta Izin Kamera...</p>
                    <p class="text-[9px] text-slate-500">Pastikan browser Anda mengizinkan akses kamera untuk melanjutkan.</p>
                </div>

                <!-- Div Target HTML5 QR Code -->
                <div id="reader" class="w-full h-full absolute inset-0 z-0 opacity-0 transition-opacity duration-500"></div>

                <!-- OVERLAY EFEK SCANNER (Hanya muncul jika kamera aktif) -->
                <div id="scannerOverlay" class="scanner-frame hidden">
                    <div class="corner corner-tl"></div>
                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>
                    <div class="corner corner-br"></div>
                    <div class="laser-line"></div>
                </div>

            </div>

        </main>

        <!-- FOOTER / AKSI MANUAL -->
        <footer class="mt-auto px-6 pb-8 pt-6 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent relative z-30 text-center">
            <p class="text-[11px] text-slate-400 mb-4">Kamera bermasalah atau tidak punya kode QR?</p>
            
            <a href="class.html" class="w-full bg-white text-slate-900 hover:bg-slate-200 font-bold py-4 rounded-xl transition-all active:scale-95 flex items-center justify-center gap-2 shadow-lg">
                <i class="fas fa-keyboard text-brand-green"></i> Masukkan Kode Manual
            </a>
        </footer>

    </div>

    <!-- SCRIPT LOGIKA QR SCANNER REAL -->
    <script>
        let html5QrCode;

        function kembali() {
            // Hentikan kamera sebelum kembali agar tidak nyala di background
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    history.back();
                }).catch(err => {
                    history.back();
                });
            } else {
                history.back();
            }
        }

        // Efek Suara Bip (Murni JS, tanpa file audio)
        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) { console.error("Audio API error", e); }
        };

        // Inisialisasi Kamera saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            // Gunakan metode Html5Qrcode murni untuk kontrol UI penuh (tanpa tombol jelek bawaan library)
            html5QrCode = new Html5Qrcode("reader");

            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0 // Persegi
            };

            // Mulai scan menggunakan kamera belakang
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                (decodedText, decodedResult) => {
                    // JIKA BERHASIL MENDETEKSI QR CODE
                    html5QrCode.stop().then(() => {
                        // Mainkan suara Bip
                        playBeep();

                        // Berikan efek visual sebentar sebelum redirect
                        document.getElementById('scannerOverlay').innerHTML = `
                            <div class="absolute inset-0 flex items-center justify-center bg-emerald-500/20 backdrop-blur-sm rounded-xl">
                                <div class="w-16 h-16 bg-emerald-500 text-white rounded-full flex items-center justify-center text-3xl shadow-lg">
                                    <i class="fas fa-check"></i>
                                </div>
                            </div>
                        `;

                        // Lempar ke class.html dengan membawa parameter ID (Kode Kelas)
                        // Membersihkan spasi pada decodedText just in case
                        const kodeKelas = decodedText.trim();
                        setTimeout(() => {
                            window.location.href = `class.html?id=${kodeKelas}`;
                        }, 800);

                    }).catch(err => {
                        console.error("Gagal menghentikan kamera", err);
                        window.location.href = `class.html?id=${decodedText.trim()}`;
                    });
                },
                (errorMessage) => {
                    // Jika belum mendeteksi (berjalan terus setiap frame). Abaikan agar tidak spam console.
                }
            ).then(() => {
                // JIKA KAMERA BERHASIL HIDUP & DIIZINKAN
                document.getElementById('cameraLoading').classList.add('hidden');
                document.getElementById('reader').classList.remove('opacity-0');
                document.getElementById('scannerOverlay').classList.remove('hidden');
            }).catch((err) => {
                // JIKA IZIN DITOLAK ATAU KAMERA TIDAK ADA
                console.error("Error mulai kamera:", err);
                document.getElementById('cameraLoading').innerHTML = `
                    <i class="fas fa-camera-slash text-4xl text-red-500 mb-3"></i>
                    <p class="text-xs font-bold text-white mb-2">Akses Kamera Ditolak</p>
                    <p class="text-[10px] text-slate-400">Harap izinkan akses kamera di pengaturan browser Anda, atau gunakan input manual.</p>
                `;
            });
        });
    </script>
</body>
</html>
