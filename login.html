<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otentikasi Sistem - Cendekia Aksara</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <!-- Container Auth -->
    <div class="bg-white w-11/12 max-w-md rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header Auth -->
        <div class="bg-blue-700 p-6 text-center">
            <img src="https://i.imgur.com/a9S8h2Z.png" alt="Logo" class="h-12 mx-auto mb-3 object-contain" onerror="this.src='https://via.placeholder.com/150x50?text=LOGO'">
            <h2 class="text-white font-bold text-xl" id="authTitle">Masuk ke Sistem</h2>
            <p class="text-blue-200 text-sm mt-1" id="authSubtitle">Gunakan akun Anda untuk mengelola pembelajaran</p>
        </div>

        <!-- Toggle Login / Register -->
        <div class="flex border-b">
            <button id="tabLogin" onclick="switchMode('login')" class="flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition">Masuk</button>
            <button id="tabRegister" onclick="switchMode('register')" class="flex-1 py-3 text-center font-bold text-gray-500 hover:text-blue-500 transition">Daftar Akun</button>
        </div>

        <!-- Form Container -->
        <div class="p-6">
            <form id="authForm" onsubmit="handleAuth(event)">
                
                <!-- Input Nama (Hanya Muncul saat Daftar) -->
                <div id="groupNama" class="hidden mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nama Lengkap</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="inputNama" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" placeholder="Masukkan nama lengkap">
                    </div>
                </div>

                <!-- Input Email -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Alamat Email</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
                        <input type="email" id="inputEmail" required class="w-full pl-10 pr-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" placeholder="contoh@gmail.com">
                    </div>
                </div>

                <!-- Input Password -->
                <div class="mb-4" id="groupPassword">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Kata Sandi</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
                        <input type="password" id="inputPassword" required class="w-full pl-10 pr-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" placeholder="Minimal 6 karakter">
                    </div>
                </div>

                <!-- Keamanan Captcha Angka (Muncul untuk daftar & login) -->
                <div class="mb-4 bg-gray-50 p-3 rounded-lg border" id="groupCaptcha">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Kode Keamanan</label>
                    <div class="flex items-center space-x-3">
                        <div class="bg-blue-100 text-blue-800 font-bold px-4 py-2 rounded-lg text-lg tracking-widest flex-1 text-center" id="captchaQuestion">
                            <!-- Diisi oleh JS: 5 + 3 = ? -->
                        </div>
                        <input type="number" id="inputCaptcha" required class="w-24 py-2 px-3 border rounded-lg focus:outline-none focus:border-blue-500 text-center font-bold text-lg" placeholder="Hasil">
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Jawab soal matematika di atas untuk melanjutkan.</p>
                </div>

                <!-- Input Kode Verifikasi Email (Hanya muncul saat daftar Non-Admin) -->
                <div id="groupVerifikasi" class="hidden mb-4 bg-green-50 p-4 rounded-lg border border-green-200">
                    <label class="block text-green-800 text-sm font-bold mb-2">Kode Verifikasi Email</label>
                    <p class="text-xs text-green-700 mb-2">Kami telah mengirimkan 6 digit kode ke email Anda.</p>
                    <div class="relative">
                        <i class="fas fa-shield-alt absolute left-3 top-3 text-green-500"></i>
                        <input type="text" id="inputKodeVerifikasi" maxlength="6" class="w-full pl-10 pr-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:border-green-500 font-bold text-center tracking-widest text-lg" placeholder="000000">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition mt-4 shadow-md">
                    Masuk Sekarang
                </button>

            </form>
            
            <div class="mt-6 text-center">
                <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600"><i class="fas fa-arrow-left mr-1"></i> Kembali ke Beranda Publik</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Sama dengan index.html) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12",
            measurementId: "G-590P9LLK7J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Logika UI State ---
        let currentMode = 'login';
        let isWaitingVerification = false;
        
        // Logika Captcha Angka
        let captchaAnswer = 0;
        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1; // 1-10
            const num2 = Math.floor(Math.random() * 10) + 1; // 1-10
            captchaAnswer = num1 + num2;
            document.getElementById('captchaQuestion').textContent = `${num1} + ${num2} = ?`;
            document.getElementById('inputCaptcha').value = '';
        }
        
        // Inisialisasi Captcha Pertama Kali
        generateCaptcha();

        // Mode Switcher (Masuk <-> Daftar)
        window.switchMode = function(mode) {
            currentMode = mode;
            isWaitingVerification = false;
            
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const groupNama = document.getElementById('groupNama');
            const groupVerifikasi = document.getElementById('groupVerifikasi');
            const btnSubmit = document.getElementById('btnSubmit');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');
            const groupPassword = document.getElementById('groupPassword');
            const groupCaptcha = document.getElementById('groupCaptcha');

            // Reset Form & Captcha setiap ganti mode
            document.getElementById('authForm').reset();
            generateCaptcha();
            groupVerifikasi.classList.add('hidden');
            groupPassword.classList.remove('hidden');
            groupCaptcha.classList.remove('hidden');
            document.getElementById('inputKodeVerifikasi').removeAttribute('required');

            if (mode === 'login') {
                tabLogin.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition";
                tabRegister.className = "flex-1 py-3 text-center font-bold text-gray-500 hover:text-blue-500 transition";
                groupNama.classList.add('hidden');
                document.getElementById('inputNama').removeAttribute('required');
                
                authTitle.textContent = "Masuk ke Sistem";
                authSubtitle.textContent = "Gunakan akun Anda untuk mengelola pembelajaran";
                btnSubmit.textContent = "Masuk Sekarang";
                btnSubmit.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition mt-4 shadow-md";
            } else {
                tabRegister.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition";
                tabLogin.className = "flex-1 py-3 text-center font-bold text-gray-500 hover:text-blue-500 transition";
                groupNama.classList.remove('hidden');
                document.getElementById('inputNama').setAttribute('required', 'true');
                
                authTitle.textContent = "Pendaftaran Guru";
                authSubtitle.textContent = "Buat akun untuk membuka ruang kelas Anda";
                btnSubmit.textContent = "Daftar Akun";
                btnSubmit.className = "w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition mt-4 shadow-md";
            }
        }

        // --- Logika Submit Form & Firebase ---
        window.handleAuth = async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('inputEmail').value.trim();
            const password = document.getElementById('inputPassword').value;
            const inputCaptcha = parseInt(document.getElementById('inputCaptcha').value);

            // 1. Validasi Captcha
            if (inputCaptcha !== captchaAnswer) {
                alert("Kode Keamanan (Captcha) salah! Silakan hitung kembali.");
                generateCaptcha();
                return;
            }

            // ================= LOGIKA LOGIN =================
            if (currentMode === 'login') {
                try {
                    btnSubmit.textContent = "Memproses...";
                    // Integrasi Login Firebase
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    
                    // Cek jika ini Admin Rahasia
                    if (email.endsWith('@arg.ac.id')) {
                        alert("Login Admin Berhasil!");
                        window.location.href = "admin-dashboard.html";
                    } else {
                        // Jika Guru
                        alert("Login Guru Berhasil!");
                        window.location.href = "guru-dashboard.html";
                    }
                } catch (error) {
                    alert("Gagal masuk: Email atau kata sandi salah.");
                    generateCaptcha(); // Reset captcha jika gagal
                    btnSubmit.textContent = "Masuk Sekarang";
                }
                return;
            }

            // ================= LOGIKA REGISTER =================
            if (currentMode === 'register') {
                const nama = document.getElementById('inputNama').value.trim();

                // Tahap 1: Evaluasi Domain Email (Rahasia Admin)
                if (!isWaitingVerification) {
                    
                    // SKENARIO 1: ADMIN (Bypass Verifikasi)
                    if (email.endsWith('@arg.ac.id')) {
                        try {
                            btnSubmit.textContent = "Mendaftarkan Admin...";
                            // Buat user di Firebase Auth
                            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                            const user = userCredential.user;
                            
                            // Simpan Data di Firestore collection 'users' dengan role 'admin'
                            await setDoc(doc(db, "users", user.uid), {
                                namaLengkap: nama,
                                email: email,
                                role: "admin",
                                createdAt: new Date()
                            });

                            alert("Registrasi Admin Berhasil! Tidak perlu verifikasi.");
                            window.location.href = "admin-dashboard.html";
                        } catch (error) {
                            alert("Gagal mendaftarkan admin: " + error.message);
                            btnSubmit.textContent = "Daftar Akun";
                        }
                    } 
                    
                    // SKENARIO 2: GURU UMUM (Perlu Verifikasi)
                    else {
                        // Secara Visual: Sembunyikan form awal, tampilkan form kode verifikasi
                        // (Dalam implementasi aslinya Firebase menggunakan Link Email, tapi untuk mensimulasikan permintaanmu akan input kode, kita buat UI-nya)
                        document.getElementById('groupPassword').classList.add('hidden');
                        document.getElementById('groupCaptcha').classList.add('hidden');
                        
                        const groupVerifikasi = document.getElementById('groupVerifikasi');
                        groupVerifikasi.classList.remove('hidden');
                        document.getElementById('inputKodeVerifikasi').setAttribute('required', 'true');
                        
                        btnSubmit.textContent = "Validasi & Selesaikan Pendaftaran";
                        isWaitingVerification = true;

                        // Di sini kamu bisa trigger Cloud Function untuk kirim kode OTP ke email,
                        // Namun untuk simulasi frontend:
                        alert(`Simulasi: Kode verifikasi telah dikirim ke ${email}. (Kode uji coba: 123456)`);
                    }
                } 
                
                // Tahap 2: Guru memasukkan kode verifikasi
                else {
                    const kodeVerif = document.getElementById('inputKodeVerifikasi').value;
                    
                    // Validasi Kode Verifikasi (Simulasi kode 123456)
                    if(kodeVerif === "123456") {
                        try {
                            btnSubmit.textContent = "Menyelesaikan...";
                            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                            const user = userCredential.user;
                            
                            // Simpan Data Guru di Firestore
                            await setDoc(doc(db, "users", user.uid), {
                                namaLengkap: nama,
                                email: email,
                                role: "teacher",
                                createdAt: new Date()
                            });

                            alert("Pendaftaran Guru Berhasil!");
                            window.location.href = "guru-dashboard.html";
                        } catch(error) {
                            alert("Error: " + error.message);
                            btnSubmit.textContent = "Validasi & Selesaikan Pendaftaran";
                        }
                    } else {
                        alert("Kode verifikasi salah!");
                    }
                }
            }
        }
    </script>
</body>
</html>
