    <script>
    /* ===== PUSTAKA LATIHAN KREASI (LocalStorage + IndexedDB) ===== */
    (function () {
        const LS = 'kreasi_lat_pilgan_v1', DBN = 'kreasi-pilgan-db';
        let S = null, siapP = null;
        const pad = n => String(n).padStart(2, '0');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'k' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
        const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
        const idbOpen = () => new Promise((ok, no) => {
            if (typeof indexedDB === 'undefined') return no(new Error('no idb'));
            try {
                const r = indexedDB.open(DBN, 1);
                r.onupgradeneeded = () => { try { r.result.createObjectStore('kv'); } catch(e){} };
                r.onsuccess = () => ok(r.result);
                r.onerror = () => no(r.error || new Error('idb error'));
            } catch(e) { no(e); }
        });
        const idbGet = async () => {
            try {
                const d = await Promise.race([
                    idbOpen(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('idb timeout')), 400))
                ]);
                return await new Promise(ok => {
                    const q = d.transaction('kv').objectStore('kv').get('state');
                    q.onsuccess = () => ok(q.result || null);
                    q.onerror = () => ok(null);
                });
            } catch (e) { return null; }
        };
        const idbSet = async v => {
            try {
                const d = await Promise.race([
                    idbOpen(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('idb timeout')), 400))
                ]);
                await new Promise(ok => {
                    const t = d.transaction('kv', 'readwrite');
                    t.objectStore('kv').put(v, 'state');
                    t.oncomplete = ok;
                    t.onerror = ok;
                    t.onabort = ok;
                });
            } catch (e) {}
        };

        const L = {
            esc, today, pad,
            siap() { return siapP || (siapP = (async () => {
                const a = lsRead(), b = await idbGet();
                S = [a, b].filter(x => x && x.hari).sort((x, y) => (y.u || 0) - (x.u || 0))[0] || { v: 1, id: uuid(), u: Date.now(), hari: {} };
                L.simpan(true); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
                return S; })()); },
            state: () => S,
            simpan(tetap) {
                if (!tetap) S.u = Date.now();
                const ks = Object.keys(S.hari).sort(); while (ks.length > 45) delete S.hari[ks.shift()];
                try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
                idbSet(JSON.parse(JSON.stringify(S)));
            },
            aktif() { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.spin && now < h.spin.ts + 864e5 && (!best || h.spin.ts > S.hari[best].spin.ts)) best = k; } return best; },
            hari(kunci) { if (kunci === undefined || kunci === null) { const a = L.aktif(); return a ? S.hari[a] : null; } return S.hari[kunci] || null; },
            cariHariDenganHasil() { let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.hasil && h.hasil.pilgan) { if (!best || (h.spin && S.hari[best] && h.spin.ts > (S.hari[best].spin ? S.hari[best].spin.ts : 0))) best = k; } } return best ? S.hari[best] : null; },
            cariHariDenganSesi() { const now = Date.now(); let best = null; for (const k in S.hari) { const h = S.hari[k]; if (h.sesi && h.sesi.pilgan && now < h.sesi.pilgan.batas) { if (!best || h.sesi.pilgan.mulai > S.hari[best].sesi.pilgan.mulai) best = k; } } return best ? S.hari[best] : null; },
            nama: () => localStorage.getItem('namaSiswaCendekia') || localStorage.getItem('studentName') || 'Siswa Penulis',
            xp: () => parseInt(localStorage.getItem('kreasiPointsArg') || '0', 10),
            tambahXp(n) {
                const cur = parseInt(localStorage.getItem('kreasiPointsArg') || '0', 10);
                const update = cur + n;
                localStorage.setItem('kreasiPointsArg', String(update));
                // Sync ke kreasi_profile jika ada
                try {
                    const p = JSON.parse(localStorage.getItem('kreasi_profile') || '{}');
                    p.xp = update;
                    localStorage.setItem('kreasi_profile', JSON.stringify(p));
                } catch(e) {}
            },
            fmt(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); },
            menit: s => Math.max(1, Math.round(s / 60)),
            beep(t) {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
                    const c = new AC(), seq = t === 'ok' ? [523, 659, 784] : [330, 262];
                    seq.forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.value = .07; o.connect(g); g.connect(c.destination); o.start(c.currentTime + i * .14); o.stop(c.currentTime + i * .14 + .12); });
                    setTimeout(() => { try { c.close(); } catch (e) {} }, 900);
                } catch (e) {}
            },
            toast(msg, err) {
                let c = document.getElementById('lToast');
                if (!c) { c = document.createElement('div'); c.id = 'lToast'; c.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100000] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none'; document.body.appendChild(c); }
                const t = document.createElement('div'); t.className = (err ? 'bg-red-500' : 'bg-slate-800') + ' text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 transition-all';
                t.innerHTML = '<i class="fas ' + (err ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400') + '"></i><span class="flex-1">' + esc(msg) + '</span>'; c.appendChild(t); setTimeout(() => t.remove(), 3200);
            }
        };
        window.L = L;
    })();
    </script>

/* ===== INISIALISASI LATIHAN ===== */
async function initLatihan() {
    try {
        await L.siap();
    } catch (e) {
        console.warn('L.siap warn:', e);
    }

    // 1. Cek apakah ada hasil tersimpan
    const hDenganHasil = L.cariHariDenganHasil();
    if (hDenganHasil) {
        window.H = hDenganHasil;
        window.soal = BANK_SOAL_KREASI;
        window.totalWaktu = 600;
        return window.tampilHasil();
    }

    // 2. Cek apakah ada sesi berjalan
    const hDenganSesi = L.cariHariDenganSesi();
    if (hDenganSesi) {
        window.H = hDenganSesi;
        window.soal = BANK_SOAL_KREASI;
        window.totalWaktu = 600;
        window.sesi = hDenganSesi.sesi.pilgan;
        return Date.now() >= window.sesi.batas ? window.kumpulkan(true) : window.renderUjian();
    }

    // 3. Tampilkan Intro
    let H = L.hari();
    if (!H) {
        const S = L.state();
        const k = 'c' + Date.now();
        S.hari[k] = { sesi: {}, hasil: {}, spin: { ts: Date.now(), judul: 'Teknik Penulisan Teks Argumentasi' } };
        H = S.hari[k];
        L.simpan(true);
    }
    window.H = H;
    window.soal = BANK_SOAL_KREASI;
    window.totalWaktu = 600; // 10 menit
    window.tampilIntro();
}

        html.push('<div class="space-y-2">');
        s.opsi.forEach((o, k) => {
            const sel = window.sesi.jawab[i] === k ? ' sel' : '';
            html.push('<button class="opsi' + sel + '" data-i="' + i + '" data-k="' + k + '"><span class="huruf">' + HURUF[k] + '</span><span class="text-[12.5px] text-slate-700 leading-snug pt-0.5 flex-1">' + L.esc(o) + '</span><i class="fas fa-circle-check cek"></i></button>');
        });

    html.push('</div><div class="h-6"></div>');
    $('main').innerHTML = html.join('');

    $('daftar').addEventListener('click', e => {
        if (!window.aktif) return;
        const fl = e.target.closest('.flag');
        if (fl) {
            const i = +fl.dataset.flag;
            if (window.sesi.ragu[i]) delete window.sesi.ragu[i]; else window.sesi.ragu[i] = 1;
            fl.classList.toggle('on', !!window.sesi.ragu[i]);
            L.simpan(); hitungJawab();
            return;
        }
        const b = e.target.closest('.opsi'); if (!b) return;
        const i = +b.dataset.i, k = +b.dataset.k;
        const sudah = b.classList.contains('sel');
        b.parentElement.querySelectorAll('.opsi').forEach(x => x.classList.remove('sel'));
        if (sudah) { delete window.sesi.jawab[i]; }
        else { window.sesi.jawab[i] = k; b.classList.add('sel'); if (navigator.vibrate) navigator.vibrate(8); }
        L.simpan();
        hitungJawab();
    });

    $('navGrid').onclick = e => {
        const b = e.target.closest('[data-go]'); if (!b) return;
        tutupNav();
        const el = $('q' + b.dataset.go);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    hitungJawab();
    jalankanWaktu();
};

window.jalankanWaktu = function() {
    const tot = window.sesi.batas - window.sesi.mulai;
    clearInterval(window.timer);
    const tik = () => {
        const sisa = Math.ceil((window.sesi.batas - Date.now()) / 1000);
        $('hTimerTxt').textContent = L.fmt(sisa);
        $('barWaktuIsi').style.width = Math.max(0, (window.sesi.batas - Date.now()) / tot * 100) + '%';
        const krit = sisa <= 60;
        $('hTimer').classList.toggle('waktu-kritis', krit);
        if (sisa <= 0) kumpulkan(true);
    };
    tik(); window.timer = setInterval(tik, 400);
};

window.mintaKumpul = async function() {
    const sisa = window.soal.length - Object.keys(window.sesi.jawab).length;
    const ragu = Object.keys(window.sesi.ragu || {}).length;
    let ket = sisa ? 'Masih ada ' + sisa + ' soal belum dijawab. ' : 'Semua soal sudah dijawab. ';
    if (ragu) ket += 'Ada ' + ragu + ' soal yang kamu tandai ragu-ragu. ';
    ket += 'Setelah dikumpulkan, jawaban akan langsung dinilai.';
    if (await modal('Kumpulkan jawaban?', ket, 'Kumpulkan', 'Periksa Lagi', 'fa-paper-plane')) kumpulkan(false);
};

window.kumpulkan = async function(auto) {
    if (window.H.hasil && window.H.hasil.pilgan) return;
    window.aktif = false;
    clearInterval(window.timer);
    tutupNav();

    const jawab = window.sesi.jawab;
    const benar = window.soal.filter((s, i) => jawab[i] === s.j).length;
    const skor = Math.round(benar / window.soal.length * 100);
    const xp = Math.round(skor / 3) + (skor >= 80 ? 15 : 0);
    L.tambahXp(xp);
    try {
        const latArg = JSON.parse(localStorage.getItem('hasilLatihanArg') || '{}');
        latArg['kreasi_pilgan'] = skor;
        localStorage.setItem('hasilLatihanArg', JSON.stringify(latArg));
    } catch (e) {}

    // Simpan status modul kreasi untuk fallback 24 jam & sinkronisasi grafik Nilaiku
    try {
        const st = JSON.parse(localStorage.getItem('kreasi_exercises_status') || '{}');
        st.pilgan = {
            skor: skor,
            xp: xp,
            ts: Date.now(),
            benar: benar,
            total: window.soal.length,
            selesai: true
        };
        localStorage.setItem('kreasi_exercises_status', JSON.stringify(st));
    } catch (e) {}

    window.H.hasil = window.H.hasil || {};
    window.H.hasil.pilgan = {
        skor: skor,
        benar: benar,
        total: window.soal.length,
        jawab: jawab,
        durasi: Math.round((Math.min(Date.now(), window.sesi.batas) - window.sesi.mulai) / 1000),
        batas: window.totalWaktu,
        selesai: Date.now(),
        auto: !!auto,
        xp: xp
    };

    delete window.H.sesi.pilgan;
    L.simpan();

    $('btnBack').onclick = null;
    $('btnBack').href = 'index.html';

    if (auto) L.toast('Waktu habis. Jawabanmu otomatis dikumpulkan.', true);
    window.tampilHasil(true);
};

        '<div class="bg-white rounded-xl p-2.5 text-center border border-slate-200"><p class="text-lg font-extrabold text-rose-500">' + salah + '</p><p class="text-[9px] font-semibold text-slate-500">Salah</p></div>',
        '<div class="bg-white rounded-xl p-2.5 text-center border border-slate-200"><p class="text-lg font-extrabold text-slate-400">' + kosong + '</p><p class="text-[9px] font-semibold text-slate-500">Kosong</p></div>',
        '<div class="bg-white rounded-xl p-2.5 text-center border border-slate-200"><p class="text-lg font-extrabold text-slate-700">' + L.fmt(R.durasi) + '</p><p class="text-[9px] font-semibold text-slate-500">Durasi</p></div>',
        '</div>',

        // Rapor Tugas & Unduh PDF
        '<div class="bg-white rounded-2xl border border-slate-200 mt-3 overflow-hidden shadow-xs">',
        '<div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200"><h3 class="font-bold text-slate-800 text-xs"><i class="fas fa-id-card text-brand-green mr-1.5"></i>Rapor Latihan Siswa</h3></div>',
        '<div class="p-4 text-[11px] text-slate-600 space-y-1.5">',
        '<p class="flex"><b class="w-24 shrink-0 text-slate-700">Nama Siswa</b><span class="mr-1">:</span><span class="font-semibold text-slate-800 break-words min-w-0">' + L.esc(L.nama()) + '</span></p>',
        '<p class="flex"><b class="w-24 shrink-0 text-slate-700">Jenis Latihan</b><span class="mr-1">:</span><span>Pilihan Ganda Kreasi Argumentasi</span></p>',
        '<p class="flex"><b class="w-24 shrink-0 text-slate-700">Materi</b><span class="mr-1">:</span><span>Teknik Penulisan &amp; Kaidah Argumentasi</span></p>',
        '<p class="flex"><b class="w-24 shrink-0 text-slate-700">Tanggal Selesai</b><span class="mr-1">:</span><span>' + L.esc(tglIndo(R.selesai)) + '</span></p>',
        '<p class="flex"><b class="w-24 shrink-0 text-slate-700">Waktu Tempuh</b><span class="mr-1">:</span><span>' + L.fmt(R.durasi) + ' dari ' + L.fmt(R.batas) + '</span></p>',
        '</div>',
        '<div class="px-4 pb-4"><button onclick="unduhPdf()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl shadow-md text-xs active:scale-95 transition flex items-center justify-center gap-2"><i class="fas fa-file-pdf"></i><span>Unduh Hasil &amp; Pembahasan (PDF)</span></button></div>',
        '</div>',

        // Analisis per Tingkat Kesulitan
        '<div class="bg-white rounded-2xl border border-slate-200 p-4 mt-3 shadow-xs">',
        '<h3 class="font-bold text-slate-800 text-xs mb-3"><i class="fas fa-chart-simple text-blue-500 mr-1.5"></i>Analisis per Tingkat Kesulitan</h3>',
        '<div class="space-y-3">',
        urut.map(t => {
            const p = Math.round(tk[t].b / tk[t].n * 100);
            return '<div><div class="flex justify-between items-center mb-1">' + badge(t) + '<span class="text-[11px] font-bold text-slate-600">' + tk[t].b + '/' + tk[t].n + ' (' + p + '%)</span></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full transition-all duration-700" style="width:' + p + '%;background:' + TKT_HEX[t] + '"></div></div></div>';
        }).join(''),
        '</div></div>',

        // Pembahasan
        '<div class="flex items-center justify-between mt-5 mb-3"><h3 class="font-bold text-slate-800 text-sm"><i class="fas fa-lightbulb text-amber-500 mr-1.5"></i>Pembahasan Soal</h3></div>',
        '<div id="filter" class="flex gap-1.5 mb-3 flex-wrap"></div>',
        '<div id="bahas" class="space-y-3"></div>',

        // Tombol Aksi Lanjutan Ruang Kreasi
        '<div class="bg-white rounded-2xl border border-slate-200 p-4 mt-4 shadow-xs">',
        '<h3 class="font-bold text-slate-800 text-xs mb-3"><i class="fas fa-compass text-brand-green mr-1.5"></i>Langkah Kreasi Selanjutnya</h3>',
        '<div class="grid grid-cols-2 gap-2">',
        '<button onclick="ulangiLatihan()" class="p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-xs text-center active:scale-95 transition"><i class="fas fa-rotate mr-1"></i>Ulangi Latihan</button>',
        '<a href="tulis.html" class="p-3 rounded-xl bg-brand-green hover:bg-emerald-700 text-white font-bold text-xs text-center shadow-xs active:scale-95 transition"><i class="fas fa-pen-nib mr-1"></i>Tulis Naskah</a>',
        '<a href="ide.html" class="p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-bold text-xs text-center active:scale-95 transition"><i class="fas fa-lightbulb text-amber-500 mr-1"></i>Kreasi Ide</a>',
        '<a href="index.html" class="p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-bold text-xs text-center active:scale-95 transition"><i class="fas fa-house text-emerald-600 mr-1"></i>Ruang Kreasi</a>',
        '</div></div>'
    ].join('');

    $('main').innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });

    filterBahas('semua');

    if (baru) {
        try {
            if (R.skor >= 80) {
                L.beep('ok');
                setTimeout(() => window.confetti && confetti({ particleCount: 120, spread: 80, origin: { y: .4 }, zIndex: 100001 }), 300);
            } else {
                L.beep(R.skor >= 60 ? 'ok' : 'err');
            }
        } catch(e) {}
    }
};

window.filterBahas = function(f) {
    const R = window.H.hasil.pilgan;
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const cnt = { semua: window.soal.length, salah: 0, benar: 0 };
    window.soal.forEach((s, i) => { const st = status(i); if (st === 'benar') cnt.benar++; else cnt.salah++; });

    $('filter').innerHTML = [['semua', 'Semua'], ['salah', 'Salah / Kosong'], ['benar', 'Benar']].map(x =>
        '<button onclick="filterBahas(\'' + x[0] + '\')" class="px-3 py-1.5 rounded-full text-[10px] font-bold border transition ' + (f === x[0] ? 'bg-brand-green text-white border-brand-green' : 'bg-white text-slate-500 border-slate-200') + '">' + x[1] + ' (' + cnt[x[0]] + ')</button>').join('');

    const arr = window.soal.map((s, i) => [s, i]).filter(x => {
        const st = status(x[1]);
        return f === 'semua' || (f === 'benar' ? st === 'benar' : st !== 'benar');
    });

    if (!arr.length) {
        $('bahas').innerHTML = '<div class="bg-white rounded-2xl p-6 text-center text-xs text-emerald-600 font-semibold border border-emerald-100"><i class="fas fa-circle-check mr-1"></i> Tidak ada soal pada kategori ini.</div>';
        return;
    }

    $('bahas').innerHTML = arr.map(([s, i]) => {
        const st = status(i), u = R.jawab[i];
        const c = st === 'benar' ? 'emerald' : 'rose';
        const lbl = st === 'benar' ? 'BENAR' : st === 'kosong' ? 'TIDAK DIJAWAB' : 'SALAH';

        const opsiHtml = s.opsi.map((o, k) => {
            const kunci = k === s.j, pilih = k === u;
            const bg = kunci ? 'bg-emerald-50 border-emerald-300' : (pilih ? 'bg-rose-50 border-rose-300' : 'bg-white border-slate-200');
            const hBg = kunci ? 'bg-emerald-500 text-white' : (pilih ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-500');
            let badgeText = '';
            if (kunci && pilih) badgeText = '<span class="text-[9px] text-emerald-700 font-bold ml-auto"><i class="fas fa-check-double mr-1"></i>Jawaban Anda (Benar)</span>';
            else if (kunci) badgeText = '<span class="text-[9px] text-emerald-700 font-bold ml-auto"><i class="fas fa-check mr-1"></i>Kunci Jawaban</span>';
            else if (pilih) badgeText = '<span class="text-[9px] text-rose-600 font-bold ml-auto"><i class="fas fa-times mr-1"></i>Jawaban Anda</span>';

            return '<div class="p-2.5 rounded-xl border ' + bg + ' flex items-start gap-2 text-[12px]"><span class="w-5 h-5 rounded-full ' + hBg + ' font-bold text-[10px] flex items-center justify-center shrink-0 mt-0.5">' + HURUF[k] + '</span><span class="flex-1 text-slate-700 leading-snug">' + L.esc(o) + '</span>' + badgeText + '</div>';
        }).join('');

        return '<article class="bg-white rounded-2xl border-2 border-' + c + '-200 p-4 shadow-xs">' +
            '<div class="flex items-center justify-between mb-2"><span class="text-[10px] font-extrabold text-' + c + '-700 uppercase tracking-wider">Soal ' + (i + 1) + ' · ' + TKT[s.tingkat][0] + '</span><span class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-' + c + '-100 text-' + c + '-700">' + lbl + '</span></div>' +
            '<p class="font-reading text-[13px] text-slate-800 leading-relaxed mb-3">' + L.esc(s.p) + '</p>' +
            '<div class="space-y-1.5 mb-3">' + opsiHtml + '</div>' +
            '<div class="bg-amber-50 border border-amber-200/80 rounded-xl p-3 text-[11px] leading-relaxed text-amber-900"><p class="font-bold text-[10px] text-amber-800 uppercase tracking-wide mb-1"><i class="fas fa-lightbulb text-amber-500 mr-1"></i>Pembahasan:</p>' + L.esc(s.bahas) + '</div>' +
            '</article>';
    }).join('');
};

window.ulangiLatihan = async function() {
    if (!(await modal('Ulangi latihan?', 'Hasil latihan sebelumnya akan direset dan Anda dapat mengerjakan ulang.', 'Ulangi', 'Batal', 'fa-rotate'))) return;
    delete window.H.hasil.pilgan;
    L.simpan();
    try {
        const st = JSON.parse(localStorage.getItem('kreasi_exercises_status') || '{}');
        delete st.pilgan;
        localStorage.setItem('kreasi_exercises_status', JSON.stringify(st));
    } catch(e) {}
    initLatihan();
};

/* ===== GENERATOR PDF HASIL & PEMBAHASAN ===== */
function buatDokumenPdf() {
    const R = window.H.hasil.pilgan;
    const nama = L.nama(), materi = 'Teknik Penulisan Teks Argumentasi';
    const W = { gelap: '#064e3b', hijau: '#059669', hijauMuda: '#d1fae5', merah: '#e11d48', merahMuda: '#ffe4e6', amber: '#d97706', amberMuda: '#fffbeb', abu: '#64748b', garis: '#e2e8f0', latar: '#f8fafc', biruMuda: '#e0f2fe', biru: '#0369a1' };
    const warnaSkor = R.skor >= 80 ? W.hijau : R.skor >= 60 ? '#f59e0b' : W.merah;
    const status = i => R.jawab[i] === undefined ? 'kosong' : (R.jawab[i] === window.soal[i].j ? 'benar' : 'salah');
    const kosong = window.soal.filter((s, i) => R.jawab[i] === undefined).length;
    const salah = R.total - R.benar - kosong;

    const lbl = t => ({ text: t, fontSize: 7.5, bold: true, color: '#ffffff', fillColor: W.hijau, margin: [7, 5, 7, 5] });
    const val = t => ({ text: String(t), bold: true, fontSize: 10, color: W.gelap, fillColor: W.latar, margin: [7, 7, 7, 7] });
    const layoutKotak = { hLineWidth: () => 0.7, vLineWidth: () => 0.7, hLineColor: () => W.hijau, vLineColor: () => '#ffffff', paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 };
    const judulBagian = t => ({ stack: [{ text: t, bold: true, fontSize: 12, color: W.gelap }, { canvas: [{ type: 'line', x1: 0, y1: 3, x2: 523, y2: 3, lineWidth: 1.2, lineColor: W.hijau }] }], margin: [0, 16, 0, 8] });

    const content = [];

    // Header Banner
    content.push({
        table: { widths: ['*'], body: [[{ stack: [
            { text: 'LEMBAR HASIL LATIHAN KREASI', fontSize: 8.5, bold: true, color: '#a7f3d0', characterSpacing: 2 },
            { text: 'Pilihan Ganda Kreasi Argumentasi', fontSize: 20, bold: true, color: '#ffffff', margin: [0, 3, 0, 2] },
            { text: 'Platform Pembelajaran Bahasa Indonesia', fontSize: 9.5, color: '#d1fae5' }
        ], fillColor: W.gelap, margin: [18, 16, 18, 16] }]] },
        layout: 'noBorders'
    });

    // Identitas
    content.push({ margin: [0, 12, 0, 0], table: { widths: ['*', '*', '*', '*'], body: [
        [lbl('NAMA SISWA'), lbl('JENIS TUGAS'), lbl('MATERI'), lbl('TANGGAL')],
        [val(nama), val('Pilihan Ganda Kreasi'), val(materi), val(tglIndo(R.selesai))]
    ] }, layout: layoutKotak });

    // Skor Card
    const sel = (label, nilai, fill, warnaTeks, ukuran) => ({ fillColor: fill, margin: [7, 8, 7, 8], stack: [
        { text: label, fontSize: 7.5, bold: true, color: warnaTeks, characterSpacing: 0.5 },
        { text: String(nilai), fontSize: ukuran || 16, bold: true, color: warnaTeks, margin: [0, 2, 0, 0] }
    ] });
    content.push({ margin: [0, 8, 0, 0], table: { widths: ['*', '*', '*', '*', '*'], body: [[
        sel('SKOR AKHIR', R.skor + ' / 100', warnaSkor, '#ffffff', 18),
        sel('BENAR', R.benar, W.hijauMuda, W.gelap),
        sel('SALAH', salah, W.merahMuda, W.merah),
        sel('KOSONG', kosong, W.latar, W.abu),
        sel('XP KREASI', '+' + R.xp, W.amberMuda, W.amber)
    ]] }, layout: layoutKotak });

    content.push({ text: 'Durasi pengerjaan: ' + L.fmt(R.durasi) + ' dari ' + L.fmt(R.batas) + (R.auto ? '  •  dikumpulkan otomatis' : ''), fontSize: 8.5, color: W.abu, margin: [0, 6, 0, 0] });

    // Soal & Pembahasan
    content.push(judulBagian('Soal, Jawaban & Pembahasan Lengkap'));
    window.soal.forEach((s, i) => {
        const st = status(i), u = R.jawab[i];
        const c = st === 'benar' ? W.hijau : W.merah;
        const label = st === 'benar' ? 'BENAR' : st === 'kosong' ? 'TIDAK DIJAWAB' : 'SALAH';
        const tanpaPadding = { hLineWidth: () => 0, vLineWidth: () => 0, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 };

        const opsiRows = s.opsi.map((o, k) => {
            const kunci = k === s.j, pilih = k === u;
            const fill = kunci ? W.hijauMuda : (pilih ? W.merahMuda : '#ffffff');
            const fillHuruf = kunci ? W.hijau : (pilih ? W.merah : W.garis);
            const teks = [{ text: String(o), color: kunci ? W.gelap : '#334155', bold: kunci || pilih }];
            if (kunci && pilih) teks.push({ text: '   [JAWABAN ANDA = BENAR]', fontSize: 7.5, bold: true, color: W.hijau });
            else if (kunci) teks.push({ text: '   [KUNCI JAWABAN]', fontSize: 7.5, bold: true, color: W.hijau });
            else if (pilih) teks.push({ text: '   [JAWABAN ANDA]', fontSize: 7.5, bold: true, color: W.merah });
            return [
                { text: HURUF[k], bold: true, alignment: 'center', color: (kunci || pilih) ? '#ffffff' : W.abu, fillColor: fillHuruf, margin: [0, 4, 0, 4] },
                { text: teks, fillColor: fill, margin: [8, 4, 8, 4], fontSize: 9.5 }
            ];
        });

        const teksJawab = u === undefined ? 'Tidak dijawab' : (HURUF[u] + '. ' + (s.opsi[u] ?? ''));
        const teksKunci = HURUF[s.j] + '. ' + (s.opsi[s.j] ?? '');

        content.push({
            margin: [0, 0, 0, 12],
            table: {
                dontBreakRows: true, widths: ['*'],
                body: [
                    [{ fillColor: c, margin: [10, 6, 10, 6], columns: [
                        { text: 'SOAL ' + (i + 1) + '   |   TINGKAT: ' + TKT[s.tingkat][0].toUpperCase(), bold: true, fontSize: 9, color: '#ffffff' },
                        { text: label, bold: true, fontSize: 9, color: '#ffffff', alignment: 'right' }
                    ] }],
                    [{ text: String(s.p), bold: true, fontSize: 10, lineHeight: 1.35, color: '#0f172a', fillColor: W.latar, margin: [10, 8, 10, 8] }],
                    [{ table: { widths: [20, '*'], body: opsiRows }, layout: tanpaPadding }],
                    [{ table: { widths: ['*', '*'], body: [[
                        { fillColor: W.biruMuda, margin: [10, 6, 10, 6], stack: [{ text: 'JAWABAN SISWA', fontSize: 7.5, bold: true, color: W.biru }, { text: teksJawab, fontSize: 9, bold: true, color: u === undefined ? W.abu : '#0f172a', margin: [0, 2, 0, 0] }] },
                        { fillColor: W.hijauMuda, margin: [10, 6, 10, 6], stack: [{ text: 'KUNCI JAWABAN', fontSize: 7.5, bold: true, color: W.hijau }, { text: teksKunci, fontSize: 9, bold: true, color: W.gelap, margin: [0, 2, 0, 0] }] }
                    ]] }, layout: tanpaPadding }],
                    [{ fillColor: W.amberMuda, margin: [10, 7, 10, 8], stack: [
                        { text: 'PENJELASAN / PEMBAHASAN', fontSize: 7.5, bold: true, color: W.amber },
                        { text: String(s.bahas), fontSize: 9, lineHeight: 1.35, color: '#334155', margin: [0, 3, 0, 0] }
                    ] }]
                ]
            },
            layout: { hLineWidth: () => 0.8, vLineWidth: () => 0.8, hLineColor: () => c, vLineColor: () => c, paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 }
        });
    });

    content.push({ text: 'Dokumen ini dibuat otomatis oleh Ruang Kreasi Argumentasi pada ' + tglIndo(Date.now()) + '.', fontSize: 8, color: W.abu, alignment: 'center', margin: [0, 8, 0, 0] });

    return {
        info: { title: 'Hasil Pilihan Ganda Kreasi - ' + nama, author: 'Ruang Kreasi Argumentasi', subject: materi },
        pageSize: 'A4',
        pageMargins: [36, 36, 36, 46],
        defaultStyle: { fontSize: 10, lineHeight: 1.2, color: '#334155' },
        footer: (cur, total) => ({ columns: [
            { text: 'Ruang Kreasi Argumentasi  •  ' + nama, fontSize: 8, color: W.abu, margin: [36, 0, 0, 0] },
            { text: 'Halaman ' + cur + ' dari ' + total, fontSize: 8, color: W.abu, alignment: 'right', margin: [0, 0, 36, 0] }
        ], margin: [0, 18, 0, 0] }),
        content
    };
}

window.unduhPdf = function() {
    if (typeof pdfMake === 'undefined') { L.toast('Pustaka PDF belum termuat. Periksa koneksi internet Anda.', true); return; }
    try {
        const R = window.H.hasil.pilgan;
        const d = new Date(R.selesai);
        const tgl = d.getFullYear() + '-' + L.pad(d.getMonth() + 1) + '-' + L.pad(d.getDate());
        const nama = ('Hasil-Pilgan-Kreasi_' + L.nama() + '_' + tgl + '.pdf').replace(/[^\w\-.]+/g, '_');
        pdfMake.createPdf(buatDokumenPdf()).download(nama);
        L.toast('PDF hasil latihan sedang diunduh…');
    } catch (e) {
        console.error(e);
        L.toast('Gagal membuat PDF hasil latihan.', true);
    }
};

initLatihan();
</script>
