<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pencarian - Argumentasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { 
                        brand: { green: '#059669', light: '#d1fae5', dark: '#064e3b' } 
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        
        /* Hide Scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- CONTAINER UTAMA (Mobile App Frame) -->
    <div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">
        
        <!-- HEADER STICKY PENCARIAN -->
        <header class="bg-brand-green fixed w-full max-w-md z-50 px-4 py-3 flex items-center gap-3 shadow-md" id="topHeader">
            <!-- Tombol Kembali -->
            <a href="index.html" class="shrink-0 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-colors active:scale-95">
                <i class="fas fa-chevron-left text-sm"></i>
            </a>
            
            <!-- Search Bar -->
            <div class="flex-1 bg-white/20 hover:bg-white/30 transition-colors rounded-full flex items-center px-3 py-1.5 border border-white/30 backdrop-blur-sm">
                <i class="fas fa-search text-white text-sm"></i>
                <input type="text" id="searchInput" placeholder="Cari materi, artikel, atau tag..." class="w-full bg-transparent outline-none text-white text-xs px-2 placeholder-white/70" onkeypress="if(event.key === 'Enter') jalankanPencarian()">
            </div>
            
            <!-- Tombol Clear Search (Muncul otomatis nanti via JS jika ada query) -->
            <button id="btnClear" onclick="clearSearch()" class="hidden shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white/80 hover:text-white transition-colors">
                <i class="fas fa-times text-sm"></i>
            </button>
        </header>

        <!-- PENGGANTI RUANG HEADER STICKY -->
        <div class="h-[60px] bg-brand-green shrink-0"></div>

        <!-- BACKGROUND LENGKUNG -->
        <div class="bg-brand-green pb-6 px-4 relative z-10 rounded-b-[2rem] shrink-0"></div>

        <!-- MAIN KONTEN (Hasil Pencarian) -->
        <div class="flex-grow overflow-y-auto hide-scrollbar pb-10 px-4 -mt-4 relative z-20">
            
            <!-- Header Hasil -->
            <div class="flex items-center justify-between mb-4 bg-white px-4 py-3 rounded-xl shadow-sm border border-slate-100">
                <h2 class="font-bold text-slate-800 text-sm">Hasil untuk: <span id="textQuery" class="text-brand-green italic">Semua Materi</span></h2>
                <span id="textCount" class="text-[10px] bg-slate-100 text-slate-500 font-bold px-2 py-1 rounded-md">...</span>
            </div>

            <!-- List Hasil Pencarian -->
            <div id="searchResults" class="flex flex-col gap-3">
                <!-- Skeleton Loader -->
                <div class="flex gap-3 bg-white p-3 rounded-xl shadow-sm border border-slate-100 animate-pulse">
                    <div class="w-24 h-24 bg-slate-200 rounded-lg shrink-0"></div>
                    <div class="flex-1 flex flex-col justify-between py-1">
                        <div><div class="h-3 bg-slate-200 w-16 rounded mb-2"></div><div class="h-4 bg-slate-200 w-full rounded mb-1"></div><div class="h-4 bg-slate-200 w-3/4 rounded"></div></div>
                    </div>
                </div>
                <div class="flex gap-3 bg-white p-3 rounded-xl shadow-sm border border-slate-100 animate-pulse">
                    <div class="w-24 h-24 bg-slate-200 rounded-lg shrink-0"></div>
                    <div class="flex-1 flex flex-col justify-between py-1">
                        <div><div class="h-3 bg-slate-200 w-16 rounded mb-2"></div><div class="h-4 bg-slate-200 w-full rounded mb-1"></div><div class="h-4 bg-slate-200 w-3/4 rounded"></div></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Container Toast -->
    <div id="toastContainer" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <!-- SCRIPT UI DASAR -->
    <script>
        function showToast(msg, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = isError ? 'bg-red-500' : 'bg-slate-800';
            const iconClass = isError ? 'fa-exclamation-circle' : 'fa-check-circle text-emerald-400';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-3 transform translate-y-[-20px] opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fas ${iconClass} text-lg shrink-0"></i> <span class="flex-1">${msg}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Fungsi untuk trigger ulang pencarian dari form input
        function jalankanPencarian() {
            const query = document.getElementById('searchInput').value.trim();
            if(query) {
                // Update URL tanpa reload halaman (UX yang lebih halus)
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?q=' + encodeURIComponent(query);
                window.history.pushState({path:newUrl}, '', newUrl);
                
                // Panggil event custom agar Firebase fetch ulang
                window.dispatchEvent(new Event('urlchange'));
            } else {
                clearSearch();
            }
        }

        // Membersihkan form pencarian
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path:newUrl}, '', newUrl);
            window.dispatchEvent(new Event('urlchange'));
        }
    </script>

    <!-- FIREBASE FETCH DATA LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query as firestoreQuery, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", projectId: "mading-cf676" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Desain Kartu (Sama persis dengan index.html)
        function renderHorizontalCard(data) {
            const imgUrl = data.coverImage || data.gambarBase64 || "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=300";
            
            // Penentuan Kategori Label & Warna
            let typeLabel = "Materi";
            let typeClass = "bg-slate-50 text-slate-600 border border-slate-100";
            
            if(data.kategori === 'argumentasi') {
                typeLabel = "Argumentasi";
                typeClass = "bg-emerald-50 text-emerald-600 border border-emerald-100";
            } else if (data.kategori === 'artikel') {
                typeLabel = "Artikel Berita";
                typeClass = "bg-blue-50 text-blue-600 border border-blue-100";
            }

            // Persiapan Tagar/Hashtag
            let tagsHtml = "";
            if (data.tags && Array.isArray(data.tags)) {
                tagsHtml = data.tags.slice(0, 3).map(tag => `<span class="bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded text-[8px] mr-1 mt-1">#${tag}</span>`).join('');
            }

            return `
            <a href="baca.html?id=${data.id}" class="flex gap-3 bg-white p-3 rounded-xl shadow-sm border border-slate-100 hover:border-brand-green transition-colors active:scale-[0.98] fade-in">
                <img src="${imgUrl}" alt="${data.judul}" class="w-24 h-24 object-cover rounded-lg shrink-0 bg-slate-100">
                <div class="flex-1 flex flex-col justify-between py-1 min-w-0">
                    <div>
                        <span class="text-[9px] font-bold ${typeClass} px-1.5 py-0.5 rounded uppercase tracking-widest">${typeLabel}</span>
                        <h3 class="font-bold text-sm text-slate-800 line-clamp-2 mt-1.5 leading-snug">${data.judul}</h3>
                        <div class="flex flex-wrap">${tagsHtml}</div>
                    </div>
                    <div class="flex justify-between items-end mt-2">
                        <span class="text-[10px] text-slate-400"><i class="far fa-clock"></i> ${data.waktuBaca || '5 Min'}</span>
                        <span class="text-[11px] font-bold text-brand-green">Mulai <i class="fas fa-chevron-right text-[9px] ml-0.5"></i></span>
                    </div>
                </div>
            </a>`;
        }

        async function fetchSearchResults() {
            const container = document.getElementById('searchResults');
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('q') ? urlParams.get('q').toLowerCase() : '';
            
            // Atur UI Text
            document.getElementById('searchInput').value = urlParams.get('q') || '';
            document.getElementById('textQuery').innerText = searchQuery ? `"${urlParams.get('q')}"` : 'Semua Materi';
            
            if(searchQuery) {
                document.getElementById('btnClear').classList.remove('hidden');
            } else {
                document.getElementById('btnClear').classList.add('hidden');
            }

            // Reset loading state
            container.innerHTML = `
                <div class="flex gap-3 bg-white p-3 rounded-xl shadow-sm border border-slate-100 animate-pulse">
                    <div class="w-24 h-24 bg-slate-200 rounded-lg shrink-0"></div>
                    <div class="flex-1 flex flex-col justify-between py-1">
                        <div><div class="h-3 bg-slate-200 w-16 rounded mb-2"></div><div class="h-4 bg-slate-200 w-full rounded mb-1"></div><div class="h-4 bg-slate-200 w-3/4 rounded"></div></div>
                    </div>
                </div>`;
            document.getElementById('textCount').innerText = 'Mencari...';

            try {
                // Fetch Data berdasarkan urutan terbaru
                const q = firestoreQuery(collection(db, "materials"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                let hasilPencarianHtml = "";
                let jumlahDitemukan = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;
                    
                    // 1. FILTER STATUS (Jangan tampilkan draft atau dihapus)
                    if (data.status === 'draft' || data.status === 'dihapus') return;

                    // 2. FILTER PENCARIAN (Judul ATAU Tag)
                    let cocok = false;
                    
                    // Jika tidak ada query (kosong), tampilkan semua yang lulus filter status
                    if (!searchQuery) {
                        cocok = true;
                    } else {
                        // Cek dari Judul
                        if (data.judul && data.judul.toLowerCase().includes(searchQuery)) {
                            cocok = true;
                        }
                        
                        // Cek dari Kategori
                        if (data.kategori && data.kategori.toLowerCase().includes(searchQuery)) {
                            cocok = true;
                        }
                        
                        // Cek dari Tags Array (jika ada)
                        if (data.tags && Array.isArray(data.tags)) {
                            const tagCocok = data.tags.some(tag => tag.toLowerCase().includes(searchQuery));
                            if(tagCocok) cocok = true;
                        }
                    }

                    if (cocok) {
                        hasilPencarianHtml += renderHorizontalCard({ id, ...data });
                        jumlahDitemukan++;
                    }
                });

                document.getElementById('textCount').innerText = `${jumlahDitemukan} Hasil`;

                if (jumlahDitemukan > 0) {
                    container.innerHTML = hasilPencarianHtml;
                } else {
                    container.innerHTML = `
                        <div class="text-center py-10 bg-white rounded-xl border border-slate-100 shadow-sm mt-2 fade-in">
                            <div class="w-16 h-16 bg-slate-100 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl"><i class="fas fa-search-minus"></i></div>
                            <h3 class="font-bold text-slate-700">Tidak Ditemukan</h3>
                            <p class="text-[11px] text-slate-500 mt-1 max-w-[200px] mx-auto">Kami tidak dapat menemukan materi yang cocok dengan kata kunci tersebut.</p>
                        </div>`;
                }

            } catch (error) {
                console.error("Firebase Search Error:", error);
                document.getElementById('textCount').innerText = '0 Hasil';
                container.innerHTML = `
                    <div class="text-center py-10 bg-white rounded-xl border border-red-100 shadow-sm mt-2 fade-in">
                        <i class="fas fa-wifi text-3xl text-red-300 mb-2"></i>
                        <h3 class="font-bold text-red-500">Gagal Memuat</h3>
                        <p class="text-[11px] text-slate-500 mt-1">Periksa koneksi internet Anda dan coba lagi.</p>
                        <button onclick="window.location.reload()" class="mt-4 text-[10px] bg-brand-green text-white px-4 py-1.5 rounded-full font-bold">Coba Lagi</button>
                    </div>`;
            }
        }

        // Panggil fungsi pencarian saat halaman dimuat
        document.addEventListener('DOMContentLoaded', fetchSearchResults);

        // Panggil fungsi pencarian saat ada custom event (dari JS Form input enter di atas)
        window.addEventListener('urlchange', fetchSearchResults);
        
        // Panggil fungsi jika user tekan tombol back/forward di browser
        window.addEventListener('popstate', fetchSearchResults);
    </script>
</body>
</html>
