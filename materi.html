<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog Materi - Argumentasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-md bg-slate-50 relative min-h-screen shadow-2xl flex flex-col sm:border-x border-slate-200">

    <!-- HEADER + TAB (STICKY) -->
    <div class="sticky top-0 z-50 shadow-md">
        <header class="bg-amber-500 px-4 h-14 flex items-center gap-3">
            <a href="index.html" aria-label="Kembali" class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition">
                <i class="fas fa-chevron-left"></i>
            </a>
            <div class="flex-1 min-w-0">
                <h1 class="text-white font-bold text-sm leading-tight truncate">Katalog Materi</h1>
                <p id="sub" class="text-white/80 text-[10px] leading-tight truncate">Memuat daftar materi…</p>
            </div>
            <button id="btnCari" onclick="tglCari()" aria-label="Cari" class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/20 active:scale-95 transition">
                <i class="fas fa-search"></i>
            </button>
            <a href="profil.html" aria-label="Profil" class="shrink-0 w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white border border-white/30">
                <i class="fas fa-user text-sm"></i>
            </a>
        </header>
        
        <!-- KOLOM PENCARIAN (HIDDEN DEFAULT) -->
        <div id="boxCari" class="hidden bg-amber-500 px-4 pb-3">
            <div class="bg-white rounded-xl flex items-center px-3 py-2 shadow-sm">
                <i class="fas fa-search text-slate-400 text-sm mr-2"></i>
                <input id="q" type="text" placeholder="Cari judul materi, bab, atau deskripsi..." class="w-full bg-transparent outline-none text-slate-700 text-sm placeholder-slate-400" oninput="cariTunda()">
                <button onclick="hapusCari()" class="text-slate-300 hover:text-slate-500 ml-2">
                    <i class="fas fa-circle-xmark"></i>
                </button>
            </div>
        </div>
        
        <!-- TAB KATEGORI -->
        <nav id="tabs" class="bg-white border-b border-slate-200 flex overflow-x-auto hide-scrollbar px-2">
            <!-- Isi tab akan dirender oleh JavaScript dari sistem Anda -->
        </nav>
    </div>

    <!-- KONTEN UTAMA MATERI -->
    <main class="flex-grow p-4">
        <!-- SKELETON LOADING -->
        <div id="sLoading" class="grid grid-cols-1 gap-3">
            <div class="animate-pulse bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 bg-slate-200 rounded-lg"></div>
                    <div class="flex-1">
                        <div class="h-4 bg-slate-200 rounded w-3/4 mb-1"></div>
                        <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                    </div>
                </div>
                <div class="h-3 bg-slate-200 rounded w-full mb-2"></div>
                <div class="h-3 bg-slate-200 rounded w-5/6"></div>
            </div>
            <div class="animate-pulse bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 bg-slate-200 rounded-lg"></div>
                    <div class="flex-1">
                        <div class="h-4 bg-slate-200 rounded w-3/4 mb-1"></div>
                        <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                    </div>
                </div>
                <div class="h-3 bg-slate-200 rounded w-full mb-2"></div>
                <div class="h-3 bg-slate-200 rounded w-4/6"></div>
            </div>
        </div>

        <!-- STATE KOSONG -->
        <div id="sKosong" class="hidden flex-col items-center justify-center py-16 text-slate-400">
            <i class="fas fa-folder-open text-5xl mb-4 text-slate-300"></i>
            <p class="text-sm font-medium">Materi tidak ditemukan.</p>
            <p class="text-xs mt-1 text-center">Coba gunakan kata kunci lain.</p>
        </div>

        <!-- LIST CONTAINER -->
        <div id="listMateri" class="grid grid-cols-1 gap-3">
            <!-- Konten card materi akan dirender di sini via JavaScript/API -->
        </div>
    </main>

</div>

<script>
    // FUNGSI TOGGLE PENCARIAN (Sama dengan format handout.html)
    function tglCari() {
        const box = document.getElementById('boxCari');
        const input = document.getElementById('q');
        if(box.classList.contains('hidden')) {
            box.classList.remove('hidden');
            input.focus();
        } else {
            box.classList.add('hidden');
            input.value = '';
            // Panggil kembali fungsi render/fetch list data awal jika ada
        }
    }

    function hapusCari() {
        document.getElementById('q').value = '';
        document.getElementById('q').focus();
        // Panggil fungsi render ulang jika diperlukan
    }

    let tunda;
    function cariTunda() {
        clearTimeout(tunda);
        tunda = setTimeout(() => {
            // Panggil fungsi API/search bawaan sistem Anda di sini
            console.log('Mencari:', document.getElementById('q').value);
        }, 500);
    }
</script>
</body>
</html>
